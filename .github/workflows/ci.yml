name: CI

# Runs typecheck, tests and a dependency audit on every push to master / PR.
# This repo auto-deploys to Vercel on push to master via the GitHub integration; this
# workflow runs alongside that deploy, not as a gate — a CI failure here does not block
# or delay the Vercel deploy (the owner has chosen to leave deploys ungated).

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Dependency audit (high severity)
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
