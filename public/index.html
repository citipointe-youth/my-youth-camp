/* ===== REGISTRATION LISTS (PNG) — 2026-07-31 ==============================================
   Owner request: images of who is registered, per grade, to send to that grade's leaders
   before camp. Targeted at the church that runs the app (Citipointe Brisbane) but any church
   can be picked.

   Drawn CLIENT-SIDE on a <canvas>. There is no image library anywhere in this repo — the
   server has exceljs and the browser has a vendored xlsx, neither of which makes pictures —
   and rendering these in a Vercel function would add a dependency and a memory cost for
   something the browser does natively. Do not move this server-side.

   ⚠ NAMES ONLY on the image. No payment status, no accommodation, no medical or contact
   data. These get forwarded to multiple leaders over consumer messaging apps; this codebase
   encrypts most of that at rest and it must not be re-published on a shareable picture.  */

const RL_W=1080;            // fixed image width; height grows to fit the longest column
const RL_PAD=56;
const RL_ROW=46;            // per-name line height

function _rlSlug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'list';}

/* Sort key: when did this person actually register?
   `dateSubmitted` (the Elvanto form date, added to RegistrantDto 2026-07-31) is the real
   answer. `createdAt` is only when the IMPORT created the row, so a bulk import ties a whole
   batch — it is a fallback, not the source. Name is the final tiebreak so equal timestamps
   still produce a stable order rather than whatever the fetch happened to return. */
function _rlSortKey(r){return String(r.dateSubmitted||r.createdAt||'');}
function _rlSort(list){
  return list.slice().sort((a,b)=>{
    const ka=_rlSortKey(a),kb=_rlSortKey(b);
    if(ka!==kb)return ka<kb?-1:1;
    return (a.lastName+a.firstName).localeCompare(b.lastName+b.firstName);
  });
}
function _rlName(r){return ((r.firstName||'')+' '+(r.lastName||'')).trim();}
/* Clip a name to its column. Canvas does NOT wrap or clip text — an over-long name would
   otherwise bleed straight across into the girls column. */
function _rlFit(ctx,text,maxW){
  if(ctx.measureText(text).width<=maxW)return text;
  let t=text;
  while(t.length>1&&ctx.measureText(t+'…').width>maxW)t=t.slice(0,-1);
  return t+'…';
}

async function _loadRegListChurches(){
  const el=document.getElementById('rlChurch');if(!el)return;
  try{
    const churches=await api('/accounts/churches');
    const list=(churches||[]).slice().sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
    if(!list.length){el.innerHTML='<option value="">No churches yet</option>';return;}
    // Default to the church that runs the app. Matched on NAME, not a hard-coded id — church
    // rows are recreated by the new-year rollover and their ids do not survive it.
    const def=list.find(c=>/citipointe\s*brisbane/i.test(c.name||''))||list[0];
    el.innerHTML=list.map(c=>`<option value="${esc(c.id)}"${c.id===def.id?' selected':''}>${esc(c.name)}</option>`).join('');
  }catch(e){el.innerHTML='<option value="">Could not load churches</option>';}
}

/* Which images to produce. Tier is driven by the STUDENT count only — leaders never move the
   threshold, they always get their own single image for the whole church. */
function _rlTier(studentCount,override){
  if(override&&override!=='auto')return override;
  if(studentCount<50)return 'church';
  if(studentCount<=100)return 'gender';
  return 'grade';
}
function _rlSheets(students,leaders,tier){
  const male=l=>l.filter(r=>r.gender==='male'),female=l=>l.filter(r=>r.gender==='female');
  const sheets=[];
  if(tier==='church'){
    sheets.push({label:'All registrations',males:male(students),females:female(students)});
  }else if(tier==='gender'){
    // Single-gender sheets: the empty side makes _rlDraw fall back to one wide column.
    sheets.push({label:'Guys',males:male(students),females:[]});
    sheets.push({label:'Girls',males:[],females:female(students)});
  }else{
    for(const g of [7,8,9,10,11,12]){
      const inG=students.filter(r=>Number(r.grade)===g);
      if(inG.length)sheets.push({label:'Year '+g,males:male(inG),females:female(inG)});
    }
    /* Anyone with no grade recorded gets their own sheet. Silently dropping a registered
       student from a roll-call export is the worst failure this feature can have. */
    const noGrade=students.filter(r=>!r.grade);
    if(noGrade.length)sheets.push({label:'Grade not recorded',males:male(noGrade),females:female(noGrade)});
  }
  if(leaders.length)sheets.push({label:'Leaders',males:male(leaders),females:female(leaders)});
  return sheets.filter(s=>s.males.length||s.females.length);
}

/* Draw one sheet and hand back a PNG blob. */
function _rlDraw(sheet,churchName,dateLabel){
  const one=!sheet.males.length||!sheet.females.length;   // only one gender present → one wide column
  const rows=Math.max(sheet.males.length,sheet.females.length);
  const headH=200, colHeadH=one?0:56, footH=64;
  const H=headH+colHeadH+rows*RL_ROW+footH;
  const cv=document.createElement('canvas');
  cv.width=RL_W;cv.height=H;
  const x=cv.getContext('2d');
  const FONT='system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

  x.fillStyle='#ffffff';x.fillRect(0,0,RL_W,H);
  x.fillStyle='#5b21b6';x.fillRect(0,0,RL_W,10);            // violet top rule

  x.fillStyle='#1e1a3a';x.font='700 46px '+FONT;x.textBaseline='alphabetic';
  x.fillText(churchName,RL_PAD,96);
  x.fillStyle='#5b21b6';x.font='700 34px '+FONT;
  x.fillText(sheet.label,RL_PAD,142);
  x.fillStyle='#6b7280';x.font='600 22px '+FONT;
  const total=sheet.males.length+sheet.females.length;
  const counts=one?(total+(total===1?' person':' people')):(sheet.males.length+' guys · '+sheet.females.length+' girls · '+total+' total');
  x.fillText(counts+'  ·  '+dateLabel,RL_PAD,176);
  // Rule sits BELOW the 176 baseline and its descenders — at headH-26 it struck through the text.
  x.fillStyle='#e4e2f5';x.fillRect(RL_PAD,headH-12,RL_W-RL_PAD*2,2);

  const draw=(list,cx,colW,colour,heading)=>{
    let y=headH+colHeadH;
    if(heading){
      x.fillStyle=colour;x.font='800 24px '+FONT;
      x.fillText(heading,cx,headH+34);
    }
    x.fillStyle='#1e1a3a';x.font='500 30px '+FONT;
    for(const r of list){
      x.fillText(_rlFit(x,_rlName(r),colW),cx,y+32);
      y+=RL_ROW;
    }
  };
  if(one){
    const list=sheet.males.length?sheet.males:sheet.females;
    draw(list,RL_PAD,RL_W-RL_PAD*2,sheet.males.length?'#1d4ed8':'#db2777','');
  }else{
    const colW=(RL_W-RL_PAD*2-40)/2;
    draw(sheet.males,RL_PAD,colW,'#1d4ed8','GUYS');
    draw(sheet.females,RL_PAD+colW+40,colW,'#db2777','GIRLS');
  }
  x.fillStyle='#9ca3af';x.font='500 20px '+FONT;
  x.fillText((SETTINGS&&SETTINGS.campName)||'Youth Camp',RL_PAD,H-26);

  return new Promise(res=>cv.toBlob(res,'image/png'));
}

/* Fetch + build every image once. BOTH export buttons go through this, so the two can never
   produce different sets. Returns null (having already toasted) when there is nothing to do. */
async function _rlGenerate(say){
  const churchId=sel('rlChurch'),split=sel('rlSplit')||'auto';
  if(!churchId){toast('Pick a church first');return null;}
  const churchName=(function(){const s=document.getElementById('rlChurch');return (s&&s.selectedIndex>=0&&s.options[s.selectedIndex].text)||'Church';})();
  say('Loading registrations…');
  let regs;
  try{regs=await api('/registrants?churchId='+encodeURIComponent(churchId));}
  catch(e){say('');toast(e.message);return null;}
  // `status` is 'cancelled' for a withdrawn registration — never list them.
  const active=(regs||[]).filter(r=>r.status!=='cancelled');
  // RegistrantDto maps person kind → 'camper' | 'leader'.
  const students=_rlSort(active.filter(r=>r.kind!=='leader'));
  const leaders=_rlSort(active.filter(r=>r.kind==='leader'));
  if(!students.length&&!leaders.length){say('');toast('No registrations for '+churchName);return null;}
  const tier=_rlTier(students.length,split);
  const sheets=_rlSheets(students,leaders,tier);
  const day=localDateISO();
  const dateLabel='Registered as at '+dtFmt(new Date().toISOString());
  say('Generating '+sheets.length+' image'+(sheets.length===1?'':'s')+'…');
  const files=[];
  for(const sheet of sheets){
    try{
      const blob=await _rlDraw(sheet,churchName,dateLabel);
      if(blob)files.push({name:_rlSlug(churchName)+'-'+_rlSlug(sheet.label)+'-'+day+'.png',blob});
    }catch(e){}
  }
  return {churchName,day,tier,files};
}

/* THE ONE download path for the whole app (generalised 2026-08-03 — Android review).
   It was written for the registration-list PNGs and carried the two mobile-safety rules
   nobody else had: append the anchor to the document before clicking it, and DELAY the
   revoke. Every other export in this file was still doing `a.click(); URL.revokeObjectURL(url)`
   in the same tick — and one (`exportBudget`) never appended the anchor at all.
   Both matter on Android Chrome, and most on an INSTALLED PWA, where a silently-failed
   download has no browser downloads tray to fall back to: the browser resolves a download
   URL asynchronously, so revoking it synchronously can cancel or truncate the file, and the
   code reports success either way because `.click()` never throws.
   ⚠ Route every new download through here. Do not hand-roll the anchor dance again. */
function _rlSaveBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url;a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  // Revoking immediately can cancel the download on some mobile browsers.
  setTimeout(()=>URL.revokeObjectURL(url),20000);
}
/* Text/CSV convenience wrapper over _rlSaveBlob. Defaults to text/csv because every current
   caller is a CSV; pass a mime for anything else. */
function _saveTextFile(text,name,mime){
  _rlSaveBlob(new Blob([text],{type:mime||'text/csv'}),name);
}

async function exportRegistrationPngs(){
  const st=document.getElementById('rlStatus');
  const say=m=>{if(st){st.style.display=m?'block':'none';st.textContent=m;}};
  const out=await _rlGenerate(say);
  if(!out)return;
  let n=0;
  for(const f of out.files){
    _rlSaveBlob(f.blob,f.name);n++;
    /* Mobile Safari and Chrome throttle simultaneous downloads and silently DROP the tail —
       an unstaggered loop loses most of a 7-image by-grade run. Do not remove this delay. */
    await new Promise(r=>setTimeout(r,300));
  }
  say(n+' image'+(n===1?'':'s')+' downloaded ('+out.tier+' split).');
  toast(n+' image'+(n===1?'':'s')+' downloaded');
}

/* ===== CHECK-IN STATUS (PNG) — 2026-08-03 =================================================
   Owner request: for a chosen camp day, an image showing how many check-ins each church
   MISSED, worst first, with morning and afternoon summed.

   WHAT "MISSED" MEANS HERE, and why it is the roster's definition and not a second one:
   a church's miss count for a session is the number of people ON THAT SESSION'S ROSTER who
   are not checked in. The roster is already exactly the right population — the backend builds
   it from people with `atCamp === true` and excludes leaders — so someone who never arrived
   at camp is not counted as a miss, and neither is a leader who has no check-in obligation.
   Re-deriving that population here from /registrants would produce a different, larger number
   than the one the leader was looking at on the check-in screen, which is the fastest way to
   make an accountability report nobody trusts.

   `checkedIn` is LAST-ENTRY-WINS on the DTO (`toRosterEntry`), so someone checked in and then
   out reads as not checked in. That is deliberate and consistent with the check-in screen and
   with `churchesBehind` in the push warning — one definition across all three.

   ⚠ Sessions are resolved from the SERVER's session list, never assumed to be `day~am` +
   `day~pm`. Under AC-1 the first camp day is PM-only and the last is AM-only, so constructing
   both ids by hand would 404 on exactly the two days most likely to be checked. Summing
   "morning + afternoon" over whatever sessions that day actually has is the same answer on an
   ordinary day and the correct one on those two.

   Rows are grouped by CHURCH, with the b-/g- logins summed (owner's choice) — that is who
   gets chased, and a church appears once. */
async function _csGather(say){
  const day=sel('csDay');
  if(!day){toast('Pick a day first');return null;}
  say('Loading check-in sessions…');
  let sessions;
  try{sessions=await api('/checkin/sessions');}
  catch(e){say('');toast(e.message);return null;}
  const daySessions=(sessions||[]).filter(s=>s.day===day);
  if(!daySessions.length){say('');toast('No check-in sessions on that day');return null;}
  say('Loading check-in status…');
  // Per church: {missed, total}. `total` is the roster size summed over the day's sessions —
  // it is what makes "9 missed" readable as 9 out of how many.
  const byChurch=new Map();
  for(const s of daySessions){
    let st;
    try{st=await api('/checkin/sessions/'+encodeURIComponent(s.id)+'/status');}
    catch(e){say('');toast('Could not load '+(s.label||s.id)+': '+e.message);return null;}
    for(const r of (st&&st.roster)||[]){
      const name=r.church||'—';
      const cur=byChurch.get(name)||{church:name,missed:0,total:0};
      cur.total+=1;
      if(!r.checkedIn)cur.missed+=1;
      byChurch.set(name,cur);
    }
  }
  const rows=[...byChurch.values()];
  if(!rows.length){say('');toast('Nobody was on the roster that day');return null;}
  // Most missed first; ties broken by name so the image is stable between runs.
  rows.sort((a,b)=>b.missed-a.missed||a.church.localeCompare(b.church));
  const dayIdx=((SETTINGS&&SETTINGS.checkInDays)||[]).indexOf(day);
  return {
    day,rows,
    sessionLabels:daySessions.map(s=>s.label||s.id),
    dayLabel:(dayIdx>=0?'Day '+(dayIdx+1)+' · ':'')+new Date(day+'T12:00:00Z').toLocaleDateString(undefined,{weekday:'long',day:'numeric',month:'long',timeZone:'UTC'}),
  };
}

/* Draw the check-in status sheet. Same canvas conventions as _rlDraw (RL_W width, violet top
   rule, camp name footer) so the two images read as a set when they land in the same chat. */
function _csDraw(data){
  const rows=data.rows;
  const headH=210, colHeadH=52, footH=64;
  const H=headH+colHeadH+rows.length*RL_ROW+footH;
  const cv=document.createElement('canvas');
  cv.width=RL_W;cv.height=H;
  const x=cv.getContext('2d');
  const FONT='system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

  x.fillStyle='#ffffff';x.fillRect(0,0,RL_W,H);
  x.fillStyle='#5b21b6';x.fillRect(0,0,RL_W,10);

  const totalMissed=rows.reduce((a,r)=>a+r.missed,0);
  const totalExpected=rows.reduce((a,r)=>a+r.total,0);
  x.fillStyle='#1e1a3a';x.font='700 46px '+FONT;x.textBaseline='alphabetic';
  x.fillText('Missed check-ins',RL_PAD,96);
  x.fillStyle='#5b21b6';x.font='700 34px '+FONT;
  x.fillText(data.dayLabel,RL_PAD,142);
  x.fillStyle='#6b7280';x.font='600 22px '+FONT;
  x.fillText(totalMissed+' of '+totalExpected+' missed  ·  '+data.sessionLabels.join(' + '),RL_PAD,176);
  x.fillStyle='#e4e2f5';x.fillRect(RL_PAD,headH-12,RL_W-RL_PAD*2,2);

  const missX=RL_W-RL_PAD-260, ofX=RL_W-RL_PAD;
  x.fillStyle='#6b7280';x.font='800 22px '+FONT;
  x.fillText('CHURCH',RL_PAD,headH+30);
  x.textAlign='right';
  x.fillText('MISSED',missX,headH+30);
  x.fillText('OF',ofX,headH+30);
  x.textAlign='left';

  let y=headH+colHeadH;
  for(const r of rows){
    // Zero missed is a GOOD result and is coloured accordingly — a list where every number is
    // alarm-red trains people to ignore the colour.
    x.fillStyle='#1e1a3a';x.font='500 30px '+FONT;
    x.fillText(_rlFit(x,r.church,missX-RL_PAD-90),RL_PAD,y+32);
    x.textAlign='right';
    x.fillStyle=r.missed>0?'#b91c1c':'#15803d';x.font='700 30px '+FONT;
    x.fillText(String(r.missed),missX,y+32);
    x.fillStyle='#9ca3af';x.font='500 26px '+FONT;
    x.fillText(String(r.total),ofX,y+32);
    x.textAlign='left';
    y+=RL_ROW;
  }

  x.fillStyle='#9ca3af';x.font='500 20px '+FONT;
  x.fillText((SETTINGS&&SETTINGS.campName)||'Youth Camp',RL_PAD,H-26);
  return new Promise(res=>cv.toBlob(res,'image/png'));
}

async function exportCheckinStatusPng(){
  const st=document.getElementById('csStatus');
  const say=m=>{if(st){st.style.display=m?'block':'none';st.textContent=m;}};
  const data=await _csGather(say);

  say('Drawing image…');

    _rlSaveBlob(blob,'missed-checkins-'+data.day+'.png');

}

async function exportRegistrationZip(){
  const st=document.getElementById('rlStatus');
  const say=m=>{if(st){st.style.display=m?'block':'none';st.textContent=m;}};
  const out=await _rlGenerate(say);
  if(!out)return;
  if(!out.files.length){say('');toast('Nothing to export');return;}
  say('Building zip…');
  try{
    const entries=[];
    for(const f of out.files)entries.push({name:f.name,data:new Uint8Array(await f.blob.arrayBuffer())});
    const zip=await _zipBlob(entries);
    _rlSaveBlob(zip,_rlSlug(out.churchName)+'-registrations-'+out.day+'.zip');
    say(out.files.length+' image'+(out.files.length===1?'':'s')+' zipped ('+out.tier+' split).');
    toast('Zip downloaded');
  }catch(e){say('');toast('Could not build the zip — use "Download images" instead');}
}

/* ===== Minimal ZIP writer =================================================================
   Hand-rolled because nothing in this repo can make a zip: the server has exceljs (which
   writes xlsx and is server-side anyway) and the browser has a vendored xlsx build. Adding
   JSZip for one button is not worth a new vendored dependency.

   Format: local file header + data per entry, then the central directory, then the EOCD —
   the classic 32-bit layout. No zip64, which caps an entry (and the archive) at 4GB; a set of
   name-only PNGs is a few hundred KB, so that limit is unreachable here.

   DEFLATE comes from the platform's own `CompressionStream('deflate-raw')` (Chrome 80+,
   Safari 16.4+, Firefox 113+). Where it is missing — or where deflating a PNG makes it BIGGER,
   which is normal, since PNG is already deflated — the entry falls back to STORE (method 0).
   A store-only zip is still a completely valid zip; the user just gets less shrinkage.  */
const _CRC_T=(function(){const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0;}
  return t;})();
function _crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=_CRC_T[(c^u8[i])&0xFF]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
async function _deflateRaw(u8){
  if(typeof CompressionStream!=='function')return null;
  try{
    const s=new Blob([u8]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    return new Uint8Array(await new Response(s).arrayBuffer());
  }catch(_){return null;}
}
/* DOS date/time. A zero date is accepted by most tools but shows as an invalid timestamp in
   Windows Explorer, so write a real one. Seconds have 2s resolution by format. */
function _dosDateTime(d){
  return {
    time:((d.getHours()&31)<<11)|((d.getMinutes()&63)<<5)|((d.getSeconds()/2)&31),
    date:(((d.getFullYear()-1980)&127)<<9)|(((d.getMonth()+1)&15)<<5)|(d.getDate()&31),
  };
}
async function _zipBlob(entries){
  const enc=new TextEncoder(),parts=[],central=[],dt=_dosDateTime(new Date());
  let offset=0;
  for(const e of entries){
    const nameB=enc.encode(e.name);
    const crc=_crc32(e.data);
    let body=await _deflateRaw(e.data),method=8;
    if(!body||body.length>=e.data.length){body=e.data;method=0;}
    const lh=new Uint8Array(30+nameB.length),lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0,true);
    lv.setUint16(8,method,true);lv.setUint16(10,dt.time,true);lv.setUint16(12,dt.date,true);
    // CRC and the uncompressed size always describe the ORIGINAL bytes, never the deflated ones.
    lv.setUint32(14,crc,true);lv.setUint32(18,body.length,true);lv.setUint32(22,e.data.length,true);
    lv.setUint16(26,nameB.length,true);lv.setUint16(28,0,true);
    lh.set(nameB,30);
    parts.push(lh,body);
    const ch=new Uint8Array(46+nameB.length),cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);
    cv.setUint16(8,0,true);cv.setUint16(10,method,true);
    cv.setUint16(12,dt.time,true);cv.setUint16(14,dt.date,true);
    cv.setUint32(16,crc,true);cv.setUint32(20,body.length,true);cv.setUint32(24,e.data.length,true);
    cv.setUint16(28,nameB.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);
    cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);
    cv.setUint32(42,offset,true);          // where this entry's LOCAL header starts
    ch.set(nameB,46);
    central.push(ch);
    offset+=lh.length+body.length;
  }
  const cdSize=central.reduce((a,c)=>a+c.length,0);
  const eo=new Uint8Array(22),ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);
  ev.setUint16(8,entries.length,true);ev.setUint16(10,entries.length,true);
  ev.setUint32(12,cdSize,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);
  return new Blob(parts.concat(central,[eo]),{type:'application/zip'});
}

/* ===== Minimal STYLED XLSX writer (2026-08-04) =============================================
   Owner: "the budget export should be an excel sheet so that excel formatting/styles can be used
   to make it more clear what is the 'total' and what is the 'lower level detail' — currently it is
   hard to read when there are several rows labelled for each church."

   ⚠️ THE VENDORED SHEETJS CANNOT DO THIS, AND FAILS SILENTLY AT IT. `xlsx.full.min.js` is the
   Community build: cell styling is a Pro feature, so `cell.s = {font:{bold:true}}` is accepted,
   ignored, and written out as an ordinary cell. Verified rather than assumed — a probe workbook
   with a bold, red-filled A1 came back with `<fonts count="1">` and `<fills count="2">`, i.e. the
   defaults and nothing else. It DOES write `!cols`, `!merges` and number formats (`z`), which is
   why the accommodation export is fine on it; bold and fills are the two things this request is
   entirely about. **Do not "simplify" this back onto XLSX.write — the bold will vanish and the
   file will still open, which is the worst way to lose a feature.**

   So the workbook is written by hand. That is far less work than it sounds because the hard part
   already exists: `_zipBlob` above (hand-rolled for the registration-list .zip, and verified by
   extracting a real archive with Windows' own Expand-Archive). An xlsx IS a zip of a handful of
   small XML parts, and only the six below are required.

   Strings are written INLINE (`t="inlineStr"`) rather than through a shared-string table — one
   less part, one less index to keep consistent, and a budget sheet is a few hundred rows.

   ⚠️ TWO THINGS THAT CORRUPT THE FILE IF TOUCHED CARELESSLY, both of which open as
   "we found a problem with some content" with no clue as to which:
     1. **fills[0] MUST be `none` and fills[1] MUST be `gray125`.** Excel reserves those two slots.
        Insert a colour at the front of the fills list and every fill in the book shifts by one.
     2. **Child order inside `<worksheet>` is fixed by the schema**: sheetViews → cols → sheetData →
        autoFilter. Emitting autoFilter before sheetData validates as nothing.
   `scripts/budget-xlsx-harness.js` unzips the real output and asserts both, plus the styling. */
function _xmlEsc(s){
  return String(s==null?'':s)
    .replace(/[&<>"']/g,(c)=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]))
    // Control characters are not representable in XML 1.0 at all — a stray one from pasted data
    // would make the whole part unparseable, so they are dropped rather than escaped.
    .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
}
function _xlCol(i){let s='',n=i;while(n>=0){s=String.fromCharCode(65+(n%26))+s;n=Math.floor(n/26)-1;}return s;}
/* The fixed style table. Indices are referenced by name below so a reordering here can't silently
   turn every total row into body text. Colours are the app's own tokens (--blue / --violet tint /
   --navy) so a printed budget still looks like the screen it came from. */
const XS={BODY:0,TITLE:1,SUB:2,HEAD:3,TEXT:4,MUTED:5,NUM:6,MONEY:7,
  TOT_T:8,TOT_N:9,TOT_M:10,GRAND_T:11,GRAND_N:12,GRAND_M:13,SECTION:14,NOTE:15};
const _XL_STYLES=
'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
'<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
  '<numFmts count="1"><numFmt numFmtId="164" formatCode="&quot;$&quot;#,##0.00"/></numFmts>'+
  '<fonts count="6">'+

/* A cell is `{v,s,n}` — value, style index, and `n:true` for "this is a number". A bare string or
   number is shorthand for the default style; `null` leaves the cell absent entirely. */
function _xc(v,s){return {v:v,s:s};}
function _xn(v,s){return {v:v,s:s,n:true};}
function _xlSheetXml(sheet){
  const rows=(sheet.rows||[]).map((cells,ri)=>{
    const r=ri+1;
    const out=(cells||[]).map((cell,ci)=>{
      if(cell==null)return '';
      const c=(typeof cell==='object')?cell:{v:cell};
      const ref=_xlCol(ci)+r,st=c.s?' s="'+c.s+'"':'';
      if(c.n){
        const num=Number(c.v);
        if(c.v==null||c.v===''||!isFinite(num))return '<c r="'+ref+'"'+st+'/>';
        return '<c r="'+ref+'"'+st+'><v>'+num+'</v></c>';
      }
      // A styled blank still has to be emitted, or the fill stops halfway across a total row.
      if(c.v==null||c.v==='')return c.s?'<c r="'+ref+'"'+st+'/>':'';
      return '<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+_xmlEsc(c.v)+'</t></is></c>';
    }).join('');
    return '<row r="'+r+'">'+out+'</row>';
  }).join('');
  const cols=(sheet.cols||[]).map((w,i)=>'<col min="'+(i+1)+'" max="'+(i+1)+'" width="'+w+'" customWidth="1"/>').join('');
  const fz=sheet.freeze
    ? '<pane ySplit="'+sheet.freeze+'" topLeftCell="A'+(sheet.freeze+1)+'" activePane="bottomLeft" state="frozen"/>'
      +'<selection pane="bottomLeft" activeCell="A'+(sheet.freeze+1)+'" sqref="A'+(sheet.freeze+1)+'"/>'
    : '';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'+
    '<sheetViews><sheetView workbookViewId="0">'+fz+'</sheetView></sheetViews>'+
    (cols?'<cols>'+cols+'</cols>':'')+
    '<sheetData>'+rows+'</sheetData>'+
    (sheet.filter?'<autoFilter ref="'+sheet.filter+'"/>':'')+
    '</worksheet>';
}
/* Same rule the compliance workbook learned the hard way: a sheet name over 31 chars or carrying
   one of `: \ / ? * [ ]` is rejected by Excel, and `'Sign-in/Sign-out Log'` 500'd that download
   for weeks. Sanitised here so a caller cannot reintroduce it. */
function _xlSheetName(n){return String(n||'Sheet').replace(/[:\\\/?*\[\]]/g,'-').slice(0,31)||'Sheet';}
async function _xlsxBlob(sheets){
  const enc=new TextEncoder(),E=(name,str)=>({name:name,data:enc.encode(str)});
  const names=sheets.map((s)=>_xlSheetName(s.name));
  const files=[
    E('[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'+
      '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'+
      '<Default Extension="xml" ContentType="application/xml"/>'+
      '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+
      sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+
      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+
      '</Types>'),
    E('_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'+
      '</Relationships>'),
    E('xl/workbook.xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'+
      '<sheets>'+names.map((n,i)=>'<sheet name="'+_xmlEsc(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets>'+
      '</workbook>'),
    E('xl/_rels/workbook.xml.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+
      '<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'+
      '</Relationships>'),
    E('xl/styles.xml',_XL_STYLES),
  ];
  sheets.forEach((s,i)=>files.push(E('xl/worksheets/sheet'+(i+1)+'.xml',_xlSheetXml(s))));
  const zip=await _zipBlob(files);
  return new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}
/* Standalone import screen (its own "Data Import" admin console tile / nav entry) — also
   gives director (who has import:run but not the Admin tab) a way to import. Reuses
   adminUpload()'s #fileIn/#impResult elements. */
RENDER.import=async function(){
  if(!['director','admin'].includes(ACTOR.role)){paint('import','<p class="note-hint">Importing is restricted to directors and admins.</p>','Import','');return;}
  paint('import',_importUploadCardHtml()+'<div id="allocWrap"></div>'+_offlineSignInCardHtml(),'Data Import','Form · Ticket · Invoice');
  _loadImportStamps();
  _loadAllocation();
};

/* ===== OFFLINE SIGN-IN (New Feature 1, bottom of Data Import) =====
   Fallback for churches who prefer bulk/paper sign-in over the app: export a spreadsheet of
   every registered student, a church marks "Y" as they arrive, re-importing bulk-signs-in
   anyone marked Y who isn't already at camp. Matches by First+Last+Church text — no id column
   (the export is the source of these exact values, so a straight match is expected to work). */
function _offlineSignInCardHtml(){
  return `<div class="card">
    <div class="h3" style="margin-top:0">Offline Sign-In</div>
    <p class="note-hint" style="text-align:left">A fallback for churches who prefer a bulk/paper sign-in instead of the app. Export the sheet, have the church mark "Y" as students arrive, then import the filled sheet to sign in everyone marked Y who isn't already at camp.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn ghost" onclick="downloadOfflineSignInTemplate()">${icSm('download')} Export sign-in sheet</button>
      <button class="btn ghost" onclick="document.getElementById('osiFileIn').click()">${icSm('upload')} Import filled sheet</button>
      <input type="file" id="osiFileIn" accept=".csv,.xlsx,.xls" style="display:none" onchange="offlineSignInUpload()">
    </div>
    <div id="osiResult" style="display:none;margin-top:10px"></div>
  </div>`;
}
async function downloadOfflineSignInTemplate(){
  await downloadCsvExport('/export/offline-signin',_exportName('offline-sign-in','xlsx'));
}
async function offlineSignInUpload(){
  const input=document.getElementById('osiFileIn');
  const file=input&&input.files&&input.files[0];
  if(!file)return;
  const box=document.getElementById('osiResult');
  if(!await confirmSheet({title:'Import this sheet and sign in everyone marked "Y" who isn\'t already at camp?',confirmLabel:'Import & sign in'})){input.value='';return;}
  if(box){box.style.display='block';box.innerHTML='<div class="loading"><div class="spin"></div><div class="lt">Reading sheet…</div></div>';}
  try{
    const rd=await _readImportFile(file);
    const r=await api('/import/offline-signin',{method:'POST',body:{csvData:rd.text}});
    const bits=[`${r.signedIn} signed in`];
    if(r.alreadySignedIn)bits.push(`${r.alreadySignedIn} already at camp`);
    if(r.unmatched&&r.unmatched.length)bits.push(`${r.unmatched.length} not matched`);
    const unmatchedList=r.unmatched&&r.unmatched.length?`<p class="note-hint" style="text-align:left;margin-top:6px">Not matched: ${r.unmatched.map(esc).join(', ')}</p>`:'';
    if(box){box.innerHTML=`<div class="callbox">${icSm('check')} ${bits.join(' · ')}</div>${unmatchedList}`;}
    toast('Offline sign-in applied');
  }catch(e){if(box)box.innerHTML='<p class="err" style="display:block">'+esc(e.message||'Import failed')+'</p>';else toast(e.message||'Import failed');}
  finally{input.value='';}
}

/* ===== UNALLOCATED REGISTRANTS + CHURCH OVERRIDES (bottom of Data Import) ===== */
const UNALLOCATED_ID='__unallocated__'; // must match backend UNALLOCATED_CHURCH_ID
let _allocState={unallocated:[],regs:[],regsAll:[],churches:[],overrides:[]};

/* ⚠️ THESE FETCHES USED TO FAIL SILENTLY, AND ONE OF THEM WAS FAILING FOR A MONTH.
   `/import/allocations` 500'd on every call (see the repo mapper fix, 2026-08-01) and the bare
   `.catch(()=>[])` turned that into an empty array — so the screen rendered "Church overrides (0)"
   and no Designated-from-OTHER card, which reads as "there is nothing here", not "this is broken".
   `_allocErrs` collects the failures and `_renderAllocCards` prints them. Keep the catches (one
   dead endpoint must not blank the whole screen) but NEVER go back to discarding the reason. */
let _allocErrs=[];
/* The two override cards are working lists, not queries: the admin searches a student in, acts,
   and the row stays put. They live in module state because _renderAllocCards rewrites
   #allocWrap wholesale — anything held only in the DOM would not survive a save. */
let _indivIds=[];   // "Individual accommodation override"
let _crIds=[];      // "Registration cancels / refunds"
async function _loadAllocation(){
  const wrap=document.getElementById('allocWrap'); if(!wrap) return;
  _allocErrs=[];
  const grab=(p,label)=>api(p).catch(e=>{_allocErrs.push(label+': '+((e&&e.message)||'failed'));return [];});
  const [unallocated,allRegs,churches,overrides]=await Promise.all([
    grab('/import/unallocated','Unallocated registrants'),
    grab(_scoped('/registrants?includeCancelled=1'),'Registrants'),
    grab('/accounts/churches','Churches'),
    grab('/import/allocations','Church overrides'),
  ]);
  /* ONE fetch, two views. `regs` stays exactly what it always was — active registrants — so the
     unallocated/designated/church-override cards and their search are untouched. `regsAll` keeps
     the cancelled people the cancels/refunds card needs to still show after a cancel lands.
     A church login is re-gated server-side and just gets the active list back either way. */
  const _all=allRegs||[];
  _allocState={unallocated:unallocated||[],regs:_all.filter(r=>r.status!=='cancelled'),
    regsAll:_all,churches:churches||[],overrides:overrides||[]};
  _renderAllocCards();
}

function _churchOpts(sel){
  return '<option value="">Select a church…</option>'+_allocState.churches.slice()
    .sort((a,b)=>String(a.name).localeCompare(String(b.name)))
    .map(c=>`<option value="${esc(c.id)}"${c.id===sel?' selected':''}>${esc(c.name)}</option>`).join('');
}

/* Item 8: how many rows the Data Import people lists show before they scroll internally.
   Mirrored by the .alloc-scroll max-height in CSS — change both together. */
const ALLOC_VISIBLE_ROWS=4;
function _renderAllocCards(){
  const wrap=document.getElementById('allocWrap'); if(!wrap) return;
  const un=_allocState.unallocated;
  const gradeLabel=p=>p.grade?('Grade '+esc(p.grade)):(p.kind==='leader'?'Leader':'—');
  const unRows=un.length?un.map(p=>`
    <div class="card" style="padding:10px">
      <div style="font-weight:600">${esc(p.firstName)} ${esc(p.lastName)}</div>
      <div class="sub">${esc(p.registrationType||'—')} · ${esc(p.gender||'—')} · ${gradeLabel(p)} · ${p.mobile?telLink(p.mobile):'no phone'}</div>
      ${p.churchUnlistedNote?`<div class="note-hint" style="text-align:left;margin:4px 0"><b>They wrote:</b> ${esc(p.churchUnlistedNote)}</div>`:''}
      <div class="rowsb" style="gap:6px;margin-top:6px">
        <select class="fld" id="alloc_${esc(p.id)}" style="flex:1">${_churchOpts('')}</select>
        <button class="btn" style="width:auto;flex:0 0 auto;margin-top:0" onclick="allocatePerson('${esc(p.id)}')">Confirm</button>
      </div>
    </div>`).join(''):'<p class="note-hint">No unallocated registrants.</p>';
  /* Item 8 (2026-07-31): both people lists on this screen scroll INTERNALLY at four rows.
     Before this, 40 unallocated registrants pushed the overrides card and the rest of the Data
     Import screen entirely below the fold — the admin had to scroll past the whole list to get
     back to anything else. `_allocScroll` is applied only when there is something to scroll;
     wrapping a short list would leave a fixed-height box with dead space in it. */
  const scroller=(html,rows)=>rows>ALLOC_VISIBLE_ROWS?`<div class="alloc-scroll">${html}</div>`:html;
  /* All three cards are COLLAPSED BY DEFAULT (owner request 2026-08-02). This screen's primary
     job is the CSV upload at the top; the allocation tools are a secondary task that was pushing
     it off the fold. `<summary>` carries the count, so "is there anything to do here?" is still
     answerable without opening anything. Do not add `open` to any of them. */
  const cardA=`<div class="card"><details data-ac="unallocated">
    <summary style="cursor:pointer;font-weight:700">Unallocated registrants (${un.length})</summary>
    <p class="note-hint" style="text-align:left">These people chose “OTHER – please specify below” and have no church yet. Allocate each to a church.</p>${scroller(unRows,un.length)}
  </details></div>`;

  /* Item 8: the single "Church overrides / forced allocations" card is SPLIT IN TWO, because it
     was conflating two things the admin treats differently:
       - `kind === 'unallocated'` — someone who picked OTHER and has since been DESIGNATED a
         church. That is finished work. It is the bulk of the list and it is why the card grew
         so long, and it is what the owner asked to collapse out of the way.
       - everything else — a MANUAL override of a church the form did name. That is a deliberate
         correction someone made and is worth keeping visible.
     Both sections still call the SAME `undoOverride`, and both are still fed by the same
     `_allocState.overrides` array, so the action behaves identically from either — only the BUTTON
     LABEL differs, because the two reversals mean different things to the reader: undoing a manual
     override puts the person back on the church their form named, while reversing a designation
     sends them back to the unallocated list. Hence "Unallocate" on cardC. */
  const ov=_allocState.overrides;
  const designated=ov.filter(o=>o.kind==='unallocated');
  const manual=ov.filter(o=>o.kind!=='unallocated');
  /* ⚠️ THE BUTTON MUST BE `btn ghost sm` WITH `flex:0 0 auto`, NOT A BARE `.btn`.
     `.btn`'s base CSS is `display:block;width:100%`, and inside a flex row an unconstrained
     `width:100%` becomes the item's FLEX-BASIS — so a plain `.btn` here claims most of the row and
     squeezes the name/church text down to nothing on a phone. This is the identical bug fixed on
     the Confirm button in this same card on 2026-07-08. `.btn.sm` sets `width:auto`; the fixed
     `min-width` keeps the two lists' buttons on one visual column, and the text block's
     `flex:1;min-width:0` is what lets it take whatever width is left over. */
  const ovRow=(o,actionLabel)=>`
    <div class="card" style="padding:10px">
      <div class="rowsb">
        <div style="flex:1;min-width:0">
          <div style="font-weight:600">${esc(o.personName)}</div>
          <div class="sub">${esc(o.formChurch||'—')} → <b>${esc(o.assignedChurchName)}</b></div>
          <div class="sub" style="font-size:var(--t-micro);color:var(--muted)">${o.kind==='unallocated'?'Allocated from unlisted':'Overridden'} · ${esc(o.createdBy)} · ${dtFmt(o.updatedAt)}</div>
        </div>
        <button class="btn ghost sm" style="flex:0 0 auto;min-width:92px" onclick="undoOverride('${esc(o.id)}')">${esc(actionLabel)}</button>
      </div>
    </div>`;
  const manualRows=manual.length?scroller(manual.map(o=>ovRow(o,'Undo')).join(''),manual.length):'<p class="note-hint">No manual overrides yet.</p>';
  /* ⚠ The override search input lives INSIDE this <details>. `_renderOvSearch` reads
     `#ovSearch`/`#ovSearchResults` by id and both bail on a null element, so a collapsed card is
     safe — a <details> keeps its children in the DOM either way. Do not move the search out. */
  const cardB=`<div class="card"><details data-ac="churchov">
    <summary style="cursor:pointer;font-weight:700">Church overrides (${manual.length})</summary>
    <p class="note-hint" style="text-align:left">People you moved to a different church than their form said. These persist across re-imports.</p>
    <div class="card" style="padding:10px;background:var(--paper)">
      <div class="lbl" style="margin-top:0">Override a church allocation</div>
      <input class="fld" id="ovSearch" placeholder="Search a registrant by name…" oninput="_renderOvSearch()">
      <div id="ovSearchResults"></div>
    </div>
    ${manualRows}
  </details></div>`;

  // Also collapsed — this one is a record of completed work, not a to-do list.
  const cardC=designated.length?`<div class="card"><details data-ac="designated">
    <summary style="cursor:pointer;font-weight:700">Designated from “OTHER” (${designated.length})</summary>
    <p class="note-hint" style="text-align:left">People who chose “OTHER – please specify below” and have since been given a church. Unallocate returns them to the unallocated list above.</p>
    ${scroller(designated.map(o=>ovRow(o,'Unallocate')).join(''),designated.length)}
  </details></div>`:'';

  const accLabel=k=>k==='tent'?'Tent':k==='classroom'?'Classroom':'—';
  const money=v=>v==null?'—':'$'+Number(v).toFixed(2);
  const indivRows=_indivIds.map(id=>{
    const p=_allocState.regs.find(r=>r.id===id); if(!p)return '';
    const ch=_allocState.churches.find(c=>c.id===p.churchId);
    const ov=p.accommodationOverride||'';
    return `<div class="card" style="padding:10px"><details data-ac="indiv:${esc(p.id)}">
      <summary style="cursor:pointer;font-weight:600">${esc(p.firstName)} ${esc(p.lastName)}</summary>
      <div class="sub" style="margin-top:6px">Individual accommodation: <b>${esc(accLabel(p.accommodationKind))}</b>${ov?' · overridden':''}</div>
      <div class="sub">Church accommodation: <b>${esc(accLabel(ch&&ch.accommodationOverride))}</b></div>
      <label class="sub" style="display:block;margin-top:8px">Accommodation override</label>
      <select class="fld" id="indivAcc_${esc(p.id)}">
        <option value=""${ov===''?' selected':''}>Leave unchanged</option>
        <option value="tent"${ov==='tent'?' selected':''}>Tent</option>
        <option value="classroom"${ov==='classroom'?' selected':''}>Classroom</option>
      </select>
      <div class="sub" style="margin-top:8px">Amount paid: <b>${esc(money(p.amountPaidOverride!=null?p.amountPaidOverride:p.amountPaid))}</b>${p.amountPaidOverride!=null?' · overridden':''}</div>
      <label class="sub" style="display:block;margin-top:4px">New amount paid</label>
      <input class="fld" id="indivAmt_${esc(p.id)}" type="number" step="0.01" inputmode="decimal" placeholder="Leave blank to keep existing">
      <div class="rowsb" style="gap:6px;margin-top:8px">
        <button class="btn ghost" onclick="indivRemove('${esc(p.id)}')">Remove from list</button>
        <button class="btn" style="width:auto;flex:0 0 auto;margin-top:0" onclick="indivSave('${esc(p.id)}')">Save override</button>
      </div>
    </details></div>`;
  }).join('');
  /* Collapsed by default like every other card on this screen (:8244). */
  const cardD=`<div class="card"><details data-ac="indivcard">
    <summary style="cursor:pointer;font-weight:700">Individual accommodation override (${_indivIds.length})</summary>
    <p class="note-hint" style="text-align:left">Set where one student sleeps, and/or what they paid, regardless of the ticket list, the invoice or their church's accommodation. Survives re-imports.</p>
    <input class="fld" id="indivSearch" oninput="_renderIndivSearch()" placeholder="Search a student to add…">
    <div id="indivSearchResults"></div>
    ${indivRows}
  </details></div>`;
  const crRows=_crIds.map(id=>{
    const p=_allocState.regsAll.find(r=>r.id===id); if(!p)return '';
    const cancelled=p.status==='cancelled';
    return `<div class="card" style="padding:10px">
      <div style="font-weight:600">${esc(p.firstName)} ${esc(p.lastName)}</div>
      <div class="sub">${esc(p.churchName||'No church')} · paid ${esc(money(p.amountPaidOverride!=null?p.amountPaidOverride:p.amountPaid))}${p.refundAmount!=null?' · refunded '+esc(money(p.refundAmount)):''}</div>
      <div class="sub">${cancelled?'<b>Registration cancelled</b>':'Registered'}</div>
      <div class="rowsb" style="gap:6px;margin-top:8px">
        <button class="btn ghost" onclick="crRemove('${esc(p.id)}')">Remove from list</button>
        ${cancelled?'':`<button class="btn" style="width:auto;flex:0 0 auto;margin-top:0" onclick="crCancel('${esc(p.id)}')">Cancel registration</button>`}
      </div>
      <div class="rowsb" style="gap:6px;margin-top:8px">
        <input class="fld" id="crAmt_${esc(p.id)}" type="number" step="0.01" inputmode="decimal" placeholder="Refund amount" style="flex:1">
        <button class="btn alt" style="width:auto;flex:0 0 auto;margin-top:0" onclick="crRefund('${esc(p.id)}')">Refund</button>
      </div>
    </div>`;
  }).join('');
  const cardE=`<div class="card"><details data-ac="crcard">
    <summary style="cursor:pointer;font-weight:700">Registration cancels / refunds (${_crIds.length})</summary>
    <p class="note-hint" style="text-align:left">Cancelling removes someone from the check-in roster and every on-screen list, but keeps their money in the budget — record a refund separately. The two actions are independent.</p>
    <input class="fld" id="crSearch" oninput="_renderCrSearch()" placeholder="Search a student to add…">
    <div id="crSearchResults"></div>
    ${crRows}
  </details></div>`;

  const errCard=_allocErrs.length?`<div class="card"><p class="err" style="display:block">Some allocation data could not be loaded, so the lists below may be incomplete: ${esc(_allocErrs.join(' · '))}</p></div>`:'';
  /* Same capture/reapply as `_budRedraw` (:4913). Before this, EVERY write on this screen
     (allocate, override, undo) re-emitted all the cards with no `open` attribute, so the whole
     screen collapsed and jumped to the top mid-task. paint()'s samePaint/keepY guard (:2488)
     does not help here — this writes #allocWrap.innerHTML directly and never goes through paint.
     `data-ac` keys the cards (and the per-student rows in the two override cards) so reopening
     is stable across a re-render that changes list contents.
     This restores only what the operator themselves opened — the collapsed-by-default rule
     above (:8244) still stands, so do NOT add `open` to any card's markup. */
  const openKeys=[...wrap.querySelectorAll('details[data-ac]')].filter(d=>d.open).map(d=>d.getAttribute('data-ac'));
  const sc=_scroller(document.getElementById('import'));
  const y=sc?sc.scrollTop:0;
  wrap.innerHTML=errCard+cardA+cardB+cardC+cardD+cardE;
  openKeys.forEach(k=>{const d=wrap.querySelector(`details[data-ac="${k}"]`);if(d)d.open=true;});
  if(sc)sc.scrollTop=y;
}

/* ===== DATA (director/admin): filterable registration table + Elvanto-format export ===== */
let _dataCache=null; // cached /registrants for client-side filtering, default-sorted to import order
let _dataSortKey=null,_dataSortDir=1; // active column sort; null key = default import order
RENDER.data=async function(){
  if(!['director','admin'].includes(ACTOR.role)){paint('data','<p class="note-hint">This area is restricted to directors and admins.</p>','Data','');return;}
  const [regs,camperPage,churches]=await Promise.all([
    api(_scoped('/registrants')).catch(()=>[]),
    api(_scoped('/campers?pageSize=1000')).catch(()=>[]),
    api('/accounts/churches').catch(()=>[]),
  ]);
  // At-camp, anyone already signed in (esp. leaders — bulk-signed-in on the mode switch)
  // has lifecycle !== 'registered' and drops out of /registrants entirely. Merge in
  // /campers (deduped by id) so this screen always shows the full roster, not just the
  // pre-camp-registered subset — same pattern as RENDER.firstday's dedup.
  const campers=Array.isArray(camperPage)?camperPage:camperPage.items||[];
  const regIds=new Set((regs||[]).map(r=>r.id));
  const merged=[...(regs||[]),...campers.filter(c=>!regIds.has(c.id))];
  // Default order = the order records were imported in (createdAt asc) — /registrants
  // itself returns alphabetical (last name), so re-sort here rather than trust the API order.
  _dataCache=merged.slice().sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  _dataSortKey=null;_dataSortDir=1;
  const chOpts=['<option value="">All churches</option>'].concat(
    (churches||[]).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`)).join('');
  const gradeOpts=['<option value="">All grades</option>','<option value="leader">Leaders</option>']
    .concat([7,8,9,10,11,12].map(g=>`<option value="${g}">Grade ${g}</option>`)).join('');
  // BUG regression fix: director has import:run + allocation:manage (access-control.ts) and
  // RENDER.import/RENDER.adminData both already accept director — they were just unreachable
  // (navModel gives director no 'import' tab and no Records & Export extra in either mode).
  // These two buttons are the reachable entry point in both pre-camp and at-camp (the at-camp
  // home "Student Data Table" tile already routes here via go('data')).
  const navCard=`<div class="card" style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn ghost" style="flex:1;min-width:160px" onclick="go('import')">${icSm('upload')} Data Import</button>
    <button class="btn ghost" style="flex:1;min-width:160px" onclick="go('adminData')">${icSm('download')} Records &amp; Export</button>
  </div>`;
  paint('data',`${navCard}<div class="card">
    <div class="h3" style="margin-top:0">Registration data</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <select class="fld" id="dfCh" style="flex:1;min-width:140px" onchange="dataApply()">${chOpts}</select>
      <select class="fld" id="dfGen" style="flex:1;min-width:110px" onchange="dataApply()">
        <option value="">All genders</option><option value="male">Male</option><option value="female">Female</option></select>
      <select class="fld" id="dfGr" style="flex:1;min-width:120px" onchange="dataApply()">${gradeOpts}</select>
      <select class="fld" id="dfReview" style="flex:1;min-width:140px" onchange="dataApply()">
        <option value="">All records</option><option value="1">Needs review only</option></select>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="dataExport(true)">Export filtered</button>
      <button class="btn ghost" onclick="dataExport(false)">Export all</button>
    </div>
    <div id="dataCount" class="note-hint" style="margin-top:6px"></div>
    <div style="overflow-x:auto;margin-top:8px"><table id="dataTbl" style="min-width:1020px;border-collapse:collapse;font-size:.8rem"></table></div>
  </div>`,'Data','Registrations');
  dataApply();
};
function dataFilters(){
  return {
    churchId:document.getElementById('dfCh')?.value||'',
    gender:document.getElementById('dfGen')?.value||'',
    grade:document.getElementById('dfGr')?.value||'',
    needsReview:document.getElementById('dfReview')?.value||'',
  };
}
const DATA_COLS=[['Name','name'],['Church','church'],['Gender','gender'],['Grade','grade'],['Reg type','regType'],['Cost','cost'],['Discount code','discount'],['Mobile','mobile'],['Medical','medical'],['Dietary','dietary'],['Other','other'],['Blue card','blueCard'],['Accommodation','accommodation'],['Review','review']];
function _dataSortVal(r,key){
  switch(key){
    case 'name':return (r.lastName+', '+r.firstName).toLowerCase();
    case 'church':return (r.churchName||'').toLowerCase();
    case 'gender':return (r.gender||'').toLowerCase();
    case 'grade':return r.kind==='leader'?9999:(r.grade??-1);
    case 'regType':return (r.registrationType||'').toLowerCase();
    case 'cost':return r.registrationCost??-1;
    case 'discount':return (r.discountCode||'').toLowerCase();
    case 'mobile':return (r.mobile||'').replace(/\D/g,'');
    case 'medical':return (r.medicalConditions||[]).join(', ').toLowerCase();
    case 'dietary':return (r.dietaryRequirements||[]).join(', ').toLowerCase();
    case 'other':return (r.otherMedications||'').toLowerCase();
    case 'blueCard':return (r.blueCardNumber||'').toLowerCase();
    case 'accommodation':return (r.accommodationKind||'')+'|'+(r.accommodationKindConfidence||'');
    case 'review':return r.needsReview?1:0;
    default:return '';
  }
}
// 3-state header click: unsorted (import order) → asc → desc → back to unsorted.
function dataSort(key){
  if(_dataSortKey!==key){_dataSortKey=key;_dataSortDir=1;}
  else if(_dataSortDir===1){_dataSortDir=-1;}
  else{_dataSortKey=null;_dataSortDir=1;}
  dataApply();
}
function dataApply(){
  const f=dataFilters();let rows=(_dataCache||[]).filter(r=>{
    if(f.churchId&&r.churchId!==f.churchId)return false;
    if(f.gender&&r.gender!==f.gender)return false;
    if(f.grade==='leader'){if(r.kind!=='leader')return false;}
    else if(f.grade){if(r.kind==='leader'||String(r.grade??'')!==f.grade)return false;}
    if(f.needsReview==='1'&&!r.needsReview)return false;
    return true;
  });
  if(_dataSortKey)rows=rows.slice().sort((a,b)=>{
    const av=_dataSortVal(a,_dataSortKey),bv=_dataSortVal(b,_dataSortKey);
    if(av<bv)return -1*_dataSortDir;if(av>bv)return 1*_dataSortDir;return 0;
  });
  const td=v=>`<td style="border-bottom:1px solid var(--line);padding:5px 8px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(v||'—')}</td>`;
  // tdRaw skips esc() — only for cells built entirely from enum-like fields / trusted markup (Accommodation, Review).
  const tdRaw=html=>`<td style="border-bottom:1px solid var(--line);padding:5px 8px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis">${html}</td>`;
  const body=rows.map(r=>{
    const grade=r.kind==='leader'?'Leader':(r.grade??'—');
    const cost=r.registrationCost!=null?'$'+r.registrationCost.toLocaleString():'—';
    return `<tr>${td(r.lastName+', '+r.firstName)}${td(r.churchName)}${td(r.gender)}${td(grade)}${td(r.registrationType)}${td(cost)}${td(r.discountCode)}${tdRaw(r.mobile?telLink(r.mobile):'')}${td((r.medicalConditions||[]).join(', '))}${td((r.dietaryRequirements||[]).join(', '))}${td(r.otherMedications)}${td(r.blueCardNumber)}${tdRaw(accomCell(r))}${tdRaw(reviewCell(r))}</tr>`;
  }).join('');
  const t=document.getElementById('dataTbl');
  const thead=DATA_COLS.map(([label,key])=>{
    const arrow=_dataSortKey===key?(_dataSortDir===1?' ▲':' ▼'):'';
    return `<th style="text-align:left;border-bottom:2px solid var(--line);padding:6px 8px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap" onclick="dataSort('${key}')">${label}${arrow}</th>`;
  }).join('');
  if(t)t.innerHTML=`<thead><tr>${thead}</tr></thead><tbody>${body||'<tr><td colspan="14" style="padding:10px;color:var(--muted)">No matching registrants</td></tr>'}</tbody>`;
  const c=document.getElementById('dataCount');if(c)c.textContent=`${rows.length} of ${(_dataCache||[]).length} registrants`;
}
function accomCell(r){
  const kind=r.accommodationKind==='tent'?'Tent':r.accommodationKind==='classroom'?'Classroom':'—';
  const badge=r.accommodationKindConfidence==='guessed'?' <span class="pill amb">Guessed</span>':'';
  return kind+badge;
}
function reviewCell(r){
  return r.needsReview?`<span class="pill warn" style="cursor:pointer" onclick="openReviewModal('${r.id}')">${icSm('alert')} Needs review</span>`:'—';
}
function openReviewModal(id){
  const r=(_dataCache||[]).find(x=>x.id===id);
  if(!r){toast('Record not found');return;}
  modal(`<h3>Needs review · ${esc(r.firstName+' '+r.lastName)} ${helpTip('This record was created or updated by a Ticket List / Invoice import that couldn\'t confidently match it to an existing person. Before confirming: check the name spelling and church are correct, and that the accommodation, cost and discount fields below look right. “Mark reviewed” only clears this flag — it does not change any data. If something’s wrong, fix it with a corrected re-import (matching improves once the name/church lines up), then come back and confirm.')}</h3>
    <p class="sub" style="margin:4px 0 8px">${esc(r.needsReviewReason||'No reason recorded.')}</p>
    <button class="btn" onclick="_markReviewed('${id}')">Mark reviewed</button>
    <button class="btn ghost" style="margin-top:6px" onclick="closeModal()">Cancel</button>`);
}
async function _markReviewed(id){
  try{
    await api('/registrants/'+id,{method:'PATCH',body:{needsReview:false,needsReviewReason:null}});
    closeModal();
    const r=(_dataCache||[]).find(x=>x.id===id);
    if(r){r.needsReview=false;r.needsReviewReason=null;}
    dataApply();
    toast('Marked reviewed');
  }catch(e){toast(e.message);}
}
async function dataExport(filtered){
  try{
    let qs='';
    if(filtered){const f=dataFilters();const params=new URLSearchParams();
      if(f.churchId)params.set('churchId',f.churchId);
      if(f.gender)params.set('gender',f.gender);
      if(f.grade==='leader')params.set('kind','leader');
      else if(f.grade)params.set('grade',f.grade);
      const s=params.toString();if(s)qs='?'+s;}
    const csv=await api('/export/registrants'+qs);
    if(!csv||typeof csv!=='string'){toast('Nothing to export');return;}
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    const a=document.createElement('a');a.href=url;
    a.download='camp-registrations-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }catch(e){toast(e.message);}
}
/* ===== ADMIN: INDIVIDUAL STUDENT DATA EDIT (at-camp) =====
   After camp commences there are no more spreadsheet uploads, so the admin corrects
   individual student records here. Students only (leaders unaffected). Merges
   /registrants (not yet arrived) + /campers (arrived) — same dual-fetch as RENDER.firstday. */
let _stuCache=[],_stuChurches=[];
function _stuNorm(r,atCamp){return {id:r.id,firstName:r.firstName,lastName:r.lastName,gender:r.gender,grade:r.grade??null,
  churchId:r.churchId,churchName:r.churchName,zone:r.zone,accommodationKind:r.accommodationKind??null,
  medical:(r.medicalConditions||[]).join(', '),dietary:(r.dietaryRequirements||[]).join(', '),atCamp};}
RENDER.adminStudents=async function(){
  const [regs,campers,churches]=await Promise.all([
    api(_scoped('/registrants')).catch(()=>[]),
    api(_scoped('/campers')).catch(()=>[]),
    api('/accounts/churches').catch(()=>[]),
  ]);
  const byId={};
  (regs||[]).filter(r=>r.kind==='camper').forEach(r=>{byId[r.id]=_stuNorm(r,false);});
  (campers||[]).filter(c=>c.kind==='student').forEach(c=>{byId[c.id]=_stuNorm(c,c.atCamp!==false);});
  _stuCache=Object.values(byId);
  _stuChurches=churches||[];
  const chOpts=['<option value="">All churches</option>'].concat(
    _stuChurches.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`)).join('');
  const gradeOpts=['<option value="">All grades</option>'].concat(GRADES.map(g=>`<option value="${g}">Grade ${g}</option>`)).join('');
  paint('adminStudents',`<div class="card">
    <div class="rowsb" style="align-items:center"><div class="h3" style="margin-top:0">Student data</div>

function _stuFormFields(s){

// Sort Form→Ticket→Invoice; reject two files of the same type (can't import the same source twice).
function _orderImportBatch(list){
  const seen={};
  for(const p of list){if(seen[p.type]){toast('Two files look like the same type ('+IMPORT_TYPES[p.type].label+'): '+seen[p.type]+' and '+p.name);return null;}seen[p.type]=p.name;}
  return list.slice().sort((a,b)=>IMPORT_TYPES[a.type].order-IMPORT_TYPES[b.type].order);
}
// Combined dry-run preview across all files in the batch, then a single confirm.
async function _renderImportPreview(){
  const box=document.getElementById('impResult');if(!box||!_importBatch)return;box.style.display='block';
  box.innerHTML='<div class="loading"><div class="spin"></div><div class="lt">Checking files…</div></div>';
  const formInBatch=_importBatch.some(b=>b.type==='form');
  let formImported=false;try{const s=await api('/settings');formImported=!!(s&&s.formImportedAt);}catch(e){}
  const results=[];
  for(const b of _importBatch){
    try{const r=await api(IMPORT_TYPES[b.type].endpoint,{method:'POST',body:{csvData:b.csvData,updateExisting:true,dryRun:true}});results.push({b,r});}
    catch(e){results.push({b,err:e.message||'error'});}
  }
  const formRes=results.find(x=>x.b.type==='form'&&x.r);
  const phantoms=(formRes&&formRes.r.phantomChurches)||[];
  // Per-file summary cards.
  const cards=results.map(({b,r,err})=>{
    if(err)return `<div class="warnbox">${esc(b.name)} (${IMPORT_TYPES[b.type].label}): ${esc(err)}</div>`;
    const del=r.deleted?` \xb7 <b style="color:var(--danger)">${r.deleted} to delete</b>`:'';
    // A Ticket/Invoice orphan/unmatched warning is misleading while an unrun Form sits in the same
    // batch (matches only happen once the Form is committed first), so suppress it in that case.
    const extra=(b.type!=='form'&&formInBatch)?`<span style="color:var(--muted)">Matches finalise after the Form import runs first.</span>`:_importExtraLine(b.type,r);
    const errs=(r.errors||[]);
    const errList=errs.length?`<div style="margin-top:4px">${errs.slice(0,8).map(e=>`<div style="color:var(--danger);font-size:.76rem">Row ${e.row}: ${esc(e.message)}</div>`).join('')}${errs.length>8?`<div class="sub">+${errs.length-8} more error${errs.length-8===1?'':'s'}</div>`:''}</div>`:'';
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px">
      <div class="rowsb" style="align-items:center"><b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)}</b><span class="pill info" style="flex:none">${IMPORT_TYPES[b.type].label}</span></div>
      <div class="sub" style="margin-top:2px">${r.created} to add \xb7 ${r.updated} to update \xb7 ${r.skipped} to skip${del} \xb7 ${errs.length} error${errs.length===1?'':'s'}</div>
      ${extra?`<div class="sub" style="margin-top:2px">${extra}</div>`:''}${errList}</div>`;
  }).join('');
  // Bug-11 guard: importing Ticket/Invoice with no Form ever imported (and none in this batch) means
  // rows can't match a student and become "Needs review" orphans. Warn loudly.
  const needsForm=!formInBatch&&!formImported&&_importBatch.some(b=>b.type==='tickets'||b.type==='invoices');
  const guardHtml=needsForm?`<div class="warnbox">${icSm('alert')} No <b>Form</b> registrations have been imported yet, so these tickets/invoices have no students to attach to — they'll be flagged "Needs review". Import the <b>Form</b> export first for them to match.</div>`:'';
  // Phantom churches from the Form file must be created before we can confirm.
  let phantomHtml='';
  if(phantoms.length){
    const autoUser=n=>n.toLowerCase().replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,30)||'church';
    const rows=phantoms.map((n,i)=>`<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="font-weight:700;margin-bottom:6px">${esc(n)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <div style="flex:1;min-width:130px"><label style="font-size:var(--t-micro)">Zone</label>${zoneSel('pzZone_'+i)}</div>
        <div style="flex:2;min-width:140px"><label style="font-size:var(--t-micro)">Username</label><input class="fld" id="pzUser_${i}" value="${esc(autoUser(n))}" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
        <div style="flex:2;min-width:140px"><label style="font-size:var(--t-micro)">Password (min 6)</label><input class="fld" id="pzPass_${i}" placeholder="min 6 chars"></div>
      </div></div>`).join('');
    phantomHtml=`<div class="warnbox">${icSm('alert')} ${phantoms.length} unrecognised church${phantoms.length===1?'':'es'} in the Form file — set zone, username &amp; password to create them first:</div>
      ${rows}
      <button class="btn" onclick="_createPhantomChurches(${esc(JSON.stringify(phantoms))})">Create ${phantoms.length} church${phantoms.length===1?'':'es'} ${icSm('arrowr')}</button>`;
  }
  const confirmHtml=phantoms.length?'':`<button class="btn" style="margin-top:8px" onclick="_confirmImport()">Confirm &amp; import ${_importBatch.length>1?'all '+_importBatch.length+' files':''}</button>`;
  box.innerHTML=`<div class="infobox"><b>Preview (nothing saved yet)</b> — ${_importBatch.length} file${_importBatch.length===1?'':'s'}, imported Form → Ticket → Invoice.</div>
    ${cards}${guardHtml}${phantomHtml}${confirmHtml}
    <button class="btn ghost" style="margin-top:8px${confirmHtml||phantomHtml?';margin-left:6px':''}" onclick="_clearImport()">Cancel</button>`;
}
async function _createPhantomChurches(names){
  const btn=event&&(event.currentTarget||event.target);
  if(btn){btn.disabled=true;btn.textContent='Creating…';}
  const autoUser=n=>n.toLowerCase().replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,30)||'church';
  for(let i=0;i<names.length;i++){
    const name=names[i];

    const username=(document.getElementById('pzUser_'+i)?.value||'').trim()||autoUser(name);
    const pass=(document.getElementById('pzPass_'+i)?.value||'').trim();
    if(pass.length<6){toast('Password for "'+name+'" must be 6+ chars');if(btn){btn.disabled=false;btn.textContent='Retry';}return;}
    if(!/^[A-Za-z0-9._-]{2,40}$/.test(username)){toast('Username for "'+name+'" is invalid — use letters, numbers, . _ - only (min 2 chars)');if(btn){btn.disabled=false;btn.textContent='Retry';}return;}
    try{await api('/accounts/churches',{method:'POST',body:{churchName:name,zone,accountFirstName:name,accountLastName:'Team',accountUsername:username,accountPassword:pass}});}
    catch(e){toast('Failed to create "'+name+'": '+(e.message||'error'));if(btn){btn.disabled=false;btn.textContent='Retry';}return;}
  }
  toast(names.length+' church'+(names.length===1?'':'es')+' created');
  _renderImportPreview(); // re-dry-run: the Form file no longer reports these as phantom

async function _confirmImport(){

  const box=document.getElementById('impResult');
  if(box){box.innerHTML='<div class="loading"><div class="spin"></div><div class="lt">Importing…</div></div>';}

// accommodation (rooms → allocation), then the day-by-day content (schedule/devotionals),
// then family-facing info (FAQ/contacts). Each step auto-detects "done" for the green tick,
// and carries a short plain-language tip (rendered as a helpTip bubble in the checklist).
const WIZARD_STEPS=[
  {key:'settings',label:'Camp settings',icon:'gear',screen:'adminSettings',summary:'Camp settings — dates, name and check-in switchover.',check:()=>!!(SETTINGS&&SETTINGS.campName&&SETTINGS.startDate)},
  {key:'churches',label:'Churches',icon:'users',screen:'adminAccounts',summary:'Churches — added automatically from your registration upload, or add one by hand.',check:async()=>{try{const c=await api('/accounts/churches');return(c||[]).length>0;}catch(e){return false;}}},
  {key:'accounts',label:'Accounts',icon:'users',screen:'adminAccounts',summary:'Accounts — login accounts for church leaders, zone leaders and directors.',check:async()=>{try{const u=await api('/accounts/users');return(u||[]).filter(x=>x.role!=='admin').length>0;}catch(e){return false;}}},
  // Item 5a: sits between Accounts and Accommodation rooms — a camp usually imports its
  // registration export right after accounts exist, before setting up rooms/allocation.
  {key:'import',label:'Import registrations',icon:'upload',screen:'import',summary:'Import registrations — upload your Form, Ticket List and Invoice exports.',check:async()=>{if(SETTINGS&&SETTINGS.formImportedAt)return true;try{const r=await api(_scoped('/registrants'));return(r||[]).length>0;}catch(e){return false;}}},
  {key:'accom',label:'Accommodation rooms',icon:'classroom',screen:'adminAccom',summary:'Accommodation rooms — your sleeping rooms and their capacities.',check:async()=>{try{const b=await api('/accommodation/classrooms');return(b||[]).length>0;}catch(e){return false;}}},
  {key:'accomAlloc',label:'Accommodation allocation',icon:'home',screen:'accom',summary:'Accommodation allocation — assign churches to rooms, auto-filled to capacity.',check:async()=>{try{const a=await api('/accommodation/allocations');return Object.values(a||{}).some(arr=>Array.isArray(arr)&&arr.some(e=>e&&Number(e.n)>0));}catch(e){return false;}}},
  // Feature 7 (2026-07-17): Schedule/FAQ/Devotionals merged into ONE step routing to the
  // already-merged RENDER.atCampInfo screen; done-check = ANY of the three has content.
  {key:'atCampInfo',label:'At Camp Info',icon:'clock',screen:'atCampInfo',summary:'At Camp Info — schedule, devotionals and FAQ for families and students.',check:async()=>{
    try{
      const days=SETTINGS?.checkInDays||[];

/* ===== ADMIN SCHEDULE (content builder — merged into RENDER.atCampInfo, item 8) ===== */
// One editable table row (Time + Activity). Index r keeps input ids unique per day.
// Inputs are addressed by CLASS within each .sched-row (not index-based ids), so a row can be
// deleted from the middle without renumbering the rest — saveSchedDay reads the live rows.
function _schedRow(d,r,t,n){return `<div class="sched-row" style="display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:6px;margin-bottom:5px;align-items:center">`
  +`<input class="fld sr-t" type="time" value="${esc(t||'')}" onfocus="_schedFocus(this)">`
  +`<input class="fld sr-n" placeholder="Activity" value="${esc(n||'')}" onfocus="_schedFocus(this)">`
  +`<button class="iconbtn danger" type="button" title="Delete row" onclick="this.closest('.sched-row').remove()">${icSm('trash')}</button></div>`;}
// Bug 1 (2026-07-28): "+ Add row" inserts AFTER the row the admin last typed in / focused,
// not always at the end. `_schedLastRow` holds that row element; it is cleared automatically
// when the row is removed from the DOM (the `.isConnected` check below), and a day whose rows
// were never touched still appends at the end.
let _schedLastRow=null;
function _schedFocus(inp){_schedLastRow=inp.closest('.sched-row');}
const SCHED_MIN_ROWS=7;
async function _acScheduleBody(){
  const days=SETTINGS?.checkInDays||[];
  if(!days.length)return '<p class="note-hint">Set the camp dates first (Camp settings).</p>';
  const blocks=await Promise.all(days.map(async d=>{
    const items=(await api('/schedule?day='+d).catch(()=>[])).slice()
      .sort((a,b)=>String(a.startTime||'').localeCompare(String(b.startTime||'')));
    const n=Math.max(SCHED_MIN_ROWS,items.length);
    let rows='';for(let r=0;r<n;r++){const it=items[r]||{};rows+=_schedRow(d,r,it.startTime,it.title);}
    return `<div class="card"><div class="h3" style="margin-top:0">${dayLong(d)} <span style="color:var(--muted);font-weight:600">· ${d}</span>
      ${helpTip('Activities are colour-coded on the schedule screen by keyword — '+_schedKeywordHelp()+' Each item is sized by how long it runs (until the next item starts).',{left:true})}</div>
      <div style="display:grid;grid-template-columns:80px minmax(0,1fr) auto;gap:8px;font-size:.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px"><span>Time</span><span>Activity</span><span style="width:32px"></span></div>
      <div id="schedRows_${d}">${rows}</div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn ghost sm" style="flex:1" onclick="addSchedRow('${d}')">+ Add row</button>
        <button class="btn ghost sm" style="flex:1" onclick="copySchedDay('${d}')">Copy day</button>
        <button class="btn ghost sm" style="flex:1" onclick="pasteSchedDay('${d}')">Paste day</button></div>
      <button class="btn sm" style="width:100%;margin-top:6px" onclick="saveSchedDay('${d}')">Save ${dayLong(d)}</button></div>`;
  }));
  return blocks.join('');
}
function addSchedRow(d){const wrap=document.getElementById('schedRows_'+d);if(!wrap)return;
  const html=_schedRow(d,wrap.children.length,'','');
  // Insert after the last-focused row, but only if that row still belongs to THIS day's table
  // (each day is its own `#schedRows_<d>` wrapper) and is still in the document.
  const last=_schedLastRow;
  if(last&&last.isConnected&&last.parentElement===wrap){last.insertAdjacentHTML('afterend',html);
    const added=last.nextElementSibling;if(added){_schedLastRow=added;const f=added.querySelector('.sr-t');if(f)f.focus();}
    return;}
  wrap.insertAdjacentHTML('beforeend',html);
  _schedLastRow=wrap.lastElementChild;}
/* Copy / paste a whole day (2026-07-30). Most camp days share a near-identical shape, so the
   admin was retyping the same 10-15 rows per day.

   Two deliberate choices:
   - The clipboard holds the LIVE EDITOR rows, not what is saved on the server, so a day can be
     copied mid-edit before it has ever been saved. It reads through the same filled-rows-only
     rule as `saveSchedDay` (`_schedReadRows`), so what you copy is exactly what you'd have saved.
   - Pasting fills the target day's EDITOR ONLY. Nothing is written until the admin presses that
     day's Save button, which keeps ONE write path (`PUT /schedule/day`) and means a mis-paste is
     undone by leaving the screen and coming back. Do not "helpfully" auto-save on paste.

   The clipboard is module-level, so it survives `_rSched()`'s re-render and navigating between
   the At-Camp Info sub-tabs, but not a page reload. That's intended — it's a scratch buffer. */
let _schedClip=null;
/** The filled rows currently in day `d`'s editor, in the same shape `saveSchedDay` would send. */
function _schedReadRows(d){
  const wrap=document.getElementById('schedRows_'+d);if(!wrap)return null;
  const out=[];
  for(const row of Array.from(wrap.children)){
    const t=(row.querySelector('.sr-t')||{}).value||'',n=(row.querySelector('.sr-n')||{}).value||'';
    if(t&&n)out.push({startTime:t,title:n});
  }
  return out;
}
function copySchedDay(d){
  const items=_schedReadRows(d);
  if(items==null)return;
  if(!items.length){toast('Nothing to copy — this day has no rows with both a time and an activity');return;}
  _schedClip={day:d,items:items};
  toast('Copied '+items.length+' item'+(items.length===1?'':'s')+' from '+dayLong(d));
}
async function pasteSchedDay(d){
  if(!_schedClip||!_schedClip.items.length){toast('Copy a day first');return;}
  if(_schedClip.day===d){toast('That is the day you copied from');return;}
  const wrap=document.getElementById('schedRows_'+d);if(!wrap)return;
  const existing=(_schedReadRows(d)||[]).length;
  // Paste REPLACES the day. Confirm only when there is something to lose.
  if(existing){
    const ok=await confirmSheet({
      title:'Replace '+dayLong(d)+"'s "+existing+' item'+(existing===1?'':'s')+' with the '+_schedClip.items.length+' copied from '+dayLong(_schedClip.day)+'?',
      confirmLabel:'Replace',danger:true});
    if(!ok)return;
  }
  const n=Math.max(SCHED_MIN_ROWS,_schedClip.items.length);
  let rows='';for(let r=0;r<n;r++){const it=_schedClip.items[r]||{};rows+=_schedRow(d,r,it.startTime,it.title);}
  wrap.innerHTML=rows;
  // The "+ Add row" insert-after-me anchor may have pointed into the markup just replaced.
  if(_schedLastRow&&!_schedLastRow.isConnected)_schedLastRow=null;
  toast('Pasted — press “Save '+dayLong(d)+'” to keep it');
}
// Table is the source of truth: saving replaces the whole day's schedule with the
// filled rows (time + title both present). Cleared rows are dropped.
async function saveSchedDay(d){
  const entries=_schedReadRows(d);
  if(entries==null)return;
  // Item 6: PUT /schedule/day replaces the whole day in one call (backend does the
  // delete+insert as one transaction) — was N deletes then N creates sequentially.
  try{
    await api('/schedule/day',{method:'PUT',body:{day:d,items:entries.map(e=>({startTime:e.startTime,title:e.title,type:'activity'}))}});
    toast('Saved '+dayLong(d)+'');await _rSched();
  }catch(e){toast(e.message);await _rSched();}
}

async function _tryRestoreSession(){
