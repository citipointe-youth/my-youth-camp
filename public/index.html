/* ── Android install-as-app prompt (2026-07-31) ────────────────────────────────────────────
   `beforeinstallprompt` is a CHROMIUM event — Safari/iOS never fires it, so the iPhone path is
   untouched by construction and needs no "not iOS" test anywhere. The existing /install.html
   guide linked from _loginTips stays the iOS story.

   We show OUR OWN banner rather than auto-firing the native dialog. Chromium refuses a
   gesture-less `prompt()` in some versions and the refusal is SILENT — the user would get
   nothing at all and there would be no fallback surface. Calling prompt() inside the tap
   handler is the only reliable path. DO NOT "simplify" this by calling prompt() straight from
   the event listener.

   Gated to Android UAs: desktop Chromium fires the same event, and the owner asked for phones.
   Everything is try/caught — this runs on the login gate, where a throw is maximally visible,
   and `localStorage` throws outright in some privacy modes. */
let _deferredInstall=null;
const _INSTALL_DISMISSED='ycp_installdismissed';
function _installDismissed(){try{return localStorage.getItem(_INSTALL_DISMISSED)==='1';}catch(_){return false;}}
function _markInstallDismissed(){try{localStorage.setItem(_INSTALL_DISMISSED,'1');}catch(_){}}
function _installBanner(){
  try{
    if(!/Android/i.test(navigator.userAgent))return;
    window.addEventListener('beforeinstallprompt',function(e){
      try{
        e.preventDefault();          // suppress Chromium's own mini-infobar; we drive it instead
        _deferredInstall=e;
        if(_installDismissed())return;
        const el=document.getElementById('installBanner');
        if(!el)return;
        el.innerHTML='<div class="ib-t">Install this app on your phone</div>'
          +'<div class="ib-s">Adds it to your home screen so it opens full-screen and loads faster.</div>'
          +'<div class="ib-r"><button type="button" class="ib-go" onclick="_installGo()">Install</button>'
          +'<button type="button" class="ib-no" onclick="_installNo()">Not now</button></div>';
        el.style.display='block';
      }catch(_){}
    });
    // Fired when the install completes (by our button or by the browser's own menu). Either way
    // the banner has done its job and must never come back on this device.
    window.addEventListener('appinstalled',function(){_markInstallDismissed();_hideInstallBanner();});
  }catch(_){}
}
function _hideInstallBanner(){try{const el=document.getElementById('installBanner');if(el){el.style.display='none';el.innerHTML='';}}catch(_){}}
async function _installGo(){
  // The deferred event is SINGLE-USE — once prompt() is called it cannot be reused, so the
  // banner goes away regardless of what the user chooses in the native dialog. If they dismiss
  // it, Chromium will fire beforeinstallprompt again on a later visit and we start over.
  const e=_deferredInstall;_deferredInstall=null;_hideInstallBanner();
  if(!e)return;
  try{e.prompt();await e.userChoice;}catch(_){}
}
function _installNo(){_markInstallDismissed();_hideInstallBanner();}
async function doLogin(){
  const err=document.getElementById('loginErr');if(err)err.style.display='none';
  try{
    Cache.clear(); // never carry one user's cached data into another's session
    const d=await api('/auth/login',{method:'POST',body:{username:document.getElementById('username').value.trim(),password:document.getElementById('password').value}});
    TOKEN=d.token;ACTOR={...d.user,displayName:((d.user.firstName||'')+' '+(d.user.lastName||'')).trim()};
    localStorage.setItem('ycp_token',TOKEN);localStorage.setItem('ycp_actor',JSON.stringify(ACTOR));
    // Remember the username (NEVER the password) so the field is prefilled on return. Beyond
    // saving typing, it gives the phone's password manager a stable id to match its saved
    // credential against, which is half of why autofill misses on a blank form.
    try{localStorage.setItem('ycp_lastuser',document.getElementById('username').value.trim());}catch(_){}
    // Item 1: nudge the browser to SAVE this credential. Chrome/Edge/Android support the Credential
    // Management API; Safari/iOS does not (there the real <form id="loginForm"> submit + correct
    // autocomplete tokens are the only lever, already in place — an existing saved password will
    // still autofill). Feature-detected, fired while the fields are still populated, best-effort.
    try{if(window.PasswordCredential&&navigator.credentials&&navigator.credentials.store){
      const _u=document.getElementById('username').value.trim();
      navigator.credentials.store(new PasswordCredential({id:_u,name:_u,password:document.getElementById('password').value})).catch(()=>{});
    }}catch(_){}
    if(MUST_CHANGE_PASSWORD_ENFORCED&&ACTOR.mustChangePassword){document.getElementById('login').style.display='none';_showChangePasswordGate();return;}
    SETTINGS=await api('/settings');
    CAMP_MODE=SETTINGS.campMode||'pre-camp';
    /* Give the browser a beat before the password field is torn down. Safari decides whether to
       offer to SAVE a new credential shortly after the form submit resolves; hiding the form
       synchronously in the same tick can make it drop the prompt entirely. 150ms is imperceptible
       and is what YS Connection settled on. Don't remove it to "speed up" login. */
    await new Promise(r=>setTimeout(r,150));
    document.getElementById('login').style.display='none';
    document.getElementById('bar').style.display='flex';
    document.getElementById('stage').style.display='block';
    document.getElementById('tabs').style.display='';  // let CSS media query control visibility
    // Restore this account's saved roster filters BEFORE the first paint, so the
    // check-in / My-students screens never render once unfiltered and then jump.
    _restoreFilters();

    _loadLeaderInitials();
    enforceInitials();
    _offerAlertsAfterLogin();   // non-church roles only — church gets it after initials
  }catch(e){if(err){err.textContent=e.message;err.style.display='block';}else toast(e.message);}
}

// Brisbane-anchored "today" (YYYY-MM-DD), mirroring the backend's zonedNow(). The camp's
// timezone is hardcoded Australia/Brisbane (see adminSettings — the field was removed), so this
// needs no settings lookup. Pass an ISO/Date to convert a specific instant instead of "now" —
// e.g. a server createdAt timestamp — so UTC-vs-Brisbane day boundaries agree everywhere in the
// SPA (a plain `new Date().toISOString().slice(0,10)` is WRONG here: it's UTC, so anywhere from
// midnight to 10am Brisbane it still reports yesterday's date).
function localDateISO(at){
  const d=at?new Date(at):new Date();
  const fmt=new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Brisbane',year:'numeric',month:'2-digit',day:'2-digit'});
  return fmt.format(d); // en-CA formats as YYYY-MM-DD
}
// Real (non-preview) current camp day number, 1-based, from the actual check-in day dates —
// today's day if camp is underway, day 1 before camp starts, the last day after it ends.
function _realCampDayNumber(){
  const days=(SETTINGS&&SETTINGS.checkInDays)||[];
  if(!days.length)return 1;
  const sorted=[...days].sort();
  const today=localDateISO();
  let idx=sorted.findIndex(d=>d>=today);
  if(idx===-1)idx=sorted.length-1;
  return idx+1;
}
// Current Brisbane clock time as 'HH:MM' (24h), zero-padded, comparable to checkinSwitchoverTime.
// formatToParts + the '24'→'00' guard avoids the midnight '24:00' quirk some engines emit.
function brisbaneNowTime(){
  const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Australia/Brisbane',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(new Date());
  let h=(parts.find(p=>p.type==='hour')||{}).value||'00';
  const m=(parts.find(p=>p.type==='minute')||{}).value||'00';
  if(h==='24')h='00';
  return h+':'+m;
}
// Which face the unified Sign-in/Check-in surface shows. 'signin' = Day-1 arrival before the
// switchover; 'checkin' = daily roll-call. Manual override (admin) wins; otherwise time-driven.
function campPhase(){
  // In the at-camp PREVIEW the phase is whatever the preview toggle says (2026-07-26 — the old
  // Day 1/Day 2 toggle was replaced by a Sign-in / Through-camp one; the point of the preview is
  // to see each surface, so the toggle wins outright over the time rule AND over the admin's
  // saved phase override, which belongs to the real camp, not the rehearsal).
  if(PREVIEW_MODE)return _previewPhase;
  const o=(SETTINGS&&SETTINGS.checkinPhaseOverride)||'auto';
  if(o==='signin'||o==='checkin')return o;
  const sw=(SETTINGS&&SETTINGS.checkinSwitchoverTime)||'14:00';
  return (_realCampDayNumber()===1&&brisbaneNowTime()<sw)?'signin':'checkin';

     the document is un-scrollable again, and iOS collapses the view straight back. The shortfall

    `<div class="wide-nav-item${ownerOf===item.id?' on':''}" onclick="go('${item.id}')">${ic(item.icon)}<span>${esc(item.label)}</span></div>`
  ).join('');
  // Ctrl+S on wide saves settings when on the settings screen
  if(!window._ctrlSListener){
    window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='s'&&ACTOR?.role==='admin'){e.preventDefault();if(typeof saveSettings==='function')saveSettings();}});
    window._ctrlSListener=true;
  }
}

function buildTabs(){

  // (pre-login), render nothing — the shell is hidden until login anyway.
  if(!ACTOR){document.getElementById('tabs').innerHTML='';return;}

    `<button class="tab" data-tab="${t.id}" onclick="gotoTab('${t.id}')"><span class="ic">${ic(t.icon)}</span>${t.label}</button>`
  ).join('');

RENDER.home=async function renderHome(skipModeSync){
  // Phase 4: firstAid has no Home — its landing is Search. (gotoTab already redirects home→search;
  // this guards any direct RENDER.home() call.)
  if(ACTOR&&ACTOR.role==='firstAid'){await gotoTab('search');return;}
  // Re-check mode on every home visit so mode switches by admin propagate to
  // already-logged-in sessions without requiring a logout/login cycle.
  // NEVER while previewing: preview locally forces CAMP_MODE='at-camp' even though
  // the server is still 'pre-camp', so re-syncing here would instantly drop the user
  // back out of the preview (bug: "preview at-camp view doesn't load").
  // skipModeSync: the caller (switchMode) already applied fresh settings locally — this
  // re-fetch would just be a 3rd sequential round-trip for no new information, and was the
  // main contributor to "switching to at-camp lags" (perf audit, 2026-07-03).
  if(!PREVIEW_MODE&&!skipModeSync){
    try{
      const fresh=await api('/settings');
      if(fresh&&fresh.campMode){
        // B-3: publish the authoritative mode so OTHER tabs of this origin pick it up via the
        // 'storage' event (see BOOT). Written every home visit; cheap and idempotent.
        try{localStorage.setItem('ycp_campmode',fresh.campMode);}catch(_){}
        // 2026-07-27: also adopt the two PHASE inputs. Without these an admin pinning the
        // phase (or editing the switchover time) never reached an already-open session, so
        // `campPhase()` — and the Check-in tab label with it — stayed on the stale value.
        if(SETTINGS){
          SETTINGS.checkinPhaseOverride=fresh.checkinPhaseOverride;
          SETTINGS.checkinSwitchoverTime=fresh.checkinSwitchoverTime;
        }
        if(fresh.campMode!==CAMP_MODE){
          CAMP_MODE=fresh.campMode;
          if(SETTINGS)SETTINGS.campMode=fresh.campMode;
          updateModeUI();buildTabs();
        }
      }
    }catch(e){}
  }
  // Re-label the Check-in/Sign-in tab if the phase moved since the nav was last built
  // (switchover time passed, admin pinned the phase, preview toggle flipped). No-op otherwise.
  _syncNavPhase();
  if(CAMP_MODE==='at-camp'){await renderHomeAtCamp();return;}
  const s=SETTINGS,isWide=['director','admin'].includes(ACTOR.role);
  // Parallel-load the independent home datasets (was three sequential awaits).
  // `churchRows` is oversight-only: it is what makes the By-ministry table list a church that
  // has registered NOBODY yet (owner request 2026-08-04) — see the table below. Already warmed
  // by `_prefetch` for these two roles, so in practice this is a client-cache hit, not a 4th
  // round trip. Fails soft: an empty list just returns the old registrants-only behaviour.
  const [h,regs,feed,churchRows]=await Promise.all([
    api('/home'),
    api(_scoped('/registrants')).catch(()=>[]),
    api('/notifications').catch(()=>[]),
    isWide?api('/accounts/churches').catch(()=>[]):Promise.resolve([]),
  ]);
  // Unacknowledged urgent notices (incident auto-alerts + human-sent) render on BOTH home
  // variants — incidents can be, and have been, logged pre-camp. 2026-07-27: the banner moved
  // off the top of the screen to just above the "Notices" heading, matching the at-camp home.
  let body=`<div class="hero">${heroMapBtn()}${heroMark()}<div class="k">${esc((s&&s.campName)||h.campName)}</div><h2${_heroNameCls(ACTOR.displayName)}>Hi ${esc(ACTOR.displayName)}</h2>
    <div class="cd"><div class="big">${h.daysToGo??'—'}</div><div class="meta">days to go<br>${esc(h.startDate||'')}${s&&s.endDate?' – '+esc(s.endDate):''}</div></div></div>`;
  // Bug-2: registrations split by who (Student/Leader) × where they sleep (Tent/Classroom).
  // Replaces the old Campers/Leaders/Ldr-blue-card band. Counts come from the already-loaded
  // /registrants (`regs`), so they reflect this login's scope (own church / zone / all).
  // Church (admin request): just two simple totals, no accommodation breakdown.
  const _acc=(k,a)=>(regs||[]).filter(r=>r.kind===k&&r.accommodationKind===a).length;
  if(ACTOR.role==='church'){
    body+=`<div class="rowsb" style="margin-bottom:6px"><span class="lbl" style="margin:0">Registrations</span></div>
    <div class="statband">
      <div class="s"><b>${h.totalCampers||0}</b><span>Students</span></div>
      <div class="s"><b>${h.totalLeaders||0}</b><span>Leaders</span></div>
    </div>`;
    body+=_contactsCardHtml();
  }else{
    body+=`<div class="rowsb" style="margin-bottom:6px"><span class="lbl" style="margin:0">Registrations by accommodation</span>${helpTip('Your registered people, split by type (Student or Leader) and sleeping kind (Tent or Classroom), as set in the import.',{left:true})}</div>
    <div class="statband statband-4">
      <div class="s"><b>${_acc('camper','tent')}</b><span>Student (Tent)</span></div>
      <div class="s"><b>${_acc('leader','tent')}</b><span>Leader (Tent)</span></div>
      <div class="s"><b>${_acc('camper','classroom')}</b><span>Student (Classroom)</span></div>
      <div class="s"><b>${_acc('leader','classroom')}</b><span>Leader (Classroom)</span></div>
    </div>`;
  }
  if(isWide)body+=`<div class="card tap" onclick="go('budget')"><div class="rowsb"><div><div style="font-weight:600">Budget &amp; costings</div><div class="sub">Student fees by accommodation</div></div><span class="pill info">View ›</span></div></div>`;
  if(isWide)body+=`<div class="card tap" onclick="go('accom')"><div class="rowsb"><div><div style="font-weight:600">Accommodation allocations</div><div class="sub">Spaces &amp; per-church spot allocation</div></div><span class="pill info">View ›</span></div></div>`;
  body+=`<div class="card"><div class="rowsb"><div class="lbl" style="margin:0">${isWide?'Camp registrations':'Your registrations'}</div><b>${h.totalRegistrants||0}</b></div>
    <div class="rowsb" style="margin-top:6px"><span class="sub" style="font-size:var(--t-xs)">${h.totalCampers||0} students · ${h.totalLeaders||0} leaders</span></div></div>`;
  // `regs` (/registrants) loaded in parallel above — used by both the wide by-ministry table and the church accommodation summary.
  if(isWide){
    // By-ministry M/F split — aggregate from /registrants (the /home + /breakdown DTOs carry no gender split)
    const _blank=n=>({name:n,maleStudents:0,femaleStudents:0,maleLeaders:0,femaleLeaders:0,total:0});
    const by={};
    /* ⚠ SEED EVERY CHURCH AT ZERO FIRST (owner request 2026-08-04). Built from /registrants
       alone, this table could only ever list churches that had already registered somebody —
       so the ministries a director most needs to see, the ones who have sent nothing in, were
       the exact rows that were missing. A church with no registrants is not absent from the
       camp, it is a chase-up. */
    (churchRows||[]).forEach(ch=>{by[ch.id]=_blank(ch.name);});
    /* Registrants still create their own row when there is no matching church record — that is
       how the `__unallocated__` sentinel bucket keeps appearing. Do not "tidy" this into a
       lookup against churchRows only; unallocated people would silently vanish from the totals. */
    (regs||[]).forEach(r=>{const c=by[r.churchId]||(by[r.churchId]=_blank(r.churchName));c.total++;
      const ld=r.kind==='leader';if(r.gender==='male'){ld?c.maleLeaders++:c.maleStudents++;}else{ld?c.femaleLeaders++:c.femaleStudents++;}});
    // Alphabetical, so the row a director is looking for is where they left it. Zero rows are
    // muted rather than sorted to the bottom — "who has sent nothing" is answered by scanning
    // for grey, and the list stays in one predictable order.
    const churches=Object.values(by).sort((a,b)=>String(a.name||'').localeCompare(String(b.name||'')));
    if(churches.length){
      body+=`<h3 class="sec">By ministry</h3>`;
      const gcols='grid-template-columns:1fr 58px 20px 58px 20px 34px';
      const hdr=`<div style="display:grid;${gcols};align-items:end;font-size:.6rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:700;padding-bottom:6px;border-bottom:1px solid var(--line)"><span></span><span style="text-align:center">Student</span><span></span><span style="text-align:center">Leader</span><span></span><span style="text-align:center">Total</span></div>`;
      // A church that has registered nobody renders muted with a single em dash rather than a
      // row of five zeros — five 0s read as five measurements, and the row it matters to a
      // director is the one saying "nothing has arrived from here yet".
      const rows=churches.map(c=>c.total===0
        ?`<div style="display:grid;${gcols};align-items:center;padding:7px 0;border-top:1px solid var(--line);color:var(--muted)">
        <span style="min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</span>
        <span style="text-align:center">—</span><span></span><span style="text-align:center">—</span><span></span>
        <span style="text-align:center;font-weight:700">0</span>
      </div>`
        :`<div style="display:grid;${gcols};align-items:center;padding:7px 0;border-top:1px solid var(--line)">
        <span style="font-weight:600;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</span>
        <span style="text-align:center;white-space:nowrap"><b style="color:var(--male)">${c.maleStudents}</b><b style="color:var(--female);margin-left:9px">${c.femaleStudents}</b></span><span></span>
        <span style="text-align:center;white-space:nowrap"><b style="color:var(--male)">${c.maleLeaders}</b><b style="color:var(--female);margin-left:9px">${c.femaleLeaders}</b></span><span></span>
        <span style="text-align:center;font-weight:800;color:var(--ink)">${c.total}</span>
      </div>`).join('');
      body+=`<div class="card" style="padding:8px 12px">${hdr}${rows}</div>`;
    }
  }
  // Bug-2 follow-up: the church/zoneLeader "Accommodation registrations" card was removed —
  // the 4-tile band at the top of the home screen now covers tent vs classroom for every role.
  // At-camp preview entry card — shown in pre-camp to all roles
  body+=`<div class="card tap" style="margin-top:18px;background:linear-gradient(135deg,#fef3c7,var(--alert-bg));border:1.5px solid #fcd34d" onclick="enterPreview()">
    <div class="rowsb">
      <div>
        <div style="font-weight:700;font-size:.94rem;color:#92400e">${ic('preview')} Preview at-camp view</div>
        <div class="sub" style="color:var(--warn);margin-top:2px">See what the app looks like during camp — read only</div>
      </div>
      <span style="font-size:var(--t-h2);color:#d97706">›</span>
    </div>
  </div>`;
  // Incidents card deliberately NOT shown on the pre-camp home (admin request, 2026-07-20) —
  // this removes pre-camp zoneLeader/director/admin's only route to RENDER.incidents;
  // pre-camp incident logging is unreachable until at-camp mode.
  // Notices — latest 3 REAL notices (incident auto-alerts are filtered out by `_noticeFeed` and
  // surface in the alert banner injected directly below instead; feed already loaded in parallel
  // above, expiry handled server-side)
  {const notices=_noticeFeed(feed).slice(0,3);
    body+=_alertBannerHtml(feed)
    +`<div class="rowsb" style="margin-top:18px"><h3 class="sec" style="margin:0">Notices</h3></div>
    <div id="homeNotices" style="margin-top:10px">${notices.length?notices.map(noticeCard).join(''):'<p class="note-hint">All caught up — no notices right now.</p>'}</div>`;
    // The "Alerts on this device" opt-in used to sit here. Moved to the Notices screen
    // (owner request 2026-07-31) — see the WEB PUSH section at the bottom of this file.
  }
  paint('home',body,'My Church Hub',isWide?'All churches':(ACTOR.churchName?esc(ACTOR.churchName):esc(ACTOR.displayName)));
};

function accLabelOf(tent,cls){const p=tent&&cls?'mixed':tent?'tent':cls?'classroom':'none';

/* ===== AT-CAMP HOME ===== */
/* ===== DIRECTOR/ADMIN MORNING DIGEST (New Feature 2) =====
   "Day N · X/Y checked in this session · Z churches complete · K first-aid records today",
   inside the hero card. Day N + X/Y come from the already-fetched /home DTO (sessionExpected
   is New Feature 2's addition to the dashboard service); churches-complete and first-aid-today
   need their own fetches, filled in by _renderDirectorDigest() once ready (same
   paint-immediately-then-inject pattern as renderOversightPulse). */
function _digestCardHtml(d){
  const day=_realCampDayNumber();
  const expected=d.sessionExpected||0;
  const checkedIn=Math.max(0,expected-(d.checkInsDue||0));
  const seg=(html,onclick)=>`<span${onclick?` style="cursor:pointer;text-decoration:underline dotted" onclick="${onclick}"`:''}>${html}</span>`;
  return `<div style="margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.25);display:flex;flex-wrap:wrap;gap:6px 10px;font-size:.78rem;color:#e0e7ff">
    ${seg('Day '+day)}<span style="opacity:.55">·</span>
    ${seg(checkedIn+'/'+expected+' checked in this session',"gotoTab('checkin')")}<span style="opacity:.55">·</span>
    ${seg('<span id="digestChurches">…</span>',"gotoTab('checkin')")}<span style="opacity:.55">·</span>
    ${seg('<span id="digestFirstAid">…</span>',"go('notes','firstaid')")}
  </div>`;
}
async function _renderDirectorDigest(){
  if(!ACTOR||!['director','admin'].includes(ACTOR.role))return;
  try{
    const session=await api('/checkin/sessions/current').catch(()=>null);
    const el=document.getElementById('digestChurches');
    if(session){
      const st=await api('/checkin/sessions/'+encodeURIComponent(session.id)+'/status').catch(()=>null);
      const byChurch={};
      (st&&st.roster||[]).forEach(r=>{
        if(!byChurch[r.church])byChurch[r.church]={done:0,total:0};
        byChurch[r.church].total++;
        if(r.checkedIn)byChurch[r.church].done++;
      });
      const churches=Object.values(byChurch);
      const complete=churches.filter(c=>c.total>0&&c.done===c.total).length;
      if(el)el.textContent=`${complete}/${churches.length} churches complete`;
    }else if(el)el.textContent='No session today';
  }catch(e){}
  try{
    const recs=await api('/notes/firstaid?limit=100').catch(()=>[]);
    const today=localDateISO();
    const count=(recs||[]).filter(n=>n.createdAt&&localDateISO(n.createdAt)===today).length;
    const el=document.getElementById('digestFirstAid');
    if(el)el.textContent=`${count} first-aid record${count===1?'':'s'} today`;
  }catch(e){}
}
async function renderHomeAtCamp(){

  const tb=document.getElementById('tabDue');if(tb){if(DUE>0){tb.style.display='grid';tb.textContent=DUE;}else tb.style.display='none';}

  let myAccom='';
  if(ACTOR.role==='church'&&ACTOR.churchId&&!PREVIEW_MODE){try{const cr=await api('/accommodation/church-rooms/'+ACTOR.churchId);
    let rooms=(cr&&cr.rooms)||[];
    /* 2026-07-31: narrow to THIS login's gender. The endpoint is church-scoped but not
       gender-scoped, so a b-/g- account was shown both teams' rooms. `ACTOR.genderScope`
       ('male'|'female'|null) rides in on the login payload (toSafeUser) and the restored
       session. A null scope means an unsplit account — keep BOTH rooms rather than blank the
       line. An empty result after filtering falls through to "To be confirmed" below, the same
       string used when the fetch fails. Display-only: the endpoint was already access-gated. */
    if(ACTOR.genderScope==='male'||ACTOR.genderScope==='female')rooms=rooms.filter(r=>r.gender===ACTOR.genderScope);
    myAccom=rooms.length?rooms.map(r=>r.name+' — '+(r.gender==='male'?'Guys':'Girls')+' ('+r.n+')').join(' · '):'To be confirmed';

  // PC-7: FAQ/Help is a PRE-CAMP aid only — no FAQ tile in at-camp home for any role.

const _DISMISS_KEY='cp_dismissed_notices';

function renderMyDay(d){

     still in the SIGN-IN phase. On day 1 before the switchover time nobody has arrived yet, so
     "N still to check in" counts a session that has not opened and reads as a backlog the
     leader has somehow already fallen behind on. `campPhase()` is the same rule the Check-in
     screen and the nav tab label branch on, so the card appears exactly when the check-in
     surface does — do NOT re-derive it from the day number here (SETTINGS.campDay is the

  if(campPhase()==='signin')return '';

// Item 4: zoneLeader's roster is already scoped to their own zone (single zone), so the old
// byZone grouping just produced one bar — effectively the "single aggregate bar" the admin
// wanted broken out. Group by church instead for zoneLeader; director/admin keep the camp-wide
// per-zone view (per-church would be 10+ bars on their home screen).
const PULSE_AMBER_PCT=70;
async function renderOversightPulse(){
  if(!['director','admin','zoneLeader'].includes(ACTOR.role))return '';
  try{
    const session=await api('/checkin/sessions/current').catch(()=>null);
    if(!session)return '';
    const st=await api('/checkin/sessions/'+encodeURIComponent(session.id)+'/status').catch(()=>null);
    if(!st)return '';
    const byChurch=ACTOR.role==='zoneLeader';
    const groups={};
    (st.roster||[]).forEach(r=>{
      const key=byChurch?r.church:r.zone;
      if(!groups[key])groups[key]={label:key,total:0,done:0};
      groups[key].total++;
      if(r.checkedIn)groups[key].done++;
    });
    const bars=Object.values(groups).map(g=>{
      const pct=g.total?Math.round(g.done/g.total*100):0;
      const amber=pct<PULSE_AMBER_PCT;
      const label=byChurch?esc(g.label):esc(g.label)+' Zone';
      const tap=byChurch?` onclick="_pulseGoToChurch('${esc(jsq(g.label))}')" style="cursor:pointer"`:'';
      return `<div style="margin-bottom:8px"${tap}>
        <div style="display:flex;justify-content:space-between;font-size:.8rem"><span>${label}</span><span>${g.done}/${g.total}</span></div>
        <div class="bar7${amber?' amber':''}"><i style="width:${pct}%"></i></div></div>`;
    }).join('');
    return bars?`<div class="card"><div class="lbl" style="margin-top:0">Check-in pulse · ${esc(st.session?.label||'')}</div>${bars}</div>`:'';
  }catch(e){return '';}
}

// Displays AU mobile numbers consistently (e.g. CSV imports that dropped the leading 0
// via spreadsheet numeric coercion show "411928301" — this reformats to "0411 928 301").
// Anything that isn't a recognisable 9/10-digit AU mobile (incl. masked contact numbers
// like "0411****01") passes through unchanged.
function fmtPhone(phone){
  if(!phone)return phone||'';
  let d=String(phone).replace(/\D/g,'');
  if(d.length===11&&d.startsWith('61'))d='0'+d.slice(2);
  else if(d.length===9&&d.startsWith('4'))d='0'+d;
  if(d.length===10&&d.startsWith('04'))return d.slice(0,4)+' '+d.slice(4,7)+' '+d.slice(7);
  return phone;
}
function telLink(phone){
  if(!phone)return esc(phone||'');
  return `<a href="tel:${esc(phone)}" style="color:var(--blue)">${esc(fmtPhone(phone))}</a>`;
}

function _ciLabel(session){
  try{
    const d=new Date(session.day+'T12:00:00Z');
    const wk=d.toLocaleDateString(undefined,{weekday:'short',timeZone:'UTC'});
    const h=parseInt((session.startTime||'09:00').split(':')[0]);
    return wk+' '+(h<12?'AM':h<17?'PM':'Eve');
  }catch(e){return session.label||session.id;}
}
/* ===== DAILY CHECK-IN ===== */
// Optimistic check-in queue — queued writes drain in order, survive brief offline.
const CHECKIN_QUEUE=[];let _draining=false,_onlineHandlerAdded=false;
// S2 (2026-07-26): the queue is persisted per account so a reload, tab eviction, or iOS
// reclaiming a backgrounded PWA no longer discards queued attendance taps. Key mirrors
// _initialsKey()'s convention. Entries carry the initials captured AT QUEUE TIME — draining
// under LEADER_INITIALS would misattribute a rehydrated entry to whoever is logged in now.
function _ciqKey(){return 'ycp_ciq_'+((ACTOR&&(ACTOR.username||ACTOR.id))||'');}
function _persistQueue(){
  try{
    if(CHECKIN_QUEUE.length)localStorage.setItem(_ciqKey(),JSON.stringify(CHECKIN_QUEUE));
    else localStorage.removeItem(_ciqKey());
  }catch(_){/* quota/private mode — in-memory queue still works */}
}
// Rehydrate on boot. Entries for any session other than the one now selected are DROPPED
// (owner decision) — their window has closed and the POST would 403. The drop is reported
// so it can be reconciled against the paper sheet rather than vanishing.
function _restoreQueue(){
  let saved=[];
  try{saved=JSON.parse(localStorage.getItem(_ciqKey())||'[]');}catch(_){saved=[];}
  if(!Array.isArray(saved)||!saved.length)return;
  const fresh=saved.filter(e=>e&&e.camperId&&e.sessionId===SEL_SESSION);
  const dropped=saved.length-fresh.length;
  CHECKIN_QUEUE.push(...fresh);
  _persistQueue();
  if(dropped>0)toast(dropped+' queued check-in'+(dropped===1?'':'s')+' from an earlier session were discarded — check the paper sheet');
  if(CHECKIN_QUEUE.length&&!_draining)drainQueue();
}
let _undoTimer=null,_undoCamperId=null,_undoType=null;
let _lastRoster=null;
// B-1 (Phase 5): count entries that were hard-dropped on an ONLINE error (4xx etc.) so the
// check-in screen can surface a "N didn't save" banner. We deliberately keep the existing
// drop-on-error + no-persistence behaviour (owner chose "banner only") — this makes the loss
// VISIBLE and prompts a re-tap, it does not silently reconstruct lost taps.
let _checkinFailed=0;
// The server explains WHY a check-in was refused (e.g. "Check-in is closed right now — the
// morning window is 06:00–12:00 …"). That message used to be swallowed by drainQueue's catch and
// replaced with a bare "tap to retry", which is actively misleading on a 4xx — retrying a refusal
// can never succeed. Keep the FIRST reason and show it in the banner. Cleared by the retry.
let _checkinFailReason='';

function _queueEntry(camperId,type){
  // initials captured NOW, not at drain time — a rehydrated entry must keep its original author.
  CHECKIN_QUEUE.push({camperId,type,sessionId:SEL_SESSION,initials:LEADER_INITIALS});
  _persistQueue();
  _updateSyncDots(camperId,'pending');
  if(!_draining)drainQueue();
  if(!_onlineHandlerAdded){window.addEventListener('online',drainQueue);_onlineHandlerAdded=true;}
}
async function drainQueue(){
  if(_draining)return;_draining=true;
  while(CHECKIN_QUEUE.length>0){
    const entry=CHECKIN_QUEUE[0];
    try{
      // entry.initials falls back for any entry queued before this change shipped.
      await api('/checkin',{method:'POST',body:{camperId:entry.camperId,sessionId:entry.sessionId,type:entry.type,initials:entry.initials||LEADER_INITIALS}});
      CHECKIN_QUEUE.shift();_persistQueue();_markSynced(entry.camperId);
    }catch(e){
      if(!navigator.onLine)break; // wait for online event; queue stays persisted
      // Deliberate: an ONLINE failure is a hard drop + banner (owner chose banner only).
      if(!_checkinFailReason)_checkinFailReason=(e&&e.message)||'';
      CHECKIN_QUEUE.shift();_persistQueue();_markSynced(entry.camperId,'error');_checkinFailed++; // B-1: surface in the banner
    }
  }
  _draining=false;
  await _rCheckin();
}
function _updateSyncDots(camperId,state){
  document.querySelectorAll('.sync-dot[data-id="'+camperId+'"]').forEach(el=>{el.className='sync-dot '+state;});
}
function _markSynced(camperId,state='synced'){_updateSyncDots(camperId,state);}
function _optimisticState(camperId,roster,queue){
  const pending=queue.filter(e=>e.camperId===camperId);
  if(!pending.length)return roster.find(r=>r.id===camperId)?.present??false;
  return pending[pending.length-1].type==='in';
}
// B-1: clear the failed badge and re-attempt any entries still queued. We do NOT reconstruct
// dropped taps (no persistence by design) — the toast tells the user to re-tap red rows.
function _retryFailedCheckins(){
  _checkinFailed=0;_checkinFailReason='';
  if(CHECKIN_QUEUE.length)drainQueue();else _rCheckin();
  toast('Re-tap any row still marked red to check them in');
}

// Unified entry: one nav id, phase-branched. Arrival sign-in before the switchover, daily after.
RENDER.checkin=async function(){
  // Item 8: an explicit home tap (openCheckinFace) forces the face; otherwise time-driven phase.
  const forced=_forceCheckinFace;_forceCheckinFace=null;
  if((forced||campPhase())==='signin'){ await _renderArrival(); return; }
  await _renderDailyCheckin();
};
/* ===== Feature 1 (2026-07-17): preview "everyone already checked in" simulation =====
   While previewing the at-camp view (PREVIEW_MODE — the pre-camp 👁 toggle, or the at-camp
   overlay inside an admin account-preview) with the REAL global mode still pre-camp, nobody has
   actually arrived yet, so the real check-in roster and My-group/roster screens are genuinely
   empty — a broken-looking demo. This block fakes a populated roster CLIENT-SIDE ONLY, built by
   re-shaping the real (pre-camp) /registrants list — it never writes anything and never touches
   the network beyond that read. Exits cleanly: once PREVIEW_MODE ends or the real mode flips to
   at-camp, `_previewSimActive()` goes false and every screen reads real data again. */
function _previewSimActive(){
  return !!(PREVIEW_MODE&&SETTINGS&&SETTINGS.campMode==='pre-camp');
}
// Fix 2 (review 2026-07-17): a SINGLE canonical population — every non-cancelled person the
// account can see, leaders included — so every screen the simulation touches (roster,
// My-group/students, openCamper) computes "who's not checked in" over the exact same people.
// Previously _previewSimRoster (non-leader-filtered) and _previewSimCampers (leader-inclusive)
// each ran _previewNotCheckedInIds over their OWN filtered list, so the two screens could
// disagree about which 5 individuals were unarrived.
function _previewCanonicalPeople(regList){
  return (Array.isArray(regList)?regList:[]).filter(r=>r.status!=='cancelled');
}
// Fix 4 (review 2026-07-17): local-only visual flips from tapping a simulated check-in row (see
// _performCheck) — never sent to the backend, cleared whenever preview is (re-)entered.
let _previewLocalFlips={};
// Deterministic "not yet checked in" set — the LAST 5 people (by surname, then first name) in
// the given (canonical) population, so the same individuals show as "not signed in" everywhere
// the simulation is used, and the not-signed-in state is demoed too, not just the all-green
// happy path.
// Fix 3 (review 2026-07-17): small-camp floor — slice(-5) with no floor marked EVERYONE
// unarrived once the population dropped to 5 or fewer (the opposite of the intended "mostly
// present, a few stragglers"). Below 6 people, hold nobody back: everyone shows checked in.
function _previewNotCheckedInIds(people){
  if(people.length<=5)return new Set();
  const sorted=[...people].sort((a,b)=>{
    const an=((a.lastName||'')+' '+(a.firstName||'')).toLowerCase();
    const bn=((b.lastName||'')+' '+(b.firstName||'')).toLowerCase();
    return an<bn?-1:an>bn?1:0;
  });
  return new Set(sorted.slice(-5).map(p=>p.id));
}
// Applies any local-only check-in-row flips (fix 4) on top of the deterministic simulated
// state — present when NOT in the canonical not-checked-in set, unless locally flipped.
function _previewIsPresent(id,notIn){
  return Object.prototype.hasOwnProperty.call(_previewLocalFlips,id)?_previewLocalFlips[id]:!notIn.has(id);
}
// Simulated daily check-in roster, shaped like _renderDailyCheckin's real `roster` array, built
// from /registrants (non-leader, non-cancelled) instead of the real (empty, pre-camp) session
// roster.
function _previewSimRoster(regList){
  // Fix 2: notIn is computed over the canonical (leader-inclusive) population, THEN the roster
  // is filtered down to non-leaders for display — so a person's not-checked-in status here
  // always matches their status on the My-group/openCamper screens, even though leaders never
  // appear in this particular roster.
  const canonical=_previewCanonicalPeople(regList);
  const notIn=_previewNotCheckedInIds(canonical);
  const people=canonical.filter(r=>r.kind!=='leader');
  return people.map(r=>({
    id:r.id,name:(r.firstName+' '+r.lastName).trim(),
    church:r.churchName,zone:r.zone,
    gender:r.gender,grade:r.grade,
    medicalFlag:(r.medicalConditions&&r.medicalConditions.length>0)||!!r.otherMedications,
    present:_previewIsPresent(r.id,notIn),
  }));
}
// Simulated CamperDto-shaped list for the My-group/roster screens (_renderMyGroup), built the
// same way — everyone `atCamp:true` except the same deterministic excluded 5.
async function _previewSimCampers(){
  const regList=await api(_scoped('/registrants')).catch(()=>[]);
  // Fix 2: same canonical population + same notIn computation as _previewSimRoster/openCamper.
  const people=_previewCanonicalPeople(regList);
  const notIn=_previewNotCheckedInIds(people);
  return people.map(r=>{
    const present=_previewIsPresent(r.id,notIn);
    return {
    id:r.id,firstName:r.firstName,lastName:r.lastName,fullName:(r.firstName+' '+r.lastName).trim(),
    kind:r.kind==='leader'?'leader':'student',
    churchId:r.churchId,churchName:r.churchName,zone:r.zone,groupId:null,
    mobile:r.mobile,gender:r.gender,grade:r.grade,
    accommodationKind:r.accommodationKind,registrationType:r.registrationType,
    registrationCost:r.registrationCost,discountCode:r.discountCode,discountAmount:r.discountAmount,
    medicalConditions:r.medicalConditions,dietaryRequirements:r.dietaryRequirements,
    otherMedications:r.otherMedications,hasMedicare:r.hasMedicare,
    parentGuardianName:r.parentGuardianName,parentPhone:r.parentPhone,parentRelation:r.parentRelation,
    consentMedical:r.consentMedical,blueCardNumber:r.blueCardNumber,blueCardExpiry:r.blueCardExpiry,
    lifecycle:present?'camper':'registered',
    atCamp:present,
    checkInHistory:[],signOutHistory:[],
    createdAt:r.createdAt,updatedAt:r.updatedAt,
  };});
}
async function _renderDailyCheckin(){
  if(SESSIONS.length===0)SESSIONS=await api('/checkin/sessions');
  // When the admin has restricted church check-in to the current session, a church login
  // is always pinned to whatever session is current right now — it can't linger on an
  // earlier/later one it picked before the restriction kicked in.
  const churchRestricted=ACTOR.role==='church'&&!!(SETTINGS&&SETTINGS.churchCheckinTimeRestricted);
  // Item 4: a church login can now BROWSE every session but only EDIT the one it's allowed to.
  // CUR_ID drives the "•" marker and the default selection for EVERY role.
  const _curSess=await api('/checkin/sessions/current').catch(()=>null);
  const CUR_ID=(_curSess&&_curSess.id)||null;
  // ⚠ THE LOCK MUST NOT COME FROM CUR_ID. `/checkin/sessions/current` is a NAVIGATION helper —
  // once camp dates exist it never returns null, because it falls back to the nearest past or
  // upcoming session. The backend's WRITE rule (allowedWindowSession) returns null outside camp
  // days and outside the AM/PM windows. On a camp day the two roughly agree, which is why this
  // survived; before camp they diverge completely, so the roster unlocked and every tap 403'd
  // into the generic "N check-ins didn't save" banner (reported 2026-07-31, church logins only —
  // admin bypasses the rule entirely). `/checkin/sessions/allowed` is that write rule, as data.
  // Fetched only when it can bite, and FAIL-CLOSED on error: no answer means no writing.
  const _allowed=churchRestricted?await api('/checkin/sessions/allowed').catch(()=>null):null;
  const ALLOWED_ID=(_allowed&&_allowed.session&&_allowed.session.id)||null;
  const closedReason=(_allowed&&_allowed.reason)||null;
  if(!SEL_SESSION)SEL_SESSION=(churchRestricted?ALLOWED_ID:null)||CUR_ID||(SESSIONS[0]&&SESSIONS[0].id);
  const sessionLocked=churchRestricted&&SEL_SESSION!==ALLOWED_ID;
  if(!SEL_SESSION){paint('checkin','<p class="note-hint">No check-in sessions configured. Set camp dates in admin settings.</p>','Daily Check-in','');return;}
  if(!window._ciqRestored){window._ciqRestored=true;_restoreQueue();}
  // Enriched RosterEntry now includes gender, grade, medicalFlag — no second /campers fetch needed.
  // "Not Signed In" (item 3) needs the students NOT on the roster at all (checkin.service's
  // roster only ever includes atCamp===true — see CLAUDE.md presence model), so fetch the
  // scoped registrant/camper lists alongside the roster status, same call shape as
  // RENDER.firstday. Both /registrants and /campers are 30s-cached by api(), so selDay/setFilter
  // re-renders don't re-hit the network.
  // Feature 1: while the preview simulation is active the real session status + camper list are
  // genuinely empty (nobody's actually arrived pre-camp) — skip those two real fetches and build
  // the roster from /registrants instead, client-side only.
  const previewSim=_previewSimActive();
  // The "Not signed in" list moved to the My-students screen, so the check-in load no longer needs
  // /campers; /registrants is only needed to build the simulated roster during a preview.
  const [st,regList]=await Promise.all([
    previewSim?Promise.resolve({session:null,roster:[]}):api('/checkin/sessions/'+encodeURIComponent(SEL_SESSION)+'/status'),
    previewSim?api(_scoped('/registrants')).catch(()=>[]):Promise.resolve([]),
  ]);
  const roster=previewSim?_previewSimRoster(regList):(st.roster||[]).map(r=>({
    id:r.camperId,name:(r.firstName+' '+r.lastName).trim(),
    church:r.church,zone:r.zone,
    gender:r.gender,grade:r.grade,medicalFlag:!!r.medicalFlag,
    present:_optimisticState(r.camperId,[{id:r.camperId,present:!!r.checkedIn}],CHECKIN_QUEUE),
  }));
  _lastRoster=roster;
  const DUE=roster.filter(c=>!c.present).length;
  const tb=document.getElementById('tabDue');if(tb){if(DUE>0){tb.style.display='grid';tb.textContent=DUE;}else tb.style.display='none';}
  const showZone=['director','admin'].includes(ACTOR.role);
  const showChurch=['zoneLeader','director','admin'].includes(ACTOR.role);
  const zonesOpt=['all',...new Set(roster.map(c=>c.zone))].filter((v,i,a)=>a.indexOf(v)===i);
  let churchPool=FILTER.zone!=='all'?roster.filter(c=>c.zone===FILTER.zone):roster;
  const churchesOpt=['all',...new Set(churchPool.map(c=>c.church))].filter((v,i,a)=>a.indexOf(v)===i);
  let list=roster.filter(c=>(FILTER.gender==='all'||c.gender===FILTER.gender)&&
    (FILTER.grade==='all'||String(c.grade)===FILTER.grade)&&
    (FILTER.zone==='all'||c.zone===FILTER.zone)&&
    (FILTER.church==='all'||c.church===FILTER.church));
  const dueList=list.filter(c=>!c.present);
  const doneList=list.filter(c=>c.present);
  const dueShown=dueList.length,presentShown=doneList.length;
  const label=_ciLabel(st.session||SESSIONS.find(x=>x.id===SEL_SESSION)||{});
  // Item 4: always show switchable session buttons (the old church-restricted branch printed a
  // static "<label> only" pill whose tooltip was unreadable — that's the reported bug). The
  // current session is the one selected by default; a restricted church picking another gets a
  // view-only banner + greyed check-in controls below.
  const dayBtns=SESSIONS.map(s=>`<button class="${s.id===SEL_SESSION?'on':''}" onclick="selDay('${s.id}')">${esc(_ciLabel(s))}${s.id===CUR_ID?' •':''}</button>`).join('');
  const gradeOpts=['all',...GRADES].map(g=>`<option value="${g}" ${String(g)===FILTER.grade?'selected':''}>${g==='all'?'All grades':'Grade '+g}</option>`).join('');
  const zoneSelOpts=zonesOpt.map(z=>`<option value="${z}" ${z===FILTER.zone?'selected':''}>${z==='all'?'All zones':z+' Zone'}</option>`).join('');
  const churchSelOpts=churchesOpt.map(ch=>`<option value="${esc(ch)}" ${ch===FILTER.church?'selected':''}>${ch==='all'?'All churches':esc(ch)}</option>`).join('');
  // Item 5/9/11: grade/gender badge to the LEFT of the name; church logins don't repeat their own
  // church on each tile (they only ever see their own), so those rows collapse to a single line and
  // fit more per screen. Item 4: when viewing a non-current session as a restricted church, the
  // check-in control is replaced by a read-only status pill (greyed / not editable).
  const showChurchOnTile=ACTOR.role!=='church';
  function rowHtml(c){
    const subTxt=showChurchOnTile?esc(c.church||c.zone||''):'';
    const rowClick=sessionLocked?'':` onclick="_performCheck('${c.id}','${c.present?'out':'in'}','${esc(jsq(c.name))}')"`;
    const actionBtn=sessionLocked
      ?`<span class="pill ${c.present?'ok':'warn'}" style="flex:none">${c.present?'In':'Out'}</span>`
      :`<button class="btn ${c.present?'ghost ':''}sm" style="z-index:1;flex:none;padding:8px 14px;font-size:var(--t-sm)" aria-label="${c.present?'Check out':'Check in'}" onclick="event.stopPropagation();_performCheck('${c.id}','${c.present?'out':'in'}','${esc(jsq(c.name))}')">${c.present?'Check out':'Check in'}</button>`;
    return `<div class="row${c.present?' checked':''}" role="button" tabindex="0"${rowClick}>
      ${gbadge(c)}
      <div style="flex:1;min-width:0">
        <div class="nm">${esc(c.name)}</div>
        ${subTxt?`<div class="sub">${subTxt}</div>`:''}
      </div>
      <button class="btn ghost sm" style="z-index:1;flex:none;padding:8px 12px" onclick="event.stopPropagation();notePrompt('${c.id}','${esc(jsq(c.name))}')">Add note</button>
      ${actionBtn}
    </div>`;
  }
  const completionBanner=dueShown===0?`<div class="card" style="background:#dcfce7;border:1px solid #16a34a;text-align:center;padding:18px 12px">
    <div style="font-size:1.3rem;font-weight:800;color:#15803d">${icSm('check')} All checked in</div>
    <div class="sub" style="color:#166534">${presentShown} of ${list.length}${list.length!==roster.length?' (filtered)':''}</div></div>`:'';
  // B-1: surface unsynced (still draining) + failed (dropped on an online error) state so a
  // leader never silently believes a tap saved. Failed banner offers a retry.
  const syncingN=CHECKIN_QUEUE.length;
  const syncBanner=(syncingN>0||_checkinFailed>0)?
    (_checkinFailed>0
      ?`<div class="ci-sync ci-sync-fail" onclick="_retryFailedCheckins()">${icSm('alert')} ${_checkinFailed} check-in${_checkinFailed===1?'':'s'} didn’t save — ${_checkinFailReason?esc(_checkinFailReason):'tap to retry'}</div>`
      :`<div class="ci-sync ci-sync-pending">${icSm('clock')} ${syncingN} syncing…</div>`):'';
  const doneSection=doneList.length>0?`<details style="margin-top:8px"><summary class="row" style="cursor:pointer;color:var(--muted);font-size:.85rem;padding:8px 12px">Done · ${doneList.length}</summary>
    ${doneList.map(c=>rowHtml(c)).join('')}</details>`:'';
  // ("Not signed in" moved to the bottom of the My-students screen — see filterMyYouth.)
  const html=`<div class="seg" id="dayseg">${dayBtns}</div>
    ${sessionLocked?`<div class="infobox" style="font-size:.8rem;margin-bottom:8px">${icSm('clock')} ${ALLOWED_ID
      ?`Viewing ${esc(label)} — only the current session can be checked in. Tap the highlighted session (•) to check people in.`
      :esc(closedReason||'Check-in is closed right now. You can look through the roster, but nobody can be checked in until a check-in window opens on a camp day.')}</div>`:''}
    ${(showZone||showChurch)?`<div class="filters">${showZone?`<select onchange="setFilter('zone',this.value)">${zoneSelOpts}</select>`:''}${showChurch?`<select onchange="setFilter('church',this.value)">${churchSelOpts}</select>`:''}</div>`:''}
    <div class="filters">
      <select onchange="setFilter('gender',this.value)"><option value="all" ${FILTER.gender==='all'?'selected':''}>All genders</option><option value="female" ${FILTER.gender==='female'?'selected':''}>Girls</option><option value="male" ${FILTER.gender==='male'?'selected':''}>Guys</option></select>
      <select onchange="setFilter('grade',this.value)">${gradeOpts}</select>
    </div>
    ${syncBanner}
    ${_filterBanner('checkin',list.length,roster.length)}
    <div class="card" style="display:flex;justify-content:space-between;align-items:center">
      <div><div class="nm">${esc(label)} check-in ${helpTip('Tap a name to mark that person present for this session; tap again to undo. Pick a different session with the buttons up top.')}</div><div class="sub">Still need ${dueShown}${list.length!==roster.length?' · filtered':''}</div></div>
      ${dueShown>0?`<div style="text-align:right"><div style="font-weight:800;font-size:var(--t-h1);line-height:1;color:var(--warn)">${dueShown}</div><div class="sub" style="font-size:var(--t-2xs)">not yet in</div></div>`:''}
    </div>
    ${completionBanner}
    ${dueList.map(c=>rowHtml(c)).join('')}
    ${doneSection}
    <p class="note-hint">Tap a row to check in/out. Notes show on the student's profile to your church too, unless marked sensitive.</p>`;
  paint('checkin',html,'Daily Check-in',label);
  // Show undo toast if pending
  if(_undoCamperId)_showUndoToast(_undoType);
};
function selDay(id){SEL_SESSION=id;RENDER.checkin();}
function setFilter(k,v){FILTER[k]=v;if(k==='zone')FILTER.church='all';_saveFilters();RENDER.checkin();}

// Re-render the check-in screen WITHOUT jumping back to the top of a long roster. paint() keeps the
// scroll on a clean same-screen repaint, but a check-in/out reflow (a row moving into the collapsed
// "Done" section) can shrink the content and clamp it — so capture and restore explicitly. Used for
// the check/uncheck actions only; deliberate navigations (selDay/setFilter) still reset to top.
function _rCheckin(){
  const el=document.getElementById('checkin');
  const sc=_scroller(el);const y=sc?sc.scrollTop:0;
  return Promise.resolve(RENDER.checkin()).then(()=>{const e2=_scroller(document.getElementById('checkin'));if(e2)e2.scrollTop=y;});
}
function _performCheck(camperId,type,name){
  if(!_ensureInitials())return; // item 7: church initials gate (no-op once set; other roles pass)
  // Fix 4 (review 2026-07-17, MEDIUM-LOW): during the preview simulation there is no real
  // check-in session — the api() write-guard blocks the POST `_queueEntry` would fire, so the
  // row never actually flipped AND drainQueue's caught error ticked up `_checkinFailed`, so a
  // false "N check-in(s) didn't save — tap to retry" banner accumulated. Flip the row LOCALLY
  // ONLY (no queue, no network) and bail before any of that.
  if(_previewSimActive()){
    _previewLocalFlips[camperId]=(type==='in');
    toast(type==='in'?'Checked in (preview)':'Checked out (preview)');
    _rCheckin();
    return;
  }
  // Check-out no longer asks for confirmation — reaching this point already required
  // actively opening the "Done" section and tapping the row, which is deliberate enough.
  // Optimistic flip
  _queueEntry(camperId,type);
  // Start undo window
  clearTimeout(_undoTimer);_undoCamperId=camperId;_undoType=type;

/* ===== BUDGET (director/admin) =====
   Tent/classroom prices come from Camp settings; the backend has no fee-tier, so every
   camper is charged the full price for their accommodation kind. */
/* ===== BUDGET & COSTINGS =====
   SPA mirror of src/services/budget.ts (the canonical, unit-tested algorithm). Keep the two in
   step — the SPA computes the budget client-side and would otherwise disagree with the server.

   2026-07-29 REWRITE: categories are TICKET CLASSIFICATIONS, not cost bands. A category used to
   be a distinct `registrationCost` value labelled "Full — $180" / "Half" / "Part" / "Sponsored".
   It is now the accommodation kind (tent | classroom) crossed with a payment tag the admin sets
   on the DISCOUNT CODE, plus one "Accommodation not recorded" bucket. See budget.ts's header
   comment for the full rationale; everything below mirrors it function for function.

   ⚠ THE GRAND TOTAL IS "MONEY RECEIVED", NOT "VALUE OF ALL PLACES" — see `_personValue`. */
function _money(n){return '$'+Number(n||0).toLocaleString('en-AU',{maximumFractionDigits:2});}
/* Mirrors CLASS_ORDER + CLASS_LABEL in budget.ts. Row order in every scope, so the table reads
   the same way every time. Adding a class = one entry here + one in budget.ts. */
const _BUD_CLASSES=[
  ['tent','Tent'],
  ['tent-inperson','Tent in person'],
  ['tent-discount','Discounted tent'],
  ['tent-sponsor','Tent full sponsor'],
  ['classroom','Classroom'],
  ['classroom-inperson','Classroom in person'],
  ['classroom-discount','Discounted classroom'],
  ['classroom-sponsor','Classroom full sponsor'],
  ['unknown','Accommodation not recorded'],
];
const _BUD_CLASS_LABEL=Object.fromEntries(_BUD_CLASSES);
/* A TicketClass is two facts glued together — where they sleep and how they paid — and the CSV
   splits it back into two columns (2026-08-04). Derived from the KEY, never parsed out of the
   display label: the label carries an em dash and a price and is written for a phone screen,
   not a spreadsheet. Keys are the stable contract with budget.ts. */
function _budAccom(cls){
  if(cls==='unknown')return 'Not recorded';
  return String(cls).indexOf('tent')===0?'Tent':'Classroom';
}
function _budPayment(cls){
  if(cls==='unknown')return '';
  const i=String(cls).indexOf('-');
  if(i<0)return 'Full price';
  const tag=String(cls).slice(i+1);
  return tag==='inperson'?'Paid in person':tag==='sponsor'?'Full sponsor':tag==='discount'?'Discounted':tag;
}
/** The three tags an admin can put on a discount code, and how they read in the dropdown. */
const _BUD_TAGS=[['inperson','Paid in person'],['sponsor','Full sponsor'],['discount','Discounted']];
function _budRowLabel(cls,amount){
  const base=_BUD_CLASS_LABEL[cls]||cls;
  return amount==null?base:(base+' — '+_money(amount));
}
/** Mirrors budget.ts discountTagFor — the tag alone, independent of accommodationKind. Null for
    no code / untagged / an unrecognised tag value. See `_classifyTicket`'s comment for why this
    must stay a SEPARATE function (2026-08-05 fix). */
function _discountTagFor(p,tags){
  const code=(p.discountCode||'').trim();
  if(!code)return null;
  const tag=(tags||{})[code];
  return (tag==='inperson'||tag==='sponsor'||tag==='discount')?tag:null;
}
/* Mirrors budget.ts classifyTicket. An unrecognised tag falls back to the plain class.
   ⚠️ DISPLAY BUCKET ONLY (2026-08-05 fix). accommodationKind unknown → 'unknown' regardless of
   the tag — we don't know tent vs classroom, so there's no 'unknown-sponsor' row. That does NOT
   mean the tag is thrown away: `_personValue`/`_sponsorAmountFor` look it up themselves via
   `_discountTagFor`, so a sponsor code still reads $0 even while accommodation is unrecorded.
   Before this fix a sponsor-tagged person with no accommodationKind yet (registered via Form+
   Invoice but not on the Ticket List) had their FULL registrationCost counted as money received,
   and the Sponsorship card showed $0 owed for them — see CLAUDE.md 2026-08-05. */
function _classifyTicket(p,tags){
  const kind=p.accommodationKind;
  if(kind!=='tent'&&kind!=='classroom')return 'unknown';
  const tag=_discountTagFor(p,tags);
  if(tag)return kind+'-'+tag;
  return kind;
}
/* Mirrors budget.ts personValue — READ ITS DOC COMMENT before changing this. Order encodes a
   deliberate owner decision: a 'inperson' code is valued at the admin's base price (the money
   was collected by hand, so no invoice records it), a 'sponsor' code is $0 (no money received),
   and otherwise `amountPaid` WINS over `registrationCost` because registrationCost is the ticket
   TOTAL while amountPaid is what actually arrived. That is what makes the grand total read as
   money received. To read it as "value of all places" instead, swap the last two lines here and
   in budget.ts's personValue — nothing else needs to change. Returns null = nothing recorded. */
/* ── Ticket prices, LEARNED FROM THE INVOICES (2026-08-02) ─────────────────────────────────────
   Mirrors src/services/ticket-prices.ts EXACTLY — change both together.

   The camp had two scalar settings, `tentPrice` and `classroomPrice`, and they had never been
   filled in, so anything the budget could not value from an invoice counted as $0. The owner then
   asked the question that kills the scalar model: *"what if there is a standard tent AND an early
   bird tent price?"* Two numbers cannot answer it. But the price is already in the data —
   `registrationCost` comes from the invoice and every ticket type has exactly one distinct cost —
   so the table is DERIVED. A new ticket type prices itself the moment its first invoice lands.

   ⚠️ Tie-break is deliberately the LOWER price: this values money as received, so guessing high
   invents income nobody paid. `distinctCosts > 1` is the flag that a type is ambiguous. */
function _normTicketType(t){return (t==null?'':String(t)).trim().replace(/\s+/g,' ').toLowerCase();}
function _budTicketPrices(regs){
  const seen=new Map();
  (regs||[]).forEach(r=>{
    const key=_normTicketType(r.registrationType);
    if(!key)return;
    const cost=r.registrationCost==null?null:Number(r.registrationCost);
    if(cost==null||!isFinite(cost))return;

function _discountTagConflict(tag,avgPercent){
  if(tag==null||avgPercent==null)return null;
  const pct=Math.round(avgPercent);
  if(tag==='sponsor'&&avgPercent<_FULL_DISCOUNT_PCT)
    return 'Tagged full sponsor, but the invoices record '+pct+'% off — the rest was paid and is being counted as $0.';
  if(tag==='discount'&&avgPercent>=_FULL_DISCOUNT_PCT)
    return 'Tagged discounted, but the invoices record the whole ticket discounted ('+pct+'%).';
  return null;
}
/** Mirrors src/services/budget.ts deriveDiscountPurpose. */
function _deriveDiscountPurpose(pairs){
  const avgPercent=_avgDiscountPct(pairs);
  if(avgPercent==null)return null;
  const valid=pairs.filter(x=>x.cost>0&&x.discount!=null);
  // Item C (2026-07-28) — mirrors budget.ts: a ~full-price code is a "bought the wrong ticket,
  // pay the difference" correction, not a concession. Still counted, but labelled honestly.
  if(avgPercent>=_FULL_DISCOUNT_PCT)return 'Ticket difference — already paid';
  const bucket=[25,50,70,100].find(b=>Math.abs(avgPercent-b)<=3);
  if(bucket!=null)return bucket+'% Off';
  const avgDollar=Math.round(valid.reduce((s,x)=>s+x.discount,0)/valid.length);
  return avgDollar>0?('$'+avgDollar+' Off'):null;
}
/** Mirrors src/services/budget.ts computeDiscountCodeSummary (incl. the per-code `tag`). */
function computeDiscountSummaryClient(regs,filterId){
  const tags=_budTags();
  const people=(regs||[]).filter(r=>!filterId||filterId==='all'||r.churchId===filterId);
  const counts=new Map(),pairsByCode=new Map();
  people.forEach(r=>{const code=(r.discountCode||'').trim();if(!code)return;
    counts.set(code,(counts.get(code)||0)+1);
    const cost=r.registrationCost==null?null:Number(r.registrationCost),discount=r.discountAmount==null?null:Number(r.discountAmount);
    if(cost!=null&&discount!=null){const pairs=pairsByCode.get(code)||[];pairs.push({cost,discount});pairsByCode.set(code,pairs);}});
  const rows=[...counts.entries()].map(([code,count])=>{
    const pairs=pairsByCode.get(code)||[];
    const avgPercent=_avgDiscountPct(pairs);
    const tag=tags[code]||null;
    return {code,count,purpose:_deriveDiscountPurpose(pairs),tag,avgPercent,
      tagConflict:_discountTagConflict(tag,avgPercent)};})
    .sort((a,b)=>b.count-a.count||a.code.localeCompare(b.code));
  return {totalInScope:people.length,rows};
}

function _budUnpricedInperson(regs,filterId,ptable,prices){

    .filter(r=>!filterId||filterId==='all'||r.churchId===filterId)
    .forEach(r=>{

        amountPaid:r.amountPaid==null?null:Number(r.amountPaid),
        accommodationKind:r.accommodationKind||null,discountCode:r.discountCode,
        registrationType:r.registrationType||null,
        amountPaidOverride:r.amountPaidOverride==null?null:Number(r.amountPaidOverride)};
      if(p.amountPaidOverride!=null)return; // an admin-set override makes the value known regardless of ticket class/price-table state

/* The budget export — a formatted THREE-SHEET WORKBOOK since 2026-08-04 (owner: "the budget
   export should be an excel sheet so that excel formatting/styles can be used to make it more
   clear what is the 'total' and what is the 'lower level detail' — currently it is hard to read
   when there are several rows labelled for each church").

   It replaces the CSV rather than sitting beside it. Two exports of the same figures drift, and
   the CSV's one advantage — "opens anywhere" — is not an advantage over a workbook that Excel,
   Numbers, Sheets and LibreOffice all open natively.

   ⚠️ **EVERY HARD-WON PROPERTY OF THE CSV IS CARRIED OVER, NOT DISCARDED:**
   · `Row type` still exists as a real column. It was added because `Audience` used to mix a
     dimension (Student/Leader) with row KINDS (Total/Grand total), so a naive SUM double-counted
     every subtotal. Filter to `Detail` and the maths is still trustworthy — there is a harness
     check asserting detail rows alone reach the grand total AND that summing every row does not.
   · Accommodation and Payment type are still derived from the class KEY (`_budAccom`/`_budPayment`),
     never string-parsed out of the display label.
   · `Unit price` is still BLANK, never 0, on a mixed-value row — a 0 reads as "free" while the
     line total says otherwise.
   · Sponsorship is still money that has NOT arrived, so it is not typed `Detail`. It now gets its
     own SHEET, which makes that separation structural rather than a convention a reader has to
     know about: nothing on the received sheet can accidentally sum it in.
   The BOM rule is the one thing that does NOT carry over, and only because it cannot apply — an
   xlsx stores text as UTF-8 XML, so the em dash that started this whole thread is simply correct.

   What the owner actually asked for is the STYLING, and it lives in the row-style choices below:
   a repeated church name recedes to muted grey, a church total is bold on lavender with a rule
   above it, and the camp total is white on indigo. The hierarchy is visible at arm's length
   instead of having to be read column by column. */
async function exportBudget(){
  const btn=document.getElementById('budExportBtn');
  if(btn)btn.disabled=true;
  try{
    const scope=sel('budChurch')||'all';
    const rep=computeBudgetClient(window._budgetRegs,scope);
    const spon=computeSponsorSummaryClient(window._budgetRegs,scope);
    const scopeLabel=scope==='all'?'All ministries':((rep.churches[0]&&rep.churches[0].churchName)||'Selected ministry');
    const year=(SETTINGS&&SETTINGS.year)||'';

    /* ── Sheet 1: Summary ──────────────────────────────────────────────────────────────────
       The two figures a director carries into a conversation, and the one line that ties them
       together. The reconciliation is an invariant of the model, not a nicety:
       sponsor total + grand total = the value of every place (asserted in budget.sponsor.test.ts). */
    const sum=[
      [_xc('Youth camp '+year+' — Budget',XS.TITLE)],
      [_xc('Scope: '+scopeLabel,XS.SUB)],
      [_xc('Exported '+new Date().toLocaleDateString('en-AU')+' · amounts are MONEY RECEIVED, not the value of every place',XS.SUB)],
      [],
      [_xc('Money received',XS.SECTION)],
      [_xc('Item',XS.HEAD),_xc('People',XS.HEAD),_xc('Amount',XS.HEAD)],
      [_xc('Students',XS.TEXT),_xn(rep.camperCount,XS.NUM),_xn(null,XS.MONEY)],
      [_xc('Leaders',XS.TEXT),_xn(rep.leaderCount,XS.NUM),_xn(null,XS.MONEY)],
      [_xc('Total received',XS.GRAND_T),_xn(rep.camperCount+rep.leaderCount,XS.GRAND_N),_xn(rep.grandTotal,XS.GRAND_M)],
      [],
    ];
    if(spon.count){
      /* No PLACES column here (owner, 2026-08-04 5th-b). A sponsorship headcount answers a
         different question from the ask, and sitting in the same table it invited the reading
         "$830 ÷ 6 places" — which is the per-place average the band split exists to avoid.
         The count still drives the unpriced warning below, it is just not presented as a figure. */
      sum.push([_xc('Sponsorship still needed',XS.SECTION)]);
      sum.push([_xc('Item',XS.HEAD),_xc('',XS.HEAD),_xc('Amount',XS.HEAD)]);
      sum.push([_xc('Full sponsorship',XS.TEXT),_xc('',XS.TEXT),_xn(spon.fullTotal,XS.MONEY)]);
      sum.push([_xc('Part sponsored',XS.TEXT),_xc('',XS.TEXT),_xn(spon.partialTotal,XS.MONEY)]);
      sum.push([_xc('Total still needed',XS.TOT_T),_xc('',XS.TOT_T),_xn(spon.total,XS.TOT_M)]);
      /* ⚠ An unpriceable place is COUNTED AND FLAGGED, never totalled as $0 — a $0 ask reads as
         "already covered", which is the opposite of "we don't know what this one is worth". */
      if(spon.unpricedCount)sum.push([_xc(spon.unpricedCount+' sponsored place(s) have no ticket price on record, so the total above UNDER-reads. Set a ticket price or record the invoice to close the gap.',XS.NOTE)]);
    }
    sum.push([]);
    sum.push([_xc('"Money received" counts what has actually come in: a full-sponsor code contributes $0 and a place paid in person is valued at its ticket price. Sponsorship is the gap that must arrive from elsewhere for the camp to be whole.',XS.NOTE)]);

    /* ── Sheet 2: By ministry ─────────────────────────────────────────────────────────────── */
    const HEAD=['Church','Row type','Audience','Accommodation','Payment type','Discount code','People','Unit price','Line total'];
    const rows=[HEAD.map((h)=>_xc(h,XS.HEAD))];
    const detail=(church,aud,list)=>(list||[]).forEach((r)=>rows.push([
      /* The church name repeats on every row so the sheet stays filterable and pivotable — the
         owner's complaint was that the repetition is what makes it hard to read, and MUTED grey
         answers that without deleting the fact. Do not blank it instead. */
      _xc(church,XS.MUTED),_xc('Detail',XS.MUTED),_xc(aud,XS.TEXT),
      _xc(_budAccom(r.key),XS.TEXT),_xc(_budPayment(r.key),XS.TEXT),_xc(r.codeHint||'',XS.TEXT),
      _xn(r.count,XS.NUM),_xn(r.amount==null?null:r.amount,XS.MONEY),_xn(r.lineTotal,XS.MONEY),
    ]));
    /* ⚠ THE CHURCH TOTAL LEADS ITS BLOCK, DETAIL SITS UNDER IT (owner, 2026-08-04 5th-b).
       A spreadsheet subtotal conventionally FOLLOWS its rows, which is why it was written that
       way — but the question this sheet is opened to answer is "what did each ministry owe",
       and a total that arrives last has to be hunted for at the bottom of a block whose length
       varies by ministry. Leading with it means scrolling the sheet reads as a list of totals,
       with the working underneath for anyone who wants it. The row keeps its top border, which
       now separates one ministry's block from the previous one. */
    rep.churches.forEach((c)=>{
      rows.push([_xc(c.churchName,XS.TOT_T),_xc('Church total',XS.TOT_T),_xc('',XS.TOT_T),_xc('',XS.TOT_T),
        _xc('',XS.TOT_T),_xc('',XS.TOT_T),_xn(c.camperCount+c.leaderCount,XS.TOT_N),_xn(null,XS.TOT_M),_xn(c.total,XS.TOT_M)]);
      detail(c.churchName,'Student',c.campers);
      detail(c.churchName,'Leader',c.leaders);
    });
    rows.push([_xc(scopeLabel,XS.GRAND_T),_xc('Camp total',XS.GRAND_T),_xc('',XS.GRAND_T),_xc('',XS.GRAND_T),
      _xc('',XS.GRAND_T),_xc('',XS.GRAND_T),_xn(rep.camperCount+rep.leaderCount,XS.GRAND_N),_xn(null,XS.GRAND_M),_xn(rep.grandTotal,XS.GRAND_M)]);
    // The filter covers the RECEIVED table only — see the sponsorship block below.
    const receivedRows=rows.length;

    /* ── Sponsorship, appended below the received table after a gap (owner, 2026-08-04 5th-b;
       it was its own sheet for a few hours) ───────────────────────────────────────────────
       Per ministry per code only. The BAND rows are gone at the owner's request: a band is one
       asking PRICE, so dropping them is what removes the early-bird/full-price differential
       from the EXPORT. ⚠ It is NOT gone from the product — the Sponsorship card on the Budget
       screen still opens each code into its bands, and `computeSponsorSummaryClient` still
       computes them (there is a test asserting $170 never appears). Do not delete `bands` on the
       strength of this export no longer printing it.

       ⚠ AND SPONSORSHIP IS STILL NOT `Detail`. On its own sheet that separation was structural;
       back on this one it rests on three things, all of which must hold: the blank spacer row,
       the distinct `Row type` values, and the autofilter stopping at `receivedRows` so
       "filter to Detail" cannot pull this block into the same table. This is money that has NOT
       arrived — summing it into the received column is the exact double-count the `Row type`
       column was added to prevent. */
    if(spon.count){
      rows.push([]);
      rows.push([_xc('Sponsorship still needed — money that has NOT arrived. Do not add these rows to the totals above.',XS.SECTION)]);
      spon.churches.forEach((c)=>c.codes.forEach((x)=>rows.push([
        _xc(c.name,XS.MUTED),_xc('Sponsor by ministry',XS.MUTED),_xc('',XS.TEXT),_xc('',XS.TEXT),
        _xc(_SPONSOR_TAG_LABEL[x.tag]||x.tag,XS.TEXT),_xc(x.code,XS.TEXT),
        _xn(x.count,XS.NUM),_xn(null,XS.MONEY),_xn(x.total,XS.MONEY)])));
      rows.push([_xc(scopeLabel,XS.GRAND_T),_xc('Sponsor total',XS.GRAND_T),_xc('',XS.GRAND_T),_xc('',XS.GRAND_T),
        _xc('',XS.GRAND_T),_xc('',XS.GRAND_T),_xn(spon.count,XS.GRAND_N),_xn(null,XS.GRAND_M),_xn(spon.total,XS.GRAND_M)]);
    }

    const sheets=[
      {name:'Summary',cols:[46,10,14],rows:sum},
      {name:'By ministry',cols:[26,20,10,16,18,16,9,12,13],rows:rows,freeze:1,filter:'A1:I'+receivedRows},
    ];

    const blob=await _xlsxBlob(sheets);
    // Routed through the shared saver: append → click → remove → revoke after 20s. This was the
    // one export in the file that never appended its anchor at all, which made it a silent no-op
    // on mobile Chromium (2026-08-03 Android review).
    _rlSaveBlob(blob,_exportName('budget-by-church','xlsx'));
    toast('Budget workbook downloaded');
  }catch(e){
    toast('Could not build the budget workbook: '+(e.message||e));
  }finally{
    if(btn)btn.disabled=false;
  }
}

// person still lands in a tent if their church never reached the 75% eligibility threshold
// (no room group exists for them there) — folded in here so nobody is silently uncounted.
function tentDist(regs){const by={},churches=accomChurches(regs);

    if(!isTent)return;
    const c=by[r.churchId]||(by[r.churchId]={name:r.churchName,m:{stu:0,ld:0},f:{stu:0,ld:0}});

/* ===== ACCOMMODATION EXPORT (.xlsx, 4 sheets) — 2026-08-03 ================================
   Owner request. Closes the one real gap the 2026-08-03 export audit found: accommodation
   allocations had no export of any kind.

   ⚠ BUILT FROM THE SAME IN-MEMORY DATA THE SCREEN RENDERS (`window._accomRegs` / `_accomRooms`
   / `_accomAlloc`, through `accomGroups` / `accomChurches` / `tentDist`). That is deliberate
   and it is the whole reason this is client-side rather than a server endpoint: those SPA
   helpers MIRROR `src/services/accommodation-allocation.ts`, and a server-generated workbook
   would be computed from the other copy. If the two ever drift, the spreadsheet would quietly
   disagree with the map the director is looking at — and a director reconciling a room list
   against a screen has no way to tell which one is lying. Exporting what is on screen makes
   that class of bug impossible here. (Same reasoning as the check-in status PNG.)

   Written with the VENDORED SheetJS (`public/vendor/xlsx.full.min.js`, 0.18.5, lazy-loaded by
   `_ensureXlsx`). Verified it can WRITE, not just read: a two-sheet workbook round-trips
   through `XLSX.write` → `XLSX.read` with cells intact. No new dependency, no server work.
   xlsx rather than CSV because the owner asked for four sheets, and CSV cannot carry them. */
function _accomExportRows(){
  const regs=window._accomRegs||[],rooms=window._accomRooms||[],alloc=window._accomAlloc||{};
  const groups=accomGroups(regs);
  const gByKey=Object.fromEntries(groups.map(g=>[g.key,g]));
  const by=accomChurches(regs);
  const td=tentDist(regs);
  const gLabel=x=>x==='male'?'Guys':'Girls';

  // roomsForKey: which rooms a cohort sits in, and how many of it are in each.
  const roomsForKey={};
  rooms.forEach(rm=>{
    (alloc[rm.id]||[]).forEach(e=>{
      if(!gByKey[e.key])return;                       // stale entry for a group that no longer exists
      (roomsForKey[e.key]=roomsForKey[e.key]||[]).push({room:rm,n:e.n});
    });
  });

  /* ── Sheet 2: one row per cohort (church × gender × year band) ── */
  const cohortRows=[['Ministry','Gender','Cohort','Students','Leaders','Total','Placed','Unplaced','Classrooms assigned','Capacity of those classrooms']];
  const sortedGroups=groups.slice().sort((a,b)=>a.church.localeCompare(b.church)||a.gender.localeCompare(b.gender)||a.label.localeCompare(b.label));
  sortedGroups.forEach(g=>{
    const rs=roomsForKey[g.key]||[];
    const placed=rs.reduce((s,r)=>s+r.n,0);
    /* ⚠ This is the capacity of the rooms this cohort OCCUPIES, not capacity reserved for it.
       A room shared with another cohort contributes its FULL capacity here, so these figures
       are not additive down the column — the header says "Capacity of those classrooms" rather
       than anything that reads like a per-cohort entitlement. The per-classroom sheet is the
       one that answers capacity questions without double counting. */
    const cap=rs.reduce((s,r)=>s+r.room.capacity,0);
    cohortRows.push([g.church,gLabel(g.gender),g.label,g.stu,g.ld,g.n,placed,g.n-placed,
      rs.map(r=>r.room.name).join('; ')||'—',cap]);
  });

  /* ── Sheet 3: one row per classroom ── */
  const roomRows=[['Classroom','Capacity','Allocated','Remaining','Gender','Cohorts allocated']];
  rooms.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(rm=>{
    const entries=(alloc[rm.id]||[]).filter(e=>gByKey[e.key]);
    const used=entries.reduce((s,e)=>s+e.n,0);
    const rg=entries.length?gByKey[entries[0].key].gender:null;
    roomRows.push([rm.name,rm.capacity,used,rm.capacity-used,rg?gLabel(rg):'—',
      entries.map(e=>{const g=gByKey[e.key];return g.church+' — '+g.label+' ('+e.n+')';}).join('; ')||'Unallocated']);
  });

  /* ── Sheet 4: tents ── */
  const tentRows=[['Ministry','Gender','Students','Leaders','Student tents','Leader tents','Total tents']];
  let tStu=0,tLd=0,tSt=0,tLt=0;
  Object.values(td).slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{
    [['m','male'],['f','female']].forEach(([gk,gv])=>{
      const g=c[gk];
      if(g.stu+g.ld===0)return;
      // Tents of up to 7, students and leaders SEPARATELY — same rule as the on-screen table.
      const st=Math.ceil(g.stu/7),lt=Math.ceil(g.ld/7);
      tStu+=g.stu;tLd+=g.ld;tSt+=st;tLt+=lt;
      tentRows.push([c.name,gLabel(gv),g.stu,g.ld,st,lt,st+lt]);
    });
  });
  tentRows.push(['TOTAL','',tStu,tLd,tSt,tLt,tSt+tLt]);

  /* ── Sheet 1: summary ── */
  const totalCap=rooms.reduce((s,r)=>s+r.capacity,0);
  const totalPlaced=Object.values(alloc).reduce((s,arr)=>s+(arr||[]).filter(e=>gByKey[e.key]).reduce((a,e)=>a+e.n,0),0);
  const clsTotal=groups.reduce((s,g)=>s+g.n,0);
  const clsStu=groups.reduce((s,g)=>s+g.stu,0);
  const clsLd=groups.reduce((s,g)=>s+g.ld,0);
  const noPref=Object.values(by).reduce((s,c)=>s+c.none,0);
  // Ministries under the 75% bar: their classroom-preference people are counted in tents.
  const underThreshold=Object.values(by).filter(c=>c.total>0&&c.classroom/c.total<0.75&&c.classroom>0);
  const active=(regs||[]).filter(r=>r.status!=='cancelled');
  const sumRows=[
    ['Accommodation allocations',''],
    ['Camp',(SETTINGS&&SETTINGS.campName)||'Youth Camp'],
    ['Exported',new Date().toLocaleString()],
    ['',''],
    ['PEOPLE',''],
    ['Registrations (excluding cancelled)',active.length],
    ['In a classroom cohort',clsTotal],
    ['  of which students',clsStu],
    ['  of which leaders',clsLd],
    ['In tents',tStu+tLd],
    ['  of which students',tStu],
    ['  of which leaders',tLd],
    ['No accommodation type recorded',noPref],
    ['',''],
    ['CLASSROOMS',''],
    ['Classrooms set up',rooms.length],
    ['Total capacity',totalCap],
    ['Placed in a classroom',totalPlaced],
    ['Spare capacity',totalCap-totalPlaced],
    ['Still to place',clsTotal-totalPlaced],
    ['',''],
    ['TENTS',''],
    ['Student tents',tSt],
    ['Leader tents',tLt],
    ['Total tents',tSt+tLt],
    ['',''],
    ['NOTES',''],
    ['Ministries under the 75% classroom threshold',underThreshold.length],
    ['','Their classroom-preference people are counted in tents, not classrooms.'],
    ['','Tents hold up to 7, students and leaders separately.'],
  ];
  underThreshold.slice().sort((a,b)=>a.name.localeCompare(b.name)).forEach(c=>{
    sumRows.push(['  '+c.name,c.classroom+' of '+c.total+' chose classroom']);
  });

  return {sumRows,cohortRows,roomRows,tentRows,
    empty:!rooms.length&&!groups.length&&tentRows.length<=2};
}

async function exportAccommodation(){
  const btn=document.getElementById('accomExportBtn');
  if(btn)btn.disabled=true;
  try{
    const d=_accomExportRows();
    if(d.empty){toast('Nothing to export yet — no rooms, cohorts or tents');return;}
    await _ensureXlsx();
    const wb=XLSX.utils.book_new();
    const add=(rows,name)=>XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(rows),name);
    // ⚠ Sheet names: max 31 chars and none of : \ / ? * [ ] — a bad name throws on append,
    // which is exactly how the compliance workbook 500'd for weeks on 'Sign-in/Sign-out Log'.
    add(d.sumRows,'Summary');
    add(d.cohortRows,'Classrooms by ministry');
    add(d.roomRows,'Classrooms by room');
    add(d.tentRows,'Tents');
    const out=XLSX.write(wb,{bookType:'xlsx',type:'array'});
    _rlSaveBlob(new Blob([out],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}),
      _exportName('accommodation','xlsx'));
    toast('Accommodation workbook downloaded');
  }catch(e){
    toast(e.message||'Could not build the workbook');
  }finally{
    if(btn)btn.disabled=false;
  }
}
