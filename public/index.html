function _isoToLocalInput(iso){if(!iso)return '';const d=new Date(iso);if(isNaN(d.getTime()))return '';
  const p=new Intl.DateTimeFormat('en-CA',{timeZone:'Australia/Brisbane',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
  const g=t=>((p.find(x=>x.type===t)||{}).value||'');let hh=g('hour');if(hh==='24')hh='00';
  return `${g('year')}-${g('month')}-${g('day')}T${hh}:${g('minute')}`;}
function _schedLabel(iso){const li=_isoToLocalInput(iso);if(!li)return '';return li.slice(0,10)+' · '+_ampm(li.slice(11));}
async function sendNotif(){const title=document.getElementById('ntitle').value.trim(),body=document.getElementById('nbody').value.trim();
  if(!title||!body){toast('Enter title + message');return;}
  let p={priority:window._pri,title,body};
  if(window._aud==='camp')p.scope='camp';else if(window._aud==='myzone'){p.scope='zone';p.zone=ACTOR.zone;}
  else{p.scope='zone';p.zone=document.getElementById('zoneSel').value;}
  let scheduledFor=null;
  if(window._when==='schedule'){
    scheduledFor=_localInputToIso((document.getElementById('schedAt')||{}).value);
    if(!scheduledFor){toast('Pick a valid date & time');return;}
    if(new Date(scheduledFor).getTime()<=Date.now()){toast('Schedule a time in the future');return;}
  }
  p.scheduledFor=scheduledFor;
  const editingId=window._editNoticeId;
  // Confirm loud/immediate sends only — a scheduled or edited notice skips the "send now?" gate.
  if(!editingId&&!scheduledFor&&(p.scope==='camp'||window._pri==='urgent')){
    if(!await confirmSheet({title:'Send '+(window._pri==='urgent'?'URGENT ':'')+(p.scope==='camp'?'camp-wide':p.zone+' zone')+' notice?',confirmLabel:'Send'}))return;
  }
  try{
    if(editingId){await api('/notifications/'+editingId,{method:'PATCH',body:p});window._editNotice=null;window._editNoticeId=null;toast('Notice updated');NOTICE_SUB='scheduled';gotoTab('notifs');}
    else{await api('/notifications',{method:'POST',body:p});
      if(scheduledFor){toast('Scheduled for '+_schedLabel(scheduledFor));NOTICE_SUB='scheduled';gotoTab('notifs');}
      else{toast('Delivered');back();}}
  }catch(e){toast(e.message);}}
// Scheduled notices management (item 9) — creator sees own; director/admin see all.
/* One pending-notice card — extracted so the merged Notices screen (item 10) owns the markup. */
function _schedNoticeCard(n){return `<div class="ncard ${n.priority==='urgent'?'urgent':n.scope==='zone'?'zone':''}">
      <div class="ntop"><span class="ntag">${n.scope==='camp'?icSm('diamond')+' Camp-wide':n.scope==='church'?'Church':esc(n.zone||'')+' Zone'}</span>
      ${n.priority==='urgent'?'<span class="ntag" style="background:#fdecec;color:var(--danger)">Urgent</span>':''}

// Kept as an alias (item 10): the two screens merged, but `go('scheduled')` is still reachable

async function deleteScheduled(id){if(!await confirmSheet({title:'Delete this scheduled notice?',confirmLabel:'Delete',danger:true}))return;try{await api('/notifications/'+id,{method:'DELETE'});toast('Deleted');NOTICE_SUB='scheduled';RENDER.notifs();}catch(e){toast(e.message);}}

// The arrival ("first day sign in") body can render into either the standalone `firstday`
// screen (legacy/direct) or the unified `checkin` screen (phase==='signin'). fdDraw writes here.
let _fdScreen='firstday';
RENDER.firstday=async function(){
  _fdScreen='firstday';
  paint('firstday','<p class="note-hint" style="margin-top:40px;text-align:center">Loading…</p>','First Day Sign In','Select students to confirm');
  const [camperPage,regList]=await Promise.all([api(_scoped('/campers?pageSize=300')),api(_scoped('/registrants'))]);
  const campers=(Array.isArray(camperPage)?camperPage:camperPage.items||[]).filter(c=>c.kind==='student');
  const camperIds=new Set(campers.map(c=>c.id));
  const registrants=(Array.isArray(regList)?regList:[]).filter(c=>c.kind!=='leader'&&!camperIds.has(c.id));
  window._fdAll=[...registrants,...campers];
  window._fdPending=new Set();

// Arrival sign-in rendered INTO the unified `checkin` screen (phase==='signin'). Reuses the exact
// first-day arrival flow (window._fd* state + fdDraw/fdToggle/fdConfirmAll), only redirecting its
// output to the active `checkin` screen so the tab highlight, Back stack and nav token stay stable.
async function _renderArrival(){
  _fdScreen='checkin';
  paint('checkin','<p class="note-hint" style="margin-top:40px;text-align:center">Loading…</p>','First Day Sign In','Select students to confirm');
  const [camperPage,regList]=await Promise.all([api(_scoped('/campers?pageSize=300')),api(_scoped('/registrants'))]);
  // 2026-07-26: LEADERS are listed on this screen too. They were filtered out of BOTH feeds, so a
  // leader missed by the pre-camp→at-camp bulk sign-in (added later, or arriving on day 1 before
  // the mode switch) could not be signed in from the arrivals screen at all — the only route was
  // finding them via My Students. They are ordinary arrivals; show them. They remain excluded from
  // the twice-daily check-in roster, which is a separate screen (checkin.service filters kind).
  const campers=(Array.isArray(camperPage)?camperPage:camperPage.items||[]).filter(c=>c.kind==='student'||c.kind==='leader');
  const camperIds=new Set(campers.map(c=>c.id));
  const registrants=(Array.isArray(regList)?regList:[]).filter(c=>!camperIds.has(c.id));
  window._fdAll=[...registrants,...campers];
  window._fdPending=new Set();
  window._fdGender='all';window._fdGrade='all';
  fdDraw();
}
function fdDraw(){
  const students=window._fdAll||[];
  const notIn=students.filter(c=>!c.atCamp);
  const alreadyIn=students.filter(c=>c.atCamp);
  const gen=window._fdGender||'all';
  const gr=window._fdGrade||'all';
  // 'leader' is a grade-filter option (mirrors My Students), since leaders now appear here and
  // have no grade to filter on.
  const matchFilter=c=>(gen==='all'||c.gender===gen)&&(gr==='all'||(gr==='leader'?c.kind==='leader':String(c.grade)===gr));
  const visible=notIn.filter(matchFilter);
  // AC-3: the gender/grade filter applies to the already-signed-in section too.
  const visibleIn=alreadyIn.filter(matchFilter);
  const pending=window._fdPending||(window._fdPending=new Set());
  const gradeOpts=['all',...GRADES,'leader'].map(g=>`<option value="${g}" ${String(g)===gr?'selected':''}>${g==='all'?'All grades':g==='leader'?'Leaders':'Yr '+g}</option>`).join('');
  function fdRow(c,done){
    // AC-4: initials bubble is gender-coloured via .av.male/.av.female (blue/pink).
    const av=`<div class="av ${esc(c.gender)}">${initials(c.firstName+' '+c.lastName)}</div>`;
    // Leaders have no grade — badge them "Leader" rather than showing "Yr —".
    const gradeLabel=c.kind==='leader'?'Leader':'Yr '+(c.grade||'—');
    const info=`<div style="flex:1;min-width:0"><div class="nm">${esc(c.firstName+' '+c.lastName)}<span class="gradepill">${gradeLabel}</span></div><div class="sub">${esc(c.churchName)}</div></div>`;
    if(done){
      // AC-2: an already-signed-in student can be signed OUT here to correct a mistake.
      const nm=(c.firstName+' '+c.lastName).replace(/'/g,"\\'");
      return `<div class="row" role="button" tabindex="0" style="cursor:pointer" onclick="signOutPrompt('${c.id}','${esc(jsq(nm))}')">${av}${info}<span class="pill ok">${icSm('check')} In</span><button class="btn ghost sm" style="flex:none" onclick="event.stopPropagation();signOutPrompt('${c.id}','${esc(jsq(nm))}')">Sign out</button></div>`;
    }
    const sel=pending.has(c.id);
    return `<div class="row ${sel?'checked':''}" role="button" tabindex="0" style="cursor:pointer" onclick="fdToggle('${c.id}',this)" data-id="${c.id}">
      ${av}${info}
      <div style="width:26px;height:26px;border-radius:50%;border:2px solid ${sel?'#16a34a':'#c2cdda'};background:${sel?'#16a34a':'transparent'};display:grid;place-items:center;flex:none;transition:.15s">
        ${sel?icSm('check','cwhite'):''}
      </div></div>`;
  }
  const pendingCount=pending.size;
  let html=`
    <div class="rowsb" style="margin-bottom:8px"><span class="lbl" style="margin:0">First-day arrivals</span>${helpTip('Tick each person as they arrive on day one, then Confirm to sign them in. This marks them on site — use the daily check-in for the twice-daily roll call after that.')}</div>
    <div class="filters" style="margin-bottom:10px">
      <select onchange="window._fdGender=this.value;fdDraw()">
        <option value="all" ${gen==='all'?'selected':''}>All genders</option>
        <option value="male" ${gen==='male'?'selected':''}>Guys</option>
        <option value="female" ${gen==='female'?'selected':''}>Girls</option>
      </select>
      <select onchange="window._fdGrade=this.value;fdDraw()">${gradeOpts}</select>
    </div>
    ${visible.length?visible.map(c=>fdRow(c,false)).join(''):'<p class="note-hint">No students match these filters.</p>'}
    ${notIn.length===0?`<div class="callbox">${icSm('check')} All students in your group are signed in</div>`:''}
    ${visibleIn.length?`<h3 class="sec" style="margin-top:16px">Already signed in (${visibleIn.length})</h3>`+visibleIn.map(c=>fdRow(c,true)).join(''):''}
    <div id="fdConfirmBar" class="fd-confirm" style="display:${pendingCount>0?'block':'none'}">
      <button class="btn" style="background:#16a34a" onclick="fdConfirmAll()">Confirm ${pendingCount} sign-in${pendingCount===1?'':'s'}</button>
    </div>
    ${pendingCount>0?'<div style="height:72px"></div>':''}`;
  // Preserve scroll: ticking a student / confirming must not jump back to the top of a long list.
  const el=document.getElementById(_fdScreen);
  const sc=_scroller(el);const y=sc?sc.scrollTop:0;
  if(el){el.innerHTML=html;if(sc)sc.scrollTop=y;}
  document.getElementById('barT').textContent='First Day Sign In';
  document.getElementById('barS').textContent=(notIn.length-pendingCount)+' remaining';
}
function fdToggle(id,rowEl){
  const pending=window._fdPending||(window._fdPending=new Set());
  if(pending.has(id))pending.delete(id);else pending.add(id);
  fdDraw();
}
async function fdConfirmAll(){
  const pending=[...(window._fdPending||new Set())];
  if(!pending.length)return;
  if(!_ensureInitials())return; // item 7: church initials gate (no-op once set)
  const btn=document.querySelector('#fdConfirmBar button');
  if(btn){btn.textContent='Signing in…';btn.disabled=true;}
  const leaderName=LEADER_INITIALS||ACTOR.displayName; // church: initials; others: display name
  let ok=0,fail=0;
  await Promise.all(pending.map(id=>
    api('/attendance/sign-in',{method:'POST',body:{camperId:id,leaderName}})
      .then(()=>{
        const c=window._fdAll.find(s=>s.id===id);
        if(c)c.atCamp=true;
        window._fdPending.delete(id);
        ok++;
      })
      .catch(()=>fail++)
  ));
  if(fail)toast(fail+' failed — please retry');
  else toast(ok+' signed in');
  fdDraw();
}

RENDER.myyouth=async function(){ await _renderMyGroup('myyouth'); };
// My-group roster (At camp / Signed out / Late arrivals) rendered into `screenId`. Used by the
// legacy `myyouth` screen and by the merged Students tab (screenId='students').
async function _renderMyGroup(screenId){
  paint(screenId,'<p class="note-hint" style="margin-top:40px;text-align:center">Loading…</p>','Student Search','At camp · signed out · late');
  // Feature 1: the real /campers list is genuinely empty pre-camp (nobody's arrived) — while
  // previewing the at-camp view, build a simulated "everyone but 5 already arrived" list instead
  // (client-side only) so the roster/search screens demo populated rather than blank.
  const previewSim=_previewSimActive();
  const items=previewSim?await _previewSimCampers():(page=>Array.isArray(page)?page:page.items||[])(await api(_scoped('/campers?pageSize=300')));
  window._myNotSignedIn=await _loadMyNotSignedIn(previewSim,items);
  window._myLeaders=await _loadMyLeaders(items);
  const isWide=['zoneLeader','director','admin'].includes(ACTOR.role);
  const zones=[...new Set(items.map(c=>c.zone))].sort();
  const zoneFilterHtml=isWide?`<select id="myZoneF" onchange="setMyFilter()"><option value="all">All zones</option>${zones.map(z=>`<option value="${z}" ${MY_FILTER.zone===z?'selected':''}>${z} Zone</option>`).join('')}</select>`:'';
  window._myYouthAll=items;
  const base=`<div class="rowsb" style="margin-bottom:8px"><span class="lbl" style="margin:0">Your group</span>${helpTip('Everyone in your group, split into At camp, Signed out, and Not signed in. Tap a name to see their details and contacts.')}</div><div class="filters">${zoneFilterHtml}<select id="myGenderF" onchange="setMyFilter()"><option value="all">All genders</option><option value="female" ${MY_FILTER.gender==='female'?'selected':''}>Girls</option><option value="male" ${MY_FILTER.gender==='male'?'selected':''}>Guys</option></select><select id="myGradeF" onchange="setMyFilter()"><option value="all">All grades</option>${GRADES.map(g=>`<option value="${g}" ${String(MY_FILTER.grade)===String(g)?'selected':''}>Yr ${g}</option>`).join('')}<option value="leaders" ${MY_FILTER.grade==='leaders'?'selected':''}>Leaders</option></select></div><div id="myYouthList"></div>`;
  document.getElementById(screenId).innerHTML=base;
  filterMyYouth();
}
// "Not signed in" list for the My-students screen (moved from the daily check-in screen): scoped
// people not at camp who have never signed in — /registrants (pre-arrival, non-leader) plus any
// not-atCamp campers with no sign-out history, deduped by id. Suppressed during the preview sim.
async function _loadMyNotSignedIn(previewSim,campers){
  if(previewSim)return [];
  const regList=await api(_scoped('/registrants')).catch(()=>[]);
  const camperIds=new Set((campers||[]).filter(c=>c.kind==='student').map(c=>c.id));
  const nsRegs=(Array.isArray(regList)?regList:[]).filter(c=>c.kind!=='leader'&&!camperIds.has(c.id)&&!c.atCamp);
  const nsCampers=(campers||[]).filter(c=>c.kind==='student'&&!c.atCamp&&!(c.signOutHistory&&c.signOutHistory.length));
  return [...nsRegs,...nsCampers];
}
/* Item 14 (2026-07-31) — the Leaders sub-menu on My group.
   Leaders get signed in and out across camp exactly like students, but they are excluded from
   the twice-daily check-in roster (deliberately — that is a different screen and must stay that
   way) AND from the "Not signed in" list above, so there was no screen anywhere that answered
   "which of my leaders are actually here right now".

   ⚠️ SCOPE IS NOT COMPUTED HERE. Both feeds are already narrowed by `canAccessPerson` on the
   server — church → own church AND own gender, zoneLeader → own zone, director/admin →
   camp-wide. Re-deriving the rule client-side is how a `b-` login ends up seeing the girls'
   leaders. Do not add a gender/church filter here "to be safe"; it would either be redundant or
   wrong, and narrowing a display can never widen access anyway.

   Merges /campers (arrived leaders, present or signed out) with /registrants (leaders who have
   never signed in), deduped by id — the same pattern as _loadMyNotSignedIn. */
async function _loadMyLeaders(campers){
  const fromCampers=(campers||[]).filter(c=>c.kind==='leader');
  const seen=new Set(fromCampers.map(c=>c.id));
  const regList=await api(_scoped('/registrants')).catch(()=>[]);
  const fromRegs=(Array.isArray(regList)?regList:[]).filter(c=>c.kind==='leader'&&!seen.has(c.id));
  return [...fromCampers,...fromRegs];
}
/* Signed-in leaders first, then everyone else; alphabetical by FIRST name within each half
   (the owner's ordering — leaders are known to each other by first name, not surname). */
function _sortLeaders(rows){
  return [...rows].sort((a,b)=>
    (b.atCamp?1:0)-(a.atCamp?1:0)
    || String(a.firstName||'').localeCompare(String(b.firstName||''))
    || String(a.lastName||'').localeCompare(String(b.lastName||'')));
}
/* Called by the three <select>s. Reads the DOM ONCE, into `MY_FILTER`, then persists — the
   selects are the input, `MY_FILTER` is the state. Before 2026-08-03 the DOM WAS the state,
   which is why this filter did not survive so much as a tab change. */
function setMyFilter(){
  MY_FILTER={zone:sel('myZoneF')||'all',gender:sel('myGenderF')||'all',grade:sel('myGradeF')||'all'};
  _saveFilters();
  filterMyYouth();
}
function filterMyYouth(){
  const zone=MY_FILTER.zone,gen=MY_FILTER.gender,gr=MY_FILTER.grade;
  const matchF=c=>(zone==='all'||c.zone===zone)&&(gen==='all'||c.gender===gen)&&(gr==='all'||(gr==='leaders'?c.kind==='leader':String(c.grade)===gr));
  const all=(window._myYouthAll||[]).filter(matchF);
  const signedOut=all.filter(c=>!c.atCamp&&c.signOutHistory&&c.signOutHistory.length>0);
  const atCamp=all.filter(c=>c.atCamp);
  // "Not signed in" moved here from the daily check-in screen (with the same one-tap sign-in button).
  const notSignedIn=(window._myNotSignedIn||[]).filter(matchF);
  /* Item 14: leaders are filtered by zone/gender but NOT by the grade filter — a leader has no
     grade, so any specific year level would empty the list, and the "Leaders" option already
     shows them in the main sections above. */
  const leaders=_sortLeaders((window._myLeaders||[]).filter(c=>
    (zone==='all'||c.zone===zone)&&(gen==='all'||c.gender===gen)));
  const el=document.getElementById('myYouthList');if(!el)return;
  // Item 9/11: align My-group rows with the daily check-in rows — a grade/gender badge (or LDR) to
  // the LEFT of the name instead of an initials bubble. Church logins don't repeat their own church
  // on each tile (they only ever see their own church + gender), so those rows collapse to one line.
  const showChurchOnTile=ACTOR.role!=='church';
  function myRow(c){
    const subParts=[];
    if(showChurchOnTile){subParts.push(esc(c.zone)+' Zone');subParts.push(esc(c.churchName));}
    const sub=subParts.join(' · ');
    return `<div class="row" role="button" tabindex="0" onclick="openCamper('${c.id}')">${gbadge({kind:c.kind,gender:c.gender,grade:c.grade})}
      <div style="flex:1;min-width:0"><div class="nm">${esc(c.firstName+' '+c.lastName)}</div>
      ${sub?`<div class="sub">${sub}</div>`:''}</div><span class="chev">›</span></div>`;
  }
  // Item 14: a leader row carries its own presence pill, because this list deliberately mixes
  // signed-in and signed-out leaders in one place (that is the question it answers). Tapping
  // opens the normal profile, which already has the sign-in / sign-out button — one code path
  // for changing a leader's presence, not a second one here.
  function leaderRow(c){
    const nm=(c.firstName+' '+c.lastName).trim();
    const pill=c.atCamp
      ?'<span class="pill ok" style="flex:none">At camp</span>'
      :'<span class="pill warn" style="flex:none">Not on site</span>';
    return `<div class="row" role="button" tabindex="0" onclick="openCamper('${c.id}')">${gbadge({kind:'leader',gender:c.gender})}
      <div style="flex:1;min-width:0"><div class="nm">${esc(nm)}</div>
      ${showChurchOnTile&&c.churchName?`<div class="sub">${esc(c.churchName)}</div>`:''}</div>
      ${pill}<span class="chev">›</span></div>`;
  }
  function nsRow(c){
    const nm=(c.firstName+' '+c.lastName).trim();
    return `<div class="row">${gbadge({kind:c.kind,gender:c.gender,grade:c.grade})}
      <div style="flex:1;min-width:0"><div class="nm">${esc(nm)}</div>${showChurchOnTile?`<div class="sub">${esc(c.churchName||'')}</div>`:''}</div>
      <button class="btn ghost sm" style="flex:none;padding:8px 12px" onclick="signInConfirmList('${c.id}','${esc(jsq(nm))}',${c.kind==='leader'})">Sign in to camp</button>
    </div>`;
  }
  const groupByChurch=ACTOR.role==='zoneLeader';
  function grouped(rows,rowFn){
    if(!groupByChurch)return rows.map(rowFn).join('');
    const by={};rows.forEach(c=>{(by[c.churchName]||(by[c.churchName]=[])).push(c);});
    return Object.keys(by).sort().map(ch=>`<div class="lbl" style="margin:8px 0 2px">${esc(ch)}</div>`+by[ch].map(rowFn).join('')).join('');
  }
  function section(title,rows){
    if(!rows.length)return '';
    return `<h3 class="sec">${title} (${rows.length})</h3>`+grouped(rows,myRow);
  }
  // Signed-out and Not-signed-in collapse into dropdowns (like the old check-in "Not Signed In").
  function dropdown(title,rows,rowFn){
    if(!rows.length)return '';
    return `<details style="margin-top:8px"><summary class="row" style="cursor:pointer;color:var(--muted);font-size:.85rem;padding:8px 12px">${title} · ${rows.length}</summary>${grouped(rows,rowFn)}</details>`;
  }
  let html='';
  html+=section('At camp',atCamp);
  html+=dropdown('Signed out of camp',signedOut,myRow);
  html+=dropdown('Not signed in',notSignedIn,nsRow);
  // Item 14: sits BELOW "Not signed in", collapsed by default. `dropdown` groups by church for a
  // zoneLeader, which is what they want here too — but the sort inside each group would be lost,
  // so leaders get their own un-grouped block with the signed-in-first ordering intact.
  if(leaders.length){
    const label=ACTOR.role==='church'?'Leaders in your group':'Leaders you can see';
    html+=`<details style="margin-top:8px"><summary class="row" style="cursor:pointer;color:var(--muted);font-size:.85rem;padding:8px 12px">${label} · ${leaders.length}</summary>${leaders.map(leaderRow).join('')}</details>`;
  }
  if(!html)html='<p class="note-hint" style="margin-top:24px;text-align:center">No one matches these filters.</p>';
  /* The saved-view strip goes ABOVE the list. `_myYouthAll` is the unfiltered population; the
     leaders block is deliberately excluded from the count because it is filtered on different
     rules (zone/gender but never grade — a leader has no year level). */
  const totalAll=(window._myYouthAll||[]).length;
  el.innerHTML=_filterBanner('my',all.length,totalAll)+html;
}
async function openCamper(id,push=true){
  const p=await api('/campers/'+id);let notesHtml='';const lead=p.kind==='leader';
  // Fix 1 (review 2026-07-17, HIGH): the REAL /campers/:id fetch above still reflects the
  // genuine pre-camp backend state (atCamp:false, empty sign-in history) even when the preview
  // simulation is showing this person as checked-in on the roster/My-group screens — drilling in
  // used to always render "Signed out" + a "Sign in to camp (late arrival)" button, contradicting
  // the row that was just tapped. Recompute presence the SAME way those screens do (fix 2/3's
  // canonical not-checked-in set, via `_previewIsPresent` so a fix-4 local flip is honoured too)
  // and use that for RENDERING ONLY — `p` itself is never mutated and nothing is sent to the
  // backend, so this adds no persistence and no network write beyond the harmless /registrants
  // GET (already cached/fired elsewhere on this screen). Excluded-5 people fall through
  // unchanged (atCamp stays the real, already-false value) and still render as not-arrived.

// Item 3: after an attendance write taken from a LIST, re-render that list in place (the row

// profile itself. Keeps the leader where they were and cuts a navigation step.
async function _refreshAfterAttendance(id){
  const cur=STACK[STACK.length-1]||'home';
  if(cur==='camper'||cur==='student'){openCamper(id,false);return;}

  // paints an empty shell first (which clamps the scroll), so capture before and restore after the
  // full re-render completes (the list is tall again by then).
  const el=document.getElementById(cur);

/* ===== SCHEDULE =====
   Bug 2 (2026-07-28): the plan view was a flat time+title list. It is now a proportional,
   colour-coded timeline. Two pure helpers drive it so the rules live in one place and the
   admin editor's tooltip can quote the same keyword list:
   - `schedCategory(title)` — keyword match on the activity name (see SCHED_CATEGORIES).
   - `_schedMinutes(a,b)` — a row's length = the NEXT row's start minus this one's; the LAST
     row of the day runs to end of day (24:00), which is what "Lights Out" wants. A next-start
     that is earlier than this one (bad data / past-midnight) also falls back to end of day. */
// Keyword → category. Order matters: the first entry whose keywords match wins, so the more
// specific "zone battle" is tested before the generic meal words. Matching is lowercase
// substring, so "Zone Battles" and "Session 2" both match.
const SCHED_CATEGORIES=[
  ['session',   'Session',     ['session']],
  ['zone',      'Zone battle', ['zone battle']],
  ['preshow',   'Pre show',    ['pre show','preshow','pre-show']],
  ['meal',      'Meal',        ['breakfast','lunch','dinner','morning tea','afternoon tea','dessert']],
];
// The keyword list shown to the admin in the editor tooltip — one source of truth with the above.
function _schedKeywordHelp(){return SCHED_CATEGORIES.map(c=>c[1]+': '+c[2].map(k=>'"'+k+'"').join(', ')).join(' · ')
  +'. Anything else is shown in grey.';}
function schedCategory(title){
  const t=String(title||'').toLowerCase();
  for(const [id,,keys] of SCHED_CATEGORIES){if(keys.some(k=>t.indexOf(k)>=0))return id;}
  return 'other';
}
function _schedMins(hhmm){const m=/^(\d{1,2}):(\d{2})/.exec(String(hhmm||''));return m?(+m[1])*60+(+m[2]):null;}
// Length of the row starting at `a`, given the next row's start `b` (null = last of the day).
function _schedMinutes(a,b){
  const s=_schedMins(a);if(s==null)return 60;
  const e=b==null?24*60:_schedMins(b);
  if(e==null||e<=s)return Math.max(15,24*60-s);   // last row / bad data → runs to end of day
  return e-s;
}
// Proportional height. Deliberately compressed (not linear) so a 30-minute item stays tappable
// and an 8-hour overnight block doesn't push everything else off the screen.
/* Recut 2026-07-29: every point on the curve is ~30% lower than the original
   `min(190,max(54,40+mins*0.38))` — a 30m slot 54->38px, an hour 63->44px, the overnight
   cap 190->133px. The compression (rather than a linear scale) is still deliberate: a
   30-minute item has to stay tappable and an 8-hour block must not push the day off screen. */
function _schedHeight(mins){return Math.round(Math.min(133,Math.max(38,28+mins*0.27)));}
function _schedDur(mins){const h=Math.floor(mins/60),m=mins%60;return h&&m?h+'h '+m+'m':h?h+'h':m+'m';}
let SCHED_DAY=null;
/* Which day the Schedule screen opens on (2026-08-03, owner request).
   It used to always open on day 1, so from day 2 of camp every single visit began with the
   wrong day and a tap to correct it — and day 1 is the one day nobody needs to look up.
   TODAY when today is a camp day, otherwise the FIRST day. `localDateISO()` is the
   Brisbane-anchored "today" (a raw toISOString().slice(0,10) is UTC and reads as YESTERDAY
   from midnight to 10am local — the bug this helper exists for; do not inline a UTC date
   here). Outside the camp dates this deliberately falls back to day 1 rather than the
   nearest day: before camp the whole schedule is being previewed from the start, and after
   camp there is no "current" day to be on. `RENDER.devotional` already worked this way. */
function _schedDefaultDay(){
  const days=(SETTINGS&&SETTINGS.checkInDays)||[];
  if(!days.length)return null;
  const today=localDateISO();
  return days.indexOf(today)>=0?today:days[0];
}
RENDER.schedule=async function(){
  if(!SCHED_DAY)SCHED_DAY=_schedDefaultDay();
  if(!SCHED_DAY){paint('schedule','<p class="note-hint">No camp days configured.</p>','Schedule','');return;}
  const items=(await api('/schedule?day='+SCHED_DAY)).slice()
    .sort((a,b)=>String(a.startTime||'').localeCompare(String(b.startTime||'')));
  const days=SETTINGS?.checkInDays||[];
  const daySeg=days.length>1?`<div class="seg">${days.map(d=>`<button class="${d===SCHED_DAY?'on':''}" onclick="selSchedDay('${d}')">${new Date(d+'T12:00:00Z').toLocaleDateString(undefined,{weekday:'short',timeZone:'UTC'})}</button>`).join('')}</div>`:'';
  const rows=items.map((i,ix)=>{
    const mins=_schedMinutes(i.startTime,ix+1<items.length?items[ix+1].startTime:null);
    const cat=schedCategory(i.title);
    return `<div class="sch-item sch-${cat}" style="min-height:${_schedHeight(mins)}px">
      <div class="sch-time">${esc(i.startTime||'')} <span class="sch-dur">&middot; ${_schedDur(mins)}</span></div>
      <div class="sch-body"><div class="sch-title">${esc(i.title)}</div></div></div>`;
  }).join('');
  const legend=items.length?`<div class="sch-legend">${SCHED_CATEGORIES.map(c=>`<span class="sch-key sch-${c[0]}">${esc(c[1])}</span>`).join('')}</div>`:'';
  paint('schedule',daySeg+(items.length?`<div class="sch-list">${rows}</div>${legend}`
    :'<div class="card"><p class="sub">No items for this day.</p></div>'),'Schedule',dayLong(SCHED_DAY));
};
function selSchedDay(d){SCHED_DAY=d;RENDER.schedule();}

/* ===== DEVOTIONAL ===== */
let DEVO_DAY=null;
/* A CHURCH account inside a preview sees DAY 1 ONLY (2026-08-07, owner request).
   Why this is needed on top of the `isCampToday` lock below: that lock only bites when TODAY is
   a camp day, so PRE-CAMP it is inert and every day stays selectable. From the leaders' handout
   day a church login can tap "Preview at-camp view" on the home screen and read all four days of
   devotional content weeks early. Day 1 is the only one that should be visible as a sample.
   Covers BOTH preview kinds: the church's own at-camp preview (`PREVIEW_MODE`) and an admin
   previewing a church login (`ACCOUNT_PREVIEW`, whose stated promise is "exactly as they see it").
   Deliberately does NOT apply to a real at-camp session — there `isCampToday` already pins the
   view to today, which is stricter and correct; nor to any non-church role.
   ⚠️ CLIENT-SIDE BY NECESSITY, not by oversight: `PREVIEW_MODE` is a purely client-side construct
   and the bearer token is the church's REAL token, so the server cannot distinguish a preview read
   of /devotional/:day from a genuine at-camp one. Proportionate because the content is a spoiler,
   not private data — do not mistake this for a privacy boundary. */
function _devoDay1Only(){
  return !!(ACTOR&&ACTOR.role==='church'&&(PREVIEW_MODE||ACCOUNT_PREVIEW));
}
RENDER.devotional=async function(){
  const days=SETTINGS?.checkInDays||[];
  // Item 12: default to TODAY's devotional and grey out the other camp days (only today's is the
  // "current" one). Outside the camp dates there is no current day, so all days stay selectable.
  const today=localDateISO();
  const isCampToday=days.includes(today);
  const day1Only=_devoDay1Only();
  // Forced on EVERY render, not just when unset: DEVO_DAY is module-level and survives
  // navigation, so a day picked before the preview was entered (or before the at-camp overlay
  // was toggled on) would otherwise persist into the locked view.
  if(day1Only)DEVO_DAY=days[0]||null;
  else if(!DEVO_DAY)DEVO_DAY=isCampToday?today:((SETTINGS?.checkInDays&&SETTINGS.checkInDays[0])||null);
  if(!DEVO_DAY){paint('devotional','<p class="note-hint">No camp days configured.</p>','Daily Devotional','');return;}
  const d=await api('/devotional/'+DEVO_DAY).catch(()=>null);
  const daySeg=days.length>1?`<div class="seg">${days.map(dy=>{
    const locked=day1Only?dy!==DEVO_DAY:(isCampToday&&dy!==today);
    const lockMsg=day1Only?"toast('Only day 1 is available in preview')":"toast('Today\\'s devotional is the current one')";
    return `<button class="${dy===DEVO_DAY?'on':''}"${locked?' style="opacity:.4"':''} onclick="${locked?lockMsg:`selDevoDay('${dy}')`}">${new Date(dy+'T12:00:00Z').toLocaleDateString(undefined,{weekday:'short',timeZone:'UTC'})}</button>`;
  }).join('')}</div>`:'';
  paint('devotional',daySeg+(d?`<div class="hero" style="background:radial-gradient(130% 130% at 100% 0%,var(--teal),var(--navy) 78%)">
    <div class="k">Verse of the day</div><h2 style="font-size:1.06rem;line-height:1.5;font-weight:700">"${esc(d.verse)}"</h2>
    <div style="color:#a5f3fc;font-size:var(--t-sm);font-weight:700;margin-top:6px">${esc(d.reference)}</div></div>
    <div class="card"><div class="h3" style="margin-top:0">Reflection</div><p style="font-size:.92rem;color:#374151;line-height:1.65">${esc(d.reflection)}</p></div>
    <div class="card" style="background:var(--tint);border-color:var(--lav)"><div class="h3" style="margin-top:0;color:var(--violet-d)">Prayer</div><p style="font-size:.92rem;color:var(--violet-dd);line-height:1.65;font-style:italic">${esc(d.prayer)}</p></div>`
    :'<p class="note-hint">No devotional set for this day.</p>'),'Daily Devotional',dayLong(DEVO_DAY));
};
// Second gate on the same rule as `_devoDay1Only` — the locked buttons above already don't call
// this, so it is belt-and-braces against a future caller (or a stale inline handler in an already
// -rendered screen) reaching a non-day-1 devotional while a church preview is active.
function selDevoDay(d){
  if(_devoDay1Only()&&d!==((SETTINGS?.checkInDays||[])[0]))return;
  DEVO_DAY=d;RENDER.devotional();
}

RENDER.testimonies=async function(){

  // "CH-2" change that merged /registrants in so pre-arrival youth (lifecycle 'registered')

  // lifecycle ≥ arrived, so someone who signed in and later signed out is still listed (a

    .sort((a,b)=>(a.firstName+a.lastName).localeCompare(b.firstName+b.lastName));
  /* 2026-07-31: the church is NO LONGER printed beside each name (owner request). A church
     login's list is already church-scoped by `_scoped('/campers')`, so the label was pure noise
     for them; admin/director lose a tiebreak between two identically-named students in different

  const opts=`<option value="" selected>No specific student identified</option>`

  paint('testimonies',`<div class="rowsb" style="margin-bottom:8px"><span class="lbl" style="margin:0">Submit a testimony</span>${helpTip('Record a God-moment from camp. Choosing a student is optional — leave it blank for a general testimony. Saved for leaders and directors to review.')}</div>
    <div class="infobox" style="font-size:.82rem">Record a testimony or God-moment from camp. Pick a student if it's about one, or leave it as a general testimony. It is saved with the records that leaders &amp; directors review.</div>
    <div class="card"><label>Student (optional)</label><select id="tmCamper">${opts}</select>
    <label>Testimony</label><textarea id="tmBody" placeholder="What happened? Whose story is it? What did God do?" style="min-height:120px"></textarea>
    <div class="tglrow" style="margin-top:10px"><div><div class="tgl-l">Mark as sensitive</div><div class="sub">Hides this testimony from church logins — zone leaders, directors and admins still see it.</div></div>
    <label class="tgl"><input type="checkbox" id="tmSensitive"><span class="track"></span></label></div>
    <button class="btn" style="margin-top:10px" onclick="submitTestimony()">Submit testimony</button></div>`,'Submit Testimonies','Open all camp');
};
async function submitTestimony(){const camperId=sel('tmCamper'),body=val('tmBody');
  const leader=_actingName(); // item 2: account name (church initials / account display name)
  const sensitive=!!document.getElementById('tmSensitive')?.checked;
  if(!body){toast('Write the testimony');return;}if(leader)LAST_LEADER=leader;
  const full=leader&&leader!==ACTOR.displayName?`${body}\n— logged by ${leader}`:body;
  const payload={body:full,category:'testimony',sensitive};if(camperId)payload.camperId=camperId;
  try{await api('/notes',{method:'POST',body:payload});toast('Testimony submitted');const t=document.getElementById('tmBody');if(t)t.value='';const s=document.getElementById('tmSensitive');if(s)s.checked=false;}catch(e){toast(e.message);}}
/* Item 13: which record types the Testimonies & Notes screen is showing. A Set, and an EMPTY
   set deliberately means "all" (see RENDER.notes). Module-level so drawNotes can read it
   without touching the DOM — the chips are the view, this is the state. */
const NOTE_CAT_OPTIONS=[
  {v:'testimony',label:'Testimony'},
  {v:'note',label:'Student note'},
  {v:'firstaid',label:'First-aid'},
  {v:'signedout',label:'Signed out'},
  {v:'incident',label:'Incidents'},
];
let NOTE_CATS=new Set();
/* The Records control is now a dropdown-style multi-select (2026-08-03) — see the .msel CSS.
   The SEMANTICS are unchanged from the 2026-07-31 chips and the important one is unchanged
   too: an EMPTY set means ALL. That is a normal state (deselect the last option) and showing
   nothing there would look broken. The button label says "All records" for the empty set
   rather than "0 selected", because "0 selected" reads as the opposite of what it does. */
function _toggleNoteCat(v){
  if(NOTE_CATS.has(v))NOTE_CATS.delete(v);else NOTE_CATS.add(v);
  const b=document.querySelector('#ntCats .msel-opt[data-cat="'+v+'"]');
  if(b)b.classList.toggle('on',NOTE_CATS.has(v));
  _ntCatLabel();
  drawNotes();
}
function _ntCatLabel(){
  const el=document.getElementById('ntCatVal');if(!el)return;

/* Open/close for any .msel. Closes every OTHER one first, so two panels can never overlap. */

RENDER.notes=async function(presetFilter){

  // AC-8: synthesise "Signed out" records from the attendance data — students no longer at camp
  // (atCamp:false / lifecycle checked_out|departed) with a sign-out event. Each surfaces as a
  // record alongside testimonies/notes, sourced from signOutHistory.
  const signedOut=camps.filter(c=>c.atCamp===false&&(c.signOutHistory||[]).some(e=>e.type==='out')).map(c=>{
    const last=(c.signOutHistory||[]).filter(e=>e.type==='out').slice(-1)[0]||{};
    return {camperName:c.firstName+' '+c.lastName,church:c.churchName,zone:c.zone,gender:c.gender,grade:c.grade,
      cat:'signedout',body:last.reason?('Reason: '+last.reason):'Signed out of camp',authorName:last.leaderName||'—',createdAt:last.timestamp||c.updatedAt};
  });
  // Feature 3: incidents surface here as a read-only "Incidents" record type. The summary is
  // decrypted server-side; zone (not church) is the only locational field on an incident.
  const incidentRecs=(incidents||[]).map(i=>({camperName:'Incident'+(i.zone?' · '+i.zone+' Zone':''),church:null,zone:i.zone,gender:null,grade:null,
    cat:'incident',severity:i.severity,body:i.summary,authorName:i.createdByName,createdAt:i.createdAt}));
  window._notesAll=[...noteRecs,...signedOut,...incidentRecs].sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  const churches=[...new Set(window._notesAll.map(n=>n.church).filter(Boolean))].sort();

     the sign-out noise had no way to say so.
     Chips rather than a native <select multiple>: that control needs ctrl/cmd-click on desktop
     and renders as a cramped scrolling box on iOS, and this app is phone-first.

function drawNotes(){
  let list=window._notesAll||[];
  const ch=sel('ntChurch')||'all',z=sel('ntZone')||'all',day=sel('ntDay')||'all';
  // Empty set = no filter (see the note on _toggleNoteCat) — NOT "show nothing".

  if(ch!=='all')list=list.filter(n=>n.church===ch);
  if(z!=='all')list=list.filter(n=>n.zone===z);
  if(day!=='all'){
    const campDays=(SETTINGS&&SETTINGS.checkInDays)||[];
    // Brisbane date, not the UTC slice — see the daySel comment in RENDER.notes.
    list=day==='__pre'
      ? list.filter(n=>campDays.indexOf(localDateISO(n.createdAt))<0)
      : list.filter(n=>localDateISO(n.createdAt)===day);
  }
  const box=document.getElementById('notesList');if(!box)return;
  // Incidents carry their own low/high severity — surface it in the badge instead of a flat
  // "Incident" label (high stays the alarming red pill; low reads as a calmer amber).
  const badge=n=>{const c=n.cat||'note';
    if(c==='testimony')return '<span class="pill info">Testimony</span>';
    if(c==='signedout')return '<span class="pill warn">Signed out</span>';
    if(c==='firstaid')return '<span class="pill amb">First-aid</span>';
    if(c==='incident')return n.severity==='high'?'<span class="pill warn">Incident · High</span>':'<span class="pill amb">Incident · Low</span>';
    return '<span class="pill ok">Student note</span>';
  };
  box.innerHTML=list.length?list.map(n=>{const c=n.cat||'note';
    const right=(n.gender)?`<span class="sub" style="white-space:nowrap">${n.grade?'Yr '+n.grade:(n.gender==='male'?'Guys':'Girls')}</span>`:'';
    // First-aid records carry a 4-line body (Problem/Treatment/First-aider/Brought by) — render
    // the Problem + Treatment lines distinctly rather than as one blob.
    let bodyHtml;
    if(c==='firstaid'){const p=_faParse(n.body);
      bodyHtml=`<div style="font-size:.86rem;margin:4px 0">
        ${p.problem?`<div><b style="color:var(--alert-ink)">Problem:</b> ${esc(p.problem)}</div>`:''}
        ${p.treatment?`<div><b style="color:var(--consent-ok-ink)">Treatment:</b> ${esc(p.treatment)}</div>`:''}
        ${p.firstAider?`<div class="sub" style="color:var(--ink-2)">First-aider: ${esc(p.firstAider)}${p.broughtBy?' · brought by '+esc(p.broughtBy):''}</div>`:''}</div>`;
    }else{bodyHtml=`<div style="font-size:.86rem;color:#475569;margin:4px 0">${esc(n.body)}</div>`;}
    /* 2026-08-03 (owner request): the record TYPE badge moved from the end of the footer line
       to the top-right of the tile, beside the year level. It used to be the last thing on a
       run-on grey line ("Sam T · 2 Oct 14:03 · Victory Church · Testimony"), so the single
       fact that decides whether a tile is worth reading at all — is this a testimony or a
       first-aid record? — was the hardest thing on the card to find, and moved horizontally
       depending on how long the church name was. Now it is in a fixed position on every tile.
       `min-width:0` on the name lets a long student name ellipsis rather than shoving the
       badge off the row; the badge block is `flex:0 0 auto` so it never shrinks. */
    return `<div class="card" style="${zoneAccentStyle(n.zone)}"><div class="rowsb" style="align-items:center;gap:8px">
      <div class="nm" style="flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(n.camperName||'—')}</div>
      <div style="flex:0 0 auto;display:flex;align-items:center;gap:6px">${right}${badge(n)}</div></div>
    ${bodyHtml}
    <div class="sub">${esc(n.authorName)} · ${dtFmt(n.createdAt)}${n.church?' · '+esc(n.church):''}</div></div>`;}).join(''):emptyState('note','No records match these filters.');
}

/* `<input type="datetime-local">` yields a BARE WALL-CLOCK string ("2026-09-29T21:15") with
   no zone. Posting that raw is the UTC-vs-Brisbane bug that has hit this repo twice (it
   lands 10 hours out), and the server's schema rejects it outright for exactly that reason.
   `new Date(v)` parses a bare datetime-local as LOCAL time — which is the device's zone, and
   the device is at camp — so toISOString() gives the correct instant. Returns null for an
   empty or unparseable field: occurredAt is optional and must never block logging. */
function _incOccurredISO(){
  const v=val('incOccurred');
  if(!v)return null;
  const d=new Date(v);
  return isNaN(d.getTime())?null:d.toISOString();
}
async function submitIncident(){

  if(!summary){toast('Describe the incident');return;}
  try{
    await api('/incidents',{method:'POST',body:{summary,severity:_incSeverity,occurredAt:_incOccurredISO()}});
    toast(_incSeverity==='high'?'Incident logged · everyone notified':'Incident logged');
    await RENDER.incidents();
  }catch(e){toast(e.message);}
}
async function deleteIncident(id){
  if(!await confirmSheet({title:'Delete this incident?',body:'This cannot be undone.',confirmLabel:'Delete',danger:true}))return;
  try{await api('/incidents/'+id,{method:'DELETE'});toast('Deleted');await RENDER.incidents();}
  catch(e){toast(e.message);}
}

    });

    const half=cu=>{const male=cu.genderScope==='male';

    return `<div class="ch-pair">${head}<div class="ch-halves">${accts.map(half).join('')}</div></div>`;
  });
  const cr=churches.length?`<div class="ch-grid">${churchCards.join('')}</div>`:'<p class="note-hint">None yet.</p>';
  // Item 2: Admin is selectable. A secondary admin is a full peer of the original — it can do

  const roleOpts=`<option value="director">Director</option><option value="zoneLeader">Zone leader</option><option value="firstAid">First aid</option><option value="admin">Admin</option>`;
  /* 2026-08-03: "Randomise & export passwords" moved to its OWN card at the top of the
     screen (owner request). It used to sit in the Churches card header, below the leadership

  paint('adminAccounts',`

      <div style="display:flex;gap:8px;align-items:stretch;flex-wrap:wrap">

async function addAcct(){const role=sel('aR');const nm=val('aName').trim();const sp=nm.indexOf(' ');

const _findUser=id=>(window._allUsers||[]).find(u=>u.id===id)||{};
const _findChurch=id=>(window._allChurches||[]).find(c=>c.id===id)||{};
/* Bug 13 helpers — a church's two logins are `b-<base>` (boys) and `g-<base>` (girls). The admin

const _OVERRIDE_TIP='When set, EVERYONE from this church — students and leaders — is switched to this accommodation type on the next registration upload — use it to correct wrong ticket purchases. Leave as "No override" if this ministry deliberately splits ticket types (e.g. seniors buy classroom).';

// Saves the church + BOTH gender logins as one unit (bug 13). The typed value is the base; the

async function saveChurchName(id){const name=val('ecnName');if(!name){toast('Enter a church name');return;}

async function addChurch(){if(!val('ncName')||!val('ncUser')){toast('Enter church name + login username');return;}

/* Feature 6: re-randomise EVERY church login's password and download the list as a CSV
   (username, church, gender, password). Also creates any missing b-/g- account and retires the
   old combined login, so one click both migrates and re-issues. Passwords are memorable (Word.##). */
/* 2026-08-05: a second button rotates CHURCH ACCOUNTS ONLY (backend
   POST /accounts/churches/randomize-church-passwords, admin:manage). It returns the SAME row
   shape as the all-accounts endpoint (username/church/gender/role/password), so there is ONE
   shared exporter (`_pwRandomiseExport`) parameterised by endpoint/filename/wording — do not
   write a second CSV builder. */
async function _pwRandomiseExport(endpoint,filenamePrefix,noneMsg,toastVerb){
  // The POST does the whole split+randomise server-side and RETURNS the new passwords. That
  // response IS the only copy — so once it succeeds we must download the CSV before anything
  // else can fail. The accounts-list refresh afterwards is cosmetic; a hiccup there must NOT
  // surface as an error (it previously made a fully-successful randomise look like it failed,
  // and left the screen showing the pre-split accounts).
  let rows;
  try{ rows=await api(endpoint,{method:'POST',body:{}}); }
  catch(e){ toast(e.message||'Could not randomise passwords'); return; }
  if(!rows||!rows.length){ toast(noneMsg); try{await _rAccts();}catch(_){} return; }
  const q=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  /* 2026-08-03: the export now covers leadership accounts too, so two columns changed.
     `Gender` is BLANK for a leadership login rather than echoing something — only church
     logins are gender-scoped, and printing a gender there would invent a split that does not
     exist. `Role` is new, because with directors and zone leaders in the same file the
     username alone no longer says what an account is. The server sends the role label in
     `church` for a leadership row, which is why that column reads "Director" not a church. */
  const header=['Username','Church / Role','Gender','Role','Password'];
  const roleLabel={admin:'Admin',director:'Director',zoneLeader:'Zone leader',firstAid:'First aid',church:'Church'};
  const body=rows.map(r=>[r.username,r.church,r.gender==='male'?'Boys':r.gender==='female'?'Girls':'',roleLabel[r.role]||(r.gender?'Church':''),r.password]);
  const csv='﻿'+[header,...body].map(r=>r.map(q).join(',')).join('\r\n');
  _saveTextFile(csv,_exportName(filenamePrefix,'csv'));
  toast(toastVerb+' ('+rows.length+' logins)');
  try{await _rAccts();}catch(_){/* UI refresh only — export already succeeded */}
}
async function randomizeChurchPasswords(){

  await _pwRandomiseExport('/accounts/churches/randomize-passwords','camp-passwords','No church accounts to export','Passwords randomised & exported');
}
/* Church accounts ONLY — leadership logins (director/zone leader/first aid/any extra admin) are
   left completely alone. Same confirm-then-download-first shape as the all-accounts version. */
async function randomizeChurchOnlyPasswords(){

  await _pwRandomiseExport('/accounts/churches/randomize-church-passwords','church-passwords','No church accounts to export','Church passwords randomised & exported');

/* ===== PASSWORD UPLOAD — the reverse of "Randomise & export passwords" =====
   Takes the exported CSV back with the Password column edited (or an .xlsx) and sets those
   passwords. Runs the server's DRY RUN first and shows what it would do, because the two
   mistakes this feature invites are silent: a mistyped username sets nothing at all, and the
   wrong file entirely matches nothing at all. Both look identical to success without a preview.

   File reading goes through _readImportFile, so .xlsx works for free via the lazy SheetJS
   path — the same helper the Form/Ticket/Invoice and Offline Sign-In uploads use. */
/* ⚠️ `_pwUpCsv` IS ARMED ONLY AT THE MOMENT ITS OWN PREVIEW IS RENDERED, and `_pwUpSeq` voids
   any older upload still in flight. Both halves are load-bearing — this pairing is the only
   thing making the preview a real safety net rather than a decoration.

   The bug it prevents (found in review, 2026-08-05): pick a file, realise mid-request it is the
   wrong one, tap Upload again and pick another. Two dry runs are now racing. If the FIRST one's
   response lands last it repaints the box with the OLD file's preview and filename — while the
   confirm button is holding the NEW file's text. You would then confirm a file you never
   reviewed, on the one screen in the app that rewrites credentials.

   So: bump the sequence, blank the armed text immediately (a superseded upload must never leave
   a live confirm behind), and after EVERY await bail if another upload has started. The armed
   text is assigned last, next to the paint, so what is armed is always what is on screen. */
let _pwUpCsv=null,_pwUpSeq=0;
async function uploadPasswords(){
  const input=document.getElementById('pwUpIn');
  const file=input&&input.files&&input.files[0];
  if(!file)return;
  const box=document.getElementById('pwUpResult');
  const seq=++_pwUpSeq;
  _pwUpCsv=null;
  if(box){box.style.display='block';box.innerHTML='<div class="loading"><div class="spin"></div><div class="lt">Reading sheet…</div></div>';}
  try{
    const rd=await _readImportFile(file);
    if(seq!==_pwUpSeq)return; // superseded by a later pick — drop this one silently
    const r=await api('/accounts/passwords/import',{method:'POST',body:{csvData:rd.text,dryRun:true}});
    if(seq!==_pwUpSeq)return;
    _pwUpCsv=rd.text;
    if(box)box.innerHTML=_pwUpPreview(r,file.name);
  }catch(e){
    if(seq!==_pwUpSeq)return; // a superseded upload's failure must not clobber the live preview
    _pwUpCsv=null;
    if(box)box.innerHTML='<p class="err" style="display:block">'+esc(e.message||'Could not read that file')+'</p>';
    else toast(e.message||'Could not read that file');
  }finally{ if(input&&seq===_pwUpSeq)input.value=''; }
}
// Shared renderer for the dry-run preview and the applied result. Every skipped row is NAMED,
// not just counted — "3 not matched" sends an admin back to a 30-row spreadsheet with no idea
// which three, which is how a genuinely wrong file gets confirmed anyway.
function _pwUpNote(icon,label,names){
  if(!names||!names.length)return '';
  return `<p class="note-hint" style="text-align:left;margin:6px 0 0">${icSm(icon)} <b>${names.length}</b> ${label}: ${names.map(esc).join(', ')}</p>`;
}
function _pwUpPreview(r,fileName){
  const bits=[];
  if(r.blank)bits.push(`${r.blank} blank password${r.blank===1?'':'s'} skipped`);
  const head=r.willSet
    ? `<div class="callbox">${icSm('check')} <b>${r.willSet}</b> password${r.willSet===1?'':'s'} will be set from <b>${esc(fileName)}</b>.${bits.length?' '+esc(bits.join(' · '))+'.':''}</div>`
    // Nothing matched = almost always the wrong file. Say that, rather than showing a Confirm
    // button that would do nothing and report success.
    : `<div class="warnbox">${icSm('alert')} Nothing in <b>${esc(fileName)}</b> matches an account, so there is nothing to set. Check it is the passwords export, with usernames in the <b>Username</b> column.</div>`;
  const detail=_pwUpNote('alert','not matched to any account',r.unmatched)
    +_pwUpNote('alert','rejected as too short',(r.invalid||[]).map(i=>i.username))
    +_pwUpNote('alert','listed twice with different passwords, so left alone',r.duplicates)
    +_pwUpNote('alert','skipped — the original admin is never changed this way',r.protectedSkipped)
    +_pwUpNote('alert','set, but the account is deactivated and still cannot log in',r.inactive);
  const confirm=r.willSet
    ? `<button class="btn" onclick="_pwUpConfirm()" style="margin-top:10px;width:100%">Set ${r.willSet} password${r.willSet===1?'':'s'}</button>`
    : '';
  return head+detail+confirm;
}
async function _pwUpConfirm(){
  /* ⚠️ The reviewed text is CAPTURED HERE, before the confirm sheet is awaited, and the
     sequence is captured with it. Reading `_pwUpCsv` after the await would let a new upload
     started while the sheet is open blank it (→ posting nothing) or replace it (→ posting a
     file this confirmation never described). Same failure class as the race in
     `uploadPasswords` above. */
  const csv=_pwUpCsv,seq=_pwUpSeq;
  if(!csv){toast('Choose the file again');return;}
  if(!await confirmSheet({title:'Set these passwords?',body:'Each listed account’s current password stops working immediately. Accounts not in the file are unchanged.',confirmLabel:'Set passwords',danger:true}))return;
  if(seq!==_pwUpSeq){toast('A different file was loaded — check the preview and try again');return;}
  const box=document.getElementById('pwUpResult');
  if(box)box.innerHTML='<div class="loading"><div class="spin"></div><div class="lt">Setting passwords…</div></div>';
  try{
    const r=await api('/accounts/passwords/import',{method:'POST',body:{csvData:csv,dryRun:false}});
    _pwUpCsv=null;
    const detail=_pwUpNote('alert','not matched to any account',r.unmatched)
      +_pwUpNote('alert','rejected as too short',(r.invalid||[]).map(i=>i.username))
      +_pwUpNote('alert','listed twice with different passwords, so left alone',r.duplicates)
      +_pwUpNote('alert','skipped — the original admin is never changed this way',r.protectedSkipped)
      +_pwUpNote('alert','set, but the account is deactivated and still cannot log in',r.inactive);
    if(box)box.innerHTML=`<div class="callbox">${icSm('check')} <b>${r.applied}</b> password${r.applied===1?'':'s'} set.</div>`+detail;
    toast('Passwords set ('+r.applied+')');
    try{await _rAccts();}catch(_){/* UI refresh only — the passwords are already set */}
  }catch(e){
    if(box)box.innerHTML='<p class="err" style="display:block">'+esc(e.message||'Could not set passwords')+'</p>';
    else toast(e.message||'Could not set passwords');
  }
}

/* Bug-7: Bulk Church Update — one form listing every church with its login username (pre-filled)
   and a password field. Save applies all changed usernames + any entered passwords at once;
   a blank password leaves that church's password unchanged. */
function bulkChurchUpdate(){
  const churches=(window._allChurches||[]);const users=(window._allUsers||[]);
  const rows=churches.map(c=>{
    // Bug 13: ONE username field per church (the shared base) — the b-/g- prefixes are re-applied
    // per account on save. Passwords stay per account, so each gender keeps its own field.
    const accts=users.filter(u=>u.role==='church'&&u.churchId===c.id)
      .sort((a,b)=>String(a.genderScope||'').localeCompare(String(b.genderScope||'')));
    if(!accts.length)return `<div style="padding:8px 0;border-top:1px solid var(--line)"><div style="font-weight:700;font-size:.82rem;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div><div class="sub" style="color:var(--danger)">No login account — add one first.</div></div>`;
    const base=_churchUserBase(accts[0].username);
    const pw=cu=>`<input class="fld ${cu.genderScope==='male'?'ch-m':'ch-f'}" data-bcp="${cu.id}" type="text" placeholder="${cu.genderScope==='male'?'boys':'girls'} password (blank = keep)" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="off" style="flex:1;margin:0">`;
    return `<div style="padding:8px 0;border-top:1px solid var(--line)">
      <div style="font-weight:700;font-size:.82rem;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div>
      <div style="display:flex;gap:6px;margin-bottom:5px">
        <input class="fld" data-bcbase="${c.id}" data-cur="${esc(base)}" value="${esc(base)}" placeholder="username (no b-/g-)" autocapitalize="none" autocorrect="off" spellcheck="false" style="flex:1;margin:0">
      </div>
      <div style="display:flex;gap:6px">${accts.map(pw).join('')}</div></div>`;
  }).join('');
  modal(`<h3>Bulk Church Update</h3>
    <p class="sub" style="margin:2px 0 6px">Update usernames and passwords for several churches at once. The username is shared — saving it updates <b>b-name</b> and <b>g-name</b> together. Leave a password blank to keep the current one.</p>
    <div style="max-height:54vh;overflow:auto;margin:4px 0 10px">${rows||'<p class="note-hint">No churches yet.</p>'}</div>
    <button class="btn" onclick="saveBulkChurch()">Save all</button>
    <button class="btn ghost" style="margin-top:6px" onclick="closeModal()">Cancel</button>`);
}
async function saveBulkChurch(){
  const baseInputs=[...document.querySelectorAll('#sheet [data-bcbase]')];
  // Validate everything first so one bad row never leaves a half-applied batch.
  const jobs=[];
  for(const inp of baseInputs){
    const churchId=inp.getAttribute('data-bcbase');const cur=inp.getAttribute('data-cur')||'';
    const base=_churchUserBase(inp.value.trim());
    if(base!==cur){
      if(!/^[A-Za-z0-9._-]{2,38}$/.test(base)){toast('Invalid username: '+(base||'(empty)'));return;}
      // One job per gender account — each keeps its own b-/g- prefix (bug 13).
      for(const cu of _churchAccts(churchId)){
        const want=_churchPrefix(cu)+base;
        if(want!==(cu.username||''))jobs.push({type:'username',id:cu.id,username:want});
      }
    }
  }
  for(const p of document.querySelectorAll('#sheet [data-bcp]')){
    const pass=(p.value||'').trim();if(!pass)continue;
    if(pass.length<6){toast('Passwords must be 6+ characters');return;}
    jobs.push({type:'password',id:p.getAttribute('data-bcp'),password:pass});
  }
  if(!jobs.length){toast('No changes to save');return;}
  let unC=0,pwC=0;
  try{
    for(const j of jobs){
      if(j.type==='username'){await api('/accounts/users/'+j.id,{method:'PATCH',body:{username:j.username}});unC++;}
      else{await api('/accounts/users/password',{method:'POST',body:{userId:j.id,password:j.password}});pwC++;}
    }
    closeModal();toast(`Saved · ${unC} username${unC===1?'':'s'}, ${pwC} password${pwC===1?'':'s'}`);await _rAccts();
  }catch(e){toast(e.message);await _rAccts();}
}

/* ===== SITE MAP (item 8, 2026-07-28) =====================================
   Upload → crop → bake to a data URI → PATCH /settings {siteMapImage}. The crop tool is ported
   from YS Connection's logo cropper (`_openLogoCropModal`/`_cropRectFor`/`_cropClampPan` in
   `Project 7 - Connection Made Simple`) with ONE generalisation: that one is hard-wired to a
   square viewport, this one takes an aspect ratio, because a venue map is rarely square and the
   owner asked to keep the shape flexible. The pan/zoom/clamp maths is otherwise the same, with
   the single `vp` size replaced by `vpW`/`vpH` throughout.

   Output is baked at ~1400px on the long edge — the sample site map is 621x849 with small
   building labels, and anything smaller loses them. PNG is tried first (flat colour + text
   compresses well and stays crisp); if that exceeds the schema cap it falls back to high-quality
   JPEG rather than failing the upload. */
const _MAP_OUT_LONG_EDGE=1400;
const _MAP_MAX_CHARS=1_600_000;   // must stay <= the schema's max on siteMapImage
const _MAP_RATIOS=[['3:4',3/4,'Portrait'],['9:16',9/16,'Tall'],['1:1',1,'Square'],['4:3',4/3,'Landscape']];
let _mapCrop=null;

function _siteMapPreviewHtml(src){
  return src
    ? `<img src="${esc(src)}" alt="Current site map" style="max-width:180px;width:100%;border-radius:12px;border:1px solid var(--line);display:block">`
    : '<p class="note-hint" style="text-align:left;margin:0">No site map uploaded — the Map button is hidden from the home screen.</p>';
}
function siteMapFileChosen(input){
  const file=input.files&&input.files[0];
  input.value='';                     // allow re-choosing the same file later
  if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>_openMapCropModal(String(reader.result));
  reader.onerror=()=>toast('Could not read that image file');
  reader.readAsDataURL(file);
}
function _openMapCropModal(dataUrl){
  const probe=new Image();
  probe.onload=()=>{
    // Default to the ratio closest to the image's own shape, so the common case needs no choice.
    const natRatio=probe.naturalWidth/probe.naturalHeight;
    let best=0;_MAP_RATIOS.forEach((r,i)=>{if(Math.abs(r[1]-natRatio)<Math.abs(_MAP_RATIOS[best][1]-natRatio))best=i;});
    _mapCrop={dataUrl,natW:probe.naturalWidth,natH:probe.naturalHeight,zoom:1,panX:0,panY:0,dragging:false,ratio:_MAP_RATIOS[best][1]};
    modal(`<h3>Crop your site map</h3>
      <p class="sub" style="margin:4px 0 10px">Drag to reposition and zoom to frame it. The shaded area is exactly what people will see. Pick the shape that suits your map.</p>
      <div class="seg" id="mapRatioSeg" style="margin-bottom:10px">${_MAP_RATIOS.map((r,i)=>`<button type="button" class="${i===best?'on':''}" data-r="${r[1]}" onclick="_mapSetRatio(${r[1]},this)">${r[2]}</button>`).join('')}</div>
      <div id="mapVp" style="width:min(300px,80vw);margin:0 auto;overflow:hidden;position:relative;border-radius:12px;background:var(--tint-2);touch-action:none">
        <img id="mapImg" src="${dataUrl}" draggable="false" alt="" style="position:absolute;left:0;top:0;transform-origin:top left;user-select:none;-webkit-user-drag:none">
      </div>
      <label style="margin-top:12px">Zoom</label>
      <input type="range" id="mapZoom" min="1" max="4" step="0.01" value="1" oninput="_mapZoomChange(this.value)" style="width:100%">
      <button class="btn" style="margin-top:10px" onclick="_mapCropConfirm()">Use this crop</button>
      <button class="btn ghost" style="margin-top:6px" onclick="_mapCropCancel()">Cancel</button>`,()=>{_mapCrop=null;});
    _mapApplyRatio();
    _mapCenter();_mapApplyTransform();_mapBindDrag();
  };
  probe.onerror=()=>toast('Could not read that image file');
  probe.src=dataUrl;
}
// Viewport height follows the chosen ratio; width is whatever the modal allows.
function _mapApplyRatio(){const el=document.getElementById('mapVp');if(el&&_mapCrop)el.style.aspectRatio=String(_mapCrop.ratio);}
function _mapSetRatio(r,btn){
  if(!_mapCrop)return;
  _mapCrop.ratio=r;
  document.querySelectorAll('#mapRatioSeg button').forEach(b=>b.classList.toggle('on',b===btn));
  _mapApplyRatio();
  // The viewport just changed shape, so the previous pan may no longer cover it.
  _mapCenter();_mapApplyTransform();
}
function _mapVpSize(){const el=document.getElementById('mapVp');
  if(!el)return{w:300,h:300/(_mapCrop?_mapCrop.ratio:1)};
  const r=el.getBoundingClientRect();return{w:r.width,h:r.height};}
// Scale at which the image exactly COVERS the viewport at zoom 1 (whichever axis is tighter).
function _mapDispSizeFor(natW,natH,zoom,vpW,vpH){
  const scale=Math.max(vpW/natW,vpH/natH)*zoom;
  return{scale,w:natW*scale,h:natH*scale};}
function _mapDispSize(){const{w:vpW,h:vpH}=_mapVpSize();
  const d=_mapDispSizeFor(_mapCrop.natW,_mapCrop.natH,_mapCrop.zoom,vpW,vpH);return{...d,vpW,vpH};}
// Clamp the pan so the image never reveals empty space past its own edges.
function _mapClampPan(panX,panY,dispW,dispH,vpW,vpH){
  return{x:Math.min(0,Math.max(vpW-dispW,panX)),y:Math.min(0,Math.max(vpH-dispH,panY))};}
// Source rect in the image's OWN natural pixels that reproduces what the viewport shows.
function _mapRectFor(imgW,imgH,panX,panY,zoom,vpW,vpH){
  const{scale}=_mapDispSizeFor(imgW,imgH,zoom,vpW,vpH);
  return{sx:-panX/scale,sy:-panY/scale,sw:vpW/scale,sh:vpH/scale};}
function _mapCenter(){const{w,h,vpW,vpH}=_mapDispSize();
  const c=_mapClampPan((vpW-w)/2,(vpH-h)/2,w,h,vpW,vpH);_mapCrop.panX=c.x;_mapCrop.panY=c.y;}
function _mapApplyTransform(){const img=document.getElementById('mapImg');if(!img||!_mapCrop)return;
  const{scale}=_mapDispSize();img.style.transform=`translate(${_mapCrop.panX}px, ${_mapCrop.panY}px) scale(${scale})`;}
function _mapBindDrag(){const vp=document.getElementById('mapVp');if(!vp)return;
  vp.onpointerdown=e=>{if(!_mapCrop)return;_mapCrop.dragging=true;_mapCrop.startX=e.clientX;_mapCrop.startY=e.clientY;
    _mapCrop.startPanX=_mapCrop.panX;_mapCrop.startPanY=_mapCrop.panY;
    if(vp.setPointerCapture)vp.setPointerCapture(e.pointerId);};
  vp.onpointermove=e=>{if(!_mapCrop||!_mapCrop.dragging)return;
    const{w,h,vpW,vpH}=_mapDispSize();
    const c=_mapClampPan(_mapCrop.startPanX+(e.clientX-_mapCrop.startX),_mapCrop.startPanY+(e.clientY-_mapCrop.startY),w,h,vpW,vpH);
    _mapCrop.panX=c.x;_mapCrop.panY=c.y;_mapApplyTransform();};
  vp.onpointerup=vp.onpointercancel=()=>{if(_mapCrop)_mapCrop.dragging=false;};
  vp.onwheel=e=>{if(!_mapCrop)return;e.preventDefault();
    const next=Math.max(1,Math.min(4,_mapCrop.zoom+(e.deltaY<0?0.1:-0.1)));
    const s=document.getElementById('mapZoom');if(s)s.value=next;_mapZoomChange(next);};
}
// Zoom about the viewport's centre so it feels like zooming into what you're looking at.
function _mapZoomChange(val){
  if(!_mapCrop)return;
  const before=_mapDispSize();
  const fx=(before.vpW/2-_mapCrop.panX)/before.w, fy=(before.vpH/2-_mapCrop.panY)/before.h;
  _mapCrop.zoom=Math.max(1,Math.min(4,parseFloat(val)||1));
  const after=_mapDispSize();
  const c=_mapClampPan(after.vpW/2-fx*after.w,after.vpH/2-fy*after.h,after.w,after.h,after.vpW,after.vpH);
  _mapCrop.panX=c.x;_mapCrop.panY=c.y;_mapApplyTransform();
}
function _mapCropCancel(){_mapCrop=null;closeModal();}
async function _mapCropConfirm(){
  if(!_mapCrop)return;
  const img=document.getElementById('mapImg');
  const{w:vpW,h:vpH}=_mapVpSize();
  const rect=_mapRectFor(_mapCrop.natW,_mapCrop.natH,_mapCrop.panX,_mapCrop.panY,_mapCrop.zoom,vpW,vpH);
  // Output keeps the crop's aspect ratio, long edge capped — never upscale past the source.
  const ratio=vpW/vpH;
  let outW=ratio>=1?_MAP_OUT_LONG_EDGE:Math.round(_MAP_OUT_LONG_EDGE*ratio);
  let outH=ratio>=1?Math.round(_MAP_OUT_LONG_EDGE/ratio):_MAP_OUT_LONG_EDGE;
  if(outW>rect.sw&&outH>rect.sh){outW=Math.round(rect.sw);outH=Math.round(rect.sh);}
  const canvas=document.createElement('canvas');canvas.width=outW;canvas.height=outH;
  const ctx=canvas.getContext('2d');
  ctx.imageSmoothingQuality='high';
  ctx.fillStyle='#fff';ctx.fillRect(0,0,outW,outH);   // flatten transparency (the sample map is RGBA)
  ctx.drawImage(img,rect.sx,rect.sy,rect.sw,rect.sh,0,0,outW,outH);
  // PNG keeps map text crisp; fall back to JPEG (then a smaller JPEG) if it's over the cap.
  let dataUrl=canvas.toDataURL('image/png');
  if(dataUrl.length>_MAP_MAX_CHARS)dataUrl=canvas.toDataURL('image/jpeg',0.92);
  if(dataUrl.length>_MAP_MAX_CHARS)dataUrl=canvas.toDataURL('image/jpeg',0.8);
  if(dataUrl.length>_MAP_MAX_CHARS){toast('That image is too large even after compression — try a smaller crop');return;}
  _mapCrop=null;closeModal();
  await _saveSiteMap(dataUrl);
}

/* Admin test for the "students still to check in" warning (owner request 2026-07-31).

   phone of every church device that has alerts on — it reaches other people, not just the

async function testCheckinWarning(){
  if(_ckTestBusy)return;
  const ok=await confirmSheet({
    title:'Send a test check-in alert?',
    body:'Every church login gets a notice titled “Check-in closing soon (test)”, and any church device with alerts turned on will get a phone notification. You will get a copy too.',
    confirmLabel:'Send test alert',
  });
  if(!ok)return;
  _ckTestBusy=true;
  try{
    const r=await api('/admin/test-checkin-warning',{method:'POST',body:{}});
    // Report what actually happened rather than a bare "sent". The two numbers differ on
    // purpose: `churches` is who was messaged, `churchesWithOutstanding` is how many a REAL
    // warning would have found behind — 0 there means the alert works but there was nothing
    // to be behind on, which is not the same as a broken counter.
    const bits=[`Sent to ${r.churches} church login${r.churches===1?'':'s'} for ${r.sessionLabel}`];
    bits.push(r.churchesWithOutstanding>0
      ? `${r.churchesWithOutstanding} with students still to check in`
      : 'none currently have students outstanding');

    if(r.failed>0)bits.push(`${r.failed} failed to save`);

    toast('Could not send the test — '+((e&&e.message)||'unknown error'));

  }

async function saveSettings(){

    // tentPrice/classroomPrice came BACK 2026-07-29 (migration 0017) for the budget's ticket
    // classification, after being dropped by PC-4/migration 0004. Their job is narrower now:
    // a REFERENCE price used to value a "paid in person" ticket, not the source of anyone's
    // recorded cost. Blank = not set (null), which is meaningful — don't coerce it to 0.
    // Timezone is intentionally fixed at Australia/Brisbane (owner decision, Phase 6): the camp
    // is always Brisbane-time, so this re-asserts it on every save (self-healing). There is no
    // timezone field in the UI by design — if the camp ever moves timezones, this is the one line
    // a developer changes. Drives compliance-export timestamp localisation (audit-export.service).

/* ===== MULTI-FILE IMPORT (auto-detect Form / Ticket List / Invoice) =====
   One upload field accepts 1–3 Elvanto exports at once. Each file's TYPE is detected from its
   column headers, so there is no manual source picker to get wrong (the old segmented selector +
   a stale file input was how a Ticket List could be sent to the Form importer). Files are always
   imported in dependency order Form → Ticket → Invoice (tickets/invoices match against the people
   the Form import creates) via a single combined preview → confirm. A file whose headers match
   none of the three is rejected with its columns shown, so nothing is silently mis-imported.
   No file is mandatory — import just the Form now and add the Ticket List / Invoice later. */
const IMPORT_TYPES={
  form:    {label:'Form',        endpoint:'/import/csv',     order:0},
  tickets: {label:'Ticket List', endpoint:'/import/tickets', order:1},
  invoices:{label:'Invoice',     endpoint:'/import/invoices',order:2},
};
// Unique-ish column markers per export (lowercased). Detection scores each type by how many of
// its markers a file's headers contain; the top scorer with >=2 markers wins, else "unknown".
const _IMPORT_SIGNATURES={
  form:["attendee's church","submission status","date submitted","school grade","parent/guardian name","list other medical conditions or medication taken"],
  tickets:["ticket type","ticket status","event occurrence information","ticket number"],
  invoices:["ticket total","amount paid","invoice date","registrants","fees paid","invoice status","total tax"],
};
// Read the first CSV row into trimmed, lowercased header names (respects quotes; strips a BOM).
function _parseHeaderRow(text){
  let s=text&&text.charCodeAt(0)===0xfeff?text.slice(1):(text||'');
  const out=[];let cur='',q=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(ch==='"'){if(q&&s[i+1]==='"'){cur+='"';i++;}else q=!q;}
    else if(ch===','&&!q){out.push(cur);cur='';}
    else if((ch==='\n'||ch==='\r')&&!q){break;}
    else cur+=ch;}
  out.push(cur);
  return out.map(h=>h.trim().toLowerCase()).filter(Boolean);
}
function _detectImportType(headers){
  const set=new Set(headers);let best=null,bestScore=0;
  for(const t of Object.keys(_IMPORT_SIGNATURES)){
    const score=_IMPORT_SIGNATURES[t].reduce((n,m)=>n+(set.has(m)?1:0),0);
    if(score>bestScore){bestScore=score;best=t;}
  }
  return bestScore>=2?best:null;
}
// Read one file to CSV text. CSV is read directly; .xlsx/.xls is converted to CSV via the
// vendored SheetJS parser (lazy-loaded on first use) so the rest of the pipeline is
// source-agnostic — detection, dry-run, phantom churches and confirm all work unchanged.
async function _readImportFile(file){
  const isXlsx=/\.(xlsx|xls)$/i.test(file.name);
  if(isXlsx)await _ensureXlsx();
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error('Could not read '+file.name));
    if(isXlsx){
      r.onload=()=>{try{resolve({name:file.name,text:_xlsxToCsv(r.result)});}catch(e){reject(new Error(file.name+': '+(e.message||'could not read spreadsheet')));}};
      r.readAsArrayBuffer(file);
    }else{
      r.onload=()=>resolve({name:file.name,text:String(r.result)});
      r.readAsText(file);
    }
  });
}
// Lazy-load the vendored SheetJS build (~0.9MB) only when an Excel file is actually chosen, so it
// never weighs on normal navigation. Same-origin, so CSP script-src 'self' allows it.
let _xlsxLoading=null;
function _ensureXlsx(){
  if(window.XLSX)return Promise.resolve();
  if(_xlsxLoading)return _xlsxLoading;
  _xlsxLoading=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='vendor/xlsx.full.min.js';
    /* Message stays NEUTRAL about reading vs writing: since 2026-08-03 this also backs the
       accommodation .xlsx EXPORT, which has no CSV alternative to fall back to, so the old
       "try exporting as CSV instead" was advice that could not be followed. The import screen
       offers a visible CSV upload of its own. */
    s.onload=()=>window.XLSX?resolve():reject(new Error('The spreadsheet engine failed to initialise'));
    s.onerror=()=>{_xlsxLoading=null;reject(new Error('Could not load the spreadsheet engine — check your connection and try again.'));};
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}
// Convert an .xlsx ArrayBuffer to CSV text. When the workbook has multiple sheets, pick the one
// whose header row matches a known import type (Form/Ticket/Invoice); otherwise use the first.
function _xlsxToCsv(arrayBuffer){
  const wb=XLSX.read(arrayBuffer,{type:'array'});
  const names=wb.SheetNames||[];
  if(!names.length)throw new Error('the workbook has no sheets');
  let chosen=names[0];
  for(const nm of names){
    const ws=wb.Sheets[nm];if(!ws)continue;
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});
    const head=((rows&&rows[0])||[]).map(h=>String(h==null?'':h).trim().toLowerCase());
    if(_detectImportType(head)){chosen=nm;break;}
  }
  return XLSX.utils.sheet_to_csv(wb.Sheets[chosen]);
}
// Per-type "extra" warning line for the preview/result (orphans, guessed accommodation, unmatched).
function _importExtraLine(type,r){
  if(type==='tickets')return r.created?`${icSm('alert')} <b>${r.created}</b> ticket${r.created===1?'':'s'} didn't match an existing student — created as "Needs review". Import the <b>Form</b> file first so tickets attach to real students.`:null;
  if(type==='invoices'){
    const parts=[];
    if(r.guessedAccommodationCount)parts.push(`${r.guessedAccommodationCount} accommodation type${r.guessedAccommodationCount===1?'':'s'} guessed from price`);
    if(r.ambiguousGroupInvoices)parts.push(`${r.ambiguousGroupInvoices} invoice${r.ambiguousGroupInvoices===1?'':'s'} covered multiple people — split by ticket price`);
    if(r.unmatchedInvoices&&r.unmatchedInvoices.length)parts.push(`${r.unmatchedInvoices.length} invoice${r.unmatchedInvoices.length===1?'':'s'} couldn't be matched to anyone`);
    return parts.length?`${icSm('alert')} ${parts.join(' · ')}.`:null;
  }
  return null;
}
