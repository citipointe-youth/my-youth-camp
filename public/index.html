/* ===== DAILY CHECK-IN ===== */
// Optimistic check-in queue — queued writes drain in order, survive brief offline.
const CHECKIN_QUEUE=[];let _draining=false,_onlineHandlerAdded=false;
let _undoTimer=null,_undoCamperId=null,_undoType=null;
let _lastRoster=null;
// B-1 (Phase 5): count entries that were hard-dropped on an ONLINE error (4xx etc.) so the
// check-in screen can surface a "N didn't save" banner. We deliberately keep the existing
// drop-on-error + no-persistence behaviour (owner chose "banner only") — this makes the loss
// VISIBLE and prompts a re-tap, it does not silently reconstruct lost taps.
let _checkinFailed=0;

function _queueEntry(camperId,type){
  CHECKIN_QUEUE.push({camperId,type,sessionId:SEL_SESSION});
  _updateSyncDots(camperId,'pending');
  if(!_draining)drainQueue();
  if(!_onlineHandlerAdded){window.addEventListener('online',drainQueue);_onlineHandlerAdded=true;}
}
async function drainQueue(){
  if(_draining)return;_draining=true;
  while(CHECKIN_QUEUE.length>0){
    const entry=CHECKIN_QUEUE[0];
    try{
      await api('/checkin',{method:'POST',body:{camperId:entry.camperId,sessionId:entry.sessionId,type:entry.type,initials:LEADER_INITIALS}});
      CHECKIN_QUEUE.shift();_markSynced(entry.camperId);
    }catch(e){
      if(!navigator.onLine)break; // wait for online event
      CHECKIN_QUEUE.shift();_markSynced(entry.camperId,'error');_checkinFailed++; // B-1: surface in the banner
    }
  }
  _draining=false;
  await RENDER.checkin();
}
function _updateSyncDots(camperId,state){
  document.querySelectorAll('.sync-dot[data-id="'+camperId+'"]').forEach(el=>{el.className='sync-dot '+state;});
}
function _markSynced(camperId,state='synced'){_updateSyncDots(camperId,state);}
function _optimisticState(camperId,roster,queue){
  const pending=queue.filter(e=>e.camperId===camperId);
  if(!pending.length)return roster.find(r=>r.id===camperId)?.present??false;
  return pending[pending.length-1].type==='in';
}
// B-1: clear the failed badge and re-attempt any entries still queued. We do NOT reconstruct
// dropped taps (no persistence by design) — the toast tells the user to re-tap red rows.
function _retryFailedCheckins(){
  _checkinFailed=0;
  if(CHECKIN_QUEUE.length)drainQueue();else RENDER.checkin();
  toast('Re-tap any row still marked red to check them in');
}

// Unified entry: one nav id, phase-branched. Arrival sign-in before the switchover, daily after.
RENDER.checkin=async function(){
  if(campPhase()==='signin'){ await _renderArrival(); return; }
  await _renderDailyCheckin();
};
/* ===== Feature 1 (2026-07-17): preview "everyone already checked in" simulation =====
   While previewing the at-camp view (PREVIEW_MODE — the pre-camp 👁 toggle, or the at-camp
   overlay inside an admin account-preview) with the REAL global mode still pre-camp, nobody has
   actually arrived yet, so the real check-in roster and My-group/roster screens are genuinely
   empty — a broken-looking demo. This block fakes a populated roster CLIENT-SIDE ONLY, built by
   re-shaping the real (pre-camp) /registrants list — it never writes anything and never touches
   the network beyond that read. Exits cleanly: once PREVIEW_MODE ends or the real mode flips to
   at-camp, `_previewSimActive()` goes false and every screen reads real data again. */
function _previewSimActive(){
  return !!(PREVIEW_MODE&&SETTINGS&&SETTINGS.campMode==='pre-camp');
}
// Fix 2 (review 2026-07-17): a SINGLE canonical population — every non-cancelled person the
// account can see, leaders included — so every screen the simulation touches (roster,
// My-group/students, openCamper) computes "who's not checked in" over the exact same people.
// Previously _previewSimRoster (non-leader-filtered) and _previewSimCampers (leader-inclusive)
// each ran _previewNotCheckedInIds over their OWN filtered list, so the two screens could
// disagree about which 5 individuals were unarrived.
function _previewCanonicalPeople(regList){
  return (Array.isArray(regList)?regList:[]).filter(r=>r.status!=='cancelled');
}
// Fix 4 (review 2026-07-17): local-only visual flips from tapping a simulated check-in row (see
// _performCheck) — never sent to the backend, cleared whenever preview is (re-)entered.
let _previewLocalFlips={};
// Deterministic "not yet checked in" set — the LAST 5 people (by surname, then first name) in
// the given (canonical) population, so the same individuals show as "not signed in" everywhere
// the simulation is used, and the not-signed-in state is demoed too, not just the all-green
// happy path.
// Fix 3 (review 2026-07-17): small-camp floor — slice(-5) with no floor marked EVERYONE
// unarrived once the population dropped to 5 or fewer (the opposite of the intended "mostly
// present, a few stragglers"). Below 6 people, hold nobody back: everyone shows checked in.
function _previewNotCheckedInIds(people){
  if(people.length<=5)return new Set();
  const sorted=[...people].sort((a,b)=>{
    const an=((a.lastName||'')+' '+(a.firstName||'')).toLowerCase();
    const bn=((b.lastName||'')+' '+(b.firstName||'')).toLowerCase();
    return an<bn?-1:an>bn?1:0;
  });
  return new Set(sorted.slice(-5).map(p=>p.id));
}
// Applies any local-only check-in-row flips (fix 4) on top of the deterministic simulated
// state — present when NOT in the canonical not-checked-in set, unless locally flipped.
function _previewIsPresent(id,notIn){
  return Object.prototype.hasOwnProperty.call(_previewLocalFlips,id)?_previewLocalFlips[id]:!notIn.has(id);
}
// Simulated daily check-in roster, shaped like _renderDailyCheckin's real `roster` array, built
// from /registrants (non-leader, non-cancelled) instead of the real (empty, pre-camp) session
// roster.
function _previewSimRoster(regList){
  // Fix 2: notIn is computed over the canonical (leader-inclusive) population, THEN the roster
  // is filtered down to non-leaders for display — so a person's not-checked-in status here
  // always matches their status on the My-group/openCamper screens, even though leaders never
  // appear in this particular roster.
  const canonical=_previewCanonicalPeople(regList);
  const notIn=_previewNotCheckedInIds(canonical);
  const people=canonical.filter(r=>r.kind!=='leader');
  return people.map(r=>({
    id:r.id,name:(r.firstName+' '+r.lastName).trim(),
    church:r.churchName,zone:r.zone,
    gender:r.gender,grade:r.grade,
    medicalFlag:(r.medicalConditions&&r.medicalConditions.length>0)||!!r.otherMedications,
    present:_previewIsPresent(r.id,notIn),
  }));
}
// Simulated CamperDto-shaped list for the My-group/roster screens (_renderMyGroup), built the
// same way — everyone `atCamp:true` except the same deterministic excluded 5.
async function _previewSimCampers(){
  const regList=await api('/registrants').catch(()=>[]);
  // Fix 2: same canonical population + same notIn computation as _previewSimRoster/openCamper.
  const people=_previewCanonicalPeople(regList);
  const notIn=_previewNotCheckedInIds(people);
  return people.map(r=>{
    const present=_previewIsPresent(r.id,notIn);
    return {
    id:r.id,firstName:r.firstName,lastName:r.lastName,fullName:(r.firstName+' '+r.lastName).trim(),
    kind:r.kind==='leader'?'leader':'student',
    churchId:r.churchId,churchName:r.churchName,zone:r.zone,groupId:null,
    mobile:r.mobile,gender:r.gender,grade:r.grade,dateOfBirth:r.dateOfBirth,
    accommodationKind:r.accommodationKind,registrationType:r.registrationType,
    registrationCost:r.registrationCost,discountCode:r.discountCode,discountAmount:r.discountAmount,
    medicalConditions:r.medicalConditions,dietaryRequirements:r.dietaryRequirements,
    otherMedications:r.otherMedications,medicareNumber:r.medicareNumber,
    parentGuardianName:r.parentGuardianName,parentPhone:r.parentPhone,parentRelation:r.parentRelation,
    consentMedical:r.consentMedical,blueCardNumber:r.blueCardNumber,blueCardExpiry:r.blueCardExpiry,
    lifecycle:present?'camper':'registered',
    atCamp:present,
    checkInHistory:[],signOutHistory:[],
    createdAt:r.createdAt,updatedAt:r.updatedAt,
  };});
}

function _performCheck(camperId,type,name){
  // Fix 4 (review 2026-07-17, MEDIUM-LOW): during the preview simulation there is no real
  // check-in session — the api() write-guard blocks the POST `_queueEntry` would fire, so the
  // row never actually flipped AND drainQueue's caught error ticked up `_checkinFailed`, so a
  // false "N check-in(s) didn't save — tap to retry" banner accumulated. Flip the row LOCALLY
  // ONLY (no queue, no network) and bail before any of that.
  if(_previewSimActive()){
    _previewLocalFlips[camperId]=(type==='in');
    toast(type==='in'?'Checked in (preview)':'Checked out (preview)');
    RENDER.checkin();
    return;
  }
  // Check-out no longer asks for confirmation — reaching this point already required
  // actively opening the "Done" section and tapping the row, which is deliberate enough.
  // Optimistic flip
  _queueEntry(camperId,type);
  // Start undo window
  clearTimeout(_undoTimer);_undoCamperId=camperId;_undoType=type;
  _undoTimer=setTimeout(()=>{_undoCamperId=null;_hideUndoToast();},4000);
  // Immediate local re-render
  RENDER.checkin();
}
function _showUndoToast(type){

  if(!el){el=document.createElement('div');el.id='undoToast';el.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#1e293b;color:var(--card);border-radius:10px;padding:10px 18px;display:flex;align-items:center;gap:10px;z-index:9999;font-size:var(--t-body)';document.body.appendChild(el);}
  el.innerHTML=`${icSm('check')} ${type==='out'?'Checked out':'Checked in'} <button onclick="undoCheck()" style="background:var(--blue);color:var(--card);border:none;border-radius:8px;padding:5px 11px;cursor:pointer;font-size:.85rem;font-family:inherit;font-weight:700">Undo</button>`;
  el.style.display='flex';
}
function _hideUndoToast(){const el=document.getElementById('undoToast');if(el)el.style.display='none';}
function undoCheck(){
  clearTimeout(_undoTimer);
  const id=_undoCamperId,type=_undoType;
  _undoCamperId=null;_undoType=null;_hideUndoToast();
  if(!id)return;

}

// exception worth calling out.

/* Parse a first-aid record body (4 labelled lines) back into its parts for display. */
function _faParse(body){const o={problem:'',treatment:'',firstAider:'',broughtBy:''};(body||'').split('\n').forEach(line=>{
  const m=line.match(/^(Problem|Treatment|First-aider|Brought by):\s*(.*)$/i);if(!m)return;
  const k=m[1].toLowerCase();const v=m[2];
  if(k==='problem')o.problem=v;else if(k==='treatment')o.treatment=v;else if(k==='first-aider')o.firstAider=v;else if(k==='brought by')o.broughtBy=v;});
  return o;}

function exportFaRecords(){

/* ===== BUDGET (director/admin) =====
   Tent/classroom prices come from Camp settings; the backend has no fee-tier, so every
   camper is charged the full price for their accommodation kind. */
/* ===== BUDGET & COSTINGS (rebuilt — brief §5) =====
   Costs come from per-registrant `registrationCost` (the CSV `Cost`), NOT from settings.
   A category = a distinct cost value within a (church, audience) scope; null cost =
   "Cost not recorded" (counted, flagged, $0 to totals — never dropped). Grand total
   reconciles exactly to the sum of every line total. This mirrors the pure helper
   src/services/budget.ts (the canonical, unit-tested algorithm). */
function _money(n){return '$'+Number(n||0).toLocaleString('en-AU',{maximumFractionDigits:2});}
function _budLabel(amount,full){
  if(amount==null)return 'Cost not recorded';
  if(amount===0)return 'Sponsored — '+_money(0);
  if(full!=null&&amount===full)return 'Full — '+_money(amount);
  if(full!=null&&full>0&&Math.abs(amount-full/2)<1)return 'Half — '+_money(amount);
  return 'Part — '+_money(amount);
}
function _budScopeRows(people,full){
  const by=new Map();
  people.forEach(p=>{const k=p.registrationCost==null?'null':String(p.registrationCost);
    let r=by.get(k);if(!r){r={amount:p.registrationCost==null?null:p.registrationCost,count:0,codes:new Map()};by.set(k,r);}
    r.count++;const c=(p.discountCode||'').trim();if(c)r.codes.set(c,(r.codes.get(c)||0)+1);});
  const rows=[...by.values()].map(r=>{let hint=null;if(r.codes.size===1){const [code,n]=[...r.codes.entries()][0];if(n===r.count)hint=code;}
    return {amount:r.amount,count:r.count,lineTotal:(r.amount||0)*r.count,unrecorded:r.amount==null,codeHint:hint};});
  rows.sort((a,b)=>a.amount==null?1:b.amount==null?-1:b.amount-a.amount);
  return rows;
}
function computeBudgetClient(regs,filterId){
  const people=(regs||[]).filter(r=>r.status!=='cancelled').filter(r=>!filterId||filterId==='all'||r.churchId===filterId)
    .map(r=>({churchId:r.churchId,churchName:r.churchName,kind:r.kind==='leader'?'leader':'camper',registrationCost:r.registrationCost==null?null:Number(r.registrationCost),discountCode:r.discountCode}));
  let full=null;people.forEach(p=>{if(p.registrationCost!=null&&p.registrationCost>0)full=full==null?p.registrationCost:Math.max(full,p.registrationCost);});
  const byChurch=new Map();
  people.forEach(p=>{let c=byChurch.get(p.churchId);if(!c){c={churchId:p.churchId,churchName:p.churchName,campers:[],leaders:[]};byChurch.set(p.churchId,c);}
    (p.kind==='leader'?c.leaders:c.campers).push(p);});
  const churches=[...byChurch.values()].map(c=>{const campers=_budScopeRows(c.campers,full),leaders=_budScopeRows(c.leaders,full);
    const camperCount=campers.reduce((s,r)=>s+r.count,0),leaderCount=leaders.reduce((s,r)=>s+r.count,0);
    const total=campers.reduce((s,r)=>s+r.lineTotal,0)+leaders.reduce((s,r)=>s+r.lineTotal,0);
    return {churchId:c.churchId,churchName:c.churchName,camperCount,leaderCount,total,campers,leaders};});

    leaderCount:churches.reduce((s,c)=>s+c.leaderCount,0),churchCount:churches.length,churches,fullAmount:full};
}
/** Mirrors src/services/budget.ts deriveDiscountPurpose. */
function _deriveDiscountPurpose(pairs){
  const valid=pairs.filter(x=>x.cost>0&&x.discount!=null);
  if(!valid.length)return null;
  const avgPercent=valid.reduce((s,x)=>s+(x.discount/x.cost)*100,0)/valid.length;
  const bucket=[25,50,70,100].find(b=>Math.abs(avgPercent-b)<=3);
  if(bucket!=null)return bucket+'% Off';
  const avgDollar=Math.round(valid.reduce((s,x)=>s+x.discount,0)/valid.length);
  return avgDollar>0?('$'+avgDollar+' Off'):null;
}
/** Mirrors src/services/budget.ts computeDiscountCodeSummary. */
function computeDiscountSummaryClient(regs,filterId){
  const people=(regs||[]).filter(r=>r.status!=='cancelled').filter(r=>!filterId||filterId==='all'||r.churchId===filterId);
  const counts=new Map(),pairsByCode=new Map();
  people.forEach(r=>{const code=(r.discountCode||'').trim();if(!code)return;
    counts.set(code,(counts.get(code)||0)+1);
    const cost=r.registrationCost==null?null:Number(r.registrationCost),discount=r.discountAmount==null?null:Number(r.discountAmount);
    if(cost!=null&&discount!=null){const pairs=pairsByCode.get(code)||[];pairs.push({cost,discount});pairsByCode.set(code,pairs);}});
  const rows=[...counts.entries()].map(([code,count])=>({code,count,purpose:_deriveDiscountPurpose(pairsByCode.get(code)||[])})).sort((a,b)=>b.count-a.count||a.code.localeCompare(b.code));
  return {totalInScope:people.length,rows};
}

/* ===== ACCOMMODATION ALLOCATIONS (director/admin) =====
   Classroom rooms (capacity) + an allocation map (roomId -> [{key:"churchId|gender", n}]).

   classroom-kind; auto-fill places min(group remaining, room remaining); rooms are
   single-gender; un-allocate cascades the freed people into other rooms. Tent City

RENDER.accom=async function(){
  if(!['director','admin'].includes(ACTOR.role)){paint('accom','<p class="note-hint" style="margin-top:24px;text-align:center">Accommodation allocations are available to directors only.</p>','Accommodation allocations','');return;}

// Mirrors src/services/accommodation-allocation.ts computeGroups (incl. PC-10 split).
// Pool = classroom-kind people per church×gender, INCLUDING leaders (matches backend).
const ACCOM_SPLIT_THRESHOLD=50;

    const c=by[r.churchId]||(by[r.churchId]={id:r.churchId,name:r.churchName,total:0,classroom:0,
      male:{cls:0,y79:0,y1012:0,yOther:0,ld:0},female:{cls:0,y79:0,y1012:0,yOther:0,ld:0}});

  if(n1012>0)out.push({key:c.id+'|'+gender+'|10-12',church:c.name,gender,label:lbl+' Yr 10–12',n:n1012,bracket:'10-12'});

}
function accomGroups(regs){

  Object.values(by).forEach(c=>{const elig=c.total>0&&c.classroom/c.total>=0.75;if(elig){

/* ===== NOTES ===== */
RENDER.testimonies=async function(){
  // A testimony is stored as a note with category 'testimony'. The student is optional —
  // the default is a general testimony with no specific student identified.
  // CH-2: the dropdown previously fetched only /campers (= isCamper, lifecycle ≥ arrived),
  // so a church login's youth who have NOT yet signed in (lifecycle 'registered') never
  // appeared and the list looked empty. Mirror RENDER.firstday: pull BOTH /registrants
  // (pre-arrival youth, kind 'camper') and /campers (arrived students, kind 'student') and
  // dedupe by id, so every one of the church's young people is selectable.
  const [campPage,regs]=await Promise.all([
    api('/campers?pageSize=300').catch(()=>[]),
    api('/registrants').catch(()=>[]),
  ]);
  const campers=(Array.isArray(campPage)?campPage:campPage.items||[]).filter(c=>c.kind==='student');
  const regYouth=(regs||[]).filter(r=>r.kind==='camper'&&r.status!=='cancelled');
  const byId={};
  campers.forEach(c=>{byId[c.id]={id:c.id,firstName:c.firstName,lastName:c.lastName,churchName:c.churchName};});
  regYouth.forEach(r=>{if(!byId[r.id])byId[r.id]={id:r.id,firstName:r.firstName,lastName:r.lastName,churchName:r.churchName};});
  const items=Object.values(byId).sort((a,b)=>(a.firstName+a.lastName).localeCompare(b.firstName+b.lastName));
  const opts=`<option value="" selected>No specific student identified</option>`
    +items.map(c=>`<option value="${c.id}">${esc(c.firstName+' '+c.lastName)} · ${esc(c.churchName)}</option>`).join('');
  paint('testimonies',`<div class="rowsb" style="margin-bottom:8px"><span class="lbl" style="margin:0">Submit a testimony</span>${helpTip('Record a God-moment from camp. Choosing a student is optional — leave it blank for a general testimony. Saved for leaders and directors to review.')}</div>
    <div class="infobox" style="font-size:.82rem">Record a testimony or God-moment from camp. Pick a student if it's about one, or leave it as a general testimony. It is saved with the records that leaders &amp; directors review.</div>
    <div class="card"><label>Student (optional)</label><select id="tmCamper">${opts}</select>
    <label>Your name (leader)</label><input class="fld" id="tmLeader" value="${esc(LAST_LEADER||'')}" placeholder="e.g. Sarah Doyle">
    <label>Testimony</label><textarea id="tmBody" placeholder="What happened? Whose story is it? What did God do?" style="min-height:120px"></textarea>
    <div class="tglrow" style="margin-top:10px"><div><div class="tgl-l">Mark as sensitive ${helpTip(_SENSITIVE_HELP)}</div><div class="sub">Hides this testimony from church logins on the student's profile.</div></div>
    <label class="tgl"><input type="checkbox" id="tmSensitive"><span class="track"></span></label></div>
    <button class="btn" style="margin-top:10px" onclick="submitTestimony()">Submit testimony</button></div>`,'Submit Testimonies','Day 2+');
};
async function submitTestimony(){const camperId=sel('tmCamper'),leader=val('tmLeader'),body=val('tmBody');
  const sensitive=!!document.getElementById('tmSensitive')?.checked;
  if(!body){toast('Write the testimony');return;}LAST_LEADER=leader;
  const full=leader&&leader!==ACTOR.displayName?`${body}\n— logged by ${leader}`:body;
  const payload={body:full,category:'testimony',sensitive};if(camperId)payload.camperId=camperId;
  try{await api('/notes',{method:'POST',body:payload});toast('Testimony submitted');const t=document.getElementById('tmBody');if(t)t.value='';const s=document.getElementById('tmSensitive');if(s)s.checked=false;}catch(e){toast(e.message);}}
RENDER.notes=async function(presetFilter){
  // /notes/recent returns bare notes (no camper details) — join /campers for name/church/zone/gender/grade.
  const [notes,page,incidents,churchRows]=await Promise.all([api('/notes/recent'),api('/campers?pageSize=300').catch(()=>[]),api('/incidents').catch(()=>[]),api('/accounts/churches').catch(()=>[])]);
  const camps=Array.isArray(page)?page:page.items||[];const cmap={};camps.forEach(c=>{cmap[c.id]=c;});
  // Left-edge zone accent (2026-07-18): a general note/testimony (no camperId) has no student
  // to take a zone from, so fall back to the zone of the church that logged it (authorChurchId).
  const churchZoneById={};(churchRows||[]).forEach(c=>{churchZoneById[c.id]=c.zone;});
  const noteRecs=(notes||[]).map(n=>{const c=cmap[n.camperId]||{};const zone=c.zone||churchZoneById[n.authorChurchId]||null;return Object.assign({},n,{camperName:c.firstName?(c.firstName+' '+c.lastName):(n.camperId||'No specific student'),church:c.churchName,zone,gender:c.gender,grade:c.grade,cat:n.category||'note'});});
  // AC-8: synthesise "Signed out" records from the attendance data — students no longer at camp
  // (atCamp:false / lifecycle checked_out|departed) with a sign-out event. Each surfaces as a
  // record alongside testimonies/notes, sourced from signOutHistory.
  const signedOut=camps.filter(c=>c.atCamp===false&&(c.signOutHistory||[]).some(e=>e.type==='out')).map(c=>{
    const last=(c.signOutHistory||[]).filter(e=>e.type==='out').slice(-1)[0]||{};
    return {camperName:c.firstName+' '+c.lastName,church:c.churchName,zone:c.zone,gender:c.gender,grade:c.grade,
      cat:'signedout',body:last.reason?('Reason: '+last.reason):'Signed out of camp',authorName:last.leaderName||'—',createdAt:last.timestamp||c.updatedAt};
  });
  // Feature 3: incidents surface here as a read-only "Incidents" record type. The summary is
  // decrypted server-side; zone (not church) is the only locational field on an incident.
  const incidentRecs=(incidents||[]).map(i=>({camperName:'Incident'+(i.zone?' · '+i.zone+' Zone':''),church:null,zone:i.zone,gender:null,grade:null,
    cat:'incident',severity:i.severity,body:i.summary,authorName:i.createdByName,createdAt:i.createdAt}));
  window._notesAll=[...noteRecs,...signedOut,...incidentRecs].sort((a,b)=>String(b.createdAt||'').localeCompare(String(a.createdAt||'')));
  const churches=[...new Set(window._notesAll.map(n=>n.church).filter(Boolean))].sort();
  const zonesPresent=[...new Set(window._notesAll.map(n=>n.zone).filter(Boolean))].sort();
  // AC-8: record filter gains "Signed out".
  // New Feature 2: a preset filter (e.g. from the director/admin digest card's first-aid
  // figure) pre-selects a record type instead of always defaulting to "All records".
  const pf=presetFilter||'all';
  const opt=(v,label)=>`<option value="${v}"${pf===v?' selected':''}>${label}</option>`;
  const recSel=`<div><label>Record</label><select id="ntCat" onchange="drawNotes()">${opt('all','All records')}${opt('testimony','Testimony')}${opt('note','Student note')}${opt('firstaid','First-aid')}${opt('signedout','Signed out')}${opt('incident','Incidents')}</select></div>`;
  const minSel=`<div><label>Ministry</label><select id="ntChurch" onchange="drawNotes()"><option value="all">All ministries</option>${churches.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join('')}</select></div>`;
  const zoneSel=`<div><label>Zone</label><select id="ntZone" onchange="drawNotes()"><option value="all">All zones</option>${zonesPresent.map(z=>`<option value="${z}">${z} Zone</option>`).join('')}</select></div>`;
  // AC-7: swap Zone and Ministry positions — Zone first, then Ministry.
  // Item 7c: the "All zones · whole camp" subtitle was never true for a zoneLeader — their
  // /notes/recent read is already zone-scoped server-side. director/admin genuinely see the
  // whole camp, so their subtitle is unchanged.
  const notesSubtitle=ACTOR.role==='zoneLeader'?`Your zone: ${esc(ACTOR.zone||'')}`:'All zones · whole camp';
  paint('notes',`<button class="btn alt" onclick="exportNotes()">${icSm('download')} Export (CSV)</button>
    <div class="selrow">${recSel}${zoneSel}</div><div class="selrow">${minSel}</div>
    <div id="notesList"></div>`,'Testimonies & Notes',notesSubtitle);
  drawNotes();
};
function drawNotes(){
  let list=window._notesAll||[];
  const cat=sel('ntCat')||'all',ch=sel('ntChurch')||'all',z=sel('ntZone')||'all';
  if(cat!=='all')list=list.filter(n=>(n.cat||'note')===cat);
  if(ch!=='all')list=list.filter(n=>n.church===ch);
  if(z!=='all')list=list.filter(n=>n.zone===z);
  const box=document.getElementById('notesList');if(!box)return;
  // Incidents carry their own low/high severity — surface it in the badge instead of a flat
  // "Incident" label (high stays the alarming red pill; low reads as a calmer amber).
  const badge=n=>{const c=n.cat||'note';
    if(c==='testimony')return '<span class="pill info">Testimony</span>';
    if(c==='signedout')return '<span class="pill warn">Signed out</span>';
    if(c==='firstaid')return '<span class="pill amb">First-aid</span>';
    if(c==='incident')return n.severity==='high'?'<span class="pill warn">Incident · High</span>':'<span class="pill amb">Incident · Low</span>';
    return '<span class="pill ok">Student note</span>';
  };
  box.innerHTML=list.length?list.map(n=>{const c=n.cat||'note';
    const right=(n.gender)?`<span class="sub" style="white-space:nowrap">${n.grade?'Yr '+n.grade:(n.gender==='male'?'Guys':'Girls')}</span>`:'';
    // First-aid records carry a 4-line body (Problem/Treatment/First-aider/Brought by) — render
    // the Problem + Treatment lines distinctly rather than as one blob.
    let bodyHtml;
    if(c==='firstaid'){const p=_faParse(n.body);
      bodyHtml=`<div style="font-size:.86rem;margin:4px 0">
        ${p.problem?`<div><b style="color:var(--alert-ink)">Problem:</b> ${esc(p.problem)}</div>`:''}
        ${p.treatment?`<div><b style="color:var(--consent-ok-ink)">Treatment:</b> ${esc(p.treatment)}</div>`:''}
        ${p.firstAider?`<div class="sub" style="color:var(--ink-2)">First-aider: ${esc(p.firstAider)}${p.broughtBy?' · brought by '+esc(p.broughtBy):''}</div>`:''}</div>`;
    }else{bodyHtml=`<div style="font-size:.86rem;color:#475569;margin:4px 0">${esc(n.body)}</div>`;}
    return `<div class="card" style="${zoneAccentStyle(n.zone)}"><div class="rowsb" style="align-items:center"><div class="nm">${esc(n.camperName||'—')}</div>${right}</div>
    ${bodyHtml}
    <div class="sub">${esc(n.authorName)} · ${dtFmt(n.createdAt)}${n.church?' · '+esc(n.church):''} · ${badge(n)}</div></div>`;}).join(''):emptyState('note','No records match these filters.');
}
async function exportNotes(){
  try{const csv=await api('/notes/export');if(!csv||typeof csv!=='string'){toast('Nothing to export');return;}
    const blob=new Blob([csv],{type:'text/csv'});const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download='testimonies-and-notes-'+new Date().toISOString().slice(0,10)+'.csv';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
    toast('Exported');
  }catch(e){toast(e.message);}}

/* ===== INCIDENTS (Feature 3) ===== */
// zoneLeader/director/admin can log AND view incidents. Low = just recorded; High = also
// raises a camp-wide urgent notice to all leaders/directors/admins (server-side).
let _incSeverity='low';
function setIncSeverity(s){_incSeverity=s;
  ['low','high'].forEach(k=>{const b=document.getElementById('incSev-'+k);if(b)b.className=(k===s?'on':'');});

RENDER.incidents=async function(){
  // Leadership only. Reachable in BOTH modes — a real incident can happen pre-camp too, and
  // zoneLeader/director have no other console from which to review/delete one (see the home
  // card comment above for the fuller rationale; reverted the at-camp-only gate 2026-07-18).
  if(!canManageIncident()){go('home');return;}
  const list=await api('/incidents').catch(()=>[]);
  _incSeverity='low';
  const canDelete=['admin','director'].includes(ACTOR.role);
  const rows=(list||[]).length?list.map(i=>{
    const sev=i.severity==='high'?'<span class="pill warn">High</span>':'<span class="pill ok">Low</span>';
    const del=canDelete?`<button class="btn ghost sm" onclick="deleteIncident('${i.id}')">${icSm('trash')}</button>`:'';

/* Feature 6: re-randomise EVERY church login's password and download the list as a CSV
   (username, church, gender, password). Also creates any missing b-/g- account and retires the
   old combined login, so one click both migrates and re-issues. Passwords are memorable (Word.##). */
async function randomizeChurchPasswords(){
  if(!confirm('Re-randomise ALL church login passwords and download the list?\n\nEvery church’s current password will stop working — hand out the new CSV.'))return;
  // The POST does the whole split+randomise server-side and RETURNS the new passwords. That
  // response IS the only copy — so once it succeeds we must download the CSV before anything
  // else can fail. The accounts-list refresh afterwards is cosmetic; a hiccup there must NOT
  // surface as an error (it previously made a fully-successful randomise look like it failed,
  // and left the screen showing the pre-split accounts).
  let rows;
  try{ rows=await api('/accounts/churches/randomize-passwords',{method:'POST',body:{}}); }
  catch(e){ toast(e.message||'Could not randomise passwords'); return; }
  if(!rows||!rows.length){ toast('No church accounts to export'); try{await _rAccts();}catch(_){} return; }
  const q=v=>{v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
  const header=['Username','Church','Gender','Password'];
  const body=rows.map(r=>[r.username,r.church,r.gender==='male'?'Boys':r.gender==='female'?'Girls':r.gender,r.password]);
  const csv='﻿'+[header,...body].map(r=>r.map(q).join(',')).join('\r\n');
  const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
  const a=document.createElement('a');a.href=url;a.download=_exportName('church-passwords','csv');
  document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  toast('Passwords randomised & exported ('+rows.length+' logins)');
  try{await _rAccts();}catch(_){/* UI refresh only — export already succeeded */}
}

/* Bug-7: Bulk Church Update — one form listing every church with its login username (pre-filled)
   and a password field. Save applies all changed usernames + any entered passwords at once;
   a blank password leaves that church's password unchanged. */
function bulkChurchUpdate(){
  const churches=(window._allChurches||[]);const users=(window._allUsers||[]);
  const gLbl=g=>g==='male'?'Boys':g==='female'?'Girls':'';
  const rows=churches.map(c=>{
    // Feature 2: a church has two gender-scoped logins (b-/g-) — list a row for each.
    const accts=users.filter(u=>u.role==='church'&&u.churchId===c.id)

async function saveBulkChurch(){
  const userInputs=[...document.querySelectorAll('#sheet [data-bcu]')];
  const passById={};document.querySelectorAll('#sheet [data-bcp]').forEach(p=>passById[p.getAttribute('data-bcp')]=p.value);
  // Validate everything first so one bad row never leaves a half-applied batch.
  const jobs=[];
  for(const inp of userInputs){
    const id=inp.getAttribute('data-bcu');const cur=inp.getAttribute('data-cur')||'';
    const uname=inp.value.trim();const pass=(passById[id]||'').trim();
    if(uname!==cur){
      if(!/^[A-Za-z0-9._-]{2,40}$/.test(uname)){toast('Invalid username: '+(uname||'(empty)'));return;}
      jobs.push({type:'username',id,username:uname});
    }
    if(pass){
      if(pass.length<6){toast('Passwords must be 6+ characters');return;}
      jobs.push({type:'password',id,password:pass});
    }
  }
  if(!jobs.length){toast('No changes to save');return;}
  let unC=0,pwC=0;
  try{
    for(const j of jobs){
      if(j.type==='username'){await api('/accounts/users/'+j.id,{method:'PATCH',body:{username:j.username}});unC++;}
      else{await api('/accounts/users/password',{method:'POST',body:{userId:j.id,password:j.password}});pwC++;}
    }
    closeModal();toast(`Saved · ${unC} username${unC===1?'':'s'}, ${pwC} password${pwC===1?'':'s'}`);await _rAccts();
  }catch(e){toast(e.message);await _rAccts();}
}

// Pure date helpers (UTC-anchored to match dayLong/timeFmt). YYYY-MM-DD in/out.
function _addDays(dateStr,n){const d=new Date(dateStr+'T12:00:00Z');if(isNaN(d))return'';d.setUTCDate(d.getUTCDate()+n);return d.toISOString().slice(0,10);}
function _datesBetween(start,end){const out=[];if(!start)return out;const s=new Date(start+'T12:00:00Z');let e=end?new Date(end+'T12:00:00Z'):s;if(isNaN(s)||isNaN(e)||e<s)return start&&!isNaN(s)?[start]:[];let cur=new Date(s);let guard=0;while(cur<=e&&guard++<60){out.push(cur.toISOString().slice(0,10));cur.setUTCDate(cur.getUTCDate()+1);}return out;}

/* ===== MULTI-FILE IMPORT (auto-detect Form / Ticket List / Invoice) =====
   One upload field accepts 1–3 Elvanto exports at once. Each file's TYPE is detected from its
   column headers, so there is no manual source picker to get wrong (the old segmented selector +
   a stale file input was how a Ticket List could be sent to the Form importer). Files are always
   imported in dependency order Form → Ticket → Invoice (tickets/invoices match against the people
   the Form import creates) via a single combined preview → confirm. A file whose headers match
   none of the three is rejected with its columns shown, so nothing is silently mis-imported.
   No file is mandatory — import just the Form now and add the Ticket List / Invoice later. */
const IMPORT_TYPES={
  form:    {label:'Form',        endpoint:'/import/csv',     order:0},
  tickets: {label:'Ticket List', endpoint:'/import/tickets', order:1},
  invoices:{label:'Invoice',     endpoint:'/import/invoices',order:2},
};
// Unique-ish column markers per export (lowercased). Detection scores each type by how many of
// its markers a file's headers contain; the top scorer with >=2 markers wins, else "unknown".
const _IMPORT_SIGNATURES={
  form:["attendee's church","submission status","date submitted","school grade","parent/guardian name","list other medical conditions or medication taken"],
  tickets:["ticket type","ticket status","event occurrence information","ticket number"],
  invoices:["ticket total","amount paid","invoice date","registrants","fees paid","invoice status","total tax"],
};
// Read the first CSV row into trimmed, lowercased header names (respects quotes; strips a BOM).
function _parseHeaderRow(text){
  let s=text&&text.charCodeAt(0)===0xfeff?text.slice(1):(text||'');
  const out=[];let cur='',q=false;
  for(let i=0;i<s.length;i++){const ch=s[i];
    if(ch==='"'){if(q&&s[i+1]==='"'){cur+='"';i++;}else q=!q;}
    else if(ch===','&&!q){out.push(cur);cur='';}
    else if((ch==='\n'||ch==='\r')&&!q){break;}
    else cur+=ch;}
  out.push(cur);
  return out.map(h=>h.trim().toLowerCase()).filter(Boolean);
}
function _detectImportType(headers){
  const set=new Set(headers);let best=null,bestScore=0;
  for(const t of Object.keys(_IMPORT_SIGNATURES)){
    const score=_IMPORT_SIGNATURES[t].reduce((n,m)=>n+(set.has(m)?1:0),0);
    if(score>bestScore){bestScore=score;best=t;}
  }
  return bestScore>=2?best:null;
}
// Read one file to CSV text. CSV is read directly; .xlsx/.xls is converted to CSV via the
// vendored SheetJS parser (lazy-loaded on first use) so the rest of the pipeline is
// source-agnostic — detection, dry-run, phantom churches and confirm all work unchanged.
async function _readImportFile(file){
  const isXlsx=/\.(xlsx|xls)$/i.test(file.name);
  if(isXlsx)await _ensureXlsx();
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onerror=()=>reject(new Error('Could not read '+file.name));
    if(isXlsx){
      r.onload=()=>{try{resolve({name:file.name,text:_xlsxToCsv(r.result)});}catch(e){reject(new Error(file.name+': '+(e.message||'could not read spreadsheet')));}};
      r.readAsArrayBuffer(file);
    }else{
      r.onload=()=>resolve({name:file.name,text:String(r.result)});
      r.readAsText(file);
    }
  });
}
// Lazy-load the vendored SheetJS build (~0.9MB) only when an Excel file is actually chosen, so it
// never weighs on normal navigation. Same-origin, so CSP script-src 'self' allows it.
let _xlsxLoading=null;
function _ensureXlsx(){
  if(window.XLSX)return Promise.resolve();
  if(_xlsxLoading)return _xlsxLoading;
  _xlsxLoading=new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    s.src='vendor/xlsx.full.min.js';
    s.onload=()=>window.XLSX?resolve():reject(new Error('Excel reader failed to initialise'));
    s.onerror=()=>{_xlsxLoading=null;reject(new Error('Could not load the Excel reader — try exporting as CSV instead.'));};
    document.head.appendChild(s);
  });
  return _xlsxLoading;
}
// Convert an .xlsx ArrayBuffer to CSV text. When the workbook has multiple sheets, pick the one
// whose header row matches a known import type (Form/Ticket/Invoice); otherwise use the first.
function _xlsxToCsv(arrayBuffer){
  const wb=XLSX.read(arrayBuffer,{type:'array'});
  const names=wb.SheetNames||[];
  if(!names.length)throw new Error('the workbook has no sheets');
  let chosen=names[0];
  for(const nm of names){
    const ws=wb.Sheets[nm];if(!ws)continue;
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,blankrows:false});
    const head=((rows&&rows[0])||[]).map(h=>String(h==null?'':h).trim().toLowerCase());
    if(_detectImportType(head)){chosen=nm;break;}
  }
  return XLSX.utils.sheet_to_csv(wb.Sheets[chosen]);
}
// Per-type "extra" warning line for the preview/result (orphans, guessed accommodation, unmatched).
function _importExtraLine(type,r){
  if(type==='tickets')return r.created?`${icSm('alert')} <b>${r.created}</b> ticket${r.created===1?'':'s'} didn't match an existing student — created as "Needs review". Import the <b>Form</b> file first so tickets attach to real students.`:null;
  if(type==='invoices'){
    const parts=[];
    if(r.guessedAccommodationCount)parts.push(`${r.guessedAccommodationCount} accommodation type${r.guessedAccommodationCount===1?'':'s'} guessed from price`);
    if(r.ambiguousGroupInvoices)parts.push(`${r.ambiguousGroupInvoices} invoice${r.ambiguousGroupInvoices===1?'':'s'} cover multiple people — amounts withheld`);
    if(r.unmatchedInvoices&&r.unmatchedInvoices.length)parts.push(`${r.unmatchedInvoices.length} invoice${r.unmatchedInvoices.length===1?'':'s'} couldn't be matched to anyone`);
    return parts.length?`${icSm('alert')} ${parts.join(' · ')}.`:null;
  }
  return null;
}

/* ===== OFFLINE SIGN-IN (New Feature 1, bottom of Data Import) =====
   Fallback for churches who prefer bulk/paper sign-in over the app: export a spreadsheet of
   every registered student, a church marks "Y" as they arrive, re-importing bulk-signs-in
   anyone marked Y who isn't already at camp. Matches by First+Last+Church text — no id column

function _offlineSignInCardHtml(){
  return `<div class="card">

async function downloadOfflineSignInTemplate(){

async function offlineSignInUpload(){
  const input=document.getElementById('osiFileIn');
  const file=input&&input.files&&input.files[0];
  if(!file)return;
  const box=document.getElementById('osiResult');
  if(!confirm('Import this sheet and sign in everyone marked "Y" who isn\'t already at camp?')){input.value='';return;}
  if(box){box.style.display='block';box.innerHTML='<div class="loading"><div class="spin"></div><div class="lt">Reading sheet…</div></div>';}
  try{

  finally{input.value='';}
}

/* ===== DATA (director/admin): filterable registration table + Elvanto-format export ===== */
let _dataCache=null; // cached /registrants for client-side filtering, default-sorted to import order
let _dataSortKey=null,_dataSortDir=1; // active column sort; null key = default import order
RENDER.data=async function(){
  if(!['director','admin'].includes(ACTOR.role)){paint('data','<p class="note-hint">This area is restricted to directors and admins.</p>','Data','');return;}
  const [regs,camperPage,churches]=await Promise.all([
    api('/registrants').catch(()=>[]),
    api('/campers?pageSize=1000').catch(()=>[]),
    api('/accounts/churches').catch(()=>[]),
  ]);
  // At-camp, anyone already signed in (esp. leaders — bulk-signed-in on the mode switch)
  // has lifecycle !== 'registered' and drops out of /registrants entirely. Merge in
  // /campers (deduped by id) so this screen always shows the full roster, not just the
  // pre-camp-registered subset — same pattern as RENDER.firstday's dedup.
  const campers=Array.isArray(camperPage)?camperPage:camperPage.items||[];
  const regIds=new Set((regs||[]).map(r=>r.id));
  const merged=[...(regs||[]),...campers.filter(c=>!regIds.has(c.id))];
  // Default order = the order records were imported in (createdAt asc) — /registrants
  // itself returns alphabetical (last name), so re-sort here rather than trust the API order.
  _dataCache=merged.slice().sort((a,b)=>(a.createdAt||'').localeCompare(b.createdAt||''));
  _dataSortKey=null;_dataSortDir=1;
  const chOpts=['<option value="">All churches</option>'].concat(
    (churches||[]).map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`)).join('');
  const gradeOpts=['<option value="">All grades</option>','<option value="leader">Leaders</option>']
    .concat([7,8,9,10,11,12].map(g=>`<option value="${g}">Grade ${g}</option>`)).join('');
  // BUG regression fix: director has import:run + allocation:manage (access-control.ts) and
  // RENDER.import/RENDER.adminData both already accept director — they were just unreachable
  // (navModel gives director no 'import' tab and no Records & Export extra in either mode).
  // These two buttons are the reachable entry point in both pre-camp and at-camp (the at-camp
  // home "Student Data Table" tile already routes here via go('data')).
  const navCard=`<div class="card" style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn ghost" style="flex:1;min-width:160px" onclick="go('import')">${icSm('upload')} Data Import</button>
    <button class="btn ghost" style="flex:1;min-width:160px" onclick="go('adminData')">${icSm('download')} Records &amp; Export</button>
  </div>`;
  paint('data',`${navCard}<div class="card">
    <div class="h3" style="margin-top:0">Registration data</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <select class="fld" id="dfCh" style="flex:1;min-width:140px" onchange="dataApply()">${chOpts}</select>
      <select class="fld" id="dfGen" style="flex:1;min-width:110px" onchange="dataApply()">
        <option value="">All genders</option><option value="male">Male</option><option value="female">Female</option></select>
      <select class="fld" id="dfGr" style="flex:1;min-width:120px" onchange="dataApply()">${gradeOpts}</select>
      <select class="fld" id="dfReview" style="flex:1;min-width:140px" onchange="dataApply()">
        <option value="">All records</option><option value="1">Needs review only</option></select>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn" onclick="dataExport(true)">Export filtered</button>
      <button class="btn ghost" onclick="dataExport(false)">Export all</button>
    </div>
    <div id="dataCount" class="note-hint" style="margin-top:6px"></div>
    <div style="overflow-x:auto;margin-top:8px"><table id="dataTbl" style="min-width:1020px;border-collapse:collapse;font-size:.8rem"></table></div>
  </div>`,'Data','Registrations');
  dataApply();
};
function dataFilters(){
  return {
    churchId:document.getElementById('dfCh')?.value||'',
    gender:document.getElementById('dfGen')?.value||'',
    grade:document.getElementById('dfGr')?.value||'',
    needsReview:document.getElementById('dfReview')?.value||'',
  };
}
const DATA_COLS=[['Name','name'],['Church','church'],['Gender','gender'],['Grade','grade'],['Reg type','regType'],['Cost','cost'],['Discount code','discount'],['Mobile','mobile'],['Medical','medical'],['Dietary','dietary'],['Other','other'],['Blue card','blueCard'],['Accommodation','accommodation'],['Review','review']];
function _dataSortVal(r,key){
  switch(key){
    case 'name':return (r.lastName+', '+r.firstName).toLowerCase();
    case 'church':return (r.churchName||'').toLowerCase();
    case 'gender':return (r.gender||'').toLowerCase();
    case 'grade':return r.kind==='leader'?9999:(r.grade??-1);
    case 'regType':return (r.registrationType||'').toLowerCase();
    case 'cost':return r.registrationCost??-1;
    case 'discount':return (r.discountCode||'').toLowerCase();
    case 'mobile':return (r.mobile||'').replace(/\D/g,'');
    case 'medical':return (r.medicalConditions||[]).join(', ').toLowerCase();
    case 'dietary':return (r.dietaryRequirements||[]).join(', ').toLowerCase();
    case 'other':return (r.otherMedications||'').toLowerCase();
    case 'blueCard':return (r.blueCardNumber||'').toLowerCase();
    case 'accommodation':return (r.accommodationKind||'')+'|'+(r.accommodationKindConfidence||'');
    case 'review':return r.needsReview?1:0;
    default:return '';
  }
}
// 3-state header click: unsorted (import order) → asc → desc → back to unsorted.
function dataSort(key){
  if(_dataSortKey!==key){_dataSortKey=key;_dataSortDir=1;}
  else if(_dataSortDir===1){_dataSortDir=-1;}
  else{_dataSortKey=null;_dataSortDir=1;}
  dataApply();
}
function dataApply(){
  const f=dataFilters();let rows=(_dataCache||[]).filter(r=>{
    if(f.churchId&&r.churchId!==f.churchId)return false;
    if(f.gender&&r.gender!==f.gender)return false;
    if(f.grade==='leader'){if(r.kind!=='leader')return false;}
    else if(f.grade){if(r.kind==='leader'||String(r.grade??'')!==f.grade)return false;}
    if(f.needsReview==='1'&&!r.needsReview)return false;
    return true;
  });
  if(_dataSortKey)rows=rows.slice().sort((a,b)=>{
    const av=_dataSortVal(a,_dataSortKey),bv=_dataSortVal(b,_dataSortKey);
    if(av<bv)return -1*_dataSortDir;if(av>bv)return 1*_dataSortDir;return 0;
  });
  const td=v=>`<td style="border-bottom:1px solid var(--line);padding:5px 8px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis">${esc(v||'—')}</td>`;
  // tdRaw skips esc() — only for cells built entirely from enum-like fields / trusted markup (Accommodation, Review).
  const tdRaw=html=>`<td style="border-bottom:1px solid var(--line);padding:5px 8px;white-space:nowrap;max-width:220px;overflow:hidden;text-overflow:ellipsis">${html}</td>`;
  const body=rows.map(r=>{
    const grade=r.kind==='leader'?'Leader':(r.grade??'—');
    const cost=r.registrationCost!=null?'$'+r.registrationCost.toLocaleString():'—';
    return `<tr>${td(r.lastName+', '+r.firstName)}${td(r.churchName)}${td(r.gender)}${td(grade)}${td(r.registrationType)}${td(cost)}${td(r.discountCode)}${td(fmtPhone(r.mobile))}${td((r.medicalConditions||[]).join(', '))}${td((r.dietaryRequirements||[]).join(', '))}${td(r.otherMedications)}${td(r.blueCardNumber)}${tdRaw(accomCell(r))}${tdRaw(reviewCell(r))}</tr>`;
  }).join('');
  const t=document.getElementById('dataTbl');
  const thead=DATA_COLS.map(([label,key])=>{
    const arrow=_dataSortKey===key?(_dataSortDir===1?' ▲':' ▼'):'';
    return `<th style="text-align:left;border-bottom:2px solid var(--line);padding:6px 8px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap" onclick="dataSort('${key}')">${label}${arrow}</th>`;
  }).join('');
  if(t)t.innerHTML=`<thead><tr>${thead}</tr></thead><tbody>${body||'<tr><td colspan="14" style="padding:10px;color:var(--muted)">No matching registrants</td></tr>'}</tbody>`;
  const c=document.getElementById('dataCount');if(c)c.textContent=`${rows.length} of ${(_dataCache||[]).length} registrants`;
}
function accomCell(r){
  const kind=r.accommodationKind==='tent'?'Tent':r.accommodationKind==='classroom'?'Classroom':'—';
  const badge=r.accommodationKindConfidence==='guessed'?' <span class="pill amb">Guessed</span>':'';
  return kind+badge;
}
function reviewCell(r){
  return r.needsReview?`<span class="pill warn" style="cursor:pointer" onclick="openReviewModal('${r.id}')">${icSm('alert')} Needs review</span>`:'—';
}
function openReviewModal(id){
  const r=(_dataCache||[]).find(x=>x.id===id);
  if(!r){toast('Record not found');return;}
  modal(`<h3>Needs review · ${esc(r.firstName+' '+r.lastName)} ${helpTip('This record was created or updated by a Ticket List / Invoice import that couldn\'t confidently match it to an existing person. Before confirming: check the name spelling and church are correct, and that the accommodation, cost and discount fields below look right. “Mark reviewed” only clears this flag — it does not change any data. If something’s wrong, fix it with a corrected re-import (matching improves once the name/church lines up), then come back and confirm.')}</h3>
    <p class="sub" style="margin:4px 0 8px">${esc(r.needsReviewReason||'No reason recorded.')}</p>
    <button class="btn" onclick="_markReviewed('${id}')">Mark reviewed</button>
    <button class="btn ghost" style="margin-top:6px" onclick="closeModal()">Cancel</button>`);
}
async function _markReviewed(id){
  try{
    await api('/registrants/'+id,{method:'PATCH',body:{needsReview:false,needsReviewReason:null}});
    closeModal();
    const r=(_dataCache||[]).find(x=>x.id===id);
    if(r){r.needsReview=false;r.needsReviewReason=null;}
    dataApply();
    toast('Marked reviewed');
  }catch(e){toast(e.message);}
}
async function dataExport(filtered){
  try{
    let qs='';
    if(filtered){const f=dataFilters();const params=new URLSearchParams();
      if(f.churchId)params.set('churchId',f.churchId);
      if(f.gender)params.set('gender',f.gender);
      if(f.grade==='leader')params.set('kind','leader');
      else if(f.grade)params.set('grade',f.grade);
      const s=params.toString();if(s)qs='?'+s;}
    const csv=await api('/export/registrants'+qs);
    if(!csv||typeof csv!=='string'){toast('Nothing to export');return;}
    const url=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));
    const a=document.createElement('a');a.href=url;
    a.download='camp-registrations-'+new Date().toISOString().slice(0,10)+'.csv';
    document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);
  }catch(e){toast(e.message);}
}
/* ===== ADMIN: INDIVIDUAL STUDENT DATA EDIT (at-camp) =====
   After camp commences there are no more spreadsheet uploads, so the admin corrects
   individual student records here. Students only (leaders unaffected). Merges
   /registrants (not yet arrived) + /campers (arrived) — same dual-fetch as RENDER.firstday. */
let _stuCache=[],_stuChurches=[];
function _stuNorm(r,atCamp){return {id:r.id,firstName:r.firstName,lastName:r.lastName,gender:r.gender,grade:r.grade??null,
  churchId:r.churchId,churchName:r.churchName,zone:r.zone,accommodationKind:r.accommodationKind??null,
  medical:(r.medicalConditions||[]).join(', '),dietary:(r.dietaryRequirements||[]).join(', '),atCamp};}
RENDER.adminStudents=async function(){
  const [regs,campers,churches]=await Promise.all([
    api('/registrants').catch(()=>[]),
    api('/campers').catch(()=>[]),
    api('/accounts/churches').catch(()=>[]),

  _stuCache=Object.values(byId);

    _stuChurches.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`)).join('');

  paint('adminStudents',`<div class="card">
    <div class="rowsb" style="align-items:center"><div class="h3" style="margin-top:0">Student data</div>
      <button class="btn sm" onclick="stuAdd()">${icSm('plus')} Add student</button></div>
    <p class="sub" style="margin:2px 0 8px">Tap a student to correct their record ${helpTip('Use this once camp is running — later spreadsheet uploads are unlikely, so fixes are made per student here. Changes apply immediately.')}</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px">
      <select class="fld" id="sfCh" style="flex:1;min-width:140px" onchange="stuApply()">${chOpts}</select>
      <select class="fld" id="sfGen" style="flex:1;min-width:110px" onchange="stuApply()">
        <option value="">All genders</option><option value="male">Male</option><option value="female">Female</option></select>
      <select class="fld" id="sfGr" style="flex:1;min-width:120px" onchange="stuApply()">${gradeOpts}</select>
    </div>
    <div class="search"><span>${ic('search')}</span><input id="sfQ" placeholder="Search by name…" oninput="stuApply()"></div>
    <div id="stuCount" class="note-hint" style="margin-top:6px"></div>
    <div style="overflow-x:auto;margin-top:8px"><table id="stuTbl" style="min-width:560px;width:100%;border-collapse:collapse;font-size:.8rem"></table></div>
  </div>`,'Individual Student Data Edit','Admin');
  stuApply();
};
function stuApply(){
  const ch=sel('sfCh')||'',gen=sel('sfGen')||'',gr=sel('sfGr')||'',q=(val('sfQ')||'').toLowerCase();
  const rows=_stuCache.filter(s=>{
    if(ch&&s.churchId!==ch)return false;
    if(gen&&s.gender!==gen)return false;
    if(gr&&String(s.grade??'')!==gr)return false;
    if(q&&!(s.firstName+' '+s.lastName).toLowerCase().includes(q))return false;
    return true;
  }).sort((a,b)=>a.lastName.localeCompare(b.lastName)||a.firstName.localeCompare(b.firstName));

  const accLbl=k=>k==='tent'?'Tent':k==='classroom'?'Classroom':'—';
  const body=rows.map(s=>`<tr onclick="stuEdit('${s.id}')" style="cursor:pointer">
    ${td(esc(s.lastName+', '+s.firstName))}${td(esc(s.churchName||'—'))}${td(s.grade??'—')}${td(esc(s.gender==='male'?'M':s.gender==='female'?'F':'—'))}${td(esc(accLbl(s.accommodationKind)))}${td(s.atCamp?'<span class="pill ok">At camp</span>':'<span class="pill info">Registered</span>')}

  const c=document.getElementById('stuCount');if(c)c.textContent=`${rows.length} of ${_stuCache.length} students`;
}
function _stuFormFields(s){
  const chSel=`<select id="seCh">${_stuChurches.map(c=>`<option value="${esc(c.id)}"${s&&c.id===s.churchId?' selected':''}>${esc(c.name)}</option>`).join('')}</select>`;

function stuEdit(id){const s=_stuCache.find(x=>x.id===id);if(!s){toast('Student not found');return;}

let _importBatch=null;        // [{type,name,csvData}] ordered Form→Ticket→Invoice, awaiting confirm
let _importPendingParsed=null; // parsed files awaiting manual type resolution (unknowns)
async function adminUpload(){
  const input=document.getElementById('fileIn');
  const files=input&&input.files?Array.prototype.slice.call(input.files):[];
  if(!files.length){toast('Choose one or more files first');return;}
  const box=document.getElementById('impResult');if(box){box.style.display='block';box.innerHTML='<div class="loading"><div class="spin"></div><div class="lt">Reading files…</div></div>';}
  try{
    const parsed=[];
    for(const f of files){
      if(!/\.(csv|xlsx|xls)$/i.test(f.name)){toast('Unsupported file (CSV or Excel only): '+f.name);_clearImport();return;}
      const rd=await _readImportFile(f);
      const headers=_parseHeaderRow(rd.text);
      parsed.push({name:f.name,csvData:rd.text,headers,type:_detectImportType(headers)});
    }
    if(parsed.some(p=>!p.type)){_importPendingParsed=parsed;_renderImportUnknown(parsed.filter(p=>!p.type));return;}
    const ordered=_orderImportBatch(parsed);
    if(!ordered)return; // dup-type toast already shown
    _importBatch=ordered;

  }catch(e){toast(e.message);_clearImport();}
}
// Reject unknowns but let the admin manually assign a type (or skip the file) rather than guessing.
function _renderImportUnknown(unknown){
  const box=document.getElementById('impResult');if(!box)return;box.style.display='block';
  const rows=unknown.map((u,i)=>`<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px">
    <div style="font-weight:700">${esc(u.name)}</div>
    <div class="sub" style="margin:2px 0 6px">Couldn't identify this file. Columns found: ${esc(u.headers.slice(0,8).join(', '))}${u.headers.length>8?'…':''}</div>
    <label style="font-size:var(--t-micro)">Treat as</label>
    <select class="fld" id="impUnk_${i}"><option value="">— skip this file —</option><option value="form">Form</option><option value="tickets">Ticket List</option><option value="invoices">Invoice</option></select>
  </div>`).join('');
  box.innerHTML=`<div class="warnbox">${icSm('alert')} ${unknown.length} file${unknown.length===1?'':'s'} not recognised as a Form, Ticket List or Invoice export. Pick a type (or skip), then continue.</div>
    ${rows}
    <button class="btn" onclick="_resolveImportUnknown()">Continue ${icSm('arrowr')}</button>
    <button class="btn ghost" style="margin-left:6px" onclick="_clearImport()">Cancel</button>`;
}
function _resolveImportUnknown(){
  const parsed=_importPendingParsed||[];
  const unknown=parsed.filter(p=>!p.type);
  unknown.forEach((u,i)=>{u.type=sel('impUnk_'+i)||null;});
  const kept=parsed.filter(p=>p.type);
  if(!kept.length){toast('Pick a type for at least one file, or cancel');return;}
  const ordered=_orderImportBatch(kept);if(!ordered)return;
  _importPendingParsed=null;_importBatch=ordered;_renderImportPreview();

// Sort Form→Ticket→Invoice; reject two files of the same type (can't import the same source twice).
function _orderImportBatch(list){
  const seen={};
  for(const p of list){if(seen[p.type]){toast('Two files look like the same type ('+IMPORT_TYPES[p.type].label+'): '+seen[p.type]+' and '+p.name);return null;}seen[p.type]=p.name;}
  return list.slice().sort((a,b)=>IMPORT_TYPES[a.type].order-IMPORT_TYPES[b.type].order);
}
// Combined dry-run preview across all files in the batch, then a single confirm.
async function _renderImportPreview(){
  const box=document.getElementById('impResult');if(!box||!_importBatch)return;box.style.display='block';
  box.innerHTML='<div class="loading"><div class="spin"></div><div class="lt">Checking files…</div></div>';
  const formInBatch=_importBatch.some(b=>b.type==='form');
  let formImported=false;try{const s=await api('/settings');formImported=!!(s&&s.formImportedAt);}catch(e){}
  const results=[];
  for(const b of _importBatch){
    try{const r=await api(IMPORT_TYPES[b.type].endpoint,{method:'POST',body:{csvData:b.csvData,updateExisting:true,dryRun:true}});results.push({b,r});}
    catch(e){results.push({b,err:e.message||'error'});}
  }
  const formRes=results.find(x=>x.b.type==='form'&&x.r);
  const phantoms=(formRes&&formRes.r.phantomChurches)||[];
  // Per-file summary cards.
  const cards=results.map(({b,r,err})=>{
    if(err)return `<div class="warnbox">${esc(b.name)} (${IMPORT_TYPES[b.type].label}): ${esc(err)}</div>`;
    const del=r.deleted?` \xb7 <b style="color:var(--danger)">${r.deleted} to delete</b>`:'';
    // A Ticket/Invoice orphan/unmatched warning is misleading while an unrun Form sits in the same
    // batch (matches only happen once the Form is committed first), so suppress it in that case.
    const extra=(b.type!=='form'&&formInBatch)?`<span style="color:var(--muted)">Matches finalise after the Form import runs first.</span>`:_importExtraLine(b.type,r);
    const errs=(r.errors||[]);
    const errList=errs.length?`<div style="margin-top:4px">${errs.slice(0,8).map(e=>`<div style="color:var(--danger);font-size:.76rem">Row ${e.row}: ${esc(e.message)}</div>`).join('')}${errs.length>8?`<div class="sub">+${errs.length-8} more error${errs.length-8===1?'':'s'}</div>`:''}</div>`:'';
    return `<div style="border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin-bottom:8px">
      <div class="rowsb" style="align-items:center"><b style="min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(b.name)}</b><span class="pill info" style="flex:none">${IMPORT_TYPES[b.type].label}</span></div>
      <div class="sub" style="margin-top:2px">${r.created} to add \xb7 ${r.updated} to update \xb7 ${r.skipped} to skip${del} \xb7 ${errs.length} error${errs.length===1?'':'s'}</div>
      ${extra?`<div class="sub" style="margin-top:2px">${extra}</div>`:''}${errList}</div>`;
  }).join('');
  // Bug-11 guard: importing Ticket/Invoice with no Form ever imported (and none in this batch) means
  // rows can't match a student and become "Needs review" orphans. Warn loudly.
  const needsForm=!formInBatch&&!formImported&&_importBatch.some(b=>b.type==='tickets'||b.type==='invoices');
  const guardHtml=needsForm?`<div class="warnbox">${icSm('alert')} No <b>Form</b> registrations have been imported yet, so these tickets/invoices have no students to attach to — they'll be flagged "Needs review". Import the <b>Form</b> export first for them to match.</div>`:'';
  // Phantom churches from the Form file must be created before we can confirm.
  let phantomHtml='';
  if(phantoms.length){
    const autoUser=n=>n.toLowerCase().replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,30)||'church';
    const rows=phantoms.map((n,i)=>`<div style="border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px">
      <div style="font-weight:700;margin-bottom:6px">${esc(n)}</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        <div style="flex:1;min-width:130px"><label style="font-size:var(--t-micro)">Zone</label>${zoneSel('pzZone_'+i)}</div>
        <div style="flex:2;min-width:140px"><label style="font-size:var(--t-micro)">Username</label><input class="fld" id="pzUser_${i}" value="${esc(autoUser(n))}" autocapitalize="none" autocorrect="off" spellcheck="false"></div>
        <div style="flex:2;min-width:140px"><label style="font-size:var(--t-micro)">Password (min 6)</label><input class="fld" id="pzPass_${i}" placeholder="min 6 chars"></div>
      </div></div>`).join('');
    phantomHtml=`<div class="warnbox">${icSm('alert')} ${phantoms.length} unrecognised church${phantoms.length===1?'':'es'} in the Form file — set zone, username &amp; password to create them first:</div>
      ${rows}
      <button class="btn" onclick="_createPhantomChurches(${esc(JSON.stringify(phantoms))})">Create ${phantoms.length} church${phantoms.length===1?'':'es'} ${icSm('arrowr')}</button>`;
  }
  const confirmHtml=phantoms.length?'':`<button class="btn" style="margin-top:8px" onclick="_confirmImport()">Confirm &amp; import ${_importBatch.length>1?'all '+_importBatch.length+' files':''}</button>`;
  box.innerHTML=`<div class="infobox"><b>Preview (nothing saved yet)</b> — ${_importBatch.length} file${_importBatch.length===1?'':'s'}, imported Form → Ticket → Invoice.</div>
    ${cards}${guardHtml}${phantomHtml}${confirmHtml}
    <button class="btn ghost" style="margin-top:8px${confirmHtml||phantomHtml?';margin-left:6px':''}" onclick="_clearImport()">Cancel</button>`;
}
async function _createPhantomChurches(names){
  const btn=event&&(event.currentTarget||event.target);
  if(btn){btn.disabled=true;btn.textContent='Creating…';}
  const autoUser=n=>n.toLowerCase().replace(/[^a-z0-9]/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'').slice(0,30)||'church';
  for(let i=0;i<names.length;i++){
    const name=names[i];
    const zone=sel('pzZone_'+i)||'Yellow';
    const username=(document.getElementById('pzUser_'+i)?.value||'').trim()||autoUser(name);
    const pass=(document.getElementById('pzPass_'+i)?.value||'').trim();
    if(pass.length<6){toast('Password for "'+name+'" must be 6+ chars');if(btn){btn.disabled=false;btn.textContent='Retry';}return;}
    if(!/^[A-Za-z0-9._-]{2,40}$/.test(username)){toast('Username for "'+name+'" is invalid — use letters, numbers, . _ - only (min 2 chars)');if(btn){btn.disabled=false;btn.textContent='Retry';}return;}
    try{await api('/accounts/churches',{method:'POST',body:{churchName:name,zone,accountFirstName:name,accountLastName:'Team',accountUsername:username,accountPassword:pass}});}
    catch(e){toast('Failed to create "'+name+'": '+(e.message||'error'));if(btn){btn.disabled=false;btn.textContent='Retry';}return;}
  }
  toast(names.length+' church'+(names.length===1?'':'es')+' created');
  _renderImportPreview(); // re-dry-run: the Form file no longer reports these as phantom
}
async function _confirmImport(){
  if(!_importBatch||!_importBatch.length){toast('No import pending');return;}
  const box=document.getElementById('impResult');
  if(box){box.innerHTML='<div class="loading"><div class="spin"></div><div class="lt">Importing…</div></div>';}
  const done=[];let flagged=0,unmatched=0;
  try{
    // Run for real in dependency order — Form persists first so Ticket/Invoice can match its people.
    for(const b of _importBatch){
      const r=await api(IMPORT_TYPES[b.type].endpoint,{method:'POST',body:{csvData:b.csvData,updateExisting:true,dryRun:false}});
      done.push({b,r});
      if(b.type==='tickets')flagged+=r.created||0;
      if(b.type==='invoices')unmatched+=(r.unmatchedInvoices&&r.unmatchedInvoices.length)||0;
    }

  _importBatch=null;
  const lines=done.map(({b,r})=>`<div class="sub"><b>${IMPORT_TYPES[b.type].label}:</b> <b style="color:#15803d">${r.created}</b> new · <b>${r.updated}</b> updated · ${r.skipped} skipped${r.deleted?' · '+r.deleted+' removed':''} · ${(r.errors||[]).length} errors</div>`).join('');
  const reviewBtn=(flagged||unmatched)?`<button class="btn alt" style="margin-top:8px" onclick="_goReviewData()">${icSm('alert')} Review ${flagged+unmatched} flagged record${flagged+unmatched===1?'':'s'} ${icSm('arrowr')}</button>`:'';
  if(box){box.style.display='block';box.innerHTML=`<div class="callbox"><b>Import complete</b></div>${lines}${reviewBtn}`;}
  _loadImportStamps(); // refresh the per-source "last imported" lines
  toast('Import complete');
}

function _clearImport(){_importBatch=null;_importPendingParsed=null;const fi=document.getElementById('fileIn');if(fi)fi.value='';const b=document.getElementById('impResult');if(b){b.style.display='none';b.innerHTML='';}}


/* ===== SETUP WIZARD ===== */
// Logical camp-setup order: settings first (unlocks dates), then churches/accounts, then
// accommodation (rooms → allocation), then the day-by-day content (schedule/devotionals),
// then family-facing info (FAQ/contacts). Each step auto-detects "done" for the green tick,
// and carries a short plain-language tip (rendered as a helpTip bubble in the checklist).
const WIZARD_STEPS=[
  {key:'settings',label:'Camp settings',icon:'gear',screen:'adminSettings',summary:'Camp settings — dates, name and check-in switchover.',check:()=>!!(SETTINGS&&SETTINGS.campName&&SETTINGS.startDate)},
  {key:'churches',label:'Churches',icon:'users',screen:'adminAccounts',summary:'Churches — added automatically from your registration upload, or add one by hand.',check:async()=>{try{const c=await api('/accounts/churches');return(c||[]).length>0;}catch(e){return false;}}},
  {key:'accounts',label:'Accounts',icon:'users',screen:'adminAccounts',summary:'Accounts — login accounts for church leaders, zone leaders and directors.',check:async()=>{try{const u=await api('/accounts/users');return(u||[]).filter(x=>x.role!=='admin').length>0;}catch(e){return false;}}},
  // Item 5a: sits between Accounts and Accommodation rooms — a camp usually imports its
  // registration export right after accounts exist, before setting up rooms/allocation.
  {key:'import',label:'Import registrations',icon:'upload',screen:'import',summary:'Import registrations — upload your Form, Ticket List and Invoice exports.',check:async()=>{if(SETTINGS&&SETTINGS.formImportedAt)return true;try{const r=await api('/registrants');return(r||[]).length>0;}catch(e){return false;}}},
  {key:'accom',label:'Accommodation rooms',icon:'classroom',screen:'adminAccom',summary:'Accommodation rooms — your sleeping rooms and their capacities.',check:async()=>{try{const b=await api('/accommodation/classrooms');return(b||[]).length>0;}catch(e){return false;}}},
  {key:'accomAlloc',label:'Accommodation allocation',icon:'home',screen:'accom',summary:'Accommodation allocation — assign churches to rooms, auto-filled to capacity.',check:async()=>{try{const a=await api('/accommodation/allocations');return Object.values(a||{}).some(arr=>Array.isArray(arr)&&arr.some(e=>e&&Number(e.n)>0));}catch(e){return false;}}},
  // Feature 7 (2026-07-17): Schedule/FAQ/Devotionals merged into ONE step routing to the
  // already-merged RENDER.atCampInfo screen; done-check = ANY of the three has content.
  {key:'atCampInfo',label:'At Camp Info',icon:'clock',screen:'atCampInfo',summary:'At Camp Info — schedule, devotionals and FAQ for families and campers.',check:async()=>{
    try{
      const days=SETTINGS?.checkInDays||[];

];
// Item 5b: tapping a step remembers it (1-based) so _wizardChipHtml can show "Back to

/* ===== ADMIN SCHEDULE (content builder — merged into RENDER.atCampInfo, item 8) ===== */
// One editable table row (Time + Activity). Index r keeps input ids unique per day.
// Inputs are addressed by CLASS within each .sched-row (not index-based ids), so a row can be
// deleted from the middle without renumbering the rest — saveSchedDay reads the live rows.
function _schedRow(d,r,t,n){return `<div class="sched-row" style="display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:6px;margin-bottom:6px;align-items:center">`
  +`<input class="fld sr-t" type="time" value="${esc(t||'')}">`
  +`<input class="fld sr-n" placeholder="Activity" value="${esc(n||'')}">`
  +`<button class="iconbtn danger" type="button" title="Delete row" onclick="this.closest('.sched-row').remove()">${icSm('trash')}</button></div>`;}
const SCHED_MIN_ROWS=7;
async function _acScheduleBody(){
  const days=SETTINGS?.checkInDays||[];
  if(!days.length)return '<p class="note-hint">Set the camp dates first (Camp settings).</p>';
  const blocks=await Promise.all(days.map(async d=>{
    const items=(await api('/schedule?day='+d).catch(()=>[])).slice()
      .sort((a,b)=>String(a.startTime||'').localeCompare(String(b.startTime||'')));
    const n=Math.max(SCHED_MIN_ROWS,items.length);
    let rows='';for(let r=0;r<n;r++){const it=items[r]||{};rows+=_schedRow(d,r,it.startTime,it.title);}
    return `<div class="card"><div class="h3" style="margin-top:0">${dayLong(d)} <span style="color:var(--muted);font-weight:600">· ${d}</span></div>
      <div style="display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:6px;font-size:.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px"><span>Time</span><span>Activity</span><span style="width:32px"></span></div>
      <div id="schedRows_${d}">${rows}</div>
      <div style="display:flex;gap:6px;margin-top:8px">
        <button class="btn ghost sm" style="flex:1" onclick="addSchedRow('${d}')">+ Add row</button>
        <button class="btn sm" style="flex:1" onclick="saveSchedDay('${d}')">Save ${dayLong(d)}</button></div></div>`;
  }));
  return blocks.join('');
}
function addSchedRow(d){const wrap=document.getElementById('schedRows_'+d);if(!wrap)return;
  wrap.insertAdjacentHTML('beforeend',_schedRow(d,wrap.children.length,'',''));}
// Table is the source of truth: saving replaces the whole day's schedule with the
// filled rows (time + title both present). Cleared rows are dropped.
async function saveSchedDay(d){
  const wrap=document.getElementById('schedRows_'+d);if(!wrap)return;
  const entries=[];
  for(const row of Array.from(wrap.children)){const t=(row.querySelector('.sr-t')||{}).value||'',n=(row.querySelector('.sr-n')||{}).value||'';if(t&&n)entries.push({startTime:t,title:n});}
  // Item 6: PUT /schedule/day replaces the whole day in one call (backend does the
  // delete+insert as one transaction) — was N deletes then N creates sequentially.
  try{
    await api('/schedule/day',{method:'PUT',body:{day:d,items:entries.map(e=>({startTime:e.startTime,title:e.title,type:'activity'}))}});
    toast('Saved '+dayLong(d)+'');await _rSched();
  }catch(e){toast(e.message);await _rSched();}
}

RENDER.atCampInfo=async function(sub){
  if(sub&&AC_INFO_TABS.some(([id])=>id===sub))_acInfoSub=sub;
  const seg=`<div class="seg" style="margin-bottom:10px">${AC_INFO_TABS.map(([id,label])=>
    `<button class="${_acInfoSub===id?'on':''}" onclick="RENDER.atCampInfo('${id}')">${label}</button>`).join('')}</div>`;
  const body=_acInfoSub==='faq'?await _acFaqBody():_acInfoSub==='devos'?await _acDevosBody():await _acScheduleBody();
  const subtitle=_acInfoSub==='faq'?'Edit answers':_acInfoSub==='devos'?'Edit each camp day':'Fill a day, then Save';
  paint('atCampInfo',seg+body,'At-Camp Info',subtitle);
};

/* ===== ADMIN CONTACTS ===== */
RENDER.adminContacts=async function(){
  const churches=await api('/accounts/churches');
  const card=c=>{const ct=c.contacts||{};
    const mp=ct.male?.primary||{},mb=ct.male?.backup||{},fp=ct.female?.primary||{},fb=ct.female?.backup||{};
    const filled=[mp,mb,fp,fb].filter(x=>x&&x.name&&String(x.name).trim()).length;
    const pill=filled===4?'ok':filled?'amb':'info';
    const pair=(lbl,n,p,nv,pv)=>`<label>${lbl}</label><div style="display:flex;gap:6px"><input class="fld" id="${n}" placeholder="Name" value="${esc(nv||'')}"><input class="fld" id="${p}" placeholder="Phone" value="${esc(pv||'')}"></div>`;
    return `<div class="card" style="padding:0;overflow:hidden">
      <div class="rowsb" style="padding:13px 14px;cursor:pointer" onclick="toggleContactCard('${c.id}')">
        <div style="min-width:0"><div style="font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(c.name)}</div><div class="sub" style="font-size:var(--t-xs)">${esc(c.zone||'—')}</div></div>
        <div style="display:flex;align-items:center;gap:8px;flex:none">
          <span class="pill ${pill}" id="contactPill_${c.id}">${filled}/4 Contacts</span>
          <span id="contactChev_${c.id}" style="display:inline-flex;transition:transform .15s;color:var(--muted)">${ic('chevron')}</span>
        </div>
      </div>
      <div id="contactBody_${c.id}" style="display:none;padding:0 14px 14px;border-top:1px solid var(--line)">
        ${pair('Guys — primary leader','mp_n_'+c.id,'mp_p_'+c.id,mp.name,mp.phone)}
        ${pair('Guys — secondary leader','mb_n_'+c.id,'mb_p_'+c.id,mb.name,mb.phone)}
        ${pair('Girls — primary leader','fp_n_'+c.id,'fp_p_'+c.id,fp.name,fp.phone)}
        ${pair('Girls — secondary leader','fb_n_'+c.id,'fb_p_'+c.id,fb.name,fb.phone)}
        <button class="btn" style="margin-top:10px" onclick="saveContacts('${c.id}')">Save ${esc(c.name)}</button>
        <p class="note-hint">Leave blank to clear. Numbers are masked until audited reveal.</p>
      </div></div>`;};
  const grid=churches.length
    ?`<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px">${churches.map(card).join('')}</div>`
    :'<p class="note-hint">No churches yet.</p>';
  paint('adminContacts',grid,'Ministry contacts','Tap a church to edit');
};
function toggleContactCard(id){const b=document.getElementById('contactBody_'+id),ch=document.getElementById('contactChev_'+id);if(!b)return;const open=b.style.display!=='none';b.style.display=open?'none':'block';if(ch)ch.style.transform=open?'':'rotate(90deg)';}
// Updates just this card's "N/4 Contacts" pill in place instead of a full RENDER.adminContacts()
// re-render — a full re-render re-fetches every church and rebuilds the whole grid, which
// collapses every open card and would drop any unsaved edits typed into OTHER churches while
// working through the list one church at a time.
function _updateContactPill(id,people){
  const filled=people.filter(x=>x&&x.name&&String(x.name).trim()).length;
  const pill=document.getElementById('contactPill_'+id);
  if(pill){pill.textContent=filled+'/4 Contacts';pill.className='pill '+(filled===4?'ok':filled?'amb':'info');}
}
async function saveContacts(id){const C=(n,p)=>({name:val(n),phone:val(p)});
  const mp=C('mp_n_'+id,'mp_p_'+id),mb=C('mb_n_'+id,'mb_p_'+id),fp=C('fp_n_'+id,'fp_p_'+id),fb=C('fb_n_'+id,'fb_p_'+id);
  try{
    await api('/accounts/churches/'+id,{method:'PATCH',body:{contacts:{male:{primary:mp,backup:mb},female:{primary:fp,backup:fb}}}});
    toast('Contacts saved');
    _updateContactPill(id,[mp,mb,fp,fb]);
  }catch(e){toast(e.message);}
}

async function _tryRestoreSession(){
  const tok=localStorage.getItem('ycp_token');const actorJson=localStorage.getItem('ycp_actor');
  if(!tok||!actorJson)return;
  TOKEN=tok;
  try{
    ACTOR=JSON.parse(actorJson);
    const stash=localStorage.getItem('ycp_preview_stash');
    if(stash){try{_previewStash=JSON.parse(stash);ACCOUNT_PREVIEW=true;document.getElementById('previewBanner').classList.add('show');}catch(_){}}
    if(MUST_CHANGE_PASSWORD_ENFORCED&&ACTOR.mustChangePassword){_showChangePasswordGate();return;}
    SETTINGS=await api('/settings');
    CAMP_MODE=SETTINGS.campMode||'pre-camp';
    document.getElementById('login').style.display='none';
    document.getElementById('bar').style.display='flex';
    document.getElementById('stage').style.display='block';
    document.getElementById('tabs').style.display='';  // let CSS media query control visibility
    updateModeUI();buildTabs();_prefetch();STACK=['home'];await gotoTab('home');
    _loadLeaderInitials(); // restore the badge/prefill; no auto-prompt on a silent session restore
  }catch(e){
    if(e&&e.code==='MUST_CHANGE_PASSWORD'){_showChangePasswordGate();return;}
    TOKEN=null;ACTOR=null;
    localStorage.removeItem('ycp_token');localStorage.removeItem('ycp_actor');
  }
}
/* ===== BOOT ===== */
// Enter-to-submit is now handled natively by #loginForm's onsubmit (real <form>, added for iOS
// PWA Keychain autofill) — no manual keydown listeners needed here, avoids a double doLogin() call.
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('modal').classList.contains('show'))closeModal();});
_initDemoLogin();_tryRestoreSession();

/* B-3: cross-tab + on-focus mode sync. A second tab (or a tab not on Home) used to keep stale
   pre-camp/at-camp nav after an admin switched mode until the user navigated Home. */
window.addEventListener('storage',e=>{
  if(e.key==='ycp_campmode'&&e.newValue)_applyModeChange(e.newValue);
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!ACTOR||PREVIEW_MODE)return;
  // A backgrounded tab may have missed the storage event — re-check the authoritative mode.
  api('/settings').then(s=>{if(s&&s.campMode)_applyModeChange(s.campMode);}).catch(()=>{});
});

/* PWA: register the service worker (network-first HTML shell, network-only API,
   cache-first assets). On a new SW taking control after a deploy, reload once so
   users get the latest UI without a manual refresh. */
if('serviceWorker'in navigator){
  let _reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_reloading)return;_reloading=true;location.reload();
  });
  window.addEventListener('load',()=>{navigator.serviceWorker.register('/sw.js').catch(()=>{});});
}

</script>
