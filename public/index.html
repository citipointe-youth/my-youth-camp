<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Content-Security-Policy: defence-in-depth alongside per-field HTML escaping (ported
     from Connection Made Simple). 'unsafe-inline' is required because the whole app is
     inline <script>/<style> with onclick handlers; the value of CSP here is blocking
     EXTERNAL script/resource loading, base-uri hijacks and form-action exfiltration.
     style-src/font-src allow Google Fonts (Plus Jakarta Sans, loaded below) — the only
     external resource this app loads; connect-src 'self' covers all API calls (relative
     paths, same origin).
     img-src MUST keep `data:` — the site map is stored as a data: URI in settings and is
     rendered by <img> in three places (crop probe, settings preview, the Map screen). With
     a bare 'self' the browser blocks every one of them and the upload fails at the probe
     with "Could not read that image file" (2026-07-29). It stays a same-origin policy:
     data: images are inert and can't exfiltrate. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1e1b4b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="My Youth Camp">
<link rel="manifest" href="/manifest.json">
<!-- iOS "Add to Home Screen" needs a raster PNG here; it can't rasterize the SVG for the
     installed tile and falls back to a screenshot (white/black). See CLAUDE.md icon section. -->
<link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>My Youth Camp</title>
<style>
:root{
/* palette */
--navy:#1e1b4b;--blue:#4f46e5;--blue2:#818cf8;--purple:#9333ea;--violet:#7c3aed;--teal:#06b6d4;--rose:#e11d48;--paper:#f5f4ff;--card:#fff;--ink:#1e1a3a;--muted:#6b7280;--line:#e4e2f5;--chip:#ede9fe;
/* indigo tints (C3) — previously scattered as raw hex; tokenised so the palette is one source of truth */
--violet-d:#5b21b6;--violet-dd:#3730a3;--tint:#f5f3ff;--tint-2:#ede9fe;--lav:#ddd6fe;--lav-2:#c4b5fd;
/* gender accents (C3 + AC-4) — bubble/bar colours: male blue, female pink */
--male:#1d4ed8;--male-bg:#dbeafe;--female:#db2777;--female-bg:#fce7f3;
/* spacing scale (C5) — L-1 (Phase 5): dropped the genuinely-unused steps (--s1/--s5/--s6/--s7,
   --r-lg); the remaining tokens are referenced in live styles. */
--s2:8px;--s3:12px;--s4:16px;--r-sm:10px;--r:14px;
--shadow-sm:0 4px 12px rgba(30,27,75,.07);
/* L-1: --ok was an unused duplicate of --green (itself removed); --warn/--danger/--info are used. */
--warn:#b45309;--danger:#b91c1c;--info:#4f46e5;
/* Phase 4 (first-aid UX): darker secondary ink for legibility (replaces --muted for body-level
   secondary text on the first-aid screens) + SOFTENED alert/consent surfaces (calm, not alarming). */
--ink-2:#4b4868;
--alert-bg:#fff8ed;--alert-bd:#fcd9a6;--alert-ink:#9a5b15;
--consent-ok-bg:#f1faf3;--consent-ok-bd:#bfe6c8;--consent-ok-ink:#1f7a43;
--consent-no-bg:#fdf3f3;--consent-no-bd:#f0c9c9;--consent-no-ink:#9b3232;
/* ── Fluid type scale (A1) ──────────────────────────────────────────────
   All sizes are rem against the ROOT (html) element, which scales 16→17→18px
   at 768/1280 (see the html/@media rules below). So every tokenised size grows
   proportionally phone→tablet→laptop — this is the headline responsive lever.
   Values preserve the current phone sizes; the file's ~33 accreted literals are
   mapped to the nearest step (≤~1px deltas — flagged for on-device review).
   --pad is the fluid screen gutter; it steps up at 540/768 (see .screen). */
--t-display:2.8rem;  /* hero marquee number (cluster: 2.8) */
--t-xl:2.2rem;       /* large stat / budget grand total (cluster: 2.2) */
--t-h1:1.4rem;       /* hero h2 / detail header (cluster: 1.3–1.4) */
--t-h2:1.2rem;       /* prominent headers (cluster: 1.2–1.25) */
--t-h3:1.05rem;      /* card / modal h3 (cluster: 1.05–1.1) */
--t-lg:1rem;         /* prominent body, search input, bar title (cluster: 1.0) */
--t-body:.9rem;      /* default body (cluster: .9–.94) */
--t-sm:.84rem;       /* secondary text (cluster: .8–.88) */
--t-xs:.74rem;       /* captions / hints / labels (cluster: .72–.78) */
--t-2xs:.68rem;      /* small labels (cluster: .64–.7) — M-2: nudged up toward the 11px floor */
--t-micro:.7rem;     /* uppercase tracking badges — M-2: raised .58→.7rem (≈9.3→11.2px @16px root)
                        so the smallest text clears the ~11px legibility floor (was below it) */
--pad:14px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100dvh;}
/* A1: explicit root size (= the previous implicit 16px), scaled up at tablet/laptop so
   every rem-based size grows proportionally. This is the core fluid-type mechanism. */
html{font-size:16px;}
/* 2026-07-26 — the light-purple strip under the bottom nav (and under the login card) on iOS.
   The CANVAS background is what paints the area below the body box — the region iOS exposes for a
   moment when the dynamic toolbar retracts or the keyboard dismisses, before the visual viewport
   settles (it vanishes on the next scroll, which is exactly the reported symptom). With no
   background on `html`, the canvas inherits BODY's `--paper`, so that transient strip read as a
   light-purple bar below the near-white nav / white login gate. Painting `html` white stops the
   propagation: body keeps `--paper` for the app column, and the strip now matches the nav above it.
   Side effect (accepted): the letterbox either side of the capped `.app` column between ~540 and
   980px is now white rather than tinted. At ≥980px `#app` is `max-width:none`, so there is no
   letterbox there at all and nothing changes. */
html{background:#fff;}
/* body background is LIGHT (matches YS Connection) so the home-indicator strip and desktop letterbox
   blend with the near-white nav instead of reading as a black bar.
   NO `overflow:hidden` / fixed `height:100dvh` on body+app (matches YS Connection): iOS mis-positions
   `position:fixed` descendants of an `overflow:hidden` ancestor, which pinned the bottom nav to the
   app's short 100dvh edge instead of the true viewport bottom (the nav "floated" with a gap below,
   in Safari AND standalone — verified 2026-07-24). A natural `min-height` shell lets the fixed nav
   anchor to the real viewport bottom. Screens still scroll internally (see `.stage`/`.screen`). */
body{font:var(--t-body)/1.55 "Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#fff;display:flex;justify-content:center;min-height:100dvh;overscroll-behavior:none;}
/* min-height (NOT fixed height) + NO overflow:hidden — see the body note above: an overflow:hidden
   ancestor breaks `position:fixed` on iOS, floating the bottom nav. The internal scroll lives on the
   screens (`.stage`/`.screen`), not here, so dropping the clip doesn't let the shell scroll. The
   ≥980px grid re-sets its own height:100dvh on #app. */
.app{width:100%;max-width:460px;min-height:100dvh;background:var(--paper);display:flex;flex-direction:column;position:relative;box-shadow:0 0 40px rgba(30,27,75,.14);}
/* Header bar is WHITE at every width (owner: match the desktop/web header on phone too).
   Previously this was a violet→navy gradient on phone and only turned white at ≥980px; now
   the base bar is white with dark text and a hairline bottom border, and the badges/sign-out
   are restyled to read on white. The ≥980px block keeps only the wide-specific tweaks
   (subtitle hidden, no wrap). The purple camp identity still lives in the hero cards. */
/* Sticky header (matches YS Connection's `.hdr`): as the BODY scrolls (phone body-scroll model,
   see the body/.app/.stage/.screen notes), the bar pins to the viewport top. The ≥980px grid
   block resets it to position:relative because the desktop shell scrolls internally, not the body. */
.bar{background:#fff;color:var(--ink);border-bottom:1px solid var(--line);padding:max(14px,env(safe-area-inset-top)) 14px 6px;display:flex;align-items:center;flex-wrap:wrap;column-gap:7px;row-gap:2px;flex:none;z-index:30;position:sticky;top:0;}
.bar .bk{width:34px;height:34px;border-radius:50%;display:none;place-items:center;background:var(--chip);color:var(--violet-d);font-size:var(--t-h3);flex:none;cursor:pointer;align-self:center;}
.bar.canback .bk{display:grid;}
/* Title + subtitle share one line ("My Church Hub — All churches"); the subtitle
   truncates first, the title stays whole. */
.bar .ttl{flex:1 0 calc(100% - 41px);min-width:0;display:flex;align-items:baseline;gap:6px;overflow:hidden;}
.bar .ttl .t{font-weight:700;font-size:var(--t-lg);white-space:nowrap;flex:none;color:var(--navy);}
.bar .ttl .s{font-size:var(--t-xs);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;}
.bar .ttl .s:not(:empty)::before{content:"— ";opacity:.7;}
/* Badges/sign-out: smaller and dropped to the bottom of the bar so they don't
   crowd the title's vertical space. */
.bar-actions{display:flex;align-items:center;gap:6px;flex:none;margin-left:auto;}
.mode-badge{font-size:var(--t-micro);font-weight:800;padding:2px 8px;border-radius:999px;white-space:nowrap;flex:none;letter-spacing:.03em;border:1px solid rgba(0,0,0,.12);}
.role-badge{font-size:var(--t-micro);font-weight:800;background:var(--chip);color:var(--violet-d);border:1px solid var(--lav);border-radius:999px;padding:2px 8px;white-space:nowrap;flex:none;letter-spacing:.03em;}
.sign-out{padding:3px 10px;border-radius:999px;background:#fff;color:var(--ink);font-size:var(--t-2xs);font-weight:700;flex:none;cursor:pointer;white-space:nowrap;border:1px solid var(--line);}
/* PHONE: the stage is a plain flex child — no clip, no positioning. The active screen flows in
   the normal document and the BODY scrolls (YS Connection body-scroll model). This is what makes
   the fixed bottom nav anchor to the true viewport bottom on iOS: with no overflow:hidden /
   fixed-height ancestor, `position:fixed` is measured against the real viewport, not the app's
   short 100dvh edge (the "floating nav" bug, 2026-07-24). The ≥980px grid block re-establishes
   internal-scroll (#stage overflow:hidden + .screen position:absolute) for the desktop layout. */
.stage{flex:1;}
/* PHONE: screens are normal in-flow blocks. overflow-x:hidden still guards against a child
   slightly overrunning the width (the sideways-pan bug); wide tables keep their OWN
   overflow-x:auto wrappers. Bottom padding clears the fixed nav. */
.screen{overflow-x:hidden;padding:var(--pad) var(--pad) calc(64px + env(safe-area-inset-bottom));display:none;}
.screen.active{display:block;animation:rise .25s ease;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
/* Bottom nav, styled like YS Connection's `.bot-nav`: a near-white bar that reserves the full
   home-indicator safe area below the icons (`max(6px, env(safe-area-inset-bottom))`) with a soft
   top shadow. The black-bar report (2026-07-24) is fixed primarily by the LIGHT body background
   above (the strip that shows below the fixed-height .app now blends instead of reading black);
   this full-inset reservation keeps the icons off the very edge. (Supersedes the Bug-3 2026-07-17
   fractional-inset tweak, which had under-reserved the safe area.) */
/* ⚠️ DO NOT translate this nav downwards to "reach" the bottom of the screen. That was tried on
   2026-07-31 (`transform:translateY(var(--vp-short))`) and REVERTED the same day: on the short
   launch viewport the nav moved DOWN past the edge of the WEB VIEW and got clipped — the owner
   reported "half of the nav bar was hidden until I scrolled down", which is strictly worse than
   the tall white bar it was trying to fix. Measured proof: the last painted row of the screenshot
   sat at 815pt with `innerHeight` 816, i.e. the page cannot paint past `innerHeight`. The strip
   between the short viewport and the physical screen bottom belongs to iOS, not to the document.
   See `_vpShortfall()` for the full measurements. */
.tabs{display:flex;background:#fff;border-top:1px solid var(--line);padding:4px 6px max(6px,env(safe-area-inset-bottom));gap:2px;box-shadow:0 -2px 10px rgba(30,27,75,.05);position:fixed;left:0;right:0;bottom:0;z-index:100;}
/* ~~`.tabs::after`~~ REMOVED 2026-07-31 — it was dead paint. It extended the nav's white surface
   120px BELOW itself, added for Bug 15 (2026-07-28) to hide a light-purple strip under the nav.
   Removing it changed nothing on screen, and the reason is worth recording, because it also
   explains Bug 15 properly for the first time:

   The nav's bottom edge already sits at `innerHeight`, and the document CANNOT PAINT PAST
   `innerHeight` (measured 2026-07-31: with `innerHeight` 816, the last painted row of a full-screen
   screenshot was 815pt). So `::after` was drawing into a clipped region and was never visible.

   The strip below it belongs to iOS. Note it is NOT filled with the manifest `background_color`
   (`#0b1220`, near-black) — it is white, because iOS extends the DOCUMENT's own backdrop colour
   into it. That is why the 2026-07-26 `html{background:#fff}` change worked and why the strip used
   to read light-purple when `html`/`body` carried `--paper`. The backgrounds are the real fix for
   the COLOUR of that strip; this pseudo-element never was.
   DO NOT re-add it. If a coloured strip appears under the nav, fix `html`/`body`. */
.tab{flex:1;text-align:center;padding:7px 4px 6px;font-size:var(--t-xs);color:var(--muted);cursor:pointer;border:none;background:none;position:relative;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:12px;transition:background .15s,color .15s;}
.tab .ic{display:block;transition:transform .15s;}
.tab.on{color:var(--blue);font-weight:700;background:var(--chip);}
.tab.on .ic{transform:scale(1.08);}
.tab .tb{position:absolute;top:4px;right:50%;transform:translateX(16px);background:var(--rose);color:#fff;font-size:var(--t-micro);font-weight:800;border-radius:999px;min-width:16px;height:16px;padding:0 4px;display:none;place-items:center;}
.hero{background:radial-gradient(130% 130% at 0% 0%,#9333ea,#1e1b4b 72%);color:#fff;border-radius:22px;padding:18px;margin-bottom:14px;position:relative;overflow:hidden;}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;background:rgba(255,255,255,.06);border-radius:50%;}
.hero:before{content:"";position:absolute;left:-20px;bottom:-30px;width:100px;height:100px;background:rgba(124,58,237,.3);border-radius:50%;}
.hero .k{font-size:var(--t-2xs);letter-spacing:.16em;text-transform:uppercase;color:#d8b4fe;font-weight:700;}
.hero h2{font-size:var(--t-h1);margin:5px 0 2px;font-weight:800;}
/* Bug 14 (2026-07-28): a church login's greeting is now the FULL ministry name (backend
   `greetingName` no longer truncates to the first word), so a long one has to fit. `.long` is
   applied by the render when the name is long: half the type size, and normal wrapping so it
   runs onto a second line rather than off the card edge. `overflow-wrap` catches a single
   unbroken word. The watermark occupies the right ~35% of the hero, hence the width cap. */
.hero h2.long{font-size:calc(var(--t-h1) / 2);line-height:1.3;max-width:66%;}
.hero h2{overflow-wrap:anywhere;}
.hero .cd{display:flex;gap:12px;align-items:flex-end;margin-top:12px;}
.hero .big{font-size:var(--t-display);font-weight:800;line-height:.9;}.hero .cd .meta{font-size:var(--t-sm);color:#e9d5ff;padding-bottom:4px;}
.nownext{background:linear-gradient(135deg,var(--violet-d),#1e1b4b);color:#fff;border-radius:16px;padding:14px 16px;margin-bottom:12px;}
.nownext .now{font-weight:800;}.nownext .nx{font-size:var(--t-sm);color:var(--lav);margin-top:2px;}
/* Incident alert banner (2026-07-26) — replaces the full-screen "Incident logged" modal that fired
   on every app open. Compact, non-blocking; one row per unacknowledged urgent notice, cleared per
   device by the "Got it" button (`_ackAlert`). Deliberately red/left-accented rather than the calm
   `.notice` tint — it still has to read as an alarm.
   2026-07-27: placement moved from above the hero to immediately ABOVE the "Notices" heading near
   the bottom of Home (owner request), on BOTH the pre-camp and at-camp home variants. This is the
   change that the 2026-07-26 "move incidents below Testimonies & Notes" request actually meant —
   the Incidents menu TILE was moved by mistake and has since been restored to the grid. */
.inc-banner{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
.inc-row{display:flex;align-items:center;gap:10px;background:#fff1f2;border:1px solid #fecdd3;border-left:4px solid var(--danger);border-radius:14px;padding:10px 12px;}
.inc-ico{flex:none;color:var(--danger);display:grid;place-items:center;}
.inc-txt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.35;cursor:pointer;}
.inc-txt b{font-size:var(--t-sm);color:var(--danger);font-weight:800;}
.inc-txt span{font-size:var(--t-xs);color:#7f1d1d;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.inc-ack{flex:none;border:none;background:var(--danger);color:#fff;font-family:inherit;font-weight:700;font-size:var(--t-xs);border-radius:999px;padding:7px 13px;cursor:pointer;}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--tint);border:1px solid var(--lav);border-radius:14px;padding:12px 14px;margin-bottom:12px;cursor:pointer;transition:background .12s;}
.notice:active{background:var(--chip);}
.notice.urg{background:#fef2f2;border-color:#fecaca;}
.notice .nico{font-size:var(--t-lg);line-height:1.35;flex:none;}
.notice .nt{font-weight:700;font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.notice .ns{font-size:var(--t-xs);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.notice .ndis{flex:none;margin-left:6px;border:none;background:transparent;color:var(--muted);font-size:var(--t-h2);line-height:1;cursor:pointer;padding:0 2px;}
.notice .ndis:active{color:#111;}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;box-shadow:0 2px 8px rgba(30,27,75,.06);}
.card.tap{cursor:pointer;transition:transform .12s,box-shadow .12s;}.card.tap:active{transform:scale(.985);box-shadow:none;}
.rowsb{display:flex;justify-content:space-between;align-items:center;gap:10px;}
.lbl{font-size:var(--t-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:2px 0 9px;}
.h3{font-size:var(--t-xs);font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:16px 2px 9px;}
h3.sec{font-size:var(--t-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 2px 9px;}
.bar7{height:9px;border-radius:999px;background:var(--chip);overflow:hidden;margin:9px 0 8px;}.bar7>i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--violet),var(--blue2));}.bar7.amber>i{background:linear-gradient(90deg,#f59e0b,#fbbf24);}
.pill{font-size:var(--t-2xs);font-weight:700;padding:3px 9px;border-radius:999px;display:inline-block;letter-spacing:.02em;white-space:nowrap;flex-shrink:0;}
.pill.ok{background:#dcfce7;color:#15803d;}.pill.warn{background:#fee2e2;color:#b91c1c;}.pill.amb{background:#fef3c7;color:#92400e;}.pill.info{background:var(--chip);color:var(--violet-d);}
.pills{display:flex;gap:7px;flex-wrap:wrap;}
/* A4: fluid tile grid — auto-fill gives a continuous 2→3→4 column progression as the
   container widens (min tile 132px), instead of a single 2→3 jump at 980px. */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:11px;margin-bottom:4px;grid-auto-rows:1fr;}
.tile{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 10px;min-height:92px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;transition:transform .12s,box-shadow .12s;box-shadow:0 2px 8px rgba(30,27,75,.06);position:relative;}
.tile:active{transform:scale(.95);box-shadow:none;}.tile .ic{font-size:1.65rem;display:block;color:var(--purple);}.tile .l{font-size:var(--t-xs);font-weight:700;margin-top:7px;color:#1e1a3a;}
.tile .sub{max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
/* Item 8: greyed (time-locked) controls — visibly disabled but still tappable to explain why. */
.tile.tdis{opacity:.45;box-shadow:none;cursor:default;}
.tile.tdis:active{transform:none;}
.wide-signin{margin:2px 0 12px;box-shadow:0 6px 16px rgba(124,58,237,.28);}
.btn.bdis{background:#e5e7eb;color:#9ca3af;box-shadow:none;cursor:default;}
/* Item 4: grouped, collapsible settings sections. */
.setg{margin-bottom:10px;border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden;box-shadow:0 2px 8px rgba(30,27,75,.05);}
.setg>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:700;display:flex;align-items:center;gap:9px;color:#1e1a3a;}
.setg>summary::-webkit-details-marker{display:none;}
.setg>summary::after{content:'⌄';margin-left:auto;opacity:.5;font-weight:700;}
.setg[open]>summary::after{content:'⌃';}
.setg[open]>summary{border-bottom:1px solid var(--line);}
.setg .card{border:none;box-shadow:none;border-radius:0;margin:0;}
.setg .pill.ok{background:#dcfce7;color:#166534;}
.setg summary .pill{margin-left:0;}
/* 2026-07-26 — short-value fields in Camp settings were inheriting `.fld`'s full-width rule, so a
   "6:00 am" time sat in a box the width of the phone (reported: "camp settings boxes are too
   wide"). Cap ONLY the fixed-width value types (time / date / number) and left-align their value;
   free-text fields like Camp name keep the full column. */
.setg input[type="time"],.setg input[type="date"],.setg input[type="number"]{max-width:190px;text-align:left;}
/* SVG icon system (3.1) + size helpers (C1/C4) */
.ic-svg{width:20px;height:20px;display:inline-block;vertical-align:middle;flex:none;stroke:currentColor;}
.ic-svg.ic-sm{width:16px;height:16px;}
.ic-svg.ic-lg{width:32px;height:32px;}
.ic-svg.ic-xl{width:48px;height:48px;}
.ic-svg.cwhite{stroke:#fff;color:#fff;width:16px;height:16px;}
/* Empty-state component (C4): consistent icon + message across lists */
.emptyst{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:40px 16px;color:var(--muted);text-align:center;}
.emptyst .ic-svg{color:var(--lav-2);}
.emptyst-msg{font-size:var(--t-sm);font-weight:600;max-width:30ch;}
/* Budget collapsible church rows (H/§5, L3 expander) */
.budchurch-body{max-height:0;overflow:hidden;transition:max-height .26s ease;}
.budchurch.open .budchurch-body{max-height:1200px;}
.budchurch .budchev{display:inline-block;transition:transform .2s;color:var(--lav-2);}
.budchurch.open .budchev{transform:rotate(90deg);}
.budcat-l{font-size:var(--t-sm);font-weight:600;}
.budcat-warn .budcat-l{color:var(--warn);}
.budcat-warn .ic-svg{color:var(--warn);}
/* Budget card row rebuild (2026-08-01) — fixed 3-track grid so a row never wraps mid-badge:
   label (flexes, ellipsis) | qty (never shrinks) | amount (right-aligned, never shrinks). A
   code chip or a mixed-value breakdown gets its OWN sub-line (grid-column:1/-1) under the
   label, never inline with it — that's what used to break onto three lines. */
/* Merged category rows (2026-08-02): chevron | label (flexes, ellipsis) | qty | amount, and a
   detail panel spanning the label..amount tracks. Campers and leaders are ONE row now — the
   split lives in the panel — so the card is a short scannable list instead of two parallel
   lists of the same category names. A separator between rows, because the panel opening in the
   middle of the list needs a visible boundary or it reads as part of the next row. */
.budrow{display:grid;grid-template-columns:14px minmax(0,1fr) auto auto;column-gap:8px;row-gap:2px;align-items:center;padding:7px 0;}
.budrow+.budrow{border-top:1px solid var(--line);}
.budrow-chev{display:flex;align-items:center;justify-content:center;color:var(--lav-2);transition:transform .18s;}
.budrow.open>.budrow-chev{transform:rotate(90deg);}
.budrow.tap{cursor:pointer;}
.budrow-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:var(--t-sm);font-weight:600;}
.budrow-qty{white-space:nowrap;flex:none;font-size:var(--t-xs);color:var(--ink-2);text-align:right;}
.budrow-amt{white-space:nowrap;flex:none;min-width:56px;text-align:right;}
.budrow-warn .budrow-label{color:var(--warn);}
.budrow-warn .ic-svg{color:var(--warn);}
/* The detail panel. Aligned as its own 3-track grid so the numbers line up under the row's own
   qty/amount columns instead of drifting — that alignment is most of what makes it readable. */
.budrow-det{grid-column:2/-1;display:none;padding:4px 0 2px;}
.budrow.open>.budrow-det{display:block;}
.buddet{display:grid;grid-template-columns:minmax(0,1fr) auto auto;column-gap:8px;align-items:baseline;padding:2px 0;font-size:var(--t-2xs);}
.buddet-k{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);}
.buddet-n{white-space:nowrap;color:var(--muted);text-align:right;}
.buddet-v{white-space:nowrap;text-align:right;min-width:56px;color:var(--ink-2);}
.buddet-hd{font-size:var(--t-2xs);font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:6px 0 1px;}
.buddet-note{font-size:var(--t-2xs);color:var(--muted);margin-top:3px;}
/* Compact inline code-usage chips (items 4/5) — "which codes did this ministry use" at a
   glance, no per-code full-width row and no ratio (the per-church/camp-wide denominators
   were being conflated — see the camp-wide discount row for the secondary ratio text). */
.budchip-row{display:flex;flex-wrap:wrap;gap:6px;}
.budchip{font-size:var(--t-2xs);font-weight:700;background:var(--chip);color:var(--violet-d);border-radius:999px;padding:3px 9px;white-space:nowrap;}
.budchip b{font-weight:800;}
/* A7/PC-12: classroom-allocation room cards as wrapping narrow tiles */
.accom-rooms{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;align-items:start;}
.accom-rooms>.card{margin-bottom:0;}
/* ── Accessibility & micro-interactions (E1/E4/L1) ── */
/* E1: visible focus ring on every interactive element (keyboard only via :focus-visible). */
button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,
.tile:focus-visible,.row:focus-visible,.tab:focus-visible,.wide-nav-item:focus-visible,.iconbtn:focus-visible,.card.tap:focus-visible{
  outline:2px solid var(--blue);outline-offset:2px;border-radius:8px;}
/* E2 / M-1 (Phase 5): the iconbtn rule lives in ONE place now (below, with the visual chrome).
   The 32×32 visual box keeps a ≥44px HIT AREA via a transparent ::before, instead of the old
   contradictory pair (min-44 here vs width-32 below, which rendered a 44px box and ignored the
   intended compact look). */
/* L1: tactile press feedback on tappable surfaces (reduced-motion aware below). */
.tile:active,.row:active,.wide-nav-item:active,.budchurch-hd:active{transform:scale(.985);}
/* E4: honour prefers-reduced-motion — disable transitions/animations/transforms. */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important;}
  .screen.active{animation:none;}
  .tile:active,.row:active,.card.tap:active,.btn:active,.budchurch .budchev{transform:none;}
}
.tile .ic-svg{width:26px;height:26px;}
.tab .ic-svg{width:21px;height:21px;}
.notice .nico .ic-svg{width:18px;height:18px;}
.search .ic-svg{width:18px;height:18px;color:var(--blue);}
.btn .ic-svg{width:15px;height:15px;margin-right:3px;}
/* Account rows (admin → Accounts): one line per login with icon actions */
.acct-row{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--line);}
.acct-row:first-child{border-top:none;}
.acct-actions{display:flex;gap:5px;flex:none;}
/* M-1: single source for .iconbtn — 32×32 visual chrome, ≥44px tappable via the ::before slop. */
.iconbtn{background:#f1f0ff;border:1px solid var(--line);border-radius:9px;width:32px;height:32px;display:grid;place-items:center;cursor:pointer;color:var(--blue);padding:0;position:relative;}
.iconbtn::before{content:"";position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44px;height:44px;}
.iconbtn .ic-svg{width:17px;height:17px;}
.iconbtn:active{background:#e0ddff;}

.acct-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:var(--t-xs);color:var(--muted);background:var(--tint);border-radius:10px;padding:9px 11px;margin-bottom:10px;}
.acct-legend span{display:inline-flex;align-items:center;gap:5px;}

.fa-neutral{border:1.5px solid var(--lav);background:var(--card);border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);box-shadow:var(--shadow-sm);}

.fa-consent.no{background:var(--consent-no-bg);border:1px solid var(--consent-no-bd);color:var(--consent-no-ink);}

.fa-lead{border:1.5px solid var(--lav);background:var(--card);border-radius:var(--r);padding:var(--s4);margin-bottom:var(--s3);box-shadow:var(--shadow-sm);}
.fa-lead .lh{display:flex;align-items:center;gap:7px;font-size:var(--t-xs);font-weight:800;text-transform:uppercase;letter-spacing:.06em;color:var(--violet-dd);margin-bottom:var(--s2);}
.fa-lead .who{display:flex;align-items:center;gap:6px;margin-bottom:2px;}
.fa-lead .who .nm{font-weight:800;font-size:var(--t-body);}
.fa-lead .who .ptag{font-size:var(--t-2xs);font-weight:800;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:999px;background:var(--tint-2);color:var(--violet-dd);}
.fa-lead .who .ptag.sec{background:var(--paper);color:var(--ink-2);border:1px solid var(--line);}

/* leader + parent call buttons: clear background, black text, bordered (icon is the affordance) */
.btn.fa-call{background:none;color:var(--ink);border:1.5px solid var(--lav);width:100%;}

.fa-recent .r .tm{color:var(--ink-2);flex:none;min-width:62px;}

.fa-rec .top .nm{font-weight:800;font-size:var(--t-sm);}
.fa-rec .top .tm{margin-left:auto;font-size:var(--t-xs);color:var(--ink-2);}
.fa-rec .ln{font-size:var(--t-sm);margin-top:2px;}

.fa-form2{display:flex;flex-direction:column;gap:0;}
.fa-form2 > div{flex:1;}
@media(min-width:540px){.fa-form2{flex-direction:row;gap:10px;}}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:64px 0;color:var(--muted);gap:12px;}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
/* Schedule-edit rows: let native time/text inputs shrink to their grid track (min-width:auto
   on inputs was overflowing the Time field into the Activity field on narrow phones). */
.sched-row input{min-width:0;overflow:hidden;}
/* NOTE: the `.sr-t` overrides live BELOW `.sched-row .fld`, not here. The time input carries BOTH
   classes and the two selectors have equal specificity (0,2,0), so whichever is declared LAST wins.
   A `.sr-t` rule placed above `.fld` is silently dead — which is exactly what happened to the
   original version of this fix, and why the time boxes stayed oversized across three attempts. */
/* 2026-07-26 — the editor's default 7 empty rows per day made the screen a wall of oversized
   boxes (the inputs inherited the full-size `.fld` padding/type, which is sized for one-per-line
   form fields, not a dense repeating grid). Compact them: shorter rows, smaller type, tighter
   radius. Purely the schedule editor — `.fld` elsewhere is untouched. */
.sched-row .fld{padding:8px 10px;font-size:var(--t-sm);border-radius:10px;}
.sched-row .iconbtn{padding:6px;}
/* 2026-07-26 (2nd pass) — the time boxes were STILL reported as too big after the 86px/8px
   tightening. The remaining bulk is the native iOS time control's own chrome, so shrink the
   field itself rather than only its track: smaller type + minimal padding (above) and a
   narrower column (set on the grid in `_schedRow`). Keep `.fld`'s height so the row's
   baseline still lines up with the Activity input. */
/* Time field — MUST stay after `.sched-row .fld` above (equal specificity, last one wins).
   `appearance:none` strips the native control's own chrome, which is the real source of the
   bulk on iOS: without it the UA gives `input[type=time]` a large intrinsic width that no
   amount of padding/track narrowing can overcome, and the value just gets clipped by the
   `overflow:hidden` on `.sched-row input` instead of actually fitting. */
.sched-row .sr-t{
  -webkit-appearance:none;appearance:none;
  padding:8px 2px;font-size:var(--t-xs);letter-spacing:-.2px;
  text-align:center;width:100%;
}
.sched-row .sr-t::-webkit-date-and-time-value{text-align:center;margin:0;}
/* ⚠ ANDROID (2026-08-03, Android review). Everything above was tuned across three device
   cycles against iOS Safari's native time control, where tapping ANYWHERE in the field opens
   the wheel picker — so hiding the picker indicator costs nothing there. On Android Chrome
   that indicator IS the element that opens the picker, so `display:none` can leave the field
   with no way to open it: typable, but the picker unreachable. Hide it only where it is
   decorative. `-webkit-min-device-pixel-ratio:0` + `not all and (min-resolution:.001dpcm)` is
   the long-standing Safari-only media query hack; Chrome (incl. Android) fails it and keeps
   the indicator. If the indicator ever crowds the 64px column on Android, widen the column —
   do NOT re-hide it globally. */
@media not all and (min-resolution:.001dpcm){
  @supports (-webkit-appearance:none){
    .sched-row .sr-t::-webkit-calendar-picker-indicator{display:none;}
  }
}
/* ── Schedule plan view (bug 2, 2026-07-28) ────────────────────────────────
   Colour-coded, proportionally-sized timeline. Each category sets --sch (accent) and
   --sch-bg (surface) once; the shared `.sch-item` rule consumes both, so adding a
   category = one CSS line + one SCHED_CATEGORIES entry. Row HEIGHT is inline
   (`min-height`, from `_schedHeight`) because it is data-derived, not a style choice. */
.sch-list{display:flex;flex-direction:column;gap:5px;}
.sch-item{display:grid;grid-template-columns:92px minmax(0,1fr);gap:10px;align-items:center;
  background:var(--sch-bg);border:1px solid var(--line);border-left:5px solid var(--sch);
  border-radius:var(--r);padding:7px 11px;box-shadow:var(--shadow-sm);}
/* 2026-07-29: the duration moved ONTO the time line ("9:00 · 30m") instead of sitting on a
   second line under it, and the column widened 62px -> 92px to fit. That, plus the recut
   _schedHeight curve, is what makes the rows ~30% shorter. If you narrow this column again,
   the duration wraps and the height saving is lost. */
.sch-time{font-weight:800;color:var(--sch);font-size:var(--t-sm);line-height:1.25;white-space:nowrap;}
.sch-dur{font-weight:600;font-size:var(--t-2xs);color:var(--muted);letter-spacing:.01em;}
.sch-title{font-weight:700;font-size:var(--t-lg);color:var(--ink);line-height:1.3;}
.sch-legend{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;}
.sch-key{font-size:var(--t-2xs);font-weight:700;padding:3px 9px;border-radius:999px;
  background:var(--sch-bg);color:var(--sch);border:1px solid var(--sch);}
.sch-session{--sch:var(--violet);--sch-bg:var(--tint);}
.sch-zone{--sch:var(--rose);--sch-bg:#fff1f3;}
.sch-preshow{--sch:#0e7490;--sch-bg:#ecfeff;}
.sch-meal{--sch:var(--warn);--sch-bg:#fffaf0;}
.sch-other{--sch:#94a3b8;--sch-bg:var(--card);}
/* ── Paired church accounts (bug 13, 2026-07-28) ───────────────────────────
   One card per church holding both gender logins, so it reads (and edits) as a unit.
   Very light blue / very light pink halves use the existing gender tokens. */
.ch-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-top:4px;}
.ch-pair{border:1px solid var(--line);border-radius:var(--r);background:var(--card);overflow:hidden;box-shadow:var(--shadow-sm);}
.ch-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 12px;}
.ch-name{font-weight:700;font-size:var(--t-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ch-sub{font-size:var(--t-micro);color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ch-halves{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);}
.ch-half{padding:9px 10px 10px;min-width:0;}
.ch-half+.ch-half{border-left:1px solid var(--line);}
.ch-m{background:var(--male-bg);}
.ch-f{background:var(--female-bg);}
.ch-m .ch-g{color:var(--male);}
.ch-f .ch-g{color:var(--female);}
.ch-g{font-size:var(--t-micro);font-weight:800;text-transform:uppercase;letter-spacing:.05em;}
.ch-u{font-size:var(--t-2xs);color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px;}
.ch-half .iconbtn{background:rgba(255,255,255,.72);}
/* First-aid "Signed in only" filter (bug 20, 2026-07-28) */
.fa-signedin{display:flex;align-items:center;gap:8px;margin:10px 0 4px;font-size:var(--t-sm);font-weight:600;color:var(--ink-2);}
.fa-signedin input{width:18px;height:18px;accent-color:var(--blue);flex:0 0 auto;margin:0;}
/* ── Site map (item 8, 2026-07-28) ─────────────────────────────────────────
   Fit-to-width by default; tapping toggles a 250%-wide zoom that scrolls in both directions,
   the same pattern the Elvanto import guide uses for its wide screenshots. */
.map-wrap{overflow:auto;-webkit-overflow-scrolling:touch;border-radius:var(--r);border:1px solid var(--line);background:var(--card);}
.map-img{display:block;width:100%;height:auto;cursor:zoom-in;}
.map-img.zoom{width:250%;max-width:none;cursor:zoom-out;}
/* The Map button sits in the hero's top-right corner, above the watermark. */
.hero-map{position:absolute;top:14px;right:14px;z-index:2;display:inline-flex;align-items:center;gap:5px;
  background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.34);color:#fff;
  font:600 var(--t-xs)/1 inherit;font-family:inherit;padding:7px 11px;border-radius:999px;cursor:pointer;}
.hero-map:hover{background:rgba(255,255,255,.26);}
.hero-map svg{width:14px;height:14px;}
/* First-day arrival confirm bar. Was `position:sticky;bottom:10px`, which pins to the bottom of
   the CONTENT, not the viewport — on the phone body-scroll shell (see the overlay GOTCHA above)
   that left it stranded at the end of a long roster instead of floating over it. Fixed to the
   viewport, above the nav (`.tabs` is z-index 100) and below `.modal` (120). */
.fd-confirm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:105;width:min(420px,calc(100% - 32px));margin:0;}
.fd-confirm .btn{box-shadow:0 6px 20px rgba(22,163,74,.45);}
@media(min-width:980px){.fd-confirm{bottom:24px;}}
/* Item 9 (2026-07-31): the admin Settings save button floats above the bottom nav instead of
   sitting at the end of the page. Camp settings is three long collapsible sections; the admin
   was scrolling back to the bottom after every edit and — because a collapsed section still
   holds its inputs — it was easy to change something and navigate away without saving.
   Anchoring copies .fd-confirm exactly: position:fixed above the nav's full safe-area
   reservation. ⚠️ It MUST be fixed, never absolute — the phone `.app` grows with content and is
   not viewport height (the standing overlay rule in CLAUDE.md). z-index 105 sits above the nav
   (100) and below modals (120), so a confirm sheet still covers it. */
.setg-save{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(72px + env(safe-area-inset-bottom));z-index:105;width:min(420px,calc(100% - 32px));margin:0;}
.setg-save .btn{margin-top:0;box-shadow:0 6px 20px rgba(79,70,229,.45);}
/* Spacer so the last section can scroll clear of the floating pill. */
.setg-savepad{height:96px;}
/* Item 13: multi-select record chips on Testimonies & Notes. Sized as real tap targets
   (min-height 34px) because this is used one-handed on a phone at camp. */
/* Multi-select that LOOKS like the plain <select>s beside it (2026-08-03).
   Replaces the wrapping row of pill chips on Testimonies & Notes. The chips were correct in
   behaviour but sized themselves to their labels, so on a phone they broke into a ragged
   two-line block that lined up with nothing — and with a fourth filter (Day) added, the
   screen needed four controls that tile as an even 2x2.
   ⚠ NOT a native <select multiple>: that needs ctrl/cmd-click on desktop and renders as a
   cramped scrolling box on iOS. This is a button + panel that borrows the .fld/select box
   styling so the four controls read as one row of dropdowns. */
.msel{position:relative;}
.msel-btn{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:var(--t-body);font-family:inherit;background:#fff;color:var(--ink);text-align:left;cursor:pointer;display:flex;align-items:center;gap:6px;}
.msel-btn:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,70,229,.1);outline:none;}
.msel-btn .msel-v{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.msel-btn .msel-c{flex:0 0 auto;opacity:.55;font-size:var(--t-xs);}
/* z-index sits above cards but well under the nav (100) — see the overlay ladder note. */
.msel-pop{display:none;position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:60;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 8px 24px rgba(15,23,42,.14);padding:4px;max-height:260px;overflow-y:auto;}
.msel.open .msel-pop{display:block;}
.msel-opt{display:flex;align-items:center;gap:9px;width:100%;background:none;border:none;font:inherit;font-size:var(--t-sm);color:var(--ink);text-align:left;padding:9px 10px;border-radius:8px;cursor:pointer;}
.msel-opt:hover{background:var(--chip);}
.msel-box{flex:0 0 auto;width:17px;height:17px;border-radius:5px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;line-height:1;}
.msel-opt.on .msel-box{background:var(--blue);border-color:var(--blue);}
/* Saved-view strip (2026-08-03; recoloured 2026-08-04). ⚠ NEUTRAL ON PURPOSE — violet tint,
   the app's "informational" register, NOT amber and NOT `.warnbox`. It was amber in the first
   version, which meant a leader whose standing job is Yr 7 boys got a warning every single
   launch about a choice that was correct. See the premise note on `_filterBanner`. Sits
   directly above the list on both the check-in and My-students screens. */
.filtban{display:flex;align-items:center;gap:10px;background:var(--tint);border:1px solid var(--line);
  border-left:4px solid var(--violet);border-radius:12px;padding:10px 12px;margin:10px 0;
  font-size:var(--t-sm);color:var(--ink);}
.filtban .sub{font-size:var(--t-2xs);color:var(--muted);}
.filtban .fb-eye{color:var(--violet);vertical-align:-2px;margin-right:2px;}
/* Item 8: four-row internal scroll on the Data Import people lists. The height is derived from
   ALLOC_VISIBLE_ROWS in the JS — keep the two in step if either changes. A card row is ~78px
   with its padding; 4 rows plus a peek of the fifth signals "there is more here". */
.alloc-scroll{max-height:320px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border:1px solid var(--line);border-radius:10px;padding:6px;background:var(--paper);}
@media(min-width:980px){.setg-save{bottom:24px;}}
/* Top loading bar (#nprog): a thin accent bar that animates whenever a real network request
   is in flight (cache hits skip it). Gives instant "it's working" feedback on button/tab taps
   that otherwise sat still during the 1–1.5s serverless round-trip. Anchored to the BOTTOM edge
   of the header bar (.bar, its positioned parent) rather than the very top of the screen. */
#nprog{position:absolute;bottom:-1px;left:0;height:3px;width:0;z-index:60;background:linear-gradient(90deg,var(--violet),var(--blue2));border-radius:0 2px 2px 0;opacity:0;transition:width .18s ease,opacity .3s ease;pointer-events:none;box-shadow:0 0 8px rgba(124,58,237,.55);}
#nprog.on{opacity:1;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
.sync-dot{width:8px;height:8px;border-radius:50%;background:#e2e8f0;flex-shrink:0;}
.sync-dot.pending{background:#fbbf24;animation:pulse 1s infinite;}
.sync-dot.synced{background:#22c55e;}
.sync-dot.error{background:#ef4444;}
/* B-1: check-in sync banner — amber while draining, red (tappable) when an online error
   dropped a tap. Uses status tokens; no new hex. */
.ci-sync{display:flex;align-items:center;gap:8px;border-radius:12px;padding:10px 13px;margin-bottom:10px;font-size:var(--t-sm);font-weight:700;}
.ci-sync-pending{background:#fef3c7;color:var(--warn);border:1px solid #fcd34d;}
.ci-sync-fail{background:#fee2e2;color:var(--danger);border:1px solid #fecaca;cursor:pointer;}
.ci-sync-fail:active{background:#fecaca;}
.loading .lt{font-size:var(--t-xs);font-weight:600;}
.callbox{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:14px;padding:13px;font-size:var(--t-sm);color:#166534;margin-bottom:10px;}
.warnbox{background:#fffbeb;border:1px solid #fcd34d;border-radius:14px;padding:13px;font-size:var(--t-sm);color:#92400e;margin-bottom:10px;}
.infobox{background:var(--tint);border:1px solid var(--lav);border-radius:14px;padding:13px;font-size:var(--t-sm);color:var(--violet-d);margin-bottom:10px;}
/* position:FIXED (not absolute): in the phone body-scroll model .app grows with content, so an
   absolute toast anchored to .app landed at the bottom of the tall page instead of on-screen.
   Fixed anchors it to the viewport. Floats near the TOP, just under the sticky header, and slides
   down into view. (top uses the safe-area inset so it clears the notch on standalone iOS.) */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 60px);transform:translateX(-50%) translateY(-20px);background:linear-gradient(135deg,var(--violet-dd),#1e1b4b);color:#fff;padding:11px 20px;border-radius:999px;font-size:var(--t-sm);font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:130;max-width:90%;text-align:center;box-shadow:0 4px 16px rgba(79,70,229,.35);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
/* position:FIXED (not absolute) so the backdrop + bottom sheet track the viewport, not the now-
   growing .app (phone body-scroll model). As absolute, a sheet opened while scrolled down landed
   at the bottom of the tall page. Fixed inset:0 = viewport on both phone and the ≥980px grid. */
/* STACKING ORDER (2026-07-26) — the bottom nav `.tabs` is `position:fixed;z-index:100`, so ANY
   full-viewport overlay must sit ABOVE 100 or the nav punches through it. Reported symptoms: the
   "Switch to At-Camp" confirm sheet and the "Bulk Church Update" sheet both had their primary
   button hidden behind the nav (`.modal` was z-index:50, `.ig-wrap` 55, the login gate 60 — all
   below the nav). Current ladder: nav 100 < modal/guide 120 < toast 130 < login/gate 140 < tooltip
   200 < undo toast 9999. GOTCHA: a new overlay must be `position:fixed` AND above 100. */
/* Viewport readout (2026-07-31) — off by default, five taps on the header title. See the `_vpDbg*`
   JS block for why it is kept rather than deleted. Anchored TOP-left deliberately: the whole
   question is what happens at the BOTTOM of the viewport, so it must not sit in the region
   under investigation.
   pointer-events:none so it can never swallow a tap; z-index above the tooltip layer (200) so it
   stays legible over any screen, but below the undo toast (9999). */
.vpdbg{position:fixed;top:0;left:0;z-index:300;pointer-events:none;background:rgba(14,10,30,.86);
  color:#fff;font:600 10px/1.35 ui-monospace,SFMono-Regular,Menlo,monospace;padding:4px 7px;
  border-radius:0 0 8px 0;max-width:62vw;}
.modal{position:fixed;inset:0;background:rgba(14,10,30,.6);display:none;align-items:flex-end;z-index:120;}
.modal.show{display:flex;}
.sheet{background:#fff;width:100%;border-radius:24px 24px 0 0;padding:20px 17px max(20px,env(safe-area-inset-bottom));animation:rise .2s;max-height:88dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
.sheet::before{content:"";display:block;width:36px;height:4px;background:#e4e2f5;border-radius:2px;margin:0 auto 14px;}
.sheet h3{font-size:var(--t-h3);color:var(--navy);margin-bottom:8px;font-weight:800;}
/* Elvanto export guide (import screen) — full-screen step viewer, swipeable on phone */
.ig-wrap{position:fixed;inset:0;background:rgba(14,10,30,.72);display:none;z-index:120;align-items:center;justify-content:center;padding:12px;}
.ig-wrap.show{display:flex;}
.ig-card{background:#fff;border-radius:20px;width:100%;max-width:720px;max-height:92dvh;display:flex;flex-direction:column;overflow:hidden;animation:rise .2s;}
.ig-hd{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 16px 10px;flex-shrink:0;}
.ig-hd .t{font-weight:800;color:var(--navy);font-size:var(--t-h3);}
.ig-x{border:none;background:#f1f0ff;color:var(--violet-dd);width:32px;height:32px;border-radius:50%;font-size:18px;font-weight:700;cursor:pointer;flex-shrink:0;line-height:1;}
.ig-body{padding:0 16px 8px;overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;flex:1;}
.ig-step{font-size:var(--t-xs);font-weight:800;color:var(--violet-d);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px;}
.ig-cap{font-size:var(--t-sm);color:var(--ink-2);margin-bottom:10px;line-height:1.45;}
.ig-imgwrap{border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;cursor:zoom-in;}
.ig-imgwrap img{display:block;width:100%;}
.ig-imgwrap.zoom{overflow-x:auto;cursor:zoom-out;-webkit-overflow-scrolling:touch;}
.ig-imgwrap.zoom img{width:220%;max-width:none;}
.ig-zoomhint{font-size:var(--t-2xs);color:var(--muted);text-align:center;margin-bottom:8px;}
.ig-ft{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);flex-shrink:0;}
.ig-ft .btn.sm{min-width:88px;}
.ig-ft button:disabled{opacity:.35;pointer-events:none;}
.ig-dots{display:flex;gap:6px;}
.ig-dots i{width:8px;height:8px;border-radius:999px;background:var(--line);display:block;transition:.15s;}
.ig-dots i.on{background:var(--blue);width:20px;}
label{display:block;font-size:var(--t-xs);font-weight:700;color:var(--muted);margin:12px 2px 5px;letter-spacing:.04em;text-transform:uppercase;}
.fld,select,textarea{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 13px;font-size:var(--t-body);font-family:inherit;background:#fff;outline:none;transition:border-color .15s,box-shadow .15s;}
.fld:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(79,70,229,.1);}
textarea{min-height:84px;resize:vertical;}
.btn{display:block;width:100%;background:linear-gradient(135deg,var(--violet),var(--blue));color:#fff;border:none;border-radius:14px;padding:14px;font-size:var(--t-body);font-weight:700;text-align:center;cursor:pointer;margin-top:8px;letter-spacing:.01em;}
.btn:active{transform:scale(.98);opacity:.92;}.btn.alt{background:#fff;color:var(--blue);border:1.5px solid var(--blue);background:none;}
.btn.sm{width:auto;padding:8px 13px;margin:0;font-size:var(--t-xs);border-radius:10px;}
.btn.red{background:linear-gradient(135deg,#e11d48,#9f1239);}.btn.ghost{background:#f1f0ff;color:var(--violet-dd);}
.detail-hd{background:linear-gradient(135deg,#9333ea,#1e1b4b);color:#fff;border-radius:22px;padding:20px 18px;margin-bottom:14px;text-align:center;}
.detail-hd .av-lg{width:66px;height:66px;border-radius:50%;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:var(--t-h1);font-weight:800;margin:0 auto 10px;}
.detail-hd h2{font-size:var(--t-h1);}
.snap .bignum{font-size:var(--t-xl);font-weight:800;line-height:1;color:var(--navy);}
.accbadge{font-size:var(--t-2xs);font-weight:800;padding:7px 12px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;}
.accbadge.tent{background:#dcfce7;color:#15803d;}.accbadge.classroom{background:var(--chip);color:var(--violet-d);}.accbadge.mixed{background:#fef3c7;color:#92400e;}
.gbar{display:flex;height:16px;border-radius:999px;overflow:hidden;background:#eef2f8;margin:4px 0 6px;}
.gbar i{display:block;height:100%;}.gbar .m{background:linear-gradient(90deg,#818cf8,#4f46e5);}.gbar .f{background:linear-gradient(90deg,#f472b6,var(--female));}
.glabels{font-size:var(--t-xs);color:var(--muted);font-weight:600;display:flex;justify-content:space-between;}
.gradebars{display:flex;gap:6px;align-items:flex-end;height:92px;padding-top:8px;}
.gcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end;}
.gcol .gbar-col{width:100%;max-width:30px;border-radius:6px 6px 3px 3px;background:linear-gradient(180deg,var(--lav-2),var(--blue));min-height:4px;}
.gcol.empty .gbar-col{background:#e6ecf5;}.gcol .n{font-size:var(--t-xs);font-weight:800;color:var(--navy);}.gcol .g{font-size:var(--t-micro);color:var(--muted);font-weight:700;}
.statband{display:flex;gap:8px;margin-bottom:12px;}
.statband .s{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 8px;text-align:center;}
.statband .s b{display:block;font-size:var(--t-h1);color:var(--navy);line-height:1.1;font-weight:800;}.statband .s span{font-size:var(--t-2xs);color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
/* 4-up accommodation tiles (home): a 2×2 grid on phone so the longer labels stay readable. */
.statband-4{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
/* Gender filter buttons (first-aid All Students). */
.fa-seg{display:flex;gap:6px;margin-bottom:10px;}
.fa-seg button{flex:1;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:8px;font-weight:700;font-family:inherit;font-size:var(--t-sm);cursor:pointer;}
.fa-seg button.on{background:var(--chip);border-color:var(--blue);color:var(--blue);}
.fa-seg.wrap{flex-wrap:wrap;}
.fa-seg.wrap button{flex:0 0 auto;padding:8px 14px;}
@media(min-width:540px){.statband-4{grid-template-columns:repeat(4,1fr);}}
/* ── Reusable help tooltip (?) — works on hover (desktop) and tap (mobile via .open) ──
   Use helpTip('plain text') in any markup. Written for leaders who didn't build the app. */
.htip{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--blue);background:var(--chip);color:var(--blue);font-size:11px;font-weight:800;line-height:1;cursor:pointer;position:relative;padding:0;font-family:inherit;vertical-align:middle;flex:0 0 auto;}
.htip-pop{position:absolute;z-index:200;top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:max-content;max-width:240px;background:#1e1b4b;color:#fff;border-radius:10px;padding:9px 11px;font-size:var(--t-xs);line-height:1.45;font-weight:500;text-transform:none;letter-spacing:normal;text-align:left;box-shadow:0 10px 28px rgba(20,16,60,.32);opacity:0;visibility:hidden;transition:opacity .12s;white-space:normal;}
.htip-pop::before{content:"";position:absolute;bottom:100%;left:50%;transform:translateX(-50%);border:6px solid transparent;border-bottom-color:#1e1b4b;}
.htip:hover .htip-pop,.htip.open .htip-pop{opacity:1;visibility:visible;}
/* Keep the bubble on-screen near the right edge (e.g. icon at end of a heading row). */
.htip.tip-left .htip-pop{left:auto;right:0;transform:none;}
.htip.tip-left .htip-pop::before{left:auto;right:6px;transform:none;}
/* Flip the bubble ABOVE the "?" when it would run off the bottom of the viewport
   (common on short laptop screens for tips low on the page). Set by _clampTip. */
.htip-pop.flip-up{top:auto;bottom:calc(100% + 8px);}
.htip-pop.flip-up::before{bottom:auto;top:100%;border-bottom-color:transparent;border-top-color:#1e1b4b;}
/* On/off toggle switch (admin Settings login locks). */
.tglrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-top:1px solid var(--line);}
.tglrow .tgl-l{font-weight:700;display:flex;align-items:center;gap:6px;}
.tglrow .sub{margin-top:2px;}
.tgl{position:relative;display:inline-flex;flex:0 0 auto;width:46px;height:26px;}
.tgl input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1;}
.tgl .track{position:absolute;inset:0;background:#cbd2e0;border-radius:999px;transition:background .15s;}
.tgl .track::before{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .15s;}
.tgl input:checked+.track{background:var(--blue);}

/* Match .app's own containment discipline (460-820px stepped) instead of stretching edge-to-edge on wide screens. */

#login .install-banner{margin-top:14px;background:var(--chip);border:1px solid var(--line);border-radius:14px;padding:12px 14px;}
#login .install-banner .ib-t{font-size:var(--t-xs);font-weight:700;color:var(--violet-d,#6d28d9);margin-bottom:2px;}

.quick button:active{background:var(--lav,#ede9fe);}
/* ── At-camp preview banner ── */
#previewBanner{display:none;background:linear-gradient(90deg,#92400e,#b45309);color:#fff;
  padding:max(8px,env(safe-area-inset-top)) 14px 8px;font-size:var(--t-xs);font-weight:700;
  flex:none;z-index:19;align-items:center;gap:10px;}
#previewBanner.show{display:flex;}
/* When the preview banner is showing it becomes the topmost element and owns the
   safe-area inset, so the header below it must NOT also reserve the notch space
   (that double-padding pushed the banner content down over the Dynamic Island). */
#previewBanner.show + .bar{padding-top:14px;}

#previewBanner .pb-exit:active{background:rgba(255,255,255,.35);}
/* Wide-nav element is hidden on phone; shown only inside the 980px breakpoint */
.wide-nav{display:none;}
/* ===== Continuous responsive progression (A2/A3/A4) =====
   Replaces the old single-jump-at-980 behaviour. Below the 980px sidebar threshold the
   single-column shell now WIDENS with the viewport (was a fixed 460px strip — the owner's
   "every screen is phone-fixed" complaint) and the gutter grows. Grids that were flex/2-col
   gain columns progressively. The 980px block below remains the "switch to sidebar nav"
   point only. Everything here is additive; phone (<540px) is unchanged. */
@media(min-width:540px){
  .app{max-width:600px;}
  :root{--pad:18px;}
  .statband{flex-wrap:wrap;}
  .selrow{flex-wrap:wrap;}
}
@media(min-width:768px){
  html{font-size:17px;}              /* A1: bump root → all rem text grows ~6% */
  .app{max-width:720px;}
  :root{--pad:22px;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}   /* enabled below sidebar too */
}
@media(min-width:900px){
  .app{max-width:820px;}
}
/* ===== Wide layout (≥980px) — strictly additive =====
   NOTE: the shell markup uses class="app" / id="bar" / id="stage", so the grid targets
   #app (added to the .app div), #bar (the header), and #stage (the content area). An
   earlier markup rebuild left these selectors as #header/#main, which matched nothing,
   so the desktop grid silently never activated (app stayed a 460px phone column). */
@media(min-width:980px){
  /* Desktop RE-ESTABLISHES the internal-scroll shell (the phone base rules now use body-scroll:
     body min-height + in-flow screens + sticky header, so the fixed bottom nav anchors to the
     real viewport on iOS). Here the grid #app is a fixed 100dvh frame, the body is clipped, and
     each screen scrolls inside #stage — unchanged desktop behaviour. */
  html,body{height:100dvh;overflow:hidden;}
  /* Full-width on large screens (owner: no centred bars on a 1080p display) — the cap
     and auto-margins were leaving ~160px gutters each side at 1920px. */
  #app{max-width:none;margin:0;width:100%;display:grid;grid-template-columns:220px 1fr;grid-template-rows:auto 1fr;grid-template-areas:"header header" "widenav main";height:100dvh;min-height:0;}
  #bar{grid-area:header;background:#fff;border-bottom:1px solid var(--line);color:var(--ink);padding:10px 20px;flex-wrap:nowrap;row-gap:0;position:relative;top:auto;}
  #bar .ttl{flex:0 0 auto;}
  #bar .ttl .s{display:none;}
  #bar .sign-out{background:transparent;border:1px solid var(--line);color:var(--ink);}
  #bar .bk{color:var(--ink);}
  #previewBanner.show{grid-column:1 / -1;}
  #tabs{display:none;}
  #stage{grid-area:main;padding:0;position:relative;overflow:hidden;min-height:0;}
  #stage .screen{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:var(--pad);}
  .wide-nav{grid-area:widenav;display:flex;flex-direction:column;gap:2px;padding:14px 10px;border-right:1px solid var(--line);background:#f9f8ff;overflow-y:auto;}
  .wide-nav-item{display:flex;align-items:center;gap:10px;padding:10px 13px;border-radius:12px;cursor:pointer;font-size:var(--t-body);font-weight:500;color:var(--ink);text-decoration:none;transition:background .12s;}
  .wide-nav-item:hover{background:var(--chip);}
  .wide-nav-item.on{background:var(--lav);color:var(--violet-d);font-weight:700;}
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  /* tiles stay fluid (auto-fill, larger min) so the wide main area fills with 4+ columns
     rather than being capped at 3. */
  .tiles{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));}
  /* A6 follow-up (Phase 2): dense card lists (My Youth roster, Budget church rows) use the
     horizontal space on laptop instead of staying a single tall column. Continuous 2-up grid;
     children's own margin-bottom is folded into the grid gap. Phone/tablet keep the single
     column (this rule is inside the 980 block). A snapshot/hero placed before .wide-cards stays
     full-width because it sits OUTSIDE the grid container. */
  .wide-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px;align-items:start;}
  .wide-cards>*{margin-bottom:0;}
  /* Bug-9: an expanded Budget church stays in its own column (a narrow dropdown) rather than
     stretching to fill the page width. */
  /* Budget layout (laptop): the church-total summary took the full page width, leaving the
     "Discount codes" card looking like an oddly wide, mostly-empty table below it. Split into
     summary (2/3) + discount codes (1/3) side by side; the discount card still starts collapsed
     (no .open class by default) same as on mobile. */
  .bud-grid{display:grid;grid-template-columns:2fr 1fr;gap:14px;align-items:start;}
}
@media(min-width:1280px){
  html{font-size:18px;}              /* A1: laptop root bump → all rem text grows again */
  /* one more column for the densest lists on a wide laptop */
  .wide-cards{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));}
}
/* Bug-5: a phone in LANDSCAPE is wide (≥768px) but short, so the width-based root-font bumps
   above (17/18px) made text — especially the My Youth snapshot — far too big. On a short
   landscape viewport, hold the root font at the phone size and cap the big snapshot numbers.

  html{font-size:15px;}
  .snap .bignum,.hero .big{font-size:var(--t-h2);}
  .gradebars{height:64px;}
}

<script>
/* ===== API (real backend) ===== */
/* The Express backend returns results bare (no {ok,data} envelope); errors come as
   an HTTP error status with a JSON body {code,message}. 204 = no content. */
/* Resilience (ported from connection-made-simple Phase 3): every request has an
   AbortController TIMEOUT so a hung fetch (cold start / flaky signal / slow DB)
   fails FAST with a recoverable error instead of leaving the UI on an infinite
   loading screen. Imports get a longer window. Concurrent in-flight GETs for the
   same path are COALESCED so the post-login prefetch and a navigation don't
   double-fire. */
const API_TIMEOUT_MS=20000, API_IMPORT_TIMEOUT_MS=90000;
const _inflight=new Map(); // path -> Promise (GET coalescing)
/* ===== DATA CACHE (30s TTL — makes back-navigation instant; ported from
   connection-made-simple). GET results are cached; every write invalidates the
   affected resource prefixes. Pass {noCache:true} to force a fresh read. ===== */
const Cache=(()=>{const store=new Map();const TTL=30000;
  const matches=(sk,k)=>sk===k||sk.startsWith(k+'/')||sk.startsWith(k+'?');
  return{
    get(k){const e=store.get(k);return(e&&Date.now()-e.ts<TTL)?e.data:null;},
    getStale(k){const e=store.get(k);return e?e.data:null;},
    set(k,d){store.set(k,{data:d,ts:Date.now()});},
    del(...keys){for(const k of keys){for(const sk of[...store.keys()]){if(matches(sk,k))store.delete(sk);}}},
    clear(){store.clear();}
  };})();
function _allCached(...paths){return paths.every(p=>Cache.get(p)!==null);}
// Map a write path to the cached resources it makes stale. /home aggregates almost
// everything, so any write drops it.
function _invalidate(path){
  // B-4 (Phase 5): drop only the resources a write genuinely makes stale. /home is the
  // aggregate view, so it's ALWAYS cleared — that keeps correctness even as the per-path
  // mappings are narrowed below.
  Cache.del('/home');
  if(path.startsWith('/import')){
    // An import rewrites the people set → registrants/campers + the allocation pool +
    // the check-in roster derive from it. Unrelated caches (faq/devotional/notifications/
    // schedule) are NOT touched (was a full Cache.clear() — needless re-fetch churn).
    // '/import' clears the allocation pool + override list themselves (`/import/unallocated`,
    // `/import/allocations`). Without it, allocating someone re-fetched nothing — `_loadAllocation`
    // goes through `api()`, whose 30s GET cache returned the PRE-allocation arrays, so the person
    // stayed in "Unallocated" and never appeared under "Designated from OTHER" until the cache
    // aged out. The write had actually succeeded; only the screen was stale.
    Cache.del('/registrants','/campers','/accommodation','/checkin','/import');
  }
  else if(path.startsWith('/accounts'))Cache.del('/accounts','/registrants');
  // Check-in SESSIONS derive from settings.checkInDays, so a settings write can change them →
  // clear /checkin. Schedule is de-linked from check-in (see CLAUDE.md "Daily check-in"), so a
  // settings write no longer clears /schedule.
  else if(path.startsWith('/settings'))Cache.del('/settings','/checkin');
  // A mode switch changes settings.campMode — clear /settings too, or a same-session read
  // within the 30s cache window (anything other than the switcher itself, which already
  // applies the fresh mode locally) would see the stale pre-switch mode.
  else if(path.startsWith('/admin/mode'))Cache.del('/settings','/checkin');
  // A schedule write is independent of check-in (de-linked) → clear only /schedule.
  else if(path.startsWith('/schedule'))Cache.del('/schedule');
  // A sign-in/out (and to a lesser extent a check-in) changes a person's atCamp/lifecycle, which
  // the registrants + campers views reflect — clear them too so a list re-rendered in place right
  // after the write (item 3) shows the change immediately instead of the stale 30s-cached roster.
  else if(path.startsWith('/attendance')||path.startsWith('/checkin'))Cache.del('/checkin','/registrants','/campers');
  else if(path.startsWith('/notifications'))Cache.del('/notifications');
  // An incident write is ALWAYS to `/incidents` (POST) or `/incidents/<id>` (DELETE). The id form
  // used to fall through to the generic `Cache.del(path)` below, which only matches keys equal to
  // or under `/incidents/<id>` — the cached LIST at key `/incidents` survived, so a deleted
  // incident stayed on screen until a full reload (reported 2026-07-26). Clear the list key
  // explicitly. `/notifications` goes too: logging a HIGH incident raises a leadersOnly urgent
  // notification, and deleting the incident must not leave that feed stale either.
  else if(path.startsWith('/incidents'))Cache.del('/incidents','/notifications');
  // Same class of bug as /incidents above: FAQ edit/delete posts to `/faq/<id>`, which would
  // otherwise leave the cached `/faq` list key intact for up to 30s.
  else if(path.startsWith('/faq'))Cache.del('/faq');
  else if(path.startsWith('/notes'))Cache.del('/notes');
  // A per-student edit (adminStudents) can touch an ARRIVED student too — campers +
  // the check-in roster derive from the same person record.
  else if(path.startsWith('/registrants'))Cache.del('/registrants','/campers','/checkin');
  else if(path.startsWith('/accommodation'))Cache.del('/accommodation');
  else Cache.del(path);
}
/* Top loading bar (#nprog) driver. Reference-counted so overlapping fetches (e.g. a parallel
   Promise.all) hold the bar until the LAST one finishes. It creeps toward 90% while in flight,
   then snaps to 100% and fades — classic "nprogress" feel. Only real network requests call this
   (from _doFetch); cached GETs never reach here, so instant navigations don't flash the bar. */
let _npCount=0,_npTimer=null,_npVal=0,_npFadeTimer=null,_npResetTimer=null;
function _npStart(){
  _npCount++;
  if(_npCount>1)return;
  const el=document.getElementById('nprog');if(!el)return;
  // A fade-out/reset from the immediately-previous cycle can still be queued (setTimeout)
  // when a new request starts right after the last one finished — cancel it so it can't
  // yank opacity/width out from under this new cycle (was causing a visible flash or the
  // bar snapping backward partway through a load).
  clearTimeout(_npFadeTimer);clearTimeout(_npResetTimer);
  _npVal=8;el.classList.add('on');el.style.width=_npVal+'%';
  clearInterval(_npTimer);
  _npTimer=setInterval(()=>{_npVal+=Math.max(0.4,(90-_npVal)*0.09);if(_npVal>=90){_npVal=90;}el.style.width=_npVal+'%';},170);
}
function _npDone(){
  if(_npCount>0)_npCount--;
  if(_npCount>0)return;
  const el=document.getElementById('nprog');if(!el)return;
  clearInterval(_npTimer);_npTimer=null;
  el.style.width='100%';
  _npFadeTimer=setTimeout(()=>{
    if(_npCount===0)el.classList.remove('on');

async function _doFetch(path,opt){

      ...(opt.body!==undefined?{body:JSON.stringify(opt.body)}:{})});

    if(e&&e.name==='AbortError')throw new Error('Request timed out — check your connection and try again.');
    throw new Error('Network error — is the server running?');

  // on `TOKEN`, which broke on a CASCADE: _prefetch() fires 5 requests at once, the first 401
  // runs sessionExpired() (which nulls TOKEN), and the remaining four then fell through this
  // branch and surfaced the server's raw string — "Missing bearer token" — as an alarming toast
  // that a refresh appeared to "fix". sessionExpired() is idempotent, so the cascade now
  // collapses into one banner. /auth/login is excluded because ITS 401 is "wrong password",
  // which must keep its own message on the login form.

    // drift out of sync with the server; if the server says the gate is up, trust it.
    if(err.code==='MUST_CHANGE_PASSWORD'){

let _modalReturnFocus=null;      // element focused before the modal opened (restored on close)
let _confirmResolver=null;       // pending confirmSheet() Promise resolver (see confirmSheet)
function modal(html){
  const m=document.getElementById('modal');
  // Only capture the return-focus target on the FIRST open — multi-step modals (note→review→note,
  // sign-out prompt→review→prompt) re-call modal() while already shown; keep the original opener.
  if(!m.classList.contains('show'))_modalReturnFocus=document.activeElement;
  document.getElementById('sheet').innerHTML=html;
  m.classList.add('show');
  _focusFirstInModal();
}
function _focusFirstInModal(){
  const sheet=document.getElementById('sheet');if(!sheet)return;
  const f=sheet.querySelector('input:not([type=hidden]),textarea,select,button,[href],[tabindex]:not([tabindex="-1"])');
  if(f){try{f.focus();}catch(_){}}
  else{sheet.setAttribute('tabindex','-1');try{sheet.focus();}catch(_){}}
}
function _trapModalTab(e){
  const sheet=document.getElementById('sheet');if(!sheet)return;
  const all=sheet.querySelectorAll('input:not([type=hidden]),textarea,select,button,[href],[tabindex]:not([tabindex="-1"])');
  const f=Array.prototype.filter.call(all,el=>!el.disabled&&el.offsetParent!==null);
  if(!f.length){e.preventDefault();sheet.setAttribute('tabindex','-1');sheet.focus();return;}
  const first=f[0],last=f[f.length-1];
  if(e.shiftKey){if(document.activeElement===first||!sheet.contains(document.activeElement)){e.preventDefault();last.focus();}}
  else if(document.activeElement===last||!sheet.contains(document.activeElement)){e.preventDefault();first.focus();}
}
function closeModal(){
  document.getElementById('modal').classList.remove('show');
  // If a confirmSheet() is awaiting a decision and the modal was dismissed some other way
  // (Escape, backdrop click, a plain closeModal in a button handler), treat it as "cancel".
  if(_confirmResolver){const r=_confirmResolver;_confirmResolver=null;r(false);}
  if(_modalReturnFocus&&typeof _modalReturnFocus.focus==='function'){try{_modalReturnFocus.focus();}catch(_){}}
  _modalReturnFocus=null;
}
/* confirmSheet — async, Promise<boolean> replacement for the blocking native confirm(). Built on
   the same .sheet/#modal system the ad-hoc conversions (switchMode/adminReset) already use. Resolves
   true on confirm, false on cancel/Escape/backdrop dismissal. `body` is auto-escaped plain text
   (use `bodyRaw` for pre-trusted markup, mirroring td/tdRaw); `danger` styles the confirm button red. */
function confirmSheet(opts){
  const o=opts||{};
  return new Promise(resolve=>{
    // Guard: if a prior confirmSheet() is somehow still pending, resolve it as cancel before
    // replacing the resolver — otherwise that Promise would hang forever.
    if(_confirmResolver){const prev=_confirmResolver;_confirmResolver=null;prev(false);}
    _confirmResolver=resolve;
    modal(`<h3>${esc(o.title||'Are you sure?')}</h3>
      ${o.body?`<p class="sub" style="margin:8px 0 14px">${esc(o.body)}</p>`:o.bodyRaw?`<p class="sub" style="margin:8px 0 14px">${o.bodyRaw}</p>`:''}
      <button class="btn${o.danger?' red':''}" onclick="_confirmSheetPick(true)">${esc(o.confirmLabel||'Confirm')}</button>
      <button class="btn ghost" style="margin-top:6px" onclick="_confirmSheetPick(false)">${esc(o.cancelLabel||'Cancel')}</button>`);
  });
}
function _confirmSheetPick(v){
  const r=_confirmResolver;_confirmResolver=null;   // null FIRST so closeModal() doesn't also resolve
  closeModal();
  if(r)r(v);
}
/* helpTip(text[,opts]) — a small "?" bubble explaining a feature in plain language for a leader
   who didn't design the app. Shows on hover (desktop) and on tap (mobile). `opts.left` anchors the
   bubble to the right edge so it doesn't run off-screen when the icon ends a heading row. */
// Bug 14: "Hi <name>" drops to half size (and wraps) once the name is too long for one line of
// the hero at full size. 14 chars is the measured fit at --t-h1 on the narrowest phone with the
// "Hi " prefix and the watermark; shorter names are unaffected.
function _heroNameCls(name){return String(name||'').length>14?' class="long"':'';}
function helpTip(text,opts){const o=opts||{};return `<button type="button" class="htip${o.left?' tip-left':''}" aria-label="Help: ${esc(text)}" onclick="_toggleTip(event,this)">?<span class="htip-pop">${esc(text)}</span></button>`;}
function _toggleTip(e,btn){e.stopPropagation();const open=btn.classList.contains('open');document.querySelectorAll('.htip.open').forEach(t=>t.classList.remove('open'));if(!open){btn.classList.add('open');_clampTip(btn);}}
// Keep the bubble fully on-screen regardless of where the "?" sits. Resets to the CSS-default
// position, measures, then nudges horizontally so neither edge runs past the viewport (8px margin).
// Works for both centred and tip-left bubbles; runs on tap (here) and on hover (delegated below).
function _clampTip(btn){const pop=btn.querySelector('.htip-pop');if(!pop)return;
  const left=btn.classList.contains('tip-left');
  pop.style.transform=left?'none':'translateX(-50%)';
  pop.classList.remove('flip-up');
  // Bug 6 (2026-07-28): clamp inside the SCREEN, not just the window. On the ≥980px layout the
  // content sits in a 220px-inset `#stage .screen` that is `overflow:hidden` both ways — a bubble
  // clamped only to the viewport still runs under the sidebar/off the screen's own edge and gets
  // clipped away. Falling back to the viewport keeps the phone behaviour identical.
  const m=8;
  const scr=btn.closest('.screen'),sr=scr?scr.getBoundingClientRect():null;
  const bl=sr?Math.max(0,sr.left):0;
  const br=sr?Math.min(document.documentElement.clientWidth,sr.right):document.documentElement.clientWidth;
  // The phone layout's bottom nav is `position:fixed` over the content, so the usable bottom
  // is its TOP edge, not the viewport's — measuring to clientHeight let a bubble low on the
  // page (e.g. the Site map tip in Camp settings) open downward into the nav and read as
  // hidden. On the ≥980px layout .tabs is display:none and this falls back to the viewport.
  const vw=br;
  const tabs=document.querySelector('.tabs');
  const tabsRect=tabs?tabs.getBoundingClientRect():null;   // display:none ⇒ height 0, so it's ignored
  const tabsTop=tabsRect&&tabsRect.height>0?tabsRect.top:Infinity;
  const vh=Math.min(document.documentElement.clientHeight,tabsTop);
  const r=pop.getBoundingClientRect();let shift=0;
  if(r.right>vw-m)shift=(vw-m)-r.right;
  if(r.left+shift<bl+m)shift=(bl+m)-(r.left+shift);
  if(shift)pop.style.transform=left?`translateX(${shift}px)`:`translateX(calc(-50% + ${shift}px))`;
  // Vertical: the bubble sits below the "?"; if that runs off the bottom (short laptop
  // viewport, tip low on the page) and there's more room above, flip it up.
  if(r.bottom>vh-m){const btnTop=btn.getBoundingClientRect().top;if(btnTop>r.height+m)pop.classList.add('flip-up');}
}
