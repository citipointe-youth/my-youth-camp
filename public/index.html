    const stash=localStorage.getItem('ycp_preview_stash');
    if(stash){try{_previewStash=JSON.parse(stash);ACCOUNT_PREVIEW=true;document.getElementById('previewBanner').classList.add('show');}catch(_){}}
    if(MUST_CHANGE_PASSWORD_ENFORCED&&ACTOR.mustChangePassword){_showChangePasswordGate();return;}
    // Validate the stored token against an AUTHENTICATED route before showing the app.
    // GET /settings is deliberately auth:false (the login screen needs the camp name/branding),
    // so it happily 200s for a dead session — restore then sailed on, hid the login screen, and
    // the app blew up one tick later when _prefetch()'s authed calls all 401'd. Session tokens
    // are stateless HMAC with a 48h TTL (auth.service.ts), so this fires for anyone returning
    // the next day. On failure _doFetch() already runs sessionExpired(); the catch below clears
    // localStorage so the next load goes straight to a clean login screen.
    await api('/auth/me',{noCache:true});
    SETTINGS=await api('/settings');
    CAMP_MODE=SETTINGS.campMode||'pre-camp';
    document.getElementById('login').style.display='none';
    document.getElementById('bar').style.display='flex';
    document.getElementById('stage').style.display='block';
    document.getElementById('tabs').style.display='';  // let CSS media query control visibility
    // Restore this account's saved roster filters BEFORE the first paint, so the
    // check-in / My-students screens never render once unfiltered and then jump.
    _restoreFilters();
    updateModeUI();buildTabs();_prefetch();STACK=['home'];await gotoTab('home');
    _loadLeaderInitials(); // restore the badge/prefill
    enforceInitials();     // item 7: a restored church session with no initials is still gated
    _offerAlertsAfterLogin();  // reopening the installed app counts as a sign-in for this offer
    // Cold start from a tapped notification (sw.js openWindow('/?nav=…')). Done AFTER
    // gotoTab('home') so 'home' stays on the stack and Back behaves normally. Routed through
    // _pushNavTo because an unknown screen name is NOT ignored by go() — it blanks the app.
    {const nav=_consumePushNav();if(nav){try{_pushNavTo(nav);}catch(_){}}}
  }catch(e){
    if(e&&e.code==='MUST_CHANGE_PASSWORD'){_showChangePasswordGate();return;}
    TOKEN=null;ACTOR=null;
    localStorage.removeItem('ycp_token');localStorage.removeItem('ycp_actor');
  }
}
/* ===== BOOT ===== */
// Enter-to-submit is now handled natively by #loginForm's onsubmit (real <form>, added for iOS
// PWA Keychain autofill) — no manual keydown listeners needed here, avoids a double doLogin() call.
document.addEventListener('keydown',e=>{
  const modalOpen=document.getElementById('modal').classList.contains('show');
  if(e.key==='Escape'&&modalOpen){closeModal();return;}
  if(e.key==='Tab'&&modalOpen){_trapModalTab(e);return;}   // keep focus inside the open dialog
  // Keyboard activation for the app's clickable non-<button> rows (role="button" tabindex="0"):
  // Enter/Space fires the same onclick as a tap. Native <button>/<a> already do this themselves.
  if((e.key==='Enter'||e.key===' ')&&e.target&&e.target.getAttribute){
    const el=e.target;
    if(el.getAttribute('role')==='button'&&el.tagName!=='BUTTON'&&el.tagName!=='A'&&el.tagName!=='INPUT'&&el.tagName!=='TEXTAREA'&&el.tagName!=='SELECT'){
      e.preventDefault();el.click();
    }
  }
});
_initDemoLogin();_loginTips();_installBanner();_tryRestoreSession();

/* B-3: cross-tab + on-focus mode sync. A second tab (or a tab not on Home) used to keep stale
   pre-camp/at-camp nav after an admin switched mode until the user navigated Home. */
window.addEventListener('storage',e=>{
  if(e.key==='ycp_campmode'&&e.newValue)_applyModeChange(e.newValue);
});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!ACTOR||PREVIEW_MODE)return;
  // A backgrounded tab may have missed the storage event — re-check the authoritative mode.
  api('/settings').then(s=>{if(s&&s.campMode)_applyModeChange(s.campMode);}).catch(()=>{});
});

/* ===== WEB PUSH — "Alerts on this device" (2026-07-30, phases 4-6) =====

   SAFETY CONTRACT, read before editing:
   `_pushCardHtml()` returns a STATIC EMPTY CONTAINER and nothing else. Every piece of
   real work happens in `_renderPushCard()`, which is async, wrapped head-to-toe in
   try/catch, and only ever writes into that one container. Nothing here can throw during
   a screen render — `Notification`, `PushManager` and `serviceWorker` are all absent or
   throwing on some of the browsers in use (older iOS especially). Keep this shape even
   though the blast radius shrank when the card moved off Home (below).

   ⚠ 2026-07-31 (owner request): this lives on the NOTICES screen now, as a compact inline
   button — NOT on either Home screen. `RENDER.notifs` is the only caller. Note the roles
   that reach Notices: church/zoneLeader/director have it as a bottom-nav tab; admin gets
   it from the Admin console tile (pre-camp) or the at-camp home Notices tile, because
   `extras` render only in the >=980px sidebar. **firstAid has no Notices screen at all**,
   so that role cannot opt in — it could not before either, since `RENDER.home` redirects
   firstAid straight to Search and the card never rendered for them. */

let _pushCfg=null;      // cached GET /push/config result
let _pushBusy=false;

function _pushCardHtml(){return '<div id="pushCard"></div>';}

/* iOS gives no permission prompt at all until the app is installed to the Home Screen —
   see the adoption note in the design. Detect standalone the two ways iOS reports it. */
function _isStandalone(){
  try{return window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;}
  catch(_){return false;}
}
function _isIOS(){
  try{return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);}
  catch(_){return false;}
}

function _urlB64ToUint8(base64){
  const pad='='.repeat((4-base64.length%4)%4);
  const b64=(base64+pad).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(b64);
  const out=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}

/* Is this a usable VAPID public key? An uncompressed P-256 point: 65 bytes, 0x04 first.
   ⚠ 2026-07-31: production briefly held pasted TABLE TEXT here, and the ONLY symptom a
   leader ever saw was `InvalidCharacterError` from the atob() above, on their phone, after
   granting the OS permission. The server now refuses to serve a malformed key at all
   (`readPushConfig`), so this is the second line of defence — with both, a bad key hides the
   card instead of producing a button that fails at the last possible step. */
function _isValidVapidKey(k){
  try{
    if(typeof k!=='string'||!/^[A-Za-z0-9\-_]+=*$/.test(k))return false;
    const b=_urlB64ToUint8(k);
    return b.length===65&&b[0]===4;
  }catch(_){return false;}
}

async function _renderPushCard(){
  const el=document.getElementById('pushCard');
  if(!el)return;
  try{
    /* Preview modes short-circuit every non-GET in api(), so subscribing is impossible —
       and SHOULD be: an admin previewing a church account must not register their own
       phone against that account. Hide the card rather than let it surface the generic
       "not available in preview" toast on a tap. */
    if(PREVIEW_MODE||ACCOUNT_PREVIEW){el.innerHTML='';return;}
    if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window)){el.innerHTML='';return;}

    if(_pushCfg===null){
      try{_pushCfg=await api('/push/config');}catch(_){el.innerHTML='';return;}
    }
    /* VAPID keys not set on the server. This is the deployed state until they are added,
       and the whole feature must be invisible — not broken-looking — until then. */
    if(!_pushCfg||!_pushCfg.configured){el.innerHTML='';return;}
    /* Configured but the key is unusable — hide rather than offer a button that can only
       fail at subscribe() time, after the user has already granted the OS permission. */
    if(!_isValidVapidKey(_pushCfg.publicKey)){el.innerHTML='';return;}

    const perm=Notification.permission;
    let body;

    if(_isIOS()&&!_isStandalone()){
      // No prompt is even possible here. Give the actual remedy, not a dead button.
      body=`<p class="note-hint" style="margin:0">Install this app to your Home Screen to get camp alerts on this device — tap Share, then <b>Add to Home Screen</b>, and open it from there.</p>
        <a class="btn ghost sm" style="margin-top:8px;display:inline-block" href="/install.html">How to install</a>`;
    }else if(perm==='denied'){
      // The app cannot re-prompt once denied; only OS/browser settings can undo it.
      body=`<p class="note-hint" style="margin:0">Alerts are blocked for this site. To turn them on, allow notifications for this app in your ${_isIOS()?'iPhone Settings → Notifications':'browser site settings'}, then come back.</p>`;
    }else{
      const reg=await navigator.serviceWorker.ready;
      const sub=await reg.pushManager.getSubscription();
      if(sub&&perm==='granted'){
        /* "Send a test" is ADMIN-ONLY from 2026-08-05 (owner request) — it was cluttering the
           Notices screen for the ~100 church/leader logins who never need it. NOTE this is a
           UI-only hide: POST /push/test stays open to any authenticated account and is safe
           that way, because `sendTestToUser(actor.id, …)` only ever pushes to the CALLER'S OWN
           devices — there is nothing to escalate. Do not "harden" the endpoint to admin-only
           without reading the 2026-07-31 push section in CLAUDE.md first: the route exists so a
           device can be proven working, and an admin diagnosing a leader's phone may still want
           it reachable. Trade-off accepted by the owner: a leader can no longer self-test. */
        const _testBtn=(ACTOR&&ACTOR.role==='admin')?`<button class="btn ghost sm" onclick="_pushTest()">Send a test</button>`:'';
        body=`<div class="rowsb" style="align-items:center"><span class="sub" style="margin:0">${icSm('check')} Alerts are on for this device</span>
          <span style="display:flex;gap:6px">${_testBtn}<button class="btn ghost sm" onclick="_pushOff()">Turn off</button></span></div>`;
      }else{
        body=`<button class="btn ghost sm" onclick="_pushOn()">${icSm('bell')} Turn on alerts for this device</button>`;
      }
    }
    // Compact by design: this sits inline on the Notices screen, not as a Home card
    // (owner request 2026-07-31). No heading — the surrounding screen is already "Notices".
    el.innerHTML=`<div style="margin:12px 0 4px">${body}</div>`;
  }catch(_){
    // Never leave a half-rendered card, and never let this break Home.
    try{el.innerHTML='';}catch(__){}
  }
}

/* The consent step. The browser's own prompt says only "<site> wants to send you
   notifications" — nothing about what, how often, or that a safeguarding-adjacent alert
   can render on a lock screen. Tapping "Allow" is not meaningful consent to that, so we
   say it plainly first. Never call requestPermission() on load — only from a tap.

   ⚠⚠ THIS IS SPLIT INTO TWO FUNCTIONS ON PURPOSE — DO NOT MERGE THEM BACK.
   `_pushOn` only opens the consent sheet; `_pushConsentGo` is the sheet's OWN click
   handler and calls `Notification.requestPermission()` as its first statement. See the
   activation note on `_pushConsentGo`. The previous shape (`await confirmSheet(...)` and
   then request the permission) is the 2026-07-31 "Could not turn on alerts on this
   device" bug on an installed iPhone. */
function _pushOn(){
  if(_pushBusy)return;
  /* Raw HTML (not esc'd) so the lines render as lines. Every fragment below is a hardcoded
     literal, so there is no untrusted input to escape here.

     2026-08-03: CUT from three dense paragraphs to three short lines (owner: "too long").
     The old copy was ~90 words on a phone modal standing between a leader and a feature they
     had already decided to turn on — which is how consent text gets scrolled past rather than
     read. Nothing was dropped that changes what someone is agreeing to: what alerts you get,
     that they carry no student detail, that they show on a lock screen, and that a device
     registration is stored until you turn it off. Only the wording is shorter.
     ⚠ Do NOT cut the lock-screen line or the "no names" line to shorten this further — those
     two are the actual substance of the consent, not decoration. */
  modal(`<h3>Alerts on this device</h3>
    <p class="sub" style="margin:8px 0 14px">You&rsquo;ll be alerted for <b>urgent</b> notices, urgent incidents (leadership only), and when your check-in window is closing. Ordinary notices don&rsquo;t buzz.
      <br><br>Alerts <b>never include a student&rsquo;s name</b> or any detail &mdash; just &ldquo;open the app&rdquo;. They can show on your lock screen.
      <br><br>Turning this off here removes the device registration.</p>
    <button class="btn" onclick="_pushConsentGo()">Turn on alerts</button>
    <button class="btn ghost" style="margin-top:6px" onclick="closeModal()">Cancel</button>`);
}

/* Offer alerts once per device (owner request, 2026-07-31). Two entry points, because the
   right moment differs by role:

     - CHURCH accounts: straight after they set their initials. Setting initials is the
       closest thing this app has to "a person has just claimed this device".
     - EVERY OTHER role: shortly after sign-in. They never set initials, so without this
       they would only ever find alerts by wandering onto the Notices screen.

   A PWA gets NO install-time hook — nothing fires on Add to Home Screen — so neither of
   these can be moved earlier.

   ⚠ `_offerAlertsAfterLogin` deliberately SKIPS church accounts: `enforceInitials()` has
   already opened a blocking, unskippable modal on that path, and a second modal 900ms later
   would replace it and leave the account with no initials.

   This opens OUR consent sheet, not the OS prompt. Two reasons, and neither is cosmetic:
     1. an OS prompt fired straight off the initials save would explain nothing, and a tap
        on "Allow" is not meaningful consent to a safeguarding-adjacent alert that renders
        on a lock screen;
     2. it is called from a setTimeout, so user activation is already gone — the OS prompt
        would be refused. The sheet's own button restores it (see `_pushConsentGo`).

   Asked at most ONCE per device: the flag is written BEFORE the sheet opens, so cancelling
   is respected. Anyone who declines can still turn alerts on from the Notices screen. */
function _pushAskedKey(){return 'ycp_push_asked';}
function _offerAlertsAfterLogin(){
  // Church accounts are served by the initials path — see the warning above.
  if(_isChurchAccount())return;
  // Longer than the initials delay: Home is still painting right after sign-in, and a modal
  // that lands mid-render reads as a glitch rather than an offer.
  setTimeout(_maybeOfferAlerts,900);
}
async function _maybeOfferAlerts(){
  try{
    if(PREVIEW_MODE||ACCOUNT_PREVIEW)return;
    if(!('serviceWorker'in navigator)||!('PushManager'in window)||!('Notification'in window))return;
    // 'granted' or 'denied' — the browser will not prompt again either way, so asking is
    // pure noise. Only 'default' is still askable.
    if(Notification.permission!=='default')return;
    // On iOS no prompt is possible at all outside an installed PWA; the Notices card
    // already explains how to install, so don't surface a dead-end sheet here.
    if(_isIOS()&&!_isStandalone())return;
    try{if(localStorage.getItem(_pushAskedKey()))return;}catch(_){}
    // Never offer what the server can't deliver — same gate as the Notices card.
    if(_pushCfg===null){try{_pushCfg=await api('/push/config');}catch(_){return;}}
    if(!_pushCfg||!_pushCfg.configured)return;
    if(!_isValidVapidKey(_pushCfg.publicKey))return;
    try{localStorage.setItem(_pushAskedKey(),'1');}catch(_){}
    _pushOn();
  }catch(_){}
}

/* ⚠ `Notification.requestPermission()` MUST be called synchronously inside this click
   handler, before any `await`.

   WebKit scopes user activation to the event handler's own call stack. A call made after
   an `await` — even one resolved from a click, as `confirmSheet()` is — has already left
   that stack and WebKit rejects it with `NotAllowedError`. Chrome uses a time-based
   transient-activation window instead, so the old shape worked on a laptop and failed on
   an installed iPhone: exactly the reported symptom, and exactly why it looked
   device-specific rather than like a code bug.

   So: request first, close the sheet second, do everything else in `_pushFinish`. Do NOT
   "tidy" this into one async function. */
function _pushConsentGo(){
  if(_pushBusy)return;
  _pushBusy=true;
  // Handles both API shapes: modern browsers return a Promise, older ones take a callback.
  // Resolving twice is harmless — a Promise settles once.
  const permP=new Promise((res,rej)=>{
    try{
      const r=Notification.requestPermission(res);
      if(r&&typeof r.then==='function')r.then(res,rej);
    }catch(e){rej(e);}
  });
  closeModal();
  _pushFinish(permP);
}

async function _pushFinish(permP){
  try{
    const perm=await permP;
    if(perm!=='granted'){toast(perm==='denied'?'Alerts blocked — allow notifications for this app in your device settings':'Alerts not enabled');return;}
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({
        // Mandatory on every browser that matters — see the sw.js push handler.
        userVisibleOnly:true,
        applicationServerKey:_urlB64ToUint8(_pushCfg.publicKey),
      });
    }
    const j=sub.toJSON();
    await api('/push/subscribe',{method:'POST',body:{endpoint:sub.endpoint,keys:{p256dh:j.keys.p256dh,auth:j.keys.auth},keyId:_pushCfg.keyId}});
    toast('Alerts are on for this device');
  }catch(e){
    _pushFail(e);
  }finally{
    _pushBusy=false;
    _renderPushCard();
  }
}

/* The old toast was a bare "Could not turn on alerts on this device" for every possible
   failure — permission, service worker, the push service, or the API call. That is what
   made the iPhone report cost a whole deploy-and-retest cycle to place. Name the error so
   the next report says which step died (`NotAllowedError` = activation/permission,
   `AbortError` = the OS push service refused, anything else = our API). */
function _pushFail(e){
  const n=(e&&(e.name||e.message))?String(e.name||e.message):'unknown error';
  toast('Could not turn on alerts — '+n);
}

async function _pushOff(){
  if(_pushBusy)return;
  _pushBusy=true;
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){
      const endpoint=sub.endpoint;
      // Unsubscribe locally FIRST so the device stops receiving even if the server call
      // fails; the row is then pruned server-side on the next 404/410 regardless.
      try{await sub.unsubscribe();}catch(_){}
      try{await api('/push/subscribe',{method:'DELETE',body:{endpoint:endpoint}});}catch(_){}
    }
    toast('Alerts turned off for this device');
  }catch(_){
    toast('Could not turn off alerts');
  }finally{
    _pushBusy=false;
    _renderPushCard();
  }
}

/* Self-test: pushes the check-in-warning shape to THIS account's own devices. The real
   check-in warning only fires on a camp day, inside the lead window, with a church actually
   behind — so without this there is no way to prove a phone is wired up until the one
   morning it matters. It proves delivery and the deep-link, not who is behind on check-ins. */
async function _pushTest(){
  if(_pushBusy)return;
  _pushBusy=true;
  try{
    const r=await api('/push/test',{method:'POST',body:{kind:'checkin'}});
    if(!r||!r.configured){toast('Alerts are not configured on the server');}
    else if(r.sent>0){toast('Test alert sent — check this device'+(r.sent>1?' (and your other devices)':''));}
    // sent:0 with a subscription present means every endpoint failed or was dead. Say which
    // rather than a bare "sent" the user then waits on for a notification that never comes.
    else if(r.pruned>0){toast('This device’s registration had expired — turn alerts off and on again');}
    else if(r.failed>0){toast('Test alert could not be delivered to this device');}
    else{toast('No devices registered for this account yet');}
  }catch(e){
    toast('Could not send the test — '+((e&&e.message)||'unknown error'));
  }finally{
    _pushBusy=false;
  }
}

/* Deep-link from a tapped notification. The SPA has no URL router, so sw.js postMessages
   the target screen to the focused client (warm path) and falls back to /?nav=<screen>
   for a cold start, which we read ONCE at boot and then strip from the address bar.

   ⚠ ALWAYS route through _pushNavTo(). A screen id that does not exist takes the app to a
   BLANK PAGE — _navTo/_showScreen deactivate every <section class="screen"> and then match
   nothing, with no error thrown anywhere. That is exactly what shipped: the server sent
   `screen: 'notices'` and this SPA's Notices screen is `notifs`, so every tapped notice
   notification opened a blank app (fixed server-side 2026-07-31). Notifications already
   delivered to a phone keep their old payload, so this guard is not redundant with that fix
   — it is what makes a bad screen id survivable. */
function _pushNavTo(screen){
  // Not logged in (or still on the login screen): navigating would reveal an empty app
  // frame behind the login card. _tryRestoreSession picks the nav up itself on the cold path.
  if(!TOKEN||!ACTOR)return;
  const ok=screen&&document.getElementById(screen)&&document.getElementById(screen).classList.contains('screen');
  go(ok?screen:'home');
}
if('serviceWorker'in navigator){
  navigator.serviceWorker.addEventListener('message',(ev)=>{
    try{
      const m=ev.data||{};
      if(m.type==='push-nav'&&m.screen)_pushNavTo(m.screen);
    }catch(_){}
  });
}
function _consumePushNav(){
  try{
    const p=new URLSearchParams(location.search);
    const nav=p.get('nav');
    if(!nav)return null;
    history.replaceState(null,'',location.pathname);
    return nav;
  }catch(_){return null;}
}

/* PWA: register the service worker (network-first HTML shell, network-only API,
   cache-first assets). On a new SW taking control after a deploy, reload once so
   users get the latest UI without a manual refresh. */
if('serviceWorker'in navigator){
  let _reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{
    if(_reloading)return;_reloading=true;location.reload();
  });
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/sw.js').then((reg)=>{
      // iOS standalone PWAs are lazy about checking for a new service worker, so a fresh deploy
      // can sit un-applied until the user manually clears website data. Force an update check on
      // load AND every time the app is brought back to the foreground; when a newer SW installs it
      // skipWaiting()s + claims, which fires controllerchange above and reloads once to the new UI.
      const _check=()=>{try{reg.update();}catch(_){}};
      _check();
      document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')_check();});
    }).catch(()=>{});
  });
}

</script>
</body>
